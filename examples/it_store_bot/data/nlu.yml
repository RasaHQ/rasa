version: "3.1"

nlu:
  - intent: greet
    examples: |
      - xin chào
      - chào bạn
      - hello
      - hi
      - chào
      - hế lô
      - chào buổi sáng
      - chào buổi chiều
      - chúc buổi tối tốt lành

  - intent: goodbye
