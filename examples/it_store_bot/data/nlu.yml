      - tạm biệt
      - bye
      - goodbye
      - hẹn gặp lại
      - cảm ơn tạm biệt
      - thôi tôi đi đây
      - ok bye

  - intent: affirm
    examples: |
      - đúng
      - đúng rồi
      - ok
      - được
      - đồng ý
      - chính xác
      - yes
      - yeah
      - vâng

  - intent: deny
    examples: |
      - không
      - không phải
      - sai rồi
      - no
      - không đúng
      - chưa đúng
      - không đồng ý

