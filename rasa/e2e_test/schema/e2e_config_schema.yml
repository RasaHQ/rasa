# Schema for conftest.yml: allows fixture-chain keys and LLM Judge/config keys
# so a root conftest used by both fixtures and LLM Judge passes validation.
mapping:
  fixtures:
    allowempty: True
    type: "seq"
    sequence:
      - type: map
        mapping:
          regex;(^[a-zA-Z_]+[a-zA-Z0-9_\-]*$):
            type: "seq"
            sequence:
              - type: map
                mapping:
                  regex;(^[a-zA-Z_]+[a-zA-Z0-9_\-]*$):
                    type: any

  llm_judge:
    type: map
    mapping:
      llm:
        type: map
        allowempty: true
        mapping:
          provider:
            type: str
            nullable: false
          model:
            type: str
            nullable: false
          model_group:
            type: str
            nullable: false
      embeddings:
        type: map
        allowempty: true
        mapping:
          provider:
            type: str
            nullable: false
          model:
            type: str
            nullable: false
          model_group:
            type: str
            nullable: false
  llm_e2e_test_conversion:
    type: map
    mapping:
      provider:
        type: str
      model:
        type: str
      deployment:
        type: str
      api_base:
        type: str
      "=":
        type: any
