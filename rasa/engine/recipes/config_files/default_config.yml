# The config recipe.
# https://rasa.com/docs/rasa/model-configuration/
recipe: default.v1

# The assistant project unique identifier
# This default value must be replaced with a unique assistant name within your deployment
assistant_id: placeholder_default

# Configuration for the Rasa NLU components.
# https://rasa.com/docs/rasa/components
#
# NOTE: This is the Python 3.12/3.13 build. TensorFlow- and ML-backed components
# (DIETClassifier, ResponseSelector, TEDPolicy, UnexpecTEDIntentPolicy, etc.) have
# been removed and are not part of the default pipeline. This default suits
# rule-based assistants using direct intent triggering and rules.
language: en

pipeline:
  - name: WhitespaceTokenizer
  - name: RegexFeaturizer
  - name: LexicalSyntacticFeaturizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: "char_wb"
    min_ngram: 1
    max_ngram: 4
  - name: EntitySynonymMapper
  - name: FallbackClassifier
    threshold: 0.3
    ambiguity_threshold: 0.1

# Configuration for the Rasa Core policies.
# https://rasa.com/docs/rasa/policies
policies:
  - name: MemoizationPolicy
  - name: RulePolicy
