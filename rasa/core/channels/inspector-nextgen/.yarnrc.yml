# Yarn version from package.json "packageManager" (Corepack)
nodeLinker: node-modules
# Loads FONTAWESOME_NPM_AUTH_TOKEN from .env for interpolation below (and for yarn run).
# Trailing ? = optional file (CI sets the variable from secrets instead).
# See https://yarnpkg.com/configuration/yarnrc#injectenvironmentfiles
injectEnvironmentFiles:
  - .env?
# Token: .env via injectEnvironmentFiles, or the environment (e.g. CI) — see README.
# Optional (:-) so Yarn can run without it for limited scenarios.
npmScopes:
  fortawesome:
    npmRegistryServer: https://npm.cloudsmith.io/fortawesome/fontawesome-pro/
    npmAlwaysAuth: true
    npmAuthToken: "${FONTAWESOME_NPM_AUTH_TOKEN:-}"