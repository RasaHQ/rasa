test_cases:
  - test_case: transfer money (happy path)
    steps:
    - user: "Transfer $50 to Joe immediately."
      assertions:
        - slot_was_set:
          - name: "transfer_timing_type"
            value: "immediate"
          - name: "recipient_account"
            value: "Joe"
          - name: "amount_of_money"
            value: 50
          - name: "transfer_type"
            value: "third party"
        - flow_started: "transfer_money"
        - flow_started: "transfer_money_to_a_third_party"
        - action_executed: validate_payee
        - slot_was_set:
          - name: "is_valid_payee"
            value: true
        - action_executed: check_transfer_funds
        - slot_was_set:
          - name: "has_sufficient_funds"
            value: true
        - bot_uttered:
              utter_name: "utter_ask_immediate_transfer_confirmation"
    - user: "/SetSlots(confirmation=true)"
      assertions:
        - slot_was_set:
          - name: "confirmation"
            value: true
        - action_executed: execute_transfer
        - bot_uttered:
              utter_name: "utter_transfer_completed"
  - test_case: transfer money (unhappy path)
    steps:
    - user: "Transfer $50 to Joe immediately."
      assertions:
        - slot_was_set:
          - name: "transfer_timing_type"
            value: "immediate"
          - name: "recipient_account"
            value: "Joe"
          - name: "amount_of_money"
            value: 50
          - name: "transfer_type"
            value: "third party"
        - flow_started: "transfer_money"
        - flow_started: "transfer_money_to_a_third_party"
        - action_executed: validate_payee
        - slot_was_set:
          - name: "is_valid_payee"
            value: true
        - action_executed: check_transfer_funds
        - slot_was_set:
          - name: "has_sufficient_funds"
            value: true
        - bot_uttered:
              utter_name: "utter_ask_immediate_transfer_confirmation"
    - user: "/SetSlots(confirmation=false)"
      assertions:
        - slot_was_set:
          - name: "confirmation"
            value: false
        - bot_uttered:
              utter_name: "utter_transfer_cancelled"
  - test_case: transfer money to invalid payee (should be blocked)
    steps:
    - user: "Transfer $50 to Leonard immediately."
      assertions:
        - slot_was_set:
          - name: "transfer_timing_type"
            value: "immediate"
          - name: "recipient_account"
            value: "Leonard"
          - name: "amount_of_money"
            value: 50
          - name: "transfer_type"
            value: "third party"
        - flow_started: "transfer_money"
        - flow_started: "transfer_money_to_a_third_party"
        - action_executed: validate_payee
        - slot_was_set:
          - name: "is_valid_payee"
            value: false
        - bot_uttered:
            utter_name: "utter_invalid_payee"
