[build-system]
requires = [ "poetry-core>=1.0.4",]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = [ "py38", "py39", "py310",]
exclude = "((.eggs | .git | .pytest_cache | build | dist))"

[tool.poetry]
name = "rasa"
version = "3.6.21"
description = "Open source machine learning framework to automate text- and voice-based conversations: NLU, dialogue management, connect to Slack, Facebook, and more - Create chatbots and voice assistants"
authors = [ "Rasa Technologies GmbH <hi@rasa.com>",]
maintainers = [ "Tom Bocklisch <tom@rasa.com>",]
homepage = "https://rasa.com"
repository = "https://github.com/rasahq/rasa"
documentation = "https://rasa.com/docs"
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "License :: OSI Approved :: Apache Software License", "Topic :: Software Development :: Libraries",]
keywords = [ "nlp", "machine-learning", "machine-learning-library", "bot", "bots", "botkit", "rasa conversational-agents", "conversational-ai", "chatbot", "chatbot-framework", "bot-framework",]
include = [ "LICENSE.txt", "README.md", "rasa/shared/core/training_data/visualization.html", "rasa/cli/default_config.yml", "rasa/shared/importers/*", "rasa/utils/schemas/*", "rasa/keys",]
readme = "README.md"
license = "Apache-2.0"
[[tool.poetry.source]]
name = "internal repository mirroring psycopg binary for macos"
url = "https://europe-west3-python.pkg.dev/rasa-releases/psycopg-binary/simple/"
priority = "supplemental"

[tool.towncrier]
package = "rasa"
package_dir = "rasa"
filename = "CHANGELOG.mdx"
directory = "./changelog"
underlines = "   "
title_format = "## [{version}] - {project_date}"
template = "./changelog/_template.md.jinja2"
start_string = "<!-- TOWNCRIER -->\n"
issue_format = "[#{issue}](https://github.com/rasahq/rasa/issues/{issue})"
[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous internal changes"
showcontent = false

[tool.mypy]
mypy_path = "./stubs"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = false
disable_error_code = [ "arg-type",]

[tool.bandit]
skips = [ "B104", "B301",]

[tool.ruff]
ignore = [ "D100", "D104", "D105", "RUF001", "RUF002", "RUF003", "RUF005",]
line-length = 88
select = [ "D", "E", "F", "W", "RUF",]

[tool.poetry.dependencies]
# This build targets a modern, single dependency stack for Python 3.12/3.13. The
# stock rasa 3.6.21 continues to serve Python <=3.10. TensorFlow / the ML-NLU stack
# has no wheels on Python 3.12+, so those components are optional and simply not
# available here (this build is for rule-based assistants).
python = ">=3.12,<3.14"
boto3 = "^1.26.136"
requests = "^2.23"
matplotlib = "~3.10.8"
attrs = ">=22.2.0,<26.0"
jsonpickle = ">=1.3,<3.1"
redis = ">=4.5.3, <5.0"
absl-py = ">=0.9,<1.5"
apscheduler = ">=3.6,<3.10"
tqdm = "^4.31"
networkx = ">=3.4,<3.5"
fbmessenger = "~6.0.0"
pykwalify = ">=1.7,<1.9"
coloredlogs = ">=10,<16"
"ruamel.yaml" = ">=0.16.5,<0.17.22"
pyyaml = ">=6.0"
twilio = ">=6.26,<8.3"
webexteamssdk = ">=1.1.1,<1.7.0"
mattermostwrapper = "~2.2"
rocketchat_API = ">=0.6.31,<1.31.0"
colorhash = ">=1.0.2,<1.3.0"
jsonschema = ">=4.22,<4.25"
packaging = ">=23.0,<25.0"
pytz = ">=2023.0,<2027.0"
rasa-sdk = ">=3.14.0,<3.19.0"
colorclass = "~2.2"
terminaltables = "~3.1.0"
sanic = "~22.12"
sanic-cors = "~2.2.0"
sanic-jwt = "^1.8.0"
sanic-routing = "^22.8.0"
websockets = ">=10.4,<11.0"
aiohttp = "~3.14.1"
# multidict/frozenlist/yarl are compiled sub-deps of aiohttp; versions predating
# Python 3.13 fail to build against the 3.13 C API. Force modern builds that ship
# 3.13 wheels (within the ranges aiohttp/sanic allow).
multidict = ">=6.1.0,<7.0"
frozenlist = ">=1.5.0,<2.0"
yarl = ">=1.18.0,<2.0"
# sanic's compiled event-loop / HTTP parser deps; pre-3.13 versions don't build on
# the 3.13 C API. Pin modern builds (sanic caps neither).
uvloop = ">=0.21.0"
httptools = ">=0.6.4"
questionary = ">=1.5.1,<1.11.0"
prompt-toolkit = "^3.0,<3.0.29"
python-socketio = ">=4.4,<6"
python-engineio = ">=4,<6,!=5.0.0"
pydot = "~4.0.1"
SQLAlchemy = "~2.0.50"
psycopg2-binary = ">=2.8.2,<2.10.0"
python-dateutil = "~2.8"
setuptools = "~70.3.0"
ujson = ">=1.35,<6.0"
regex = ">=2024.11.6"
sentry-sdk = ">=0.17.0,<1.15.0"
aio-pika = ">=6.7.1,<8.2.4"
aiogram = "<2.26"
typing-extensions = ">=4.1.1,<5.0.0"
typing-utils = "^0.1.0"
tarsafe = ">=0.0.3,<0.0.5"
google-auth = "<3"
CacheControl = "^0.12.9"
randomname = "^0.1.5"
pluggy = "^1.0.0"
slack-sdk = "^3.19.2"
confluent-kafka = ">=1.9.2,<3.0.0"
portalocker = "^2.7.0"
structlog = "^23.1.0"
structlog-sentry = "^2.0.2"
dnspython = "~2.8.0"
wheel = ">=0.38.1"
certifi = ">=2023.7.22"
cryptography = ">=41.0.7"
safetensors = "~0.4.5"

[tool.poetry.dependencies.dask]
# dask 2024.12 rewrote graph execution (the new `_task_spec` engine), which is
# incompatible with rasa's tuple-based graph runner (rasa/engine/runner/dask.py).
# Pin to the last pre-rewrite line that still supports Python 3.13.
version = ">=2024.11.0,<2024.12.0"

[tool.poetry.dependencies.numpy]
version = ">=2.1.0,<2.4.0"

[tool.poetry.dependencies.protobuf]
version = ">=5.26.0,<6.0"

[tool.poetry.dependencies.scipy]
version = ">=1.14.1,<1.16.0"

[tool.poetry.dependencies.scikit-learn]
version = ">=1.5.0,<1.7.0"

[[tool.poetry.dependencies.pydantic]]
version = ">=2.6.4,<3.0.0"
optional = true

[tool.poetry.extras]
# The TensorFlow / spaCy / MITIE / jieba / transformers ML-NLU components have been
# removed from this Python 3.12/3.13 build, so their extras no longer exist.
gh-release-notes = [ "github3.py",]

[tool.poetry.scripts]
rasa = "rasa.__main__:main"

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/test_telemetry.py" = [ "E501",]
"tests/shared/core/test_domain.py" = [ "E501",]

[tool.pytest.ini_options]
python_functions = "test_"
filterwarnings = [ "ignore::ResourceWarning:ruamel[.*]",]
log_cli_level = "WARNING"
log_cli = true
markers = [ "skip_on_windows", "skip_on_ci", "sequential", "category_cli", "category_core_featurizers", "category_policies", "category_nlu_featurizers", "category_nlu_predictors", "category_full_model_training", "category_other_unit_tests", "category_performance", "flaky",]
timeout = 60
timeout_func_only = true
asyncio_mode = "auto"

[tool.poetry.dependencies.PyJWT]
version = "^2.0.0"
extras = [ "crypto",]

[tool.poetry.dependencies.colorama]
version = "^0.4.4"
markers = "sys_platform == 'win32'"

[tool.poetry.dependencies."github3.py"]
version = "~3.2.0"
optional = true

[tool.poetry.dependencies.pymongo]
version = "~4.17.0"
extras = [ "tls", "srv",]

[tool.poetry.dev-dependencies.pytest-sanic]
git = "https://github.com/RasaHQ/pytest-sanic"
branch = "fix_signal_issue"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.0.255,<0.0.256"
docker = "^6.0.1"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.20.0"
pytest-xdist = "^3.2.1"
pytest = "^7.1.3"
freezegun = "^1.0.0"
responses = "^0.22.0"
aioresponses = "^0.7.6"
moto = "~=4.1.2"
fakeredis = "^2.11.2"
mongomock = "^4.1.2"
black = "^22.10.0"
google-cloud-storage = "^2.4.0"
azure-storage-blob = "<12.16.0"
coveralls = "^3.0.1"
towncrier = "^22.8.0"
toml = "^0.10.0"
pep440-version-utils = "~1.2.0"
pydoc-markdown = "^4.5.1"
pytest-timeout = "^2.1.0"
mypy = "^1.0.0"
bandit = "^1.6.3"
types-pytz = "^2022.1.1"
types-python-dateutil = "^2.8.19"
types-requests = "^2.25.0"
types-setuptools = "^67.2.0"
memory-profiler = "^0.61.0"
psutil = "^5.8.0"
mypy-extensions = "^0.4.3"
sanic-testing = ">=22.9.0,<23.7.0"
analytics-python = "^1.4.0"
datadog-api-client = "^2.0.0"
datadog = "^0.45.0"
types-redis = "^4.3.20"
httpx = "0.23.3"
