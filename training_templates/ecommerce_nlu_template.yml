version: "3.1"

# ========================================
# TEMPLATE: E-Commerce Chatbot NLU Data
# Use Case: Bán hàng online (sản phẩm công nghệ)
# ========================================

nlu:
  # ============ GREETINGS & PLEASANTRIES ============

  - intent: greet
    examples: |
      - xin chào
      - chào bạn
      - hello
      - hi
      - chào buổi sáng
      - chào buổi chiều
      - chào buổi tối
      - hey
      - hế lô
      - alo

  - intent: goodbye
    examples: |
      - tạm biệt
      - bye
      - goodbye
      - hẹn gặp lại
      - tạm biệt nhé
      - bye bye
      - thôi tôi đi đây
      - ok tạm biệt

  - intent: thank
    examples: |
      - cảm ơn
      - cảm ơn bạn
      - thanks
      - thank you
      - cảm ơn nhiều
      - cảm ơn nhé
      - thanks a lot
      - cảm ơn bạn nhiều

  - intent: affirm
    examples: |
      - đúng
      - đúng rồi
      - ok
      - được
      - đồng ý
      - yes
      - yeah
      - vâng
      - ừ
      - okie

  - intent: deny
    examples: |
      - không
      - không phải
      - no
      - không đúng
      - sai rồi
      - thôi
      - không cần

  # ============ PRODUCT SEARCH ============

  - intent: search_product
    examples: |
      - tìm [laptop](product_type)
      - tìm [máy tính](product_type)
      - cho tôi xem [laptop](product_type)
