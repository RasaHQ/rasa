      - tôi muốn mua [laptop](product_type)
      - [laptop](product_type) gaming
      - tìm [laptop](product_type) [ASUS](brand)
      - [laptop](product_type) [Dell](brand) có không
      - cho xem [máy chủ](product_type)
      - tìm [server](product_type) [HP](brand)
      - [camera](product_type) an ninh
      - tìm [switch](product_type) mạng
      - [phần mềm](product_type) [Windows](product_name)
      - tìm [laptop](product_type) dưới [20 triệu](price_range)
