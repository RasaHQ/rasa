  # ============ ENTITIES ============

  # Synonyms
  - synonym: laptop
    examples: |
      - laptop
      - máy tính
      - máy tính xách tay
      - notebook
      - pc xách tay

  - synonym: máy chủ
    examples: |
      - máy chủ
      - server
      - may chu
      - máy chủ server

  - synonym: camera
    examples: |
      - camera
      - cam
      - camera an ninh
      - camera giám sát

  # Lookup Tables
  - lookup: brands
    examples: |
      - Dell
      - HP
      - Lenovo
      - ASUS
      - MSI
      - Cisco
      - HPE
      - Hikvision
      - Dahua
      - Microsoft

  - lookup: product_types
    examples: |
      - laptop
      - máy tính
      - máy chủ
      - server
      - switch
      - switch mạng
      - camera
      - camera an ninh
      - phần mềm
      - software

  # Regex
  - regex: order_id
    examples: |
      - \#\d{5,8}
      - ORDER-\d{6}
      - ORD\d{4,6}

  - regex: price_pattern
    examples: |
      - \d+\s?(triệu|tr|trieu)
      - \d+\s?(ngàn|k|ngan)
      - \d+\s?(đồng|dong|vnd)

  - regex: quantity_pattern
    examples: |
      - \d+\s?(cái|chiếc|con|bộ)
