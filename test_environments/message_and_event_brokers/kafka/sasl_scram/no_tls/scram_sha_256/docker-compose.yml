---
version: '3.8'
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: zookeeper-sasl-scram-sha-256-no-tls
    ports:
      - "2186:2186"
    environment:
      ZOOKEEPER_SERVER_ID: 1
      ZOOKEEPER_CLIENT_PORT: 2186
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_LOG4J_ROOT_LOGLEVEL: "DEBUG"
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/zookeeper_server_jaas.conf
        -Dquorum.auth.enableSasl=true
        -Dquorum.auth.learnerRequireSasl=true
        -Dquorum.auth.serverRequireSasl=true
        -Dquorum.cnxn.threads.size=20
        -Dzookeeper.authProvider.1=org.apache.zookeeper.server.auth.SASLAuthenticationProvider
        -Dzookeeper.authProvider.2=org.apache.zookeeper.server.auth.DigestAuthenticationProvider
        -DjaasLoginRenew=3600000
        -DrequireClientAuthScheme=sasl
        -Dquorum.auth.learner.loginContext=QuorumLearner
        -Dquorum.auth.server.loginContext=QuorumServer
    volumes:
      - ./zookeeper_server_jaas.conf:/etc/kafka/secrets/zookeeper_server_jaas.conf
      - ./zookeeper_client_jaas.conf:/etc/kafka/client/zookeeper_client_jaas.conf
    healthcheck:
      test: nc -z localhost 2186 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s

  zookeeper-scram-256-add-kafka-users:
    image: confluentinc/cp-kafka:7.3.2
    container_name: "zookeeper-scram-256-add-kafka-users"
    depends_on:
      zookeeper:
        condition: service_healthy
    command: "kafka-configs --zookeeper zookeeper-sasl-scram-sha-256-no-tls:2186 --alter --add-config 'SCRAM-SHA-256=[iterations=4096,password=password]' --entity-type users --entity-name kafkabroker && \
              kafka-configs --zookeeper zookeeper-sasl-scram-sha-256-no-tls:2186 --alter --add-config 'SCRAM-SHA-256=[iterations=4096,password=password]' --entity-type users --entity-name client"
    environment:
      KAFKA_BROKER_ID: ignored
      KAFKA_ZOOKEEPER_CONNECT: ignored
      KAFKA_OPTS: -Djava.security.auth.login.config=/etc/kafka/secrets/zookeeper_client_jaas.conf
    volumes:
      - ./zookeeper_client_jaas.conf:/etc/kafka/secrets/zookeeper_client_jaas.conf

  kafka-broker:
    image: confluentinc/cp-kafka:7.3.2
    container_name: kafka-broker-sasl-scram-sha-256-no-tls
    ports:
      - "9096:9096"
    depends_on:
      zookeeper-scram-256-add-kafka-users:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2186
      KAFKA_LISTENERS: SASL_PLAINTEXT://:9096, PLAINTEXT_LOCALHOST://:29096, SASL_BROKER://:9097
      KAFKA_ADVERTISED_LISTENERS: SASL_PLAINTEXT://localhost:9096, PLAINTEXT_LOCALHOST://localhost:29096, SASL_BROKER://kafka-broker-sasl-scram-sha-256-no-tls:9097
      KAFKA_SECURITY_INTER_BROKER_PROTOCOL: SASL_PLAINTEXT
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_SASL_ENABLED_MECHANISMS: SCRAM-SHA-256
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: SCRAM-SHA-256
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: SASL_PLAINTEXT:SASL_PLAINTEXT, PLAINTEXT_LOCALHOST:PLAINTEXT, SASL_BROKER:SASL_PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_RETENTION_MINUTES: 172800
      KAFKA_LOG4J_LOGGERS: "kafka.authorizer.logger=DEBUG,kafka.controller=DEBUG"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "DEBUG"
      KAFKA_SUPER_USERS: User:kafkabroker;User:kafkaclient
      KAFKA_ZOOKEEPER_SASL_ENABLED: "true"
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
      KAFKA_OPTS: -Dzookeeper.sasl.client=true
        -Dzookeeper.sasl.clientconfig=Client
        -Djava.security.auth.login.config=/etc/kafka/secrets/conf/kafka_server_jaas.conf
    volumes:
      - ./broker_jaas.conf:/etc/kafka/secrets/conf/kafka_server_jaas.conf
    healthcheck:
      test: nc -z localhost 29096 || exit 1
      interval: 30s
      retries: 10
      start_period: 15s
      timeout: 10s