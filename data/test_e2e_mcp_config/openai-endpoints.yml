action_endpoint:
  actions_module: "actions"
  
mcp_servers:
  - name: finnhub_mock_mcp_server
    url: http://127.0.0.1:8000/mcp/
    type: http

model_groups:
  - id: llm-model
    models:
      - provider: openai
        model: gpt-4o-2024-11-20
        timeout: 30
        temperature: 0.0
        top_p: 0.0
        cache:
          no-cache: true
