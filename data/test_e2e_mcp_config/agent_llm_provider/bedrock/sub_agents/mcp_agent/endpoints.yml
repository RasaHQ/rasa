action_endpoint:
  actions_module: "actions"
  
mcp_servers:
  - name: finnhub_mock_mcp_server
    url: http://127.0.0.1:8000/mcp/
    type: http
    oauth:
      client_id: "${AGENT_CLIENT_ID}"
      client_secret: "${AGENT_CLIENT_SECRET}"
      token_url: https://oauth-mock.mock.beeceptor.com/oauth/token/google # Using free online mock Oauth2.0 server (mocking Google provider) from Beeceptor
      scope: "read:users"

model_groups:
  - id: llm-model
    models:
      - provider: bedrock
        model: us.anthropic.claude-sonnet-4-5-20250929-v1:0
        aws_access_key_id: ${AWS_ACCESS_KEY_ID} # reference secret environment variable.
        aws_secret_access_key: ${AWS_SECRET_ACCESS_KEY} # reference secret environment variable.
        aws_session_token: ${AWS_SESSION_TOKEN}
        aws_region_name: ${AWS_REGION_NAME}
        timeout: 30
        temperature: 1.0
        cache:
          no-cache: true
        reasoning_effort: "high"
