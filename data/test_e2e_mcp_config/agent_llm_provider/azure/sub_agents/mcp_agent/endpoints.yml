action_endpoint:
  actions_module: "actions"
  
mcp_servers:
  - name: finnhub_mock_mcp_server
    url: http://127.0.0.1:8000/mcp/
    type: http
    oauth:
      client_id: "${AGENT_CLIENT_ID}"
      client_secret: "${AGENT_CLIENT_SECRET}"
      token_url: https://oauth-mock.mock.beeceptor.com/oauth/token/google # Using free online mock Oauth2.0 server (mocking Google provider) from Beeceptor
      scope: "read:users"

model_groups:
  - id: azure_model
    models:
    # Same LLM models across multiple deployments
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_GPT5_2_CSE}
        api_base: ${AZURE_API_BASE_GPT5_2_CSE}
        api_key: ${AZURE_API_KEY_CSE}
        api_version: ${AZURE_API_VERSION_GPT5_2_CSE}
        timeout: 30
        num_retries: 5
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_GPT5_2_ENGINE}
        api_base: ${AZURE_API_BASE_GPT5_2_ENGINE}
        api_key: ${AZURE_API_KEY_ENGINE}
        api_version: ${AZURE_API_VERSION_GPT5_2_ENGINE}
        timeout: 30
        num_retries: 5
    router:
      routing_strategy: cost-based-routing
      num_retries: 5
      timeout: 30
      allowed_fails: 3
      cooldown_time: 30
      retry_after: 5
      redis_host: ${REDIS_HOST}
      redis_port: ${REDIS_PORT}
      cache_responses: True
      set_verbose: True
      debug_level: DEBUG
  - id: llm-model
    models:
      - provider: openai
        model: openai/responses/gpt-5.2-2025-12-11
        timeout: 30
        temperature: 1.0
        reasoning_effort: "xhigh"
        max_completion_tokens: 5096
