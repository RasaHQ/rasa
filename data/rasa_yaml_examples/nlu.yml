version: "3.1"

nlu:
- intent: estimate_emissions
  examples: |
    - how much CO2 will that use?
    - how much carbon will a one way flight from [new york]{"entity": "city", "role": "from"} to [california]{"entity": "city", "role": "to"} produce?

- intent: give_name
  examples: |
    - my name is lors
    - I am Francelle
    - call me Lorraine
    - I'm Sam
    - my name is [lors](name)