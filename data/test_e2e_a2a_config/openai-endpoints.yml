action_endpoint:
  actions_module: "actions"

tracing:
  - type: langfuse
    host: https://cloud.langfuse.com
    public_key: ${LANGFUSE_PUBLIC_KEY}
    private_key: ${LANGFUSE_PRIVATE_KEY}
  - type: jaeger
    host: localhost
    port: 4317
    service_name: rasa
    sync_export: ~

model_groups:
  - id: llm-model
    models:
      - provider: openai
        model: openai/responses/gpt-5.2-2025-12-11
        timeout: 30
        temperature: 1.0
        reasoning_effort: "xhigh"
        max_completion_tokens: 5096
