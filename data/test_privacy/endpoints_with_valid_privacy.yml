event_broker:
  type: kafka
  url: localhost
  partition_by_sender: true
  topic: rasa
  client_id: kafka-python-rasa
  security_protocol: PLAINTEXT
  stream_pii: false
  anonymization_topics:
    - anonymization

privacy:
  tracker_store_settings:
    deletion:
      min_after_session_end: 3000
      cron: "30 0 * * 0"
    anonymization:
      min_after_session_end: 120
      cron: "30 1 * * 6"

  rules:
    - slot: credit_card_number
      anonymization:
          type: redact
          redaction_char: "#"
          keep_right: 4
    - slot: age
      anonymization:
          type: mask
