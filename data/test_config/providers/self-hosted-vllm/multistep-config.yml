recipe: default.v1
language: en
pipeline:
  - name: LLMBasedRouter
    prompt: rasa-private/data/test_config/providers/router_template.jinja2
    llm:
      provider: self-hosted
      model: Qwen/Qwen2.5-Coder-1.5B-Instruct
      api_base: "http://localhost:8080/v1"
      timeout: 900
      temperature: 0.0
    calm_entry:
      sticky: "handles everything else, including finance, transactions, transfers, balance, contacts and pizza orders"
    nlu_entry:
      sticky: "handles only health advice and hotel or restaurant bookings"
      non_sticky: "handles chitchat"
  - name: WhitespaceTokenizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: LogisticRegressionClassifier
    max_iter: 100
    solver: lbfgs
    tol: 0.0001
    random_state: 42
    ranking_length: 10
  - name: CRFEntityExtractor
  - name: DucklingEntityExtractor
    url: "http://localhost:8000"
    dimensions: ["time", "number"]
    timezone: "Europe/Berlin"
    timeout: 3
  - name: NLUCommandAdapter
  - name: MultiStepLLMCommandGenerator
    llm:
      provider: self-hosted
      model: Qwen/Qwen2.5-Coder-1.5B-Instruct
      api_base: "http://localhost:8080/v1"
      timeout: 900
      temperature: 0.0
      top_p: 0.01
    prompt_templates:
      handle_flows:
        file_path: rasa-private/data/test_config/providers/command_prompt.jinja2
      fill_slots:
        file_path: rasa-private/data/test_config/providers/command_prompt.jinja2

policies:
  - name: RulePolicy
  - name: TEDPolicy
    constrain_similarities: true
  - name: FlowPolicy
  - name: EnterpriseSearchPolicy
    citation_enabled: true
    use_generative_llm: true
    vector_store:
      source: data-repo/docs/
    llm:
      provider: self-hosted
      model: Qwen/Qwen2.5-Coder-1.5B-Instruct
      api_base: "http://localhost:8080/v1"
      timeout: 900
      temperature: 0.2
  - name: IntentlessPolicy
    llm:
      provider: self-hosted
      model: Qwen/Qwen2.5-Coder-1.5B-Instruct
      api_base: "http://localhost:8080/v1"
      timeout: 900
      temperature: 0.2

assistant_id: 20240418-073244-narrow-archive
