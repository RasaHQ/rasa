recipe: default.v1
language: en
pipeline:
  - name: WhitespaceTokenizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: LogisticRegressionClassifier
    max_iter: 100
    solver: lbfgs
    tol: 0.0001
    random_state: 42
    ranking_length: 10
  - name: CRFEntityExtractor
  - name: DucklingEntityExtractor
    url: "http://localhost:8000"
    dimensions: ["time", "number"]
    timezone: "Europe/Berlin"
    timeout: 3
  - name: CompactLLMCommandGenerator
    llm:
      provider: ollama
      model: llama3.2
      api_base: "http://localhost:11434"
      timeout: 20
      temperature: 0.0
      top_p: 0.0
      cache:
        no-cache: true

policies:
  - name: RulePolicy
  # Enable when bug ENG-1747 is resolved 
  # - name: TEDPolicy
  #   constrain_similarities: true
  - name: FlowPolicy
  - name: EnterpriseSearchPolicy
    max_messages_in_query: 4
    citation_enabled: true
    use_generative_llm: true
    vector_store:
      source: calm-benchmarking-bot/docs/
    llm:
      provider: ollama
      model: llama3.2
      api_base: "http://localhost:11434"
      timeout: 7
  - name: IntentlessPolicy
    llm:
      provider: ollama
      model: llama3.2
      api_base: "http://localhost:11434"
      timeout: 7

assistant_id: 20240418-073244-narrow-archive
