action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: openai_llm

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-openai-with-custom-prompt-for-CompactLLMCommandGenerator

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-openai-with-custom-prompt-for-CompactLLMCommandGenerator

model_groups:
  - id: openai_llm
    models:
      - provider: openai
        model: gpt-4o
        timeout: 20
        temperature: 0.0
        top_p: 0.0
        cache:
          no-cache: true
        num_retries: 5

  - id: openai_embeddings
    models:
      - provider: openai
        model: text-embedding-3-large
        timeout: 20
        num_retries: 5
