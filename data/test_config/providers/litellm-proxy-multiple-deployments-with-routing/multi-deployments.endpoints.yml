action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 rephrase_all: True
 llm:
    model_group: azure_llm

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-litellm-proxy

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-litellm-proxy

model_groups:
  - id: azure_llm
    models:
    # Same LLM models across multiple deployments
      - provider: litellm_proxy
        api_base: ${HTTP_PROXY_1} 
        model: gpt-3.5-turbo
      - provider: litellm_proxy
        api_base: ${HTTP_PROXY_2} 
        model: gpt-3.5-turbo
    router:
      routing_strategy: usage-based-routing
      num_retries: 5
      timeout: 30 
      redis_host: ${REDIS_HOST}
      redis_port: ${REDIS_PORT}
      cache_responses: True

  - id: azure_embeddings
    models:
      # Same Embedding models across multiple deployments
      - provider: litellm_proxy
        api_base: ${HTTP_PROXY_2}
        model: text-embedding-ada-002
      - provider: litellm_proxy
        api_base: ${HTTP_PROXY_2}
        model: text-embedding-ada-002
    router:
      routing_strategy: least-busy
      cache_responses: True
