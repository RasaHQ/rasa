action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: azure_llm

model_groups:
  - id: azure_llm
    models:
      - provider: litellm_proxy
        api_base: ${LITELLM_PROXY} 
        model: gpt-3.5-turbo
        timeout: 60
        temperature: 0.0
        top_p: 0.0
        cache:
          no-cache: true

  - id: azure_embeddings
    models:
      - provider: litellm_proxy
        api_base: ${LITELLM_PROXY}
        model: text-embedding-ada-002
        timeout: 60

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-litellm-proxy-multiple-deployments-with-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-litellm-proxy-multiple-deployments-with-routing
