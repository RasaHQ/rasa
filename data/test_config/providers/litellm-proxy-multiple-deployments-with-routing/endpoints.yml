action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 rephrase_all: True
 llm:
    model_group: azure_llm

model_groups:
  - id: azure_llm
    models:
      - provider: litellm_proxy
        api_base: ${LITELLM_PROXY} 
        model: gpt-3.5-turbo

  - id: azure_embeddings
    models:
      - provider: litellm_proxy
        api_base: ${LITELLM_PROXY}
        model: text-embedding-ada-002

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-litellm-proxy

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-litellm-proxy
