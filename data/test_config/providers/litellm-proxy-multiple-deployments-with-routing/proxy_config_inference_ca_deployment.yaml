model_list:
  - model_name: gpt-3.5-turbo
    litellm_params:
      model: azure/test-gpt-35-turbo
      api_base: "os.environ/AZURE_API_BASE_GPT3_5_TURBO_CA"
      api_key: "os.environ/AZURE_API_KEY_CA"
      api_version: "os.environ/AZURE_API_VERSION_GPT3_5_TURBO_CA"
  - model_name: text-embedding-3-large
    litellm_params:
      model: azure/test-text-embedding-3-large
      api_base: "os.environ/AZURE_API_BASE_TXT_EMBEDDING_ADA_CA"
      api_key: "os.environ/AZURE_API_KEY_CA"
      api_version: "os.environ/AZURE_API_VERSION_TXT_EMBEDDING_ADA_CA"

litellm_settings:
  ssl_verify: false
  request_timeout: 600
  callbacks: ["otel"]
  set_verbose: true

general_settings:
  background_health_checks: True
