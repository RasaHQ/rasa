action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: azure_llm

model_groups:
  - id: azure_llm
    models:
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_GPT4o}
        api_base: ${AZURE_API_BASE_GPT4o}
        api_key: ${AZURE_API_KEY_TRAINING}
        api_version: ${AZURE_API_VERSION_GPT4o}
        timeout: 20
        temperature: 0.0
        top_p: 0.0
        cache:
          no-cache: true
        num_retries: 5

  - id: azure_embeddings
    models:
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_TXT_EMBEDDING_3_LARGE}
        api_base: ${AZURE_API_BASE_TXT_EMBEDDING_3_LARGE}
        api_key: ${AZURE_API_KEY_TRAINING}
        api_version: ${AZURE_API_VERSION_TXT_EMBEDDING_3_LARGE}
        timeout: 20
        num_retries: 5

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-azure-multiple-deployments-with-least-busy-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-azure-multiple-deployments-with-least-busy-routing
