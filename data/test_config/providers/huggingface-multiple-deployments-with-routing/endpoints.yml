action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 rephrase_all: True
 llm:
    model_group: huggingface_llm
    
model_groups:
  - id: huggingface_llm
    models:
      - provider: huggingface
        model: rasa/cmd_gen_codellama_13b_calm_demo
        api_base: https://tli2t3mifcp9pjf8.us-east-1.aws.endpoints.huggingface.cloud
        api_key: ${HUGGINGFACE_API_KEY}
        timeout: 7
        num_retries: 5

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing
