action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: huggingface_llm
    
model_groups:
  - id: huggingface_llm
    models:
      - provider: huggingface
        model: huggingface/meta-llama/Llama-3.3-70B-Instruct
        api_key: ${HUGGINGFACE_API_KEY}
        timeout: 20
        temperature: 0.0
        cache:
          no-cache: true
        num_retries: 5

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing
