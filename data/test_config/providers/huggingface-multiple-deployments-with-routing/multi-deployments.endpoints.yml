action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: huggingface_llm

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-huggingface-multiple-deployments-with-routing
    
model_groups:
  - id: huggingface_llm
    models:
    # Same LLM models across multiple inference endpoints
      - provider: huggingface
        model: huggingface/meta-llama/Llama-3.3-70B-Instruct
        api_key: ${HUGGINGFACE_API_KEY}
        timeout: 7
        num_retries: 5
      - provider: huggingface
        model: together/meta-llama/Llama-3.3-70B-Instruct
        api_key: ${HUGGINGFACE_API_KEY}
        timeout: 7
        num_retries: 5
    router:
      routing_strategy: usage-based-routing
      num_retries: 5
      timeout: 30 
      redis_host: ${REDIS_HOST}
      redis_port: ${REDIS_PORT}
      cache_responses: True
