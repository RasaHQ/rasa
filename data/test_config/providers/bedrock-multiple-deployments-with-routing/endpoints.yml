action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 rephrase_all: True
 llm:
    model_group: bedrock_llm

model_groups:
  - id: bedrock_llm
    models:
      - provider: bedrock
        model: anthropic.claude-3-5-sonnet-20240620-v1:0
        aws_region_name: ${AWS_REGION_NAME}
        timeout: 7
        num_retries: 5

  - id: bedrock_embeddings
    models:
      - provider: bedrock
        model: amazon.titan-embed-text-v1
        aws_region_name: ${AWS_REGION_NAME}
        timeout: 7
        num_retries: 5

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-bedrock

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: rasa-providers-e2e-tests-bedrock
