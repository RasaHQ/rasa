action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: gemini_llm

model_groups:
  - id: gemini_llm
    models:
      - provider: gemini
        model: gemini-2.0-flash-lite-001
        api_key: ${GEMINI_API_KEY_1}
        timeout: 20
        temperature: 0.0
        top_p: 0.0
        cache:
          no-cache: true
        num_retries: 5

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-gemini-multiple-deployments-with-routing

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-gemini-multiple-deployments-with-routing
