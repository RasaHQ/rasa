action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
 type: rephrase
 llm:
    model_group: azure_llm

tracing:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-azure-multiple-deployments-with-usage-based-routing-v2

metrics:
 type: otlp
 endpoint: localhost:4317
 insecure: true
 host: localhost
 service_name: e2e-tests-azure-multiple-deployments-with-usage-based-routing-v2

model_groups:
  - id: azure_llm
    models:
    # Same LLM models across multiple deployments
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_GPT4o_CA}
        api_base: ${AZURE_API_BASE_GPT4o_CA}
        api_key: ${AZURE_API_KEY_CA}
        api_version: ${AZURE_API_VERSION_GPT4o_CA}
        timeout: 7
        num_retries: 5
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_GPT4o_FR}
        api_base: ${AZURE_API_BASE_GPT4o_FR}
        api_key: ${AZURE_API_KEY_FR}
        api_version: ${AZURE_API_VERSION_GPT4o_FR}
        timeout: 7
        num_retries: 5
    router:
      routing_strategy: usage-based-routing-v2
      num_retries: 5
      timeout: 30
      allowed_fails: 3
      cooldown_time: 30
      retry_after: 5
      redis_host: ${REDIS_HOST}
      redis_port: ${REDIS_PORT}
      cache_responses: True
      set_verbose: True
      debug_level: DEBUG

  - id: azure_embeddings
    models:
      # Same Embedding models across multiple deployments
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_TXT_EMBEDDING_3_LARGE_CA}
        api_base: ${AZURE_API_BASE_TXT_EMBEDDING_3_LARGE_CA}
        api_key: ${AZURE_API_KEY_CA}
        api_version: ${AZURE_API_VERSION_TXT_EMBEDDING_3_LARGE_CA}
        timeout: 7
        num_retries: 5
      - provider: azure
        deployment: ${AZURE_DEPLOYMENT_TXT_EMBEDDING_3_LARGE_FR}
        api_base: ${AZURE_API_BASE_TXT_EMBEDDING_3_LARGE_FR}
        api_key: ${AZURE_API_KEY_FR}
        api_version: ${AZURE_API_VERSION_TXT_EMBEDDING_3_LARGE_FR}
        timeout: 7
        num_retries: 5
    router:
      routing_strategy: usage-based-routing-v2
      num_retries: 5
      timeout: 30
      allowed_fails: 3
      cooldown_time: 30
      retry_after: 5
      redis_host: ${REDIS_HOST}
      redis_port: ${REDIS_PORT}
      cache_responses: True
      set_verbose: True
      debug_level: DEBUG
