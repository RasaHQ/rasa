recipe: default.v1
language: en
pipeline:
  - name: LLMBasedRouter
    calm_entry:
      sticky: "handles everything else, including finance, transactions, transfers, balance, contacts and pizza orders"
    nlu_entry:
      sticky: "handles only health advice and hotel or restaurant bookings"
      non_sticky: "handles chitchat"
  - name: WhitespaceTokenizer
  - name: CountVectorsFeaturizer
  - name: CountVectorsFeaturizer
    analyzer: char_wb
    min_ngram: 1
    max_ngram: 4
  - name: LogisticRegressionClassifier
    max_iter: 100
    solver: lbfgs
    tol: 0.0001
    random_state: 42
    ranking_length: 10
  - name: CRFEntityExtractor
  - name: DucklingEntityExtractor
    url: "http://localhost:8000"
    dimensions: ["time", "number"]
    timezone: "Europe/Berlin"
    timeout: 3
  - name: NLUCommandAdapter
  - name: data-repo.custom.search_ready_llm_command_generator_override_component.CustomSearchReadyLLMCommandGenerator
    llm:
      model_group: openai_llm
    flow_retrieval:
      embeddings:
        model_group: openai_embeddings
    prompt_template: rasa-private/data/test_config/providers/custom-search-ready-llm-command-generator-prompt-with-modified-dsl

policies:
  - name: RulePolicy
  - name: TEDPolicy
    constrain_similarities: true
  - name: FlowPolicy
  - name: EnterpriseSearchPolicy
    llm:
      model_group: openai_llm
    max_messages_in_query: 4
    use_generative_llm: true
    citation_enabled: true
    check_relevancy: true
    vector_store:
      source: data-repo/docs/
    embeddings:
      model_group: openai_embeddings

assistant_id: 20240418-073244-narrow-archive
