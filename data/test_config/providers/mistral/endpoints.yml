action_endpoint:
  url: "http://localhost:5055/webhook"

nlg:
  type: rephrase
  llm:
    model_group: mistral_llm

model_groups:
  - id: mistral_llm
    models:
      - provider: mistral
        model: codestral-2508
        timeout: 20
        temperature: 0.0
        top_p: 1
        cache:
          no-cache: true
        num_retries: 5

tracing:
  type: otlp
  endpoint: localhost:4317
  insecure: true
  host: localhost
  service_name: e2e-tests-mistral

metrics:
  type: otlp
  endpoint: localhost:4317
  insecure: true
  host: localhost
  service_name: e2e-tests-mistral
