name: eks-helm
description: Deploy a Rasa Pro instance on EKS using Helm via Pulumi. IRSA (volume, env) is in Helm values; set irsaRoleArn and ensure the rasa SA has eks.amazonaws.com/role-arn.
runtime: yaml
config:
  clusterName:
    type: string
  projectName:
    type: string
  rasaPro:
    type: string
  rasaProRepository:
    type: string
  rasaProHelmRepo:
    type: string
  rasaProHelmVersion:
    type: string
  rasaProModelBucketName:
    type: string
  rasaProModelFileName:
    type: string
  # PostgreSQL tracker store (RDS) with IAM auth, no password
  trackerStoreDbHost:
    type: string
  trackerStoreDbPort:
    type: string
    default: "5432"
  trackerStoreDbName:
    type: string
  trackerStoreDbUser:
    type: string
  # Region of the RDS instance; boto3 uses AWS_DEFAULT_REGION when generating the IAM auth token
  trackerStoreDbRegion:
    type: string
    default: "eu-west-1"
  # IRSA: IAM role ARN for the Rasa service account (must have eks.amazonaws.com/role-arn on SA)
  irsaRoleArn:
    type: string
  authToken:
    type: string
    default: "c29tZXNlY3JldA==" #base64 encoded 'somesecret'
  jwtSecret:
    type: string
    default: "c29tZXNlY3JldA==" #base64 encoded 'somesecret'
packages:
  rasa-aws: github.com/RasaHQ/pulumi-components/rasa-aws@v3.1.0-rasa-aws
  rasa-apps: github.com/RasaHQ/pulumi-components/rasa-apps@v1.5.0-rasa-apps
resources:
  githubProvider:
    type: pulumi:providers:github
    properties:
      owner: RasaHQ
  clusterRef:
    type: pulumi:pulumi:StackReference
    properties:
      name: ${clusterName}
  k8sProvider:
    type: pulumi:providers:kubernetes
    properties:
      kubeconfig: ${clusterRef.outputs["kubeConfig"]}
  namespace:
    type: kubernetes:core/v1:Namespace
    properties:
      metadata:
        name: ${projectName}
    options:
      provider: ${k8sProvider}
  rasa-pro:
    type: rasa-apps:RasaPro
    properties:
      rasaProHelmRepo: ${rasaProHelmRepo}
      rasaProHelmVersion: ${rasaProHelmVersion}
      rasaProLicense: ${rasaProLicense}
      openaiApiKey: ${rasaProOpenaiApiKey}
      namespace: ${projectName}
      helmValues: ${rasaProHelmValues}
      createNamespace: false
    options:
      provider: ${k8sProvider}
      dependsOn:
        - ${namespace}
  rasaProDns:
    type: rasa-aws:Route53IngressDnsRecord
    properties:
      route53ZoneName: ${awsRoute53ZoneName}
      dnsHostname: ${projectName}.${awsRoute53ZoneName}
      albTags:
        elbv2.k8s.aws/cluster: ${clusterRef.outputs["clusterName"]}
        ingress.k8s.aws/stack: ${pulumi.project}-${pulumi.stack}-alb-group
    options:
      provider: ${k8sProvider}
      dependsOn:
        - ${rasa-pro}
outputs:
  rasaProServerUrl: https://${rasaProDns.dnsRecordName}/version
  oidcProviderArn: ${clusterRef.outputs["oidcProviderArn"]}
  oidcProviderUrl: ${clusterRef.outputs["oidcProviderUrl"]}
variables:
  rasaProHelmValues:
    fullnameOverride: rasa
    # Service account with IRSA annotation
    serviceAccount:
      create: true
      name: rasa
      annotations:
        eks.amazonaws.com/role-arn: ${irsaRoleArn}
    rasa:
      enabled: true
      image:
        tag: ${rasaPro}
        repository: ${rasaProRepository}
      # Volumes and volumeMounts for endpoints.yml
      volumes:
        - name: aws-iam-token
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: sts.amazonaws.com  # CRITICAL - must match STS expectations
                  expirationSeconds: 86400
                  path: token
      volumeMounts:
        - name: aws-iam-token
          mountPath: /var/run/secrets/eks.amazonaws.com/serviceaccount
          readOnly: true
      settings:
        authToken:
          secretName: rasa-secrets
          secretKey: authToken
        jwtSecret:
          secretName: rasa-secrets
          secretKey: jwtSecret
        debugMode: true
        credentials:
          enabled: true
          additionalChannelCredentials:
            rest: {}
        endpoints:
          action_endpoint:
            actions_module: "actions"
          tracker_store:
            enabled: true
            type: sql
            dialect: postgresql
            url: ${trackerStoreDbHost}
            db: ${trackerStoreDbName}
            username: ${trackerStoreDbUser}
            port: "5432"
            password: ""
            # no password - RDS IAM auth (RDS_SQL_DB_AWS_IAM_ENABLED=true)
          # Rasa endpoints.yml uses snake_case; some charts expect camelCase in values
          actionEndpoint:
            actions_module: "actions"
          trackerStore:
            enabled: true
            type: sql
            dialect: postgresql
            url: ${trackerStoreDbHost}
            db: ${trackerStoreDbName}
            username: ${trackerStoreDbUser}
            port: "5432"
            password: ""
            # no password - RDS IAM auth (RDS_SQL_DB_AWS_IAM_ENABLED=true)
      ingress:
        enabled: true
        className: alb
        annotations:
          kubernetes.io/ingress.class: alb
          alb.ingress.kubernetes.io/scheme: internet-facing
          alb.ingress.kubernetes.io/target-type: ip
          alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
          alb.ingress.kubernetes.io/backend-protocol: 'HTTP'
          alb.ingress.kubernetes.io/certificate-arn: ${awsCertificateArn}
          alb.ingress.kubernetes.io/group.name: ${pulumi.project}-${pulumi.stack}-alb-group
        hosts:
          - host: ${projectName}.${awsRoute53ZoneName}
            paths:
              - path: /
                pathType: Prefix
            extraPaths: []
        tls:
          - secretName: rasa-tls
            hosts:
              - ${projectName}.${awsRoute53ZoneName}
      additionalArgs: ["--model", "${rasaProModelFileName}", "--remote-storage", "aws"]
      additionalEnv:
        # IRSA configuration - using projected token with correct audience (must match STS expectations)
        - name: AWS_ROLE_ARN
          value: ${irsaRoleArn}
        - name: AWS_WEB_IDENTITY_TOKEN_FILE
          value: /var/run/secrets/eks.amazonaws.com/serviceaccount/token  # Custom path
        # RDS IAM authentication
        - name: IAM_CLOUD_PROVIDER
          value: "aws"
        - name: RDS_SQL_DB_AWS_IAM_ENABLED
          value: "true"
        - name: DB_HOST
          value: ${trackerStoreDbHost}
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: ${trackerStoreDbUser}
        - name: DB_DATABASE
          value: ${trackerStoreDbName}
        - name: SQL_TRACKER_STORE_SSL_MODE
          value: "require"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: rasa-secrets
              key: openaiApiKey
        - name: RASA_PRO_LICENSE
          valueFrom:
            secretKeyRef:
              name: rasa-secrets
              key: rasaProLicense
        # AWS region configuration (boto3 uses AWS_DEFAULT_REGION when generating the IAM auth token)
        - name: AWS_DEFAULT_REGION
          value: ${trackerStoreDbRegion}
        - name: AWS_REGION
          value: ${trackerStoreDbRegion}
        - name: BUCKET_NAME
          value: ${rasaProModelBucketName}
        - name: AUTH_TOKEN
          value: ${authToken}
        - name: JWT_SECRET
          value: ${jwtSecret}
        # SQL connection pooling for IAM token refresh
        - name: SQL_POOL_SIZE
          value: "5"
        - name: SQL_MAX_OVERFLOW
          value: "10"
        - name: SQL_POOL_RECYCLE
          value: "899"
        - name: SQL_POOL_PRE_PING
          value: "True"
      resources:
        requests:
          cpu: 1000m
          memory: 2Gi
        limits:
          cpu: 2000m
          memory: 4Gi
    rasaProServices:
      enabled: false
