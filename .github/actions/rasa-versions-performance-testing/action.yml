name: Rasa versions performance testing
description: Performance testing of CALM CompactLLMCommandGenerator, against baseline.

inputs:
    calm-benchmarking-bot-branch-tag-or-commit:
        description: "calm-benchmarking-bot's branch, tag or commit SHA to run DUT tests against"
        default: main
        required: true
    calm-experiment-tracking-branch-tag-or-commit:
        description: "calm-experiment-tracking repo's branch, tag or commit SHA, which contains rasa config and endpoint files to use"
        default: main
        required: true
    config_file:
        description: "Config file on calm-experiment-tracking repo, to use for rasa model training"
        default: main
        required: true
    endpoints_file:
        description: "Endpoints file on calm-experiment-tracking repo, to use for rasa model training and running DUT tests"
        default: main
        required: true
    tests_directory:
        description: "Tests directory on calm-benchmarking-bot, containing the DUT tests to run"
        default: main
        required: true
  
runs:
  using: 'composite'
  steps:
      - name: Checkout `calm-benchmarking-bot` git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RasaHQ/calm-benchmarking-bot
          ref: ${{ inputs.calm-benchmarking-bot-branch-tag-or-commit }}
          path: calm-benchmarking-bot
          token: ${{ env.CALM_BENCHMARKING_BOT_READ_TOKEN }}
      - name: Checkout `calm-experiment-tracking` git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RasaHQ/calm-experiment-tracking
          ref: ${{ inputs.calm-experiment-tracking-branch-or-tag }}
          path: calm-experiment-tracking
          token: ${{ env.CALM_EXPERIMENT_TRACKING_READ_TOKEN }}
      - name: Setup
        id: setup-python
        uses: ./.github/actions/setup-python-env
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
      - name: Configure AWS credentials
        if: ${{ contains(env.LLM_MODEL_NAME, 'claude') }}
        uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497 #v3.0.1
        with:
          role-to-assume: arn:aws:iam::329710836760:role/GitHubAction-BedrockFullAccess
          aws-region: ${{ env.AWS_REGION_NAME }}
      - name: Train model
        env:
          CONFIG_FILE: ${{ inputs.config_file }}
          ENDPOINTS_FILE: ${{ inputs.endpoints_file }}
        run: |
          : Train model
          rm -rf models .rasa
          cp -r calm-benchmarking-bot/docs .
          rasa train \
          --config calm-experiment-tracking/"${CONFIG_FILE}" \
          --endpoints calm-experiment-tracking/"${ENDPOINTS_FILE}" \
          --domain calm-benchmarking-bot/domain \
          --data calm-benchmarking-bot/data \
          --fixed-model-name dut-"${LLM_MODEL_NAME}"
        shell: bash
      - name: Run DUT tests and verify results against baseline
        id: verify-results-against-previous-baseline
        uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
        env:
          TESTS_DIRECTORY: ${{ inputs.tests_directory }}
          ENDPOINTS_FILE: ${{ inputs.endpoints_file }}
          DUT_RESULTS_FILE_PATH: ${{ github.workspace }}/current-test-results.yml
        with:
          timeout_minutes: 60
          max_attempts: 2
          retry_wait_seconds: 300
          shell: bash
          command: |
            : Run DUT tests and verify results against baseline
            set -Eeuxov pipefail
            cd calm-benchmarking-bot
            rasa test du "${TESTS_DIRECTORY}" \
            --output-prompt \
            --output-file "${DUT_RESULTS_FILE_PATH}" \
            --debug \
            --endpoints "${GITHUB_WORKSPACE}"/calm-experiment-tracking/"${ENDPOINTS_FILE}" \
            --model "${GITHUB_WORKSPACE}"/models/dut-"${LLM_MODEL_NAME}".tar.gz
            pytest "${GITHUB_WORKSPACE}"/scripts/rasa_versions_performance_testing.py -svv --cache-clear
      - name: Save test results
        if: ${{ failure() && steps.verify-results-against-previous-baseline.outcome == 'failure' }}
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 #v4.4.3
        with:
          name: ${{ env.LLM_MODEL_NAME }}-dut-test-results
          path: current-test-results.yml
