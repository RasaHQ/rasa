name: "Rasa Memory Monitor"
description: "Runs rasa init/train in Docker and reports memory usage"
inputs:
  RASA_PRO_LICENSE:
    required: true
    description: "Rasa Pro license key"
  OPENAI_API_KEY:
    required: true
    description: "OpenAI API key"
runs:
  using: "composite"
  steps:
    - name: Run rasa init, monitor memory
      working-directory: /tmp/rasa-memory-test
      shell: bash
      run: /usr/bin/time -v rasa init --no-prompt > output.txt 2>&1
      env:
        RASA_PRO_LICENSE: ${{ inputs.RASA_PRO_LICENSE }}
        OPENAI_API_KEY: ${{ inputs.OPENAI_API_KEY }}
    - name: Run rasa train, monitor memory
      working-directory: /tmp/rasa-memory-test
      if: ${{ success() }}
      shell: bash
      run: /usr/bin/time -v rasa train --fixed-model-name model > train_output.txt 2>&1
      env:
        RASA_PRO_LICENSE: ${{ inputs.RASA_PRO_LICENSE }}
        OPENAI_API_KEY: ${{ inputs.OPENAI_API_KEY }}
        RASA_PRO_DEV_REPOSITORY: ${{ inputs.RASA_PRO_DEV_REPOSITORY }}
        RASA_IMAGE_TAG: ${{ inputs.RASA_IMAGE_TAG }}

    - name: Read max resident set size
      working-directory: /tmp/rasa-memory-test
      id: read-max-rss
      shell: bash
      run: |
        MAX_RSS=$(grep 'Maximum resident set size' output.txt | awk -F': ' '{print $2}' | tr -d ' ')
        echo "MAX_RSS=$MAX_RSS" >> $GITHUB_ENV
        echo "max_rss=$MAX_RSS" >> $GITHUB_OUTPUT
        MAX_RSS_TRAIN=$(grep 'Maximum resident set size' train_output.txt | awk -F': ' '{print $2}' | tr -d ' ')
        echo "MAX_RSS_TRAIN=$MAX_RSS_TRAIN" >> $GITHUB_ENV
        echo "max_rss_train=$MAX_RSS_TRAIN" >> $GITHUB_OUTPUT

        MAX_RSS_MB=$(echo "scale=2; $MAX_RSS/1024" | bc)
        echo "MAX_RSS_MB=$MAX_RSS_MB" >> $GITHUB_OUTPUT
        MAX_RSS_TRAIN_MB=$(echo "scale=2; $MAX_RSS_TRAIN/1024" | bc)
        echo "MAX_RSS_TRAIN_MB=$MAX_RSS_TRAIN_MB" >> $GITHUB_OUTPUT
outputs:
  max_rss:
    description: "Max RSS for rasa init"
    value: ${{ steps.read-max-rss.outputs.max_rss }}
  max_rss_mb:
    description: "Max RSS (MB) for rasa init"
    value: ${{ steps.read-max-rss.outputs.MAX_RSS_MB }}
  max_rss_train:
    description: "Max RSS for rasa train"
    value: ${{ steps.read-max-rss.outputs.max_rss_train }}
  max_rss_train_mb:
    description: "Max RSS (MB) for rasa train"
    value: ${{ steps.read-max-rss.outputs.MAX_RSS_TRAIN_MB }}
