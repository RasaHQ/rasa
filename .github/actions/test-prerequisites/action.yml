name: Test prerequisites
description: Encapsulates steps for Testing

inputs:
  PYTHON_VERSION:
    description: "Default Python Version"
    required: true
  LOAD_CACHE:
    description: "Load cached Rasa or not. Default = true"
    required: false
    default: "true"
  RASA_INSTALL_GROUP:
    description: "Rasa install group."
    required: false
    default: "full"
outputs:
  CACHE_LOADED:
    description: "Cache hit and cache loaded or not"
    value: ${{ steps.cached-rasa.outputs.cache-hit || steps.cached-rasa-with-spacy-mitie-and-transformer-models.outputs.cache-hit }}

runs:
  using: "composite"
  steps:
    - name: Set up Python ${{ inputs.PYTHON_VERSION }} 🐍
      id: setup-python
      uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
      with:
        python-version: ${{ inputs.PYTHON_VERSION }}

    - name: Read Poetry Version 🔢
      run: |
        echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
      shell: bash

    # Install & configure poetry
    - name: Install Poetry ${{ env.POETRY_VERSION }}
      uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
      with:
        version: ${{ env.POETRY_VERSION }}
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Dry-run and capture output for hashing
      env:
        RASA_INSTALL_GROUP: ${{ inputs.RASA_INSTALL_GROUP }}
      run: |
        if [[ "${RASA_INSTALL_GROUP}" == "default" ]]; 
        then
            make install --dry-run > dry-run
        elif [[ "${RASA_INSTALL_GROUP}" == "anonymisation" ]]; then
            make install-nlu-pii-channels --dry-run > dry-run
            make install-monitoring --dry-run >> dry-run
        elif [[ "${RASA_INSTALL_GROUP}" == "full-with-spacy-mitie-and-transformer-models" ]]; then
            make install-full --dry-run > dry-run
        else
            make install-"${RASA_INSTALL_GROUP}" --dry-run > dry-run
        fi
      shell: bash

    # Load cached Rasa if exists, save cache after job on miss
    - name: Cache Rasa
      id: cached-rasa
      if: ${{ inputs.LOAD_CACHE == 'true' && inputs.RASA_INSTALL_GROUP != 'full-with-spacy-mitie-and-transformer-models' }}
      uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
      with:
        path: ${{ github.workspace }}/.venv
        key: rasa-${{ inputs.RASA_INSTALL_GROUP }}-install-${{ runner.os }}-${{ inputs.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'dry-run') }}

    # Load cached Rasa (with Spacy, Mitie and Transformer models) if exists, save cache after job on miss
    - name: Cache Rasa with Spacy, Mitie and Transformer models
      id: cached-rasa-with-spacy-mitie-and-transformer-models
      if: ${{ inputs.LOAD_CACHE == 'true' && inputs.RASA_INSTALL_GROUP == 'full-with-spacy-mitie-and-transformer-models' }}
      uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
      with:
        path: ${{ github.workspace }}/.venv
        key: rasa-${{ inputs.RASA_INSTALL_GROUP }}-install-${{ runner.os }}-${{ inputs.PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'Makefile', 'data/test/hf_transformers_models.txt', 'dry-run') }}

    # Only install when the restored venv is empty (e.g. Poetry recreated it after path mismatch).
    # Fixes : poetry treating the venv as broken and recreating an empty venv.
    # Probe with poetry run which pytest: if it succeeds, venv is valid and we skip the heavy install
    # (avoids TensorFlow install on Python 3.13 and saves time). If it fails, venv is empty → run install.
    - name: Ensure Rasa dependencies in venv 📦
      if: ${{ inputs.LOAD_CACHE == 'true' }}
      env:
        RASA_INSTALL_GROUP: ${{ inputs.RASA_INSTALL_GROUP }}
      run: |
        if poetry run which pytest >/dev/null 2>&1; then
          echo "Venv already has pytest, skipping install."
          exit 0
        fi
        echo "Venv missing pytest (empty or recreated), running install..."
        if [[ "${RASA_INSTALL_GROUP}" == "default" ]]; then
          make install | tee .output
        elif [[ "${RASA_INSTALL_GROUP}" == "anonymisation" ]]; then
          make install-nlu-pii-channels | tee .output
          make install-monitoring | tee -a .output
        elif [[ "${RASA_INSTALL_GROUP}" == "full-with-spacy-mitie-and-transformer-models" ]]; then
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-spacy
          make prepare-mitie
          make prepare-transformers
        else
          make install-"${RASA_INSTALL_GROUP}" | tee .output
        fi
        if grep 'The lock file is not up to date' .output; then exit 1; fi
      shell: bash
