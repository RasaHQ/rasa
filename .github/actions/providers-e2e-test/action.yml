name: E2E Test on Rasa-Calm-Demo with supported providers
description: Runs E2E Test on `Rasa-Calm-Demo` bot with supported providers

inputs:
  provider:
    # In-case provider only has supported model for one
    # (for e.g. only chat-completion), then default OpenAI
    # would be used for the other
    description: LLM chat-completion and Embeddings model provider
    required: true
    default: all # Run e2e-test on all providers by default

  train-and-test:
    description: "Single-step or multi-step training type, and testing on corresponding model"
    required: true

  rasa-calm-demo-branch:
    description: Branch to checkout for `rasa-calm-demo`
    required: true
    default: main

  single-step-e2e-test-with-assertions:
      description: "Path to test file, on `rasa-calm-demo` repository"
      required: true
      # TODO: Use test that invokes enterprise-search, when flakiness is resolved
      default: "e2e_tests_with_assertions/passing/happy_path/user_checks_balance.yml"

  multi-step-e2e-test-with-assertions:
    description: "Path to test file, on `rasa-calm-demo` repository"
    required: true
    default: "e2e_tests_with_assertions/passing/happy_path/user_checks_balance.yml"

  llm-as-judge-model:
    description: "Judge model (must be from OpenAI) to be used by assertions."
    required: true
    default: gpt-4o-mini

runs:
  using: composite
  steps:
    - name: Checkout git repository 🕝
      uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c
      with:
        repository: RasaHQ/rasa-calm-demo
        ref: ${{ inputs.rasa-calm-demo-branch }}
        path: rasa-calm-demo
        token: ${{ env.RASA_CALM_DEMO_READ_TOKEN }}

    - name: Setup LLM-as-judge model
      working-directory: rasa-calm-demo
      run: |
        : Setup LLM-as-judge model
        echo "llm_as_judge:
                api_type: openai
                model: ${{ inputs.llm-as-judge-model }}" > conftest.yml
      shell: bash

    - name: Run OTEL collector for Tracing and Metrics collection
      working-directory: data/test_config/providers
      run: docker compose -f otel-docker-compose.yml up -d
      shell: bash

    - name: Setup Python Environment
      uses: RasaHQ/rasa-private/.github/actions/setup-python-env@main
      with:
        PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

    - name: Install MLflow for e2e-tests-with-assertions
      run: |
        : Install MLflow for e2e-tests-with-assertions
        source $VENV && poetry install -E mlflow
      shell: bash

    - name: Install google-generative-ai package
      if: ${{ inputs.provider == 'gemini' }}
      run: |
        : Install google-generative-ai package
        pip install google-generativeai
      shell: bash

    - name: Install sentence-transformers package
      if: ${{ inputs.provider == 'huggingface_local' }}
      run: |
        : Install sentence-transformers package
        source $VENV && pip install sentence-transformers
      shell: bash

    - name: Configure AWS credentials
      if: ${{ contains(inputs.provider, 'bedrock') }}
      uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497 #v3.0.1
      with:
        role-to-assume: arn:aws:iam::329710836760:role/GitHubAction-BedrockFullAccess
        aws-region: ${{ env.AWS_REGION_NAME }}

    - name: Install and start Ollama server
      if: ${{ inputs.provider == 'ollama' }}
      run: |
        : Install and start Ollama server
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
      shell: bash

    - name: Pull Ollama LLM model
      if: ${{ inputs.provider == 'ollama' }}
      run: |
        : Pull Ollama LLM model
        ollama pull llama3.2
      shell: bash

    - name: Setup vLLM
      if: ${{ inputs.provider == 'self-hosted' }}
      run: |
        : Setup vLLM
        pip install vllm==0.6.0 && vllm serve --trust-remote-code Snowflake/snowflake-arctic-base 
      shell: bash

    # As endpoint is scaled-to-zero upon inactivity for cost minimisation,
    # so need to wake it up before usage
    - name: Wake up Hugging Face inference endpoint
      if: ${{ inputs.provider == 'huggingface' }}
      working-directory: data/test_config/providers
      env:
        ENDPOINT_NAME: cmd-gen-codellama-13b-calm-d-bfz
        ENDPOINT_NAMESPACE: rasa
      run: |
        : Wake up Hugging Face inference endpoint
        pip install huggingface_hub && ./wake-up-inference-endpoint.py
      shell: bash

    # As endpoint are scaled-to-zero upon inactivity for cost minimisation,
    # so need to wake them up before usage
    - name: Wake up multiple Hugging Face inference endpoints
      if: ${{ inputs.provider == 'huggingface-multiple-deployments-with-routing' }}
      working-directory: data/test_config/providers
      env:
        ENDPOINT_NAME: cmd-gen-codellama-13b-calm-d-bfz
        ENDPOINT_NAMESPACE: rasa
      run: |
        : Wake up multiple Hugging Face inference endpoint
        pip install huggingface_hub
        ./wake-up-inference-endpoint.py & pid0=$!
        export ENDPOINT_NAME=cmd-gen-codellama-13b-calm-d-rbo && ./wake-up-inference-endpoint.py & pid1=$!
        export ENDPOINT_NAME=cmd-gen-codellama-13b-calm-d-kuz && ./wake-up-inference-endpoint.py & pid2=$!
        wait $pid0 && wait $pid1 && wait $pid2
      shell: bash

    - name: Install LiteLLM proxy with instrumentation
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      run: |
        : Install LiteLLM proxy with instrumentation
        source $VENV && pip install 'litellm[proxy]'
        echo "OTEL_TRACER_NAME=rasa-providers-e2e-tests-litellm-proxy" >> $GITHUB_ENV
        echo "OTEL_SERVICE_NAME=rasa-providers-e2e-tests-litellm-proxy" >> $GITHUB_ENV
      shell: bash

    - name: Run duckling server
      working-directory: rasa-calm-demo
      run: |
        make run-duckling
      shell: bash

    - name: Run action server
      id: run-action-server
      env:
        RASA_PRO_LICENSE: ${{ env.RASA_PRO_LICENSE }}
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        RASA_PRO_BETA_INTENTLESS: true
      working-directory: rasa-calm-demo
      run: |
        rasa run actions &
      shell: bash

    - name: Start LiteLLM proxy for training
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy for training
        litellm --config proxy_config_training.yaml --detailed_debug --debug & pid=$!
        litellm --config proxy_config_training.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_training.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY=http://0.0.0.0:4000" >> $GITHUB_ENV
        echo "litellm-proxy-pid=$pid" >> $GITHUB_ENV
      shell: bash

    - name: Train model
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      env:
        RASA_PRO_LICENSE: ${{ env.RASA_PRO_LICENSE }}
        RASA_PRO_BETA_INTENTLESS: true
      with:
        timeout_minutes: 15
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Train model
          rm -rf .rasa models \
            && rasa train \
            --config data/test_config/providers/${{ inputs.provider }}/${{ inputs.train-and-test }}-config.yml \
            --endpoints data/test_config/providers/${{ inputs.provider }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --domain rasa-calm-demo/domain \
            --data rasa-calm-demo/data \
            --fixed-model-name ${{ inputs.train-and-test }}-${{ inputs.provider }}-model \
            2>&1 \
            | tee model-training-log

    - name: Verify LLM and Embeddings API health checks during training
      run: |
        grep -i 'Sending a test LLM API request for the component - ContextualResponseRephraser' model-training-log \
          && grep -i 'Sending a test LLM API request for the component - LLMBasedRouter.' model-training-log \
          && grep -i 'Sending a test LLM API request for the component - EnterpriseSearchPolicy' model-training-log \
          && grep -i 'Sending a test LLM API request for the component - IntentlessPolicy' model-training-log \
          && grep -i 'Sending a test LLM API request for the component - LLMBasedCommandGenerator' model-training-log \
          && grep -i 'Sending a test Embeddings API request for the component - FlowRetrieval' model-training-log \
          && grep -i 'Sending a test Embeddings API request for the component - EnterpriseSearchPolicy' model-training-log \
          && grep -i 'Sending a test Embeddings API request for the component - IntentlessPolicy' model-training-log \
          && grep -i 'Your Rasa model is trained and saved' model-training-log \
          && echo 'LLM and Embeddings API health checks passed for all components during training'
      shell: bash
    
    - name: Get multi-deployments endpoints file
      if: ${{ contains(inputs.provider, '-multiple-deployments-with-') }}
      run: |
        : Get endpoints file
        echo "ENDPOINTS_FILE_NAME=multi-deployments.endpoints" >> $GITHUB_ENV
      shell: bash

    - name: Stop LiteLLM proxy used for training
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      run: |
        : Stop LiteLLM proxy used for training
        kill ${{ env.litellm-proxy-pid }}
      shell: bash

    - name: Start LiteLLM proxy 1 for inference
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy 1 for inference
        litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug 2>&1 > proxy-log-1 &
        litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY_1=http://0.0.0.0:4000" >> $GITHUB_ENV
      shell: bash

    - name: Start LiteLLM proxy 2 for inference
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy 2 for inference
        litellm --port 4001 --config proxy_config_inference_fr_deployment.yaml --detailed_debug --debug 2>&1 > proxy-log-2 &
        litellm --config proxy_config_inference_fa_deployment.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_inference_fa_deployment.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY_2=http://0.0.0.0:4001" >> $GITHUB_ENV
      shell: bash

    - name: Run e2e test (Single Step Command Generator)
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      if: ${{ inputs.train-and-test == 'singlestep' }}
      id: e2e-test-on-singlestep-trained-model
      env:
        RASA_PRO_LICENSE: ${{ env.RASA_PRO_LICENSE }}
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        RASA_PRO_BETA_INTENTLESS: true
      with:
        timeout_minutes: 15
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Run e2e test on SingleStepCommandGenerator model
          rasa test e2e rasa-calm-demo/${{ inputs.single-step-e2e-test-with-assertions }} \
            --e2e-results \
            --debug \
            --endpoints data/test_config/providers/${{ inputs.provider }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --model models/${{ inputs.train-and-test }}-${{ inputs.provider }}-model.tar.gz \
            2>&1 \
            | tee e2e-tests-log

    - name: Run e2e test (Multi-Step Command Generator)
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      if: ${{ inputs.train-and-test == 'multistep' }}
      env:
        RASA_PRO_LICENSE: ${{ env.RASA_PRO_LICENSE }}
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        RASA_PRO_BETA_INTENTLESS: true
      with:
        timeout_minutes: 15
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Run e2e test on MultiStepCommandGenerator model
          rasa test e2e rasa-calm-demo/${{ inputs.multi-step-e2e-test-with-assertions }} \
            --e2e-results \
            --debug \
            --endpoints data/test_config/providers/${{ inputs.provider }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --model models/${{ inputs.train-and-test }}-${{ inputs.provider }}-model.tar.gz \
            2>&1 \
            | tee e2e-tests-log

    - name: Verify LLM and Embeddings API health checks during inference
      if: ${{ !contains(inputs.provider, 'azure-multiple-deployments-with-') }}
      run: |
        grep -i 'Sending a test LLM API request for the component - ContextualResponseRephraser' e2e-tests-log \
          && grep -i 'Sending a test LLM API request for the component - LLMBasedRouter.' e2e-tests-log \
          && grep -i 'Sending a test LLM API request for the component - EnterpriseSearchPolicy' e2e-tests-log \
          && grep -i 'Sending a test LLM API request for the component - IntentlessPolicy' e2e-tests-log \
          && (grep -i 'Sending a test LLM API request for the component - MultiStepLLMCommandGenerator' e2e-tests-log || grep -i 'Sending a test LLM API request for the component - SingleStepLLMCommandGenerator' e2e-tests-log) \
          && grep -i 'Sending a test Embeddings API request for the component - FlowRetrieval' e2e-tests-log \
          && grep -i 'Sending a test Embeddings API request for the component - EnterpriseSearchPolicy' e2e-tests-log \
          && grep -i 'Sending a test Embeddings API request for the component - IntentlessPolicy' e2e-tests-log \
          && echo 'LLM and Embeddings API health checks passed for all components during inference'
      shell: bash

    - name: Save test results
      if: failure()
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 #v4.4.3
      with:
        name: ${{ inputs.provider }}-E2E-test-${{ inputs.train-and-test }}-results
        path: tests/e2e_results_failed.yml

    - name: Save LiteLLM-proxy logs
      if: ${{ failure() && inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 #v4.4.3
      with:
        name: LiteLLM-proxy-logs
        path: data/test_config/providers/litellm-proxy-multiple-deployments-with-routing/proxy-log-*

    - name: Get Rasa-pro version and short-SHA, and set as environment variables
      if: always()
      env:
        RASA_PRO_LICENSE: ${{ env.RASA_PRO_LICENSE }}
      run: |
        echo "RASA_VERSION=$(rasa --version | grep 'Rasa Pro Version' | tr -d ' ' | awk -F ':' '{print $2}')" >> $GITHUB_ENV
        echo "SHORT_SHA=`git rev-parse --short HEAD`" >> $GITHUB_ENV
      shell: bash

    - name: Notify Slack of successful test 💬
      if: success()
      uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 #v 1.25.0
      with:
        # Send notification to #dev-tribe-alerts slack channel
        channel-id: C070ELPSLBB 
        slack-message: ':rocket: *Rasa-Pro* (version `${{ env.RASA_VERSION }}`, `rasa-private` branch `${{ github.ref_name }}` sha `${{ env.SHORT_SHA }}`)
          CALM E2E tests (from `rasa-calm-demo` branch `${{ inputs.rasa-calm-demo-branch }}`) passed against: `${{ inputs.provider }}`, on ${{ inputs.train-and-test }} trained model. More
          information can be found <https://github.com/${{ github.repository
          }}/actions/runs/${{ github.run_id }}|here>.'
      env:
        SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}

    - name: Notify Slack of failing test ⛔️
      if: failure()
      uses: slackapi/slack-github-action@6c661ce58804a1a20f6dc5fbee7f0381b469e001 #v 1.25.0
      with:
        # Send notification to #dev-tribe-alerts slack channel
        channel-id: C070ELPSLBB 

        # Alert Engine-squad
        slack-message: '<!subteam^S0322UJCPU1> :broken_heart: *Rasa-Pro* (version `${{ env.RASA_VERSION
          }}`, `rasa-private` branch `${{ github.ref_name }}` sha `${{ env.SHORT_SHA }}`) CALM E2E tests (from `rasa-calm-demo` branch `${{ inputs.rasa-calm-demo-branch }}`) failed against: `${{ inputs.provider }}`, on ${{ inputs.train-and-test }} trained model!
          More information can be found <https://github.com/${{
          github.repository }}/actions/runs/${{ github.run_id }}|here>.'
      env:
        SLACK_BOT_TOKEN: ${{ env.SLACK_BOT_TOKEN }}
