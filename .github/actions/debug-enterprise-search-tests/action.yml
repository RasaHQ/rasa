name: Debug enterprise search test containers
description: Encapsulates steps for enterprise search test debugging

inputs:
  COMPOSE_FILE_PATH:
    description: 'Enterprise search tests docker compose path'
    required: true

runs:
  using: 'composite'
  steps:
  - name: List containers
    run: sudo docker ps -a
    shell: bash

  - name: Check rasa-pro container logs faiss
    env:       
      COMPOSE_FILE_PATH: ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs rasa-pro-assistant-faiss
    shell: bash

  - name: Check rasa-pro container logs milvus
    env:
      COMPOSE_FILE_PATH: ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs rasa-pro-assistant-milvus
    shell: bash

  - name: Check rasa-pro container logs qdrant
    env:
      COMPOSE_FILE_PATH:
        ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs rasa-pro-assistant-qdrant
    shell: bash

  - name: Check action server container logs
    env:
      COMPOSE_FILE_PATH: ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs action-server
    shell: bash

  - name: Check qdrant container logs
    env:
      COMPOSE_FILE_PATH: ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs qdrant
    shell: bash

  - name: Check milvus container logs
    env:
      COMPOSE_FILE_PATH: ${{ inputs.COMPOSE_FILE_PATH }}
    run: |
      docker compose -f "$COMPOSE_FILE_PATH" logs milvus-standalone
    shell: bash
