name: Destroy Pulumi Resources
description: Destroys Pulumi resources and removes the stack.
inputs:
  aws-region:
    description: AWS region
    required: true
  role-to-assume:
    description: AWS role to assume
    required: true
  pulumi-access-token:
    description: Pulumi access token
    required: true
  stack-name:
    description: Pulumi stack name
    required: true



runs:
  using: "composite"
  steps:

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v3
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}

    - name: Set up kubeconfig
      env:
        AWS_REGION: ${{ inputs.aws-region }}
      shell: bash
      run: |
        aws eks update-kubeconfig --name rasa-pro-cluster --region $AWS_REGION

    - uses: pulumi/actions@v5
    - name: Destroy resources and remove the stack
      shell: bash
      env:
        PULUMI_ACCESS_TOKEN: ${{ inputs.pulumi-access-token }}
        STACK_NAME: ${{ inputs.stack-name }}
      run: |
        pulumi destroy -s rasa/rasa-pro-eks-helm/$STACK_NAME --yes
        pulumi stack rm rasa/rasa-pro-eks-helm/$STACK_NAME --yes
