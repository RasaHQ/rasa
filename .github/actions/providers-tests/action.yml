name: Test on Bot with supported CALM providers
description: Runs test(s) on bot with supported CALM providers

inputs:
  provider:
    # In-case provider only has supported model for one
    # (for e.g. only chat-completion), then default OpenAI
    # would be used for the other
    description: LLM chat-completion and Embeddings model provider
    required: true
    default: all # Run e2e-test on all providers by default

  train-and-test:
    description: "CompactLLMCommandGenerator or SearchReadyLLMCommandGenerator for training and testing on corresponding model"
    required: true

  data-repo:
    description: Bot repository
    required: true
    default: main

  data-repo-branch:
    description: Branch to checkout for data-repo
    required: true
    default: main

  compact-tests:
    description: "Path to test file(s)"
    required: true
    default: "e2e_tests/tests_for_github_workflows/user_checks_balance.yml"

  search-ready-tests:
    description: "Path to test file(s)"
    required: true
    default: "e2e_tests/tests_for_github_workflows/chitchat_during_flow.yml"

runs:
  using: composite
  steps:
    - name: Checkout ${{ inputs.data-repo }} git repository 🕝
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        repository: RasaHQ/${{ inputs.data-repo }}
        ref: ${{ inputs.data-repo-branch }}
        path: data-repo
        token: ${{ inputs.data-repo == 'rasa-calm-demo' && env.RASA_CALM_DEMO_READ_TOKEN || env.CALM_BENCHMARKING_BOT_READ_TOKEN }}

    - name: Initialise data-repo as module
      run: |
        : Initialise data-repo as module
        touch data-repo/__init__.py
      shell: bash

    - name: Checkout specific `rasa-pro` version 🕝
      if: ${{ env.RASA_PRO_VERSION != '' }}
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ env.RASA_PRO_VERSION }}
        path: rasa-pro

    - name: Setup Python Environment
      id: setup-python
      uses: ./.github/actions/setup-python-env
      with:
        PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
        WORKING_DIRECTORY: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
        MATRIX_JOB: ${{ inputs.provider }}-${{ inputs.train-and-test }}
        RASA_DEFAULT_INSTALLATION_ONLY: False
        OPTIONAL_GROUP_TO_INSTALL: nlu

    - name: Install google-generative-ai package
      working-directory: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
      if: ${{ contains(inputs.provider, 'gemini') && steps.setup-python.outputs.cache-hit != 'true' }}
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        : Install google-generative-ai package
        source $VENV && pip install -r ./data/test_config/providers/"${PROVIDER}"/requirements.txt
      shell: bash

    - name: Install sentence-transformers package
      working-directory: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
      if: ${{ inputs.provider == 'huggingface_local' && steps.setup-python.outputs.cache-hit != 'true' }}
      run: |
        : Install sentence-transformers package
        source $VENV && pip install -r ./data/test_config/providers/huggingface_local/requirements.txt
      shell: bash

    - name: Configure AWS credentials
      if: ${{ contains(inputs.provider, 'bedrock') || contains(inputs.provider, 'sagemaker') }}
      uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
      with:
        role-to-assume: arn:aws:iam::307946638045:role/GitHubAction-BedrockAndSagemakerAccess
        aws-region: ${{ env.AWS_REGION_NAME }}

    - name: Install and start Ollama server
      if: ${{ inputs.provider == 'ollama' }}
      run: |
        : Install and start Ollama server
        curl -fsSL https://ollama.com/install.sh | sh
        ollama serve &
      shell: bash

    - name: Pull Ollama LLM model
      if: ${{ inputs.provider == 'ollama' }}
      run: |
        : Pull Ollama LLM model
        ollama pull gemma3
      shell: bash

    - name: Ollama API health-check
      if: ${{ inputs.provider == 'ollama' }}
      run: |
        : Ollama API health-check
        curl http://localhost:11434/api/generate -d '{
          "model": "gemma3",
          "prompt": "Why is the sky blue?"
        }'
      shell: bash

    - name: Build vLLM Docker image
      if: ${{ inputs.provider == 'self-hosted-vllm' }}
      run: |
        : Build vLLM Docker image
        mkdir vllm
        git clone --depth=1 --branch v0.8.2 https://github.com/vllm-project/vllm.git vllm
        cd vllm
        docker buildx build -f Dockerfile.cpu \
        --cache-to type=gha \
        --cache-from type=gha \
        -t vllm-cpu-env \
        --shm-size=60g .
      shell: bash

    - name: Install Huggingface CLI
      working-directory: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
      if: ${{ (contains(inputs.provider, 'self-hosted') || contains(inputs.provider, 'huggingface')) && steps.setup-python.outputs.cache-hit != 'true' }}
      env:
        PROVIDER: ${{ inputs.provider }}
      run: |
        : Install Huggingface CLI
        source $VENV && pip install -r ./data/test_config/providers/"${PROVIDER}"/requirements.txt
      shell: bash

    - name: Cache model to be used with vLLM
      if: ${{ inputs.provider == 'self-hosted-vllm' }}
      uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
      id: self-hosted-vllm-model-cache
      with:
        path: models
        key: ${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ inputs.provider }}-${{ inputs.train-and-test }}-model-${{ hashFiles('rasa-private/data/test_config/providers/self-hosted-vllm/*') }}

    - name: Download model to be used with vLLM
      if: ${{ inputs.provider == 'self-hosted-vllm' && steps.self-hosted-vllm-model-cache.outputs.cache-hit != 'true' }}
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      env:
        LLM_MODEL_NAME: ${{ env.LLM_MODEL_NAME || 'ibm-granite/granite-3.3-2b-instruct' }}
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Download model to be used with vLLM
          set -Eeuxov pipefail
          git config --global credential.helper cache
          huggingface-cli login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          export HF_HUB_ENABLE_HF_TRANSFER=1
          huggingface-cli download ${{ env.LLM_MODEL_NAME }} --repo-type model --local-dir models --cache-dir models

    - name: Performance tuning for vLLM
      if: ${{ inputs.provider == 'self-hosted-vllm' }}
      run: |
        : Performance tuning for vLLM
        sudo apt-get install libtcmalloc-minimal4
        echo "LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libtcmalloc_minimal.so.4:$LD_PRELOAD" >> $GITHUB_ENV
      shell: bash

    - name: Run vLLM Docker container with model
      id: run-vllm-docker-container
      env:
        LLM_MODEL_NAME: ${{ env.LLM_MODEL_NAME || 'ibm-granite/granite-3.3-2b-instruct' }}
      if: ${{ inputs.provider == 'self-hosted-vllm' }}
      run: |
        : Run vLLM Docker container with model
        docker run -d -p 8080:8080 \
        -v $(pwd)/models:/mnt/model \
        -e VLLM_LOGGING_LEVEL=DEBUG \
        --shm-size=60g \
        --name vllm \
        vllm-cpu-env \
        --model "/mnt/model" \
        --served-model-name ${{ env.LLM_MODEL_NAME }} \
        --swap-space 0 \
        --port 8080 \
        --max_model_len 4096 \
        --trust-remote-code
      shell: bash

    - name: Cache model to be used with Llama-CPP
      if: ${{ inputs.provider == 'self-hosted-llama-cpp' }}
      uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
      id: self-hosted-llama-cpp-model-cache
      with:
        path: models
        key: ${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ inputs.provider }}-${{ inputs.train-and-test }}-model-${{ hashFiles('rasa-private/data/test_config/providers/self-hosted-llama-cpp/*') }}

    - name: Download model to be used with llama.cpp
      if: ${{ inputs.provider == 'self-hosted-llama-cpp' && steps.self-hosted-llama-cpp-model-cache.outputs.cache-hit != 'true' }}
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      env:
        LLM_MODEL_NAME: ${{ env.LLM_MODEL_NAME || 'ggml-org/Meta-Llama-3.1-8B-Instruct-Q4_0-GGUF' }}
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Download model to be used with vLLM
          set -Eeuxov pipefail
          git config --global credential.helper cache
          huggingface-cli login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          export HF_HUB_ENABLE_HF_TRANSFER=1
          huggingface-cli download ${{ env.LLM_MODEL_NAME }} --repo-type model --local-dir models --cache-dir models

    - name: Install llama.cpp
      if: ${{ inputs.provider == 'self-hosted-llama-cpp' }}
      run: |
        : Install llama.cpp
        eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
        brew install llama.cpp \
        && brew list llama.cpp \
        && brew info llama.cpp \
        && echo "PATH=$PATH:$(brew --prefix llama.cpp)/bin" >> "$GITHUB_ENV"
      shell: bash

    - name: Start llama.cpp server
      if: ${{ inputs.provider == 'self-hosted-llama-cpp' }}
      run: |
        : Start llama.cpp server
        llama-server --model models/meta-llama-3.1-8b-instruct-q4_0.gguf -v --no-webui &
      shell: bash

    - name: Install LiteLLM proxy with instrumentation
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      env:
        PROVIDER: ${{ inputs.provider }}
        RASA_PRO_DIRECTORY: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
      run: |
        : Install LiteLLM proxy with instrumentation
        python -m venv "${GITHUB_WORKSPACE}"/litellm-proxy-venv # Install LiteLLM-Proxy in separate virtual-environment to avoid clashes with Rasa dependencies (using Pipx is still causing errors)
        . "${GITHUB_WORKSPACE}"/litellm-proxy-venv/bin/activate
        pip install -r "${RASA_PRO_DIRECTORY}"/data/test_config/providers/"${PROVIDER}"/requirements.txt
        litellm --version
        echo "OTEL_TRACER_NAME=litellm-proxy-multiple-deployments-with-routing" >> $GITHUB_ENV
      shell: bash

    - name: Run duckling server
      working-directory: data-repo
      run: |
        : Run duckling server
        make run-duckling
      shell: bash

    - name: Run action server
      id: run-action-server
      env:
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
      working-directory: data-repo
      run: |
        : Run action server
        rasa run actions &
      shell: bash

    - name: Start LiteLLM proxy for training
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: rasa-private/data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy for training
        . "${GITHUB_WORKSPACE}"/litellm-proxy-venv/bin/activate
        litellm --config proxy_config_training.yaml --detailed_debug --debug & pid=$!
        litellm --config proxy_config_training.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_training.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY=http://0.0.0.0:4000" >> $GITHUB_ENV
        echo "litellm-proxy-pid=$pid" >> $GITHUB_ENV
      shell: bash

    - name: Run OTEL collector for Tracing and Metrics collection
      working-directory: rasa-private
      id: run-otel-collector
      run: |
        : Run OTEL collector for Tracing and Metrics collection
        make run-otel-collector
      shell: bash

    - name: Train model
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      env:
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Train model
          set -Eeuxov pipefail
          rasa_path="${GITHUB_WORKSPACE}"/${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
          rm -rf "${rasa_path}"/.rasa "${rasa_path}"/models \
            && rasa train \
            --config "${GITHUB_WORKSPACE}"/rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.COMMAND_GENERATOR }}-config.yml \
            --endpoints "${GITHUB_WORKSPACE}"/rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --domain "${GITHUB_WORKSPACE}"/data-repo/domain \
            --data "${GITHUB_WORKSPACE}"/data-repo/data \
            --fixed-model-name ${{ env.COMMAND_GENERATOR }}-${{ env.PROVIDER }}-model \
            2>&1 \
            | tee model-training-log.txt

    - name: Verify LLM and Embeddings API health checks during training
      if: ${{ !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      env:
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      run: |
        : Verify LLM and Embeddings API health checks during training
        grep -i 'Sending a test LLM API request for the component - ContextualResponseRephraser' model-training-log.txt \
          && (grep -i 'Sending a test LLM API request for the component - LLMBasedRouter.' model-training-log.txt || grep -iv 'LLMBasedRouter.' rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.COMMAND_GENERATOR }}-config.yml) \
          && grep -i 'Sending a test LLM API request for the component - EnterpriseSearchPolicy' model-training-log.txt \
          && grep -i 'Sending a test LLM API request for the component - LLMBasedCommandGenerator' model-training-log.txt \
          && grep -i 'Sending a test Embeddings API request for the component - FlowRetrieval' model-training-log.txt \
          && grep -i 'Sending a test Embeddings API request for the component - EnterpriseSearchPolicy' model-training-log.txt \
          && grep -i 'Your Rasa model is trained and saved' model-training-log.txt \
          && echo 'LLM and Embeddings API health checks passed for all components during training'
      shell: bash

    - name: Verify correct default model used for OpenAI provider by CompactLLMCommandGenerator
      if: ${{ inputs.provider == 'openai' && inputs.train-and-test == 'compact' && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST  }}
      run: |
        : Verify correct default model used for OpenAI provider by CompactLLMCommandGenerator
        grep -i '"model": "gpt-4o-2024-11-20"' model-training-log.txt
      shell: bash

    - name: Get multi-deployments endpoints file
      if: ${{ contains(inputs.provider, '-multiple-deployments-with-') }}
      run: |
        : Get endpoints file
        echo "ENDPOINTS_FILE_NAME=multi-deployments.endpoints" >> $GITHUB_ENV
      shell: bash

    - name: Stop LiteLLM proxy used for training
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      run: |
        : Stop LiteLLM proxy used for training
        kill ${{ env.litellm-proxy-pid }}
      shell: bash

    - name: Start LiteLLM proxy 1 for inference
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: rasa-private/data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy 1 for inference
        . "${GITHUB_WORKSPACE}"/litellm-proxy-venv/bin/activate
        litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug 2>&1 > proxy-log-1 &
        litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_inference_ca_deployment.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY_1=http://0.0.0.0:4000" >> $GITHUB_ENV
      shell: bash

    - name: Start LiteLLM proxy 2 for inference
      if: ${{ inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      working-directory: rasa-private/data/test_config/providers/litellm-proxy-multiple-deployments-with-routing
      run: |
        : Start LiteLLM proxy 2 for inference
        . "${GITHUB_WORKSPACE}"/litellm-proxy-venv/bin/activate
        litellm --port 4001 --config proxy_config_inference_fr_deployment.yaml --detailed_debug --debug 2>&1 > proxy-log-2 &
        litellm --config proxy_config_inference_fa_deployment.yaml --detailed_debug --debug --health --test || (sleep 5 && litellm --config proxy_config_inference_fa_deployment.yaml --detailed_debug --debug --health --test)
        echo "LITELLM_PROXY_2=http://0.0.0.0:4001" >> $GITHUB_ENV
      shell: bash

    - name: Run e2e test (Compact Command Generator)
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      if: ${{ inputs.train-and-test == 'compact' && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      env:
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        TESTS: ${{ inputs.compact-tests }}
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Run e2e test on CompactLLMCommandGenerator model
          set -Eeuxov pipefail
          rm -rf .rasa
          if [[ ! -d tests ]]; then
            mkdir tests;
          fi
          rasa test e2e "${GITHUB_WORKSPACE}"/data-repo/${{ env.TESTS }} \
            --e2e-results \
            --debug \
            --endpoints "${GITHUB_WORKSPACE}"/rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --model models/${{ env.COMMAND_GENERATOR }}-${{ env.PROVIDER }}-model.tar.gz \
            2>&1 \
            | tee e2e-tests-log.txt

    - name: Run e2e test (Search Ready Command Generator)
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      if: ${{ inputs.train-and-test == 'search-ready' && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      env:
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        TESTS: ${{ inputs.search-ready-tests }}
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      with:
        timeout_minutes: 60
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Run e2e test on SearchReadyLLMCommandGenerator model
          set -Eeuxov pipefail
          rm -rf .rasa
          if [[ ! -d tests ]]; then
            mkdir tests;
          fi
          rasa test e2e "${GITHUB_WORKSPACE}"/data-repo/${{ env.TESTS }} \
            --e2e-results \
            --debug \
            --endpoints "${GITHUB_WORKSPACE}"/rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --model models/${{ env.COMMAND_GENERATOR }}-${{ env.PROVIDER }}-model.tar.gz \
            2>&1 \
            | tee e2e-tests-log.txt

    - name: Verify correct JSON default prompts used by CompactLLMCommandGenerator
      if: ${{ inputs.train-and-test == 'compact' && !contains(inputs.provider, 'custom') && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST  }}
      run: |
        : Verify correct JSON default prompts used by CompactLLMCommandGenerator
        grep -i '## Task Description' e2e-tests-log.txt
        grep -iF 'Use the following structured data:\n```json' e2e-tests-log.txt
      shell: bash

    - name: Verify correct default prompt with 'search and reply' command used by SearchReadyLLMCommandGenerator
      if: ${{ inputs.train-and-test == 'search-ready' && !contains(inputs.provider, 'custom') && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST  }}
      run: |
        : Verify correct default prompt with 'search and reply' command used by SearchReadyLLMCommandGenerator
        grep -i '## Task Description' e2e-tests-log.txt
        grep -i '## Decision Rule Table' e2e-tests-log.txt
        grep -iF 'Use the following structured data:\n```json' e2e-tests-log.txt
        grep -iF '* `search and reply`: Provide a response from the knowledge base to address' e2e-tests-log.txt
      shell: bash

    - name: Run Dialogue Understanding Tests
      uses: nick-fields/retry@3f757583fb1b1f940bc8ef4bf4734c8dc02a5847 #v3.0.0
      if: ${{ env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      env:
        RASA_DUCKLING_HTTP_URL: ${{ env.DUCKLING_URL }}
        TESTS: ${{ inputs.single-step-tests }}
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      with:
        timeout_minutes: 15
        max_attempts: 2
        retry_wait_seconds: 300
        shell: bash
        command: |
          : Run dialogue understanding tests
          rasa test du data-repo/${{ env.TESTS }} \
            --output-file dut-${{ env.PROVIDER }}-${{ env.COMMAND_GENERATOR }}.yml \
            --output-prompt \
            --debug \
            --endpoints data/test_config/providers/${{ env.PROVIDER }}/${{ env.ENDPOINTS_FILE_NAME }}.yml \
            --model models/${{ env.COMMAND_GENERATOR }}-${{ env.PROVIDER }}-model.tar.gz \
            2>&1 \
            | tee e2e-tests-log.txt

    - name: Verify LLM and Embeddings API health checks during inference
      if: ${{ !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      env:
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      run: |
        : Verify LLM and Embeddings API health checks during inference
        grep -i 'Sending a test LLM API request for the component - ContextualResponseRephraser' e2e-tests-log.txt \
          && (grep -i 'Sending a test LLM API request for the component - LLMBasedRouter.' e2e-tests-log.txt || grep -iv 'LLMBasedRouter.' rasa-private/data/test_config/providers/${{ env.PROVIDER }}/${{ env.COMMAND_GENERATOR }}-config.yml) \
          && grep -i 'Sending a test LLM API request for the component - EnterpriseSearchPolicy' e2e-tests-log.txt \
          && (grep -i 'Sending a test LLM API request for the component - CompactLLMCommandGenerator' e2e-tests-log.txt || grep -i 'Sending a test LLM API request for the component - CustomCompactLLMCommandGenerator' e2e-tests-log.txt || grep -i 'Sending a test LLM API request for the component - SearchReadyLLMCommandGenerator' e2e-tests-log.txt || grep -i 'Sending a test LLM API request for the component - CustomSearchReadyLLMCommandGenerator' e2e-tests-log.txt ) \
          && grep -i 'Sending a test Embeddings API request for the component - FlowRetrieval' e2e-tests-log.txt \
          && grep -i 'Sending a test Embeddings API request for the component - EnterpriseSearchPolicy' e2e-tests-log.txt \
          && echo 'LLM and Embeddings API health checks passed for all components during inference'
      shell: bash

    - name: Save E2E test results
      if: ${{ failure() && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: ${{ inputs.provider }}-E2E-test-${{ inputs.train-and-test }}-results
        path: tests/e2e_results_failed.yml

    - name: Save training log
      if: ${{ failure() && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: ${{ inputs.provider }}-E2E-test-${{ inputs.train-and-test }}-training-log
        path: model-training-log.txt

    - name: Save E2E tests log
      if: ${{ failure() && !env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: ${{ inputs.provider }}-E2E-test-${{ inputs.train-and-test }}-e2e-tests-log.txt
        path: e2e-tests-log.txt

    - name: Save DUT results
      if: ${{ failure() && env.RASA_PRO_BETA_DIALOGUE_UNDERSTANDING_TEST }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: ${{ inputs.provider }}-DUT-${{ inputs.train-and-test }}-results
        path: dut-${{ inputs.provider }}-${{ inputs.train-and-test }}.yml

    - name: Save LiteLLM-proxy logs
      if: ${{ failure() && inputs.provider == 'litellm-proxy-multiple-deployments-with-routing' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: LiteLLM-proxy-logs
        path: rasa-private/data/test_config/providers/litellm-proxy-multiple-deployments-with-routing/proxy-log-*

    - name: Collect vLLM logs
      if: ${{ inputs.provider == 'self-hosted-vllm' && failure() && steps.run-vllm-docker-container.outcome == 'success' }}
      env:
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      run: |
        : Collect vLLM logs
        sudo cp $(docker inspect --format='{{.LogPath}}' vllm) vllm-logs-${{ env.COMMAND_GENERATOR }}.txt
        sudo chmod 755 vllm-logs-${{ env.COMMAND_GENERATOR }}.txt
      shell: bash

    - name: Save vLLM logs
      if: ${{ inputs.provider == 'self-hosted-vllm' && failure() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: vllm-logs-${{ inputs.train-and-test }}
        path: vllm-logs-${{ inputs.train-and-test }}.txt

    - name: Collect OTEL collector logs
      id: collect-otel-collector-logs
      if: ${{ failure() && steps.run-otel-collector.outcome == 'success' }}
      env:
        PROVIDER: ${{ inputs.provider }}
        COMMAND_GENERATOR: ${{ inputs.train-and-test }}
      run: |
        : Collect OTEL collector logs
        sudo cp $(docker inspect --format='{{.LogPath}}' otel-collector) otel-collector-logs-${{ env.PROVIDER }}-${{ env.COMMAND_GENERATOR }}.txt
        sudo chmod 755 otel-collector-logs-${{ env.PROVIDER }}-${{ env.COMMAND_GENERATOR }}.txt
      shell: bash

    - name: Save OTEL collector logs
      if: ${{ failure() && steps.collect-otel-collector-logs.outcome == 'success' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: otel-collector-logs-${{ inputs.provider }}-${{ inputs.train-and-test }}
        path: otel-collector-logs-${{ inputs.provider }}-${{ inputs.train-and-test }}.txt

    - name: Stop OTEL collector
      working-directory: rasa-private
      if: ${{ steps.run-otel-collector.outcome == 'success' }}
      run: |
        : Stop OTEL collector
        make stop-otel-collector
      shell: bash

    - name: Get Rasa-pro version and short-SHA, and set as environment variables
      working-directory: ${{ env.RASA_PRO_VERSION != '' && 'rasa-pro' || 'rasa-private' }}
      if: always()
      run: |
        echo "RASA_VERSION=$(rasa --version | grep 'Rasa Pro Version' | tr -d ' ' | awk -F ':' '{print $2}')" >> $GITHUB_ENV
        echo "SHORT_SHA=`git rev-parse --short HEAD`" >> $GITHUB_ENV
      shell: bash

    - name: Notify Slack of successful test 💬
      if: ${{ success() && github.event_name != 'pull_request' && env.SEND_RESULTS_NOTIFICATION_TO_SLACK == 'true' }}
      uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v 2.0.0
      with:
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        # Send notification to #rasa-pro-alerts slack channel
        payload: |
          channel: C01M5TAHDHA
          text: ':rocket: *Rasa-Pro* (version `${{ env.RASA_VERSION }}`, `rasa-private` branch `${{ github.ref_name }}` sha `${{ env.SHORT_SHA }}`)
            CALM tests (from `${{ inputs.data-repo }}` branch `${{ inputs.data-repo-branch }}`) passed against: `${{ inputs.provider }}`, with ${{ inputs.train-and-test }} command-generator. More
            information can be found <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>.'

    - name: Notify Slack of failing test ⛔️
      if: ${{ failure() && github.event_name != 'pull_request'  && env.SEND_RESULTS_NOTIFICATION_TO_SLACK == 'true' }}
      uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v 2.0.0
      with:
        method: chat.postMessage
        token: ${{ env.SLACK_BOT_TOKEN }}
        # Send notification to #rasa-pro-alerts slack channel
        payload: |
          channel: C01M5TAHDHA
          text: '<!subteam^S0322UJCPU1> :broken_heart: *Rasa-Pro* (version `${{ env.RASA_VERSION
            }}`, `rasa-private` branch `${{ github.ref_name }}` sha `${{ env.SHORT_SHA }}`) CALM tests (from `${{ inputs.data-repo }}` branch `${{ inputs.data-repo-branch }}`) failed against: `${{ inputs.provider }}`, with ${{ inputs.train-and-test }} command-generator!
            More information can be found <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>.'
