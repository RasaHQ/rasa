version: 2
updates:
  - package-ecosystem: pip
    # we enforce `increase` here because it ensures that we maintain a small range of
    # compatible versions; it speeds up installation with pip for our customers
    versioning-strategy: increase
    directory: "/"
    schedule:
      interval: weekly
      time: "02:00"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 20
    labels:
      - type:dependencies
      - release:main
    groups:
      engine-squad:
        dependency-type: production
        patterns:
          - "dask"
          - "numpy"
          - "scipy"
          - "litellm"
          - "openai"
          - "langchain"
          - "sklearn-crfsuite"
          - "scikit-learn"
          - "faiss-cpu"
          - "tiktoken"
          - "matplotlib"
          - "gliner"
          - "onnxruntime"
          - "skops"
          - "safetensors"
          - "mitie"
          - "tf-keras"
      server-and-protocols:
        dependency-type: production
        patterns:
          - "sanic"
          - "sanic-cors"
          - "sanic-routing"
          - "sanic-openapi"
          - "portalocker"
          - "ruamel.yaml"
          - "pyyaml"
          - "packaging"
          - "websockets"
          - "aiohttp"
          - "aioshutil"
          - "types-aiofiles"
          - "python-socketio"
          - "python-engineio"
          - "confluent-kafka"
          - "pypred"
          - "jinja2"
          - "mcp"
          - "werkzeug"
          - "a2a-sdk"
      cloud-and-channels:
        dependency-type: production
        patterns:
          - "boto3"
          - "google-cloud-storage"
          - "azure-storage-blob"
          - "fbmessenger"
          - "twilio"
          - "webexteamssdk"
          - "mattermostwrapper"
          - "rocketchat_API"
          - "aiogram"
          - "slack-sdk"
          - "azure-identity"
          - "aws-msk-iam-sasl-signer-python"
      static-analysis-tools:
        dependency-type: production
        patterns:
          - "ruff"
          - "mypy"
          - "types-protobuf"
          - "typing-extensions"
          - "typing-utils"
          - "protobuf"
          - "jsonschema"
          - "pep440-version-utils"
          - "presidio-analyzer"
          - "pykwalify"
          - "pydantic"
          - "towncrier"
          - "types-cachetools"
      database-and-storage:
        dependency-type: production
        patterns:
          - "pymongo"
          - "sqlalchemy"
          - "psycopg2-binary"
          - "diskcache"
          - "redis"
          - "qdrant-client"
          - "pymilvus"
          - "tenacity"
          - "types-protobuf"
          - "openpyxl"
          - "hvac"
      config-serialisation-parsing:
        dependency-type: production
        patterns:
          - "attrs"
          - "pytz"
          - "jsonpicke"
          - "pykwalify"
          - "ruamel.yaml"
          - "pyyaml"
          - "packaging"
          - "colorama"
          - "colorhash"
          - "colorclass"
          - "terminaltables"
          - "pydot"
          - "ujson"
          - "regex"
          - "jsonpatch"
          - "importlib-resources"
          - "importlib-metadata"
          - "python-dateutil"
          - "dnspython"
          - "randomname"
      utilities:
        dependency-type: production
        patterns:
          - "demoji"
          - "langcodes"
          - "pep440-version-utils"
          - "tqdm"
          - "coloredlogs"
          - "tarsafe"
          - "rich"
          - "tenacity"
          - "python-dotenv"
          - "questionary"
          - "pluggy"
          - "certifi"
          - "absl-py"
          - "apscheduler"
          - "CacheControl"
          - "cvg-python-sdk"
          - "psutil"
      security-auth:
        dependency-type: production
        patterns:
          - "hvac"
          - "python-keycloak"
          - "cryptography"
          - "google-auth"
          - "sanic-jwt"
          - "PyJWT"
      monitoring:
        dependency-type: production
        patterns:
          - "langfuse"
      logging-observability:
        dependency-type: production
        patterns:
          - "structlog"
          - "sentry-sdk"
          - "structlog-sentry"
          - "opentelemetry-sdk"
          - "opentelemetry-exporter-jaeger"
          - "opentelemetry-exporter-otlp"
          - "opentelemetry-api"
      other-production-dependencies:
        dependency-type: production
        patterns:
          - "*"
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: prompt-toolkit
        versions:
          - "> 2.0.10"
      - dependency-name: setuptools
        versions:
          - "> 70.0.0"
      - dependency-name: tensorflow # tensorflow version is pinned in pyproject.toml
        versions:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "01:00"
    groups:
      actions-deps:
        patterns:
          - "*"
        exclude-patterns:
        # internal git repo, not reachable for depenabot
          - "RasaHQ/get-release-records-from-cms-gha"
          - "RasaHQ/push-release-record-to-cms-gha"
    pull-request-branch-name:
      separator: "-"
    open-pull-requests-limit: 10
    reviewers:
      - RasaHQ/atom-squad
    labels:
      - type:dependencies
