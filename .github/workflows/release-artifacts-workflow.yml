name: Release artifacts workflow

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Tag version:'
        required: true
      run_e2e_test_on_providers:
        description: "Run E2E test on CALM supported LLM and Embeddings model providers"
        type: boolean
        required: true
        default: false
      provider:
        description: "Provider(s) to run e2e-test on. Ignored unless `run_e2e_test_on_providers==true`"
        type: choice
        required: true
        default: "all"
        # TODO: Enable testing of all the providers
        options:
          - all
          - openai
          - azure
          - azure-oauth
          - bedrock
          - gemini
          - huggingface
          - huggingface_local
          - anthropic
#          - cohere TODO: Enable after ENG-1411 is unblocked
          - mistral
          - together_ai
          - groq
#          - voyage TODO: Enable after ENG-1415 is unblocked
          - ollama
          - self-hosted-vllm
          - self-hosted-llama-cpp
          - azure-multiple-deployments-with-simple-shuffle-routing
          - azure-multiple-deployments-with-least-busy-routing
          - azure-multiple-deployments-with-usage-based-routing
          # - azure-multiple-deployments-with-usage-based-routing-v2 TODO: Enable after ENG-1651 is resolved
          - azure-multiple-deployments-with-latency-based-routing
          - azure-multiple-deployments-with-cost-based-routing
          - gemini-multiple-deployments-with-routing
          # - huggingface-multiple-deployments-with-routing # Disabled as HF inference provider monthly credits exceeded
          - bedrock-multiple-deployments-with-routing
          - sagemaker_chat-multiple-deployments-with-routing
          - litellm-proxy-multiple-deployments-with-routing
          - openai-with-custom-prompt-for-CompactLLMCommandGenerator
          - openai-with-custom-prompt-for-CustomLLMCommandGenerator
          - openai-with-custom-prompt-for-CustomSearchReadyLLMCommandGenerator

      data-repo:
        description: "Bot repository"
        type: choice
        required: true
        options:
          - rasa-calm-demo
          - calm-benchmarking-bot

      data-repo-branch:
        description: "Branch to checkout for data-repo/bot"
        type: string
        required: true
        default: main
      command-generator:
        description: "Command-generator(s) to use: compact, search-ready or all"
        required: true
        default: all
      compact-e2e-test-with-assertions:
        description: "Path to test file. Ignored unless `run_e2e_test_on_providers==true`"
        type: string
        required: true
        default: "e2e_tests/tests_for_github_workflows/user_checks_balance.yml"
      search-ready-e2e-test-with-assertions:
        description: "Path to test file, to be run with search-ready-LLM-Generator trained model"
        type: string
        required: true
        default: e2e_tests/tests_for_github_workflows/chitchat_during_flow.yml"

# SECRETS
# - SLACK_BOT_TOKEN: token to post to RasaHQ slack account
# - RASA_TELEMETRY_WRITE_KEY: key to write to segment. Used to report telemetry.
#                                 The key will be added to the distributions
# - RASA_EXCEPTION_WRITE_KEY: key to write to sentry. Used to report exceptions.
#                                 The key will be added to the distributions.
#                                 Key can be found at https://sentry.io/settings/rasahq/projects/rasa-open-source/install/python/
# - SENTRY_AUTH_TOKEN: authentication used to tell Sentry about any new releases
#                      created at https://sentry.io/settings/account/api/auth-tokens/

env:
  GCP_TARGET_IMAGE_REGISTRY: "europe-west3-docker.pkg.dev/rasa-releases/rasa-pro"
  DEFAULT_PYTHON_VERSION: "3.11"

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  pull-requests: read # This is required, if workflow `./.github/workflows/providers-e2e-tests.yml` is called

jobs:
  run-e2e-test-on-providers:
    uses: ./.github/workflows/providers-e2e-tests.yml
    if: ${{ inputs.run_e2e_test_on_providers }}
    with:
      provider: ${{ inputs.provider }}
      data-repo: ${{ inputs.data-repo }}
      data-repo-branch: ${{ inputs.data-repo-branch }}
      compact-e2e-test-with-assertions: ${{ inputs.compact-e2e-test-with-assertions }}
      search-ready-e2e-test-with-assertions: ${{ inputs.search-ready-e2e-test-with-assertions }}
      command-generator: ${{ inputs.command-generator }}

  release-artifacts-docker:
    name: Release Artifacts Docker
    # Run this workflow on a large runner because ARM64 build consumes disk space
    # ubuntu-24.04-4core - 4 cores, 16GB of RAM and 150 GB SSD
    runs-on: ubuntu-24.04-4core

    outputs:
      tag_version: ${{ steps.set-tag-version.outputs.tag_version }}

    env:
      DOCKER_HUB_RASA_IMAGE_REPOSITORY: docker.io/rasa/rasa-pro

    steps:
      - name: Set tag version
        id: set-tag-version
        run: |
          if [[ -n "$GITHUB_REF" && "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG_VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
            echo "tag_version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "$INPUT_TAG_VERSION" ]]; then
            echo "TAG_VERSION=$INPUT_TAG_VERSION" >> $GITHUB_ENV
            echo "tag_version=$INPUT_TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "No tag version found."
            exit 1
          fi
        env:
          INPUT_TAG_VERSION: ${{ github.event.inputs.tag_version }}

      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG_VERSION }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
        with:
          platforms: linux/amd64,linux/arm64
          # The latest version will lead to segmentation fault.
          image: tonistiigi/binfmt:qemu-v7.0.0-28

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Read Poetry Version 🔢
        run: |
           echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Authenticate with Google Cloud
        id: auth
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
           workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_OIDC}}
           service_account: "github-actions-oidc-atom@rasa-releases.iam.gserviceaccount.com"

      - name: Authenticate with Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0g
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Authenticate docker for release registry 🎫
        run: |
           gcloud auth configure-docker europe-west3-docker.pkg.dev

      - name: Build Docker base images 🛠
        run: |
          RASA_BASE_REPOSITORY=${{ env.GCP_TARGET_IMAGE_REGISTRY }}/rasa \
          RASA_BASE_IMAGE_TAG=${{ env.TAG_VERSION }} \
          make build-multi-platform-base-docker

      - name: Copy Segment write key to the package
        env:
           RASA_TELEMETRY_WRITE_KEY: ${{ secrets.RASA_PRO_SEGMENT_WRITE_KEY }}
           RASA_EXCEPTION_WRITE_KEY: ${{ secrets.RASA_OSS_EXCEPTION_WRITE_KEY }}
        run: |
           ./scripts/write_keys_file.sh

      - name: Build and push rasa-pro docker image to GCP and Docker Hub
        run: |
          # Build the multi-platform docker image and push to GCP and Docker Hub
          RASA_IMAGE_TAGS="-t ${{ env.GCP_IMAGE_TAG }} -t ${{ env.GCP_LATEST_IMAGE_TAG }} -t ${{ env.DOCKER_HUB_IMAGE_TAG }}" \
          RASA_BASE_REPOSITORY=${{ env.GCP_TARGET_IMAGE_REGISTRY }}/rasa \
          RASA_BASE_IMAGE_TAG=${{ env.TAG_VERSION }} \
          make build-multi-platform-rasa-docker
        env:
          DOCKER_HUB_IMAGE_TAG: ${{ env.DOCKER_HUB_RASA_IMAGE_REPOSITORY }}:${{ env.TAG_VERSION }}
          GCP_LATEST_IMAGE_TAG: ${{ env.GCP_TARGET_IMAGE_REGISTRY }}/rasa-pro:${{ env.TAG_VERSION }}-latest
          GCP_IMAGE_TAG: ${{ env.GCP_TARGET_IMAGE_REGISTRY }}/rasa-pro:${{ env.TAG_VERSION }}

  release-artifacts-pypi:
    name: Release Artifacts PyPI
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/rasa-pro
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        ref: ${{ env.TAG_VERSION }}

    - name: Set up Python 🐍
      uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
      with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

    - name: Read Poetry Version 🔢
      run: |
         echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
      shell: bash

    - name: Authenticate with Google Cloud
      id: auth
      uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
      with:
         workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_OIDC}}
         service_account: "github-actions-oidc-atom@rasa-releases.iam.gserviceaccount.com"

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

    - name: Authenticate docker for release registry 🎫
      run: |
         gcloud auth configure-docker europe-west3-docker.pkg.dev

    - name: Install poetry 🦄
      uses: Gr1N/setup-poetry@48b0f77c8c1b1b19cb962f0f00dff7b4be8f81ec #v9
      with:
          poetry-version: ${{ env.POETRY_VERSION }}

    - name: Copy Segment write key to the package
      env:
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.RASA_PRO_SEGMENT_WRITE_KEY }}
          RASA_EXCEPTION_WRITE_KEY: ${{ secrets.RASA_OSS_EXCEPTION_WRITE_KEY }}
      run: |
          ./scripts/write_keys_file.sh

    - name: Build ⚒️ Distributions
      run: poetry build

    - name: Check that distributions contain keys
      run: |
        ./scripts/check-keys-present.sh

    - name: Upload to Github Artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: rasa-pro-distributions
        path: dist

    # Push to the public PYPI release registry
    - name: Publish to public PyPI 📦
      if: always()
      uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
      with:
        repository-url: https://upload.pypi.org/legacy/
        packages-dir: ${{ format('{0}/dist', github.workspace) }}
        verbose: true

    # Push library to GCP Artifact Registry rasa-plus-py
    - name: Release via GCP Artifact Registry
      if: always()
      run: |
          pip install keyring
          pip install keyrings.google-artifactregistry-auth
          pip install twine --upgrade
          gcloud artifacts print-settings python --project=rasa-releases --repository=rasa-pro-python --location=europe-west3 > ~/.pypirc
          twine upload --verbose --repository-url https://europe-west3-python.pkg.dev/rasa-releases/rasa-pro-python/ ${{ format('{0}/dist/*', github.workspace) }}

  release-atifacts-publish-release:
    name: Release Artifacts Publish Release
    runs-on: ubuntu-24.04
    needs: [release-artifacts-docker, release-artifacts-pypi]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.release-artifacts-docker.outputs.tag_version }}

      - name: Notify Sentry about the release
        if: success()
        env:
           GITHUB_TAG: ${{ needs.release-artifacts-docker.outputs.tag_version }}
           SENTRY_ORG: rasahq
           SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
           curl -sL https://sentry.io/get-cli/ | bash
           GITHUB_TAG=${GITHUB_TAG/refs\/tags\//}
           sentry-cli releases new -p rasa-open-source "rasa-$GITHUB_TAG"
           sentry-cli releases set-commits "rasa-$GITHUB_TAG" --auto --ignore-missing
           sentry-cli releases finalize "rasa-$GITHUB_TAG"

      - name: Publish Release Notes 🗞
        if: success()
        env:
          GH_RELEASE_NOTES_TOKEN: ${{ secrets.GH_RELEASE_NOTES_TOKEN }}
          GITHUB_TAG: ${{ needs.release-artifacts-docker.outputs.tag_version }}
          GITHUB_REPO_SLUG: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
        run: |
          GITHUB_TAG=$GITHUB_TAG
          pip install -U github3.py pep440-version-utils
          python3 scripts/publish_gh_release_notes.py

      - name: Update CMS with new release record
        if: success()
        uses: RasaHQ/push-release-record-to-datocms-gha@1be87116d0a2b555bd5b291ea5923ce5b7aeb83e
        # this step only has an effect for new majors and minors; the action skips other versions
        with:
          dato-cms-api-key: ${{ secrets.DATO_CMS_API_KEY }}
          product-name: "Rasa Pro"
          build-trigger-id: ${{ vars.DATO_CMS_BUILD_TRIGGER_ID }}

  release-artifact-slack-notifications:
    name: Release Artifact Slack Notifications
    runs-on: ubuntu-24.04
    needs: [release-artifacts-docker, release-artifacts-pypi]
    if: always()  # Ensures this job runs regardless of the result of previous jobs

    steps:
      - name: Notify Slack of successful release 💬
        if: ${{ needs.release-artifacts-docker.result == 'success' && needs.release-artifacts-pypi.result == 'success' }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v 2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Send notification to #release slack channel
          payload: |
            channel: "C024Z61K9QU"
            text: ":rocket: New *Rasa Private* version `${{ needs.release-artifacts-docker.outputs.tag_version }}` has been released! More information can be found <https://github.com/RasaHQ/rasa-private/releases/tag/${{ needs.release-artifacts-docker.outputs.tag_version }}|here>."

      - name: Notify Slack of unsuccessful release ⛔️
        if: ${{ needs.release-artifacts-docker.result != 'success' || needs.release-artifacts-pypi.result != 'success' }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d #v 2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Send notification to #devtribe slack channel
          payload: |
            channel: "C061J0LGHU0"
            text: ":broken_heart: *Rasa Private* release version `${{ needs.release-artifacts-docker.outputs.tag_version }}` has failed! More information can be found <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|here>."
