name: Continuous Integration

on:
  workflow_call:
    inputs:
      # CI only runs tests for the lowest supported Python version
      python-versions:
        type: string
        default: '[3.9]'
        required: false
        description: "Python versions to run the tests on."
      # Code Quality checks are enabled by default
      run_code_quality:
        type: string
        required: false
        default: 'true'
        description: "Whether to run the Code Quality checks."
      # Only run partial workflow steps
      run_mode:
        type: string
        required: false
        default: 'full'
        description: "Whether to run all the CI checks."

concurrency:
  group: continous-integration-${{ github.ref }} # branch or tag name
  cancel-in-progress: true

# SECRETS
# - RASA_TELEMETRY_WRITE_KEY: key to write to segment. Used to report telemetry.
#                                 The key will be added to the distributions
#                      created at https://sentry.io/settings/account/api/auth-tokens/
# - RASA_PRO_LICENSE: license key for Rasa Pro. Used to run tests for Rasa Pro.
# - INTEGRATION_TESTS_STUDIO_LICENSE: license key for Studio. Used in integration tests. Expires in 2034.
# - INTEGRATION_TESTS_PRO_LICENSE: license key for Pro. Used in integration tests. Expires in 2034.

env:
  AWS_REGION: eu-west-1
  RASA_PRO_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-private-dev
  RASA_SDK_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-sdk-dev
  RASA_PRO_HELM_REPO: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts/rasa
  RASA_PRO_HELM_VERSION: 1.2.0
  DEFAULT_PYTHON_VERSION: "3.9"
  NODE_VERSION_INSPECTOR_BUILD: 20
  SONAR_ORGANIZATION: rasahq
  SONAR_PROJECT_KEY: RasaHQ_rasa-private

permissions:
  checks: write
  id-token: write
  pull-requests: write
  contents: read
  issues: read

jobs:
  check-poetry-lock-is-up-to-date:
    name: check poetry lock is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Check poetry lock
        run: |
          poetry check
          if grep 'Error: pyproject.toml changed significantly since poetry.lock was last generated' .output; then exit 1; fi

  check-for-merge-conflicts:
    name: Check for merge conflicts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Merge Conflict finder
        run: |
          ./scripts/conflict-finder.sh
        shell: bash

  quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_code_quality != 'false' }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full

      - name: Checkout target branch to be able to diff on PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "DOCSTRING_DIFF_BRANCH=origin/${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Checkout target branch to be able to diff on merge queue
        if: github.event_name == 'merge_group'
        run: |
          git fetch origin ${{ github.event.merge_group.base_sha }}
          echo "DOCSTRING_DIFF_BRANCH=${{ github.event.merge_group.base_sha }}" >> $GITHUB_ENV

      - name: Fetch current branch
        run: |
          # Fetch entire history for current branch so that `make lint-docstrings`
          # can calculate the proper diff between the branches
          git fetch --unshallow origin "${{ github.ref }}"

      - name: Add github workflow problem matchers
        run: |
          echo "::add-matcher::.github/matchers/flake8-error-matcher.json"

      - name: Lint Code 🎎
        run: |
          # If it's not a pull request, $DOCSTRING_DIFF_BRANCH is unset.
          # This will result in an empty diff, which effictively means that
          # make lint-docstrings will be skipped for other events than `pull_request`
          make lint BRANCH=$DOCSTRING_DIFF_BRANCH

      - name: Check Types 📚
        run: make types

      - name: Lint Changelog Filenames 📝
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: make lint-changelog

  rasa-private-dev-docker-image:
    name: rasa-private dev docker image
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_mode != 'false' }}
    outputs:
      rasa_image_tag: ${{ steps.set-tag.outputs.rasa_image_tag }}
      stack_name: ${{ steps.set-tag.outputs.stack_name }}
    env:
      PLATFORM: linux/amd64

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Set image tag
        id: set-tag
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "RASA_IMAGE_TAG=pr${{ github.event.number }}-$(git rev-parse --short $(cat $GITHUB_EVENT_PATH | jq -r .pull_request.head.sha))" >> $GITHUB_ENV
            echo "rasa_image_tag=pr${{ github.event.number }}-$(git rev-parse --short $(cat $GITHUB_EVENT_PATH | jq -r .pull_request.head.sha))" >> $GITHUB_OUTPUT
            echo "stack_name=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "RASA_IMAGE_TAG=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')-$(git rev-parse --short HEAD)" >> $GITHUB_ENV
            echo "rasa_image_tag=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "stack_name=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          fi

      - name: Build Rasa Private Dev Docker Image
        run: |
          POETRY_VERSION=$POETRY_VERSION \
          PLATFORM=${{ env.PLATFORM }} \
          RASA_REPOSITORY=${{ env.RASA_PRO_DEV_REPOSITORY }} \
          RASA_IMAGE_TAG=${{ env.RASA_IMAGE_TAG }} \
          make build-docker

      - name: Tag, and push image to Amazon ECR
        run: |
          docker push ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }}
      
      # Leverage GitHub Actions artifact upload/download to share Docker images between jobs,
      # reducing dependency on ECR and minimizing AWS costs
      - name: Save docker image
        run: docker save ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }} | gzip > image-${{ env.RASA_IMAGE_TAG }}.tar.gz

      - name: Upload image as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: docker-image-${{ env.RASA_IMAGE_TAG }}.tar.gz
          path: image-${{ env.RASA_IMAGE_TAG }}.tar.gz
          retention-days: 5
  
  # This job is stable but still a work in progress.
  # It is not a blocker for merging and will eventually be moved to a separate workflow.
  # Skip this job from merge queue, Backport PRs and Dependabot PRs
  rasa-private-dev-train-the-model:
    name: Train the model and upload to S3
    if: github.event_name != 'merge_group' && !startsWith(github.event.pull_request.title, 'Backport' && github.actor != 'dependabot[bot]')
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
      
      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load
      
      - name: Rasa Train
        run: |
          make run-channel-connectors-integration-containers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          MODEL_NAME: model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the model to S3
        run: |
          aws s3 cp $MODEL_FILE_PATH s3://rasa-pro-ci-trained-models/ \
          --region eu-west-1 \
          --endpoint-url https://s3.eu-west-1.amazonaws.com
        env:
          MODEL_FILE_PATH: tests_deployment/integration_tests_channel_connectors/calm-demo-bot/models/model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
         
  # This job is stable but still a work in progress.
  # It is not a blocker for merging and will eventually be moved to a separate workflow.
  # Skip this job from merge queue, Backport PRs and Dependabot PRs
  deploy-rasa-private-helm-chart:
    name: Deploy rasa private helm chart
    if: github.event_name != 'merge_group' && !startsWith(github.event.pull_request.title, 'Backport' && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    needs: [rasa-private-dev-docker-image, rasa-private-dev-train-the-model]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.9 🐍
        id: setup-python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: ./infrastructure/eks-helm
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497 # v3.0.1
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}  

      - name: Set up kubeconfig
        run: |
          aws eks update-kubeconfig --name rasa-pro-cluster --region ${{ env.AWS_REGION }}

      - name: Pulumi Up (Deploy)
        uses: pulumi/actions@ae8c5623fbcf1b4781618a60e69d423f9a6b9c92 #v5.1.1
        with:
          command: up
          refresh: true
          stack-name: rasa/${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          work-dir: ./infrastructure/eks-helm
          upsert: true
        env:
          DOMAIN_NAME: rasapro.rasa-dev.io
          PROJECT_NAME: rasa-pro-${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          PR_NAME: ${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          RASA_PRO_HELM_REPO: ${{ env.RASA_PRO_HELM_REPO }}
          RASA_PRO_HELM_VERSION: ${{ env.RASA_PRO_HELM_VERSION }}
          RASA_PRO_VERSION: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          RASA_PRO_DEV_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_PRO_LICENSE: ${{ secrets.HELM_DEPLOY_RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.HELM_DEPLOY_OPENAI_API_KEY }}
          CERTIFICATE_ARN: ${{ secrets.HELM_DEPLOY_CERTIFICATE_ARN }}
          HOSTED_ZONE_ID: ${{ secrets.HELM_DEPLOY_HOSTED_ZONE_ID }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.HELM_DEPLOY_PULUMI_ACCESS_TOKEN }}
          # Variables for pulling the model from s3 bucket
          MODEL_FILE_NAME: model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
          AWS_MODEL_S3_BUCKET: "rasa-pro-ci-trained-models"
          AWS_MODEL_S3_ENDPOINT_URL: "https://s3.eu-west-1.amazonaws.com"
          AWS_DEFAULT_REGION: ${{ env.AWS_REGION}}
          AWS_MODEL_S3_ACCESS_KEY_ID: ${{ secrets.AWS_MODEL_S3_ACCESS_KEY_ID }}
          AWS_MODEL_S3_SECRET_ACCESS_KEY: ${{ secrets.AWS_MODEL_S3_SECRET_ACCESS_KEY }}

      - name: Force stop pulumi during ci cancelation
        # This step is used to force stop the deployment if the CI is cancelled
        if: ${{ cancelled() }}
        uses: ./.github/actions/force-stop-deployment
        with:
          STACK_NAME: pr-${{ github.event.number }}
          PULUMI_ACCESS_TOKEN: ${{ secrets.HELM_DEPLOY_PULUMI_ACCESS_TOKEN }}
          BASE_STACK: ${{ env.BASE_STACK_NAME }}
        env:
          BASE_STACK_NAME: rasa-pro-eks-helm
          
      - name: Add deployment details as comment
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 #v2.9.1
        with:
          header: deployment
          recreate: true
          message: |
            PR Deployment is ready!
            Helm chart version: ${{ env.RASA_PRO_HELM_VERSION }}
            URL: https://${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}.rasapro.rasa-dev.io/version

  check_inspector_build:
    name: Check Inspector Build
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_mode != 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: rasa/core/channels/inspector

    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
      with:
        node-version: ${{ env.NODE_VERSION_INSPECTOR_BUILD }}

    - name: Cache node modules
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      id: yarn-cache
      with:
        path: "**/inspector/node_modules"
        key: ${{ runner.os }}-modules-${{ hashFiles('**/inspector/yarn.lock') }}

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: |
        yarn install --frozen-lockfile

    - name: Build Inspector
      run: |
        yarn build

    - name: Store build output
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: inspector-build
        path: rasa/core/channels/inspector/dist

    - name: Compare build output
      run: |
        if git diff --quiet -- dist; then
          echo "No changes in the Inspector build output."
        else
          echo "Detected changes in the Inspector build output. Please build the Inspector and commit the contents of rasa/core/channels/inspector/dist/ ."
          exit 1
        fi

  tracing-integration-test:
    name: Tracing Integration Tests
    if: ${{ inputs.run_mode != 'false' }}
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04-4core
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
      
      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Pull rasa-sdk dev image
        uses: ./.github/actions/pull-from-ecr
        with:
          AWS_REGION: ${{ env.AWS_REGION }}
          AWS_ARN_ROLE_TO_ASSUME: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          IMAGE_TAG: latest
          REPOSITORY: ${{ env.RASA_SDK_DEV_REPOSITORY }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Tracing integration testing - Run docker containers
        env:
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_SDK_REPOSITORY: ${{ env.RASA_SDK_DEV_REPOSITORY }}
        run: |
          make run-tracing-integration-containers

      - name: Tracing integration testing - Test Code with Services 🩺
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}
        run: |
          make test-tracing-integration

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-tracing-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_tracing_deployment/docker-compose.yml

      - name: Tracing integration testing - Stop docker containers
        if: always()
        run: |
          make stop-tracing-integration-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Tracing Integration Test Results
          path: integration-results-tracing.xml

  metric-integration-test:
    name: Metric Integration Tests
    if: ${{ inputs.run_mode != 'false' }}
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04-4core
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
      
      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Metric Integration Testing - Run docker containers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_SDK_REPOSITORY: rasa/rasa-sdk
          RASA_SDK_IMAGE_TAG: latest
        run: |
          make run-metrics-integration-containers

      - name: Metric Integration Testing -  Test Code with Services 🩺
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}
        run: |
          make test-metrics-integration

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-metric-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_metrics_setup/docker-compose.yml

      - name: Metric Integration Testing - Stop docker containers
        run: |
          make stop-metrics-integration-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Metric Integration Test Results
          path: integration-results-metric.xml

  custom-action-integration-tests:
    name: Custom Action Integration Tests With NLU bot and CALM bot
    if: ${{ inputs.run_mode != 'false' }}
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04-4core
    env:
      RASA_SDK_IMAGE_TAG: latest

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Docker version
        run: docker --version && docker compose version

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
      
      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Custom Actions Integration Testing NLU - Train docker containers
        run: |
          make train-action-server-nlu-bot
        env:
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
