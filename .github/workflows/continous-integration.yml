name: Continuous Integration

on:
  workflow_call:
    inputs:
      # CI only runs tests for the lowest supported Python version
      python-versions:
        type: string
        default: '["3.10"]'
        required: false
        description: "Python versions to run the tests on."
      # Code Quality checks are enabled by default
      run_code_quality:
        type: string
        required: false
        default: 'true'
        description: "Whether to run the Code Quality checks."
      # Only run partial workflow steps
      full_ci_mode:
        type: string
        required: false
        default: 'true'
        description: "Whether to run all the CI checks."

concurrency:
  group: continous-integration-${{ github.ref }} # branch or tag name
  cancel-in-progress: true

# SECRETS
# - RASA_TELEMETRY_WRITE_KEY: key to write to segment. Used to report telemetry.
#                                 The key will be added to the distributions
#                      created at https://sentry.io/settings/account/api/auth-tokens/
# - RASA_PRO_LICENSE: license key for Rasa Pro. Used to run tests for Rasa Pro.
# - INTEGRATION_TESTS_STUDIO_LICENSE: license key for Studio. Used in integration tests. Expires in 2034.
# - INTEGRATION_TESTS_PRO_LICENSE: license key for Pro. Used in integration tests. Expires in 2034.

env:
  AWS_REGION: eu-west-1
  RASA_PRO_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-private-dev
  RASA_SDK_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-sdk-dev
  RASA_PRO_HELM_REPO: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts/rasa
  RASA_PRO_HELM_VERSION: 1.2.0
  DEFAULT_PYTHON_VERSION: "3.10"
  NODE_VERSION_INSPECTOR_BUILD: 20
  SONAR_ORGANIZATION: rasahq
  SONAR_PROJECT_KEY: RasaHQ_rasa-private
  TEMPLATES: "telco finance basic"
  POSTGRES_HOST: rasa-pro-integration-tests-db.cvgblmmqghrx.eu-west-1.rds.amazonaws.com
  POSTGRES_PORT: '5432'
  POSTGRES_USER: integration_tests_user
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_AWS }}
  POSTGRES_DB: integrationtestsdb

permissions:
  checks: write
  id-token: write
  pull-requests: write
  contents: read
  issues: read

jobs:
  check-poetry-lock-is-up-to-date:
    name: check poetry lock is up to date
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Check poetry lock
        run: |
          poetry check
          if grep 'Error: pyproject.toml changed significantly since poetry.lock was last generated' .output; then exit 1; fi

  check-for-merge-conflicts:
    name: Check for merge conflicts
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Merge Conflict finder
        run: |
          ./scripts/conflict-finder.sh
        shell: bash

  quality:
    name: Code Quality
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_code_quality != 'false' }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free up disk-space
        uses: RasaHQ/rasa-private/.github/actions/free-disk-space@fe77d93db58f0412e2162fdaa34e2ed596f8536b

      - name: Prepare the job
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full

      - name: Checkout target branch to be able to diff on PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "DOCSTRING_DIFF_BRANCH=origin/${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Checkout target branch to be able to diff on merge queue
        if: github.event_name == 'merge_group'
        run: |
          git fetch origin ${{ github.event.merge_group.base_sha }}
          echo "DOCSTRING_DIFF_BRANCH=${{ github.event.merge_group.base_sha }}" >> $GITHUB_ENV

      - name: Fetch current branch
        run: |
          # Fetch entire history for current branch so that `make lint-docstrings`
          # can calculate the proper diff between the branches
          git fetch --unshallow origin "${{ github.ref }}"

      - name: Add github workflow problem matchers
        run: |
          echo "::add-matcher::.github/matchers/flake8-error-matcher.json"

      - name: Lint Code 🎎
        run: |
          # If it's not a pull request, $DOCSTRING_DIFF_BRANCH is unset.
          # This will result in an empty diff, which effictively means that
          # make lint-docstrings will be skipped for other events than `pull_request`
          make lint BRANCH=$DOCSTRING_DIFF_BRANCH

      - name: Check Types 📚
        run: make types

      - name: Lint Changelog Filenames 📝
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: make lint-changelog

  train-templates-dev:
    name: Train Project Templates for Dev
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    outputs:
      tag_version: ${{ steps.set-tag.outputs.tag_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image tag
        id: set-tag
        uses: ./.github/actions/set-tag-version

      - name: Train templates
        uses: ./.github/actions/train-templates
        with:
          tag_version: ${{ steps.set-tag.outputs.tag_version }}
          templates: ${{ env.TEMPLATES }}
          rasa_pro_license: ${{ secrets.RASA_PRO_LICENSE }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  rasa-init-sanity-check:
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
        template:
          - default
          - tutorial
          - basic
          - finance
          - telco
        install-group:
          - default
          - nlu
          - channels
          - full
        install-method:
          - poetry
          - pip
          - uv
        exclude:
          - python-version: "3.9"
            template: tutorial
          - python-version: "3.9"
            template: basic
          - python-version: "3.9"
            template: finance
          - python-version: "3.9"
            template: telco
          - python-version: "3.9"
            install-method: pip
          - python-version: "3.9"
            install-method: uv
    name: rasa init Py${{ matrix.python-version }} ${{ matrix.install-group }}-group (with ${{ matrix.install-method }} install) ${{ matrix.template }}-template
    env:
      RASA_INIT_TEST_DIRECTORY: test-rasa-init
    steps:
        - name: Check out code
          uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        - name: Free up disk-space
          if: ${{ matrix.install-group == 'full' || matrix.install-group == 'nlu' }}
          uses: RasaHQ/rasa-private/.github/actions/free-disk-space@fe77d93db58f0412e2162fdaa34e2ed596f8536b
        - name: Setup Python ${{ matrix.python-version }} and install rasa-pro (via ${{ matrix.install-method }}) with default installation
          if: ${{ matrix.python-version != '3.9' && matrix.install-group == 'default' }}
          uses: ./.github/actions/setup-python-env
          with:
            PYTHON_VERSION: ${{ matrix.python-version }}
            MATRIX_JOB: ${{ matrix.install-group }}-${{ matrix.install-method }}-${{ matrix.template }}
            RASA_DEFAULT_INSTALLATION_ONLY: "true"
            DEPENDENCIES_AND_PACKAGE_MANAGEMENT_TOOL: ${{ matrix.install-method }}
        - name: Setup Python ${{ matrix.python-version }} and install rasa-pro (via ${{ matrix.install-method }}) with ${{ matrix.install-group }} group
          if: ${{ matrix.python-version != '3.9' && matrix.install-group != 'default'  }}
          uses: ./.github/actions/setup-python-env
          with:
            PYTHON_VERSION: ${{ matrix.python-version }}
            MATRIX_JOB: ${{ matrix.install-group }}-${{ matrix.install-method }}-${{ matrix.template }}
            OPTIONAL_GROUP_TO_INSTALL: ${{ matrix.install-group }}
            RASA_DEFAULT_INSTALLATION_ONLY: "false"
            DEPENDENCIES_AND_PACKAGE_MANAGEMENT_TOOL: ${{ matrix.install-method }}
        - name: Set up Python 3.9
          if: ${{ matrix.python-version == '3.9' }}
          uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c # v5.0.0
          with:
            python-version: ${{ matrix.python-version }}
        - name: Read Poetry Version 🔢
          if: ${{ matrix.python-version == '3.9' }}
          run: |
            echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        - name: Install Poetry ${{ env.POETRY_VERSION }}
          if: ${{ matrix.python-version == '3.9' }}
          uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a # v1.4.1
          with:
            version: ${{ env.POETRY_VERSION }}
            virtualenvs-create: true
            virtualenvs-in-project: true
            installer-parallel: true
        - name: Check error warning on Rasa install if using Python 3.9
          if: ${{ matrix.python-version == '3.9' }}
          run: |
            make install > error-log 2>&1 || true
            cat error-log
            grep 'Current Python version (3.9.23) is not allowed by the project (>=3.10.0,<3.14)' error-log
        - name: Make empty directory for `rasa init`
          run: mkdir "${RASA_INIT_TEST_DIRECTORY}"
        - name: Sanity check of `rasa init`
          if: ${{ matrix.python-version != '3.9' }}
          working-directory: ${{ env.RASA_INIT_TEST_DIRECTORY }}
          env:
            LLM_API_HEALTH_CHECK: true
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
            RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
            TEMPLATE: ${{ matrix.template }}
          run: rasa init --template "${TEMPLATE}" --no-prompt --debug

  rasa-private-dev-docker-image:
    name: rasa-private dev docker image
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    needs: [train-templates-dev]
    outputs:
      rasa_image_tag: ${{ steps.set-tag.outputs.rasa_image_tag }}
      stack_name: ${{ steps.set-tag.outputs.stack_name }}
    env:
      PLATFORM: linux/amd64

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Set image tag
        id: set-tag
        run: |
          TAG_VERSION="${{ needs.train-templates-dev.outputs.tag_version }}"
          echo "RASA_IMAGE_TAG=${TAG_VERSION}" >> $GITHUB_ENV
          echo "rasa_image_tag=${TAG_VERSION}" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "stack_name=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "stack_name=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          fi

      - name: Prepare template caches
        uses: ./.github/actions/prepare-template-caches
        with:
          tag_version: ${{ needs.train-templates-dev.outputs.tag_version }}
          templates: ${{ env.TEMPLATES }}

      - name: Build Rasa Private Dev Docker Image
        run: |
          POETRY_VERSION=$POETRY_VERSION \
          PLATFORM=${{ env.PLATFORM }} \
          RASA_REPOSITORY=${{ env.RASA_PRO_DEV_REPOSITORY }} \
          RASA_IMAGE_TAG=${{ env.RASA_IMAGE_TAG }} \
          make build-docker

      - name: Tag, and push image to Amazon ECR
        run: |
          docker push ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }}

      # Leverage GitHub Actions artifact upload/download to share Docker images between jobs,
      # reducing dependency on ECR and minimizing AWS costs
      - name: Save docker image
        run: docker save ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }} | gzip > image-${{ env.RASA_IMAGE_TAG }}.tar.gz

      - name: Upload image as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: docker-image-${{ env.RASA_IMAGE_TAG }}.tar.gz
          path: image-${{ env.RASA_IMAGE_TAG }}.tar.gz
          retention-days: 5

  # This job is stable but still a work in progress.
  # It is not a blocker for merging and will eventually be moved to a separate workflow.
  # Skip this job from merge queue, Backport PRs and Dependabot PRs
  rasa-private-dev-train-the-model:
    name: Train the model and upload to S3
    if: github.event_name != 'merge_group' && !startsWith(github.event.pull_request.title, 'Backport') && github.actor != 'dependabot[bot]' &&  inputs.full_ci_mode != 'false'
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Rasa Train
        run: |
          make train-rds-tracker-bot
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          MODEL_NAME: model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
          DB_HOST: ${{ env.POSTGRES_HOST }} # required if tracker-store-type is sql
          DB_PORT: ${{ env.POSTGRES_PORT }} # required if tracker-store-type is sql
          DB_USER: ${{ env.POSTGRES_USER }} # required if tracker-store-type is sql
          DB_PASS: ${{ env.POSTGRES_PASSWORD }} # required if tracker-store-type is sql
          DB_NAME: ${{ env.POSTGRES_DB }} # required if tracker-store-type is sql


      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload the model to S3
        run: |
          aws s3 cp $MODEL_FILE_PATH s3://rasa-pro-ci-trained-models/ \
          --region eu-west-1 \
          --endpoint-url https://s3.eu-west-1.amazonaws.com
        env:
          MODEL_FILE_PATH: tests_deployment/integration_tests_tracker_stores/sql_tracker_store/calm-demo-bot/models/model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

  # This job is stable but still a work in progress.
  # It is not a blocker for merging and will eventually be moved to a separate workflow.
  # Skip this job from merge queue, Backport PRs and Dependabot PRs
  deploy-rasa-private-helm-chart:
    name: Deploy rasa private helm chart
    if: github.event_name != 'merge_group' && !startsWith(github.event.pull_request.title, 'Backport') && github.actor != 'dependabot[bot]' &&  inputs.full_ci_mode != 'false'
    runs-on: ubuntu-24.04
    needs: [rasa-private-dev-docker-image, rasa-private-dev-train-the-model]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10 🐍
        id: setup-python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Deploy Rasa Pro Dev Helm Chart
        uses: ./.github/actions/setup-build-for-helm-deploy
        with:
          python-version: ${{ env.DEFAULT_PYTHON_VERSION }}
          aws-region: ${{ env.AWS_REGION }}
          aws-assume-role-session-token: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          rasa-pro-helm-repo: ${{ env.RASA_PRO_HELM_REPO }}
          rasa-pro-helm-version: ${{ env.RASA_PRO_HELM_VERSION }}
          rasa-pro-version: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          rasa-pro-dev-repository: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          helm-deploy-rasa-pro-license: ${{ secrets.HELM_DEPLOY_RASA_PRO_LICENSE }}
          helm-deploy-openai-api-key: ${{ secrets.HELM_DEPLOY_OPENAI_API_KEY }}
          helm-deploy-certificate-arn: ${{ secrets.HELM_DEPLOY_CERTIFICATE_ARN }}
          helm-deploy-hosted-zone-id: ${{ secrets.HELM_DEPLOY_HOSTED_ZONE_ID }}
          helm-deploy-pulumi-access-token: ${{ secrets.HELM_DEPLOY_PULUMI_ACCESS_TOKEN }}
          model-file-name: model-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
          aws-model-s3-bucket: rasa-pro-ci-trained-models
          aws-model-s3-endpoint-url: https://s3.eu-west-1.amazonaws.com
          aws-model-s3-access-key-id: ${{ secrets.AWS_MODEL_S3_ACCESS_KEY_ID }}
          aws-model-s3-secret-access-key: ${{ secrets.AWS_MODEL_S3_SECRET_ACCESS_KEY }}
          stack-name: ${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          # Use the image tag as project name and PR name to distinguish deployments
          project-name: rasa-pro-${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          pr-name: ${{ needs.rasa-private-dev-docker-image.outputs.stack_name }}
          domain-name: rasapro.rasa-dev.io
          postgres-host: ${{ env.POSTGRES_HOST }} # required if tracker-store-type is sql
          postgres-port: ${{ env.POSTGRES_PORT }} # required if tracker-store-type is sql
          postgres-user: ${{ env.POSTGRES_USER }} # required if tracker-store-type is sql
          postgres-password: ${{ env.POSTGRES_PASSWORD }} # required if tracker-store-type is sql
          postgres-db: ${{ env.POSTGRES_DB }} # required if tracker-store-type is sql


  # This job is being moved here from the pr-cleanup.yml workflow, to reduce AWS costs and save resources.
  # Skip this job from merge queue, Backport PRs and Dependabot PRs
  pulumi-destroy:
    if: always() && github.event_name != 'merge_group' && !startsWith(github.event.pull_request.title, 'Backport') && github.actor != 'dependabot[bot]' &&  inputs.full_ci_mode != 'false'
    name: Destroy pulumi resources
    needs: deploy-rasa-private-helm-chart
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set stack name
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "STACK_NAME=pr-${{ github.event.number }}" >> $GITHUB_ENV
          else
            echo "STACK_NAME=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@8c3f20df09ac63af7b3ae3d7c91f105f857d8497 # v3.0.1
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: |
          aws eks update-kubeconfig --name rasa-pro-cluster --region ${{ env.AWS_REGION }}

      - uses: pulumi/actions@ae8c5623fbcf1b4781618a60e69d423f9a6b9c92 #v5.1.1
      - name: Destroy resources and remove the stack
        run: |
          pulumi destroy -s rasa/rasa-pro-eks-helm/${{ env.STACK_NAME }} --yes
          pulumi stack rm rasa/rasa-pro-eks-helm/${{ env.STACK_NAME }} --yes
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.HELM_DEPLOY_PULUMI_ACCESS_TOKEN }}

  check_inspector_build:
    name: Check Inspector Build
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    defaults:
      run:
        shell: bash
        working-directory: rasa/core/channels/inspector

    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
      with:
        node-version: ${{ env.NODE_VERSION_INSPECTOR_BUILD }}

    - name: Cache node modules
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      id: yarn-cache
      with:
        path: "**/inspector/node_modules"
        key: ${{ runner.os }}-modules-${{ hashFiles('**/inspector/yarn.lock') }}

    - name: Install dependencies
      if: steps.yarn-cache.outputs.cache-hit != 'true'
      run: |
        yarn install --frozen-lockfile

    - name: Build Inspector
      run: |
        yarn build

    - name: Store build output
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
      with:
        name: inspector-build
        path: rasa/core/channels/inspector/dist

    - name: Compare build output
      run: |
        if git diff --quiet -- dist; then
          echo "No changes in the Inspector build output."
        else
          echo "Detected changes in the Inspector build output. Please build the Inspector and commit the contents of rasa/core/channels/inspector/dist/ ."
          exit 1
        fi

  tracing-integration-test:
    name: Tracing Integration Tests
    if: ${{ inputs.full_ci_mode != 'false' }}
    needs: rasa-private-dev-docker-image
    runs-on: ubuntu-24.04-4core
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
