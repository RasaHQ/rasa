    name: Run Message Processor Tests
    runs-on: warp-ubuntu-latest-x64-8x
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
        runner: [1]
    needs: [install-and-cache-rasa]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RASA_INSTALL_GROUP: "full-with-spacy-mitie-and-transformer-models"

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        id: linux-dependencies
        with:
          packages: libpq-dev graphviz graphviz-dev python3-tk
          version: ${{ runner.os }}-${{ matrix.python-version }}-test-message-processor-${{ matrix.runner }}

      - name: Install Linux dependencies
        if: ${{ steps.linux-dependencies.outputs.cache-hit != 'true' }}
        run: |
          sudo apt-get -y install libpq-dev
          make prepare-tests-ubuntu

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@f4b026bb8b8b53f323960cf86a849a0231ff93b9 # v2.5.0
        with:
          languages: python
          api_key: ${{secrets.DD_API_KEY}}
          site: datadoghq.eu

      - name: Test Code 🔍 (multi-process)
        env:
          DD_RECORD_TEST_MEMORY: "true"
          JOBS: 3
          PYTHONUTF8: 1
          PYTHONUNBUFFERED: 1
          ARGS: "-v"
          RUNNER_ID: ${{ matrix.runner }}
          NUMBER_OF_RUNNERS: 1
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          BLOCKED_LICENSE: ${{ secrets.BLOCKED_LICENSE }}
          CHAMPION_LICENSE: ${{ secrets.CHAMPION_LICENSE }}
          CHAMPION_SERVER_INTERNAL_LICENSE: ${{ secrets.CHAMPION_SERVER_INTERNAL_LICENSE }}
          CHAMPION_SERVER_LIMITED_LICENSE: ${{ secrets.CHAMPION_SERVER_LIMITED_LICENSE }}
          EXPIRED_LICENSE: ${{ secrets.EXPIRED_LICENSE }}
          IMMATURE_LICENSE: ${{ secrets.IMMATURE_LICENSE }}
          INVALID_SCHEMA_LICENSE: ${{ secrets.INVALID_SCHEMA_LICENSE }}
          INVALID_SIGNATURE_LICENSE: ${{ secrets.INVALID_SIGNATURE_LICENSE }}
          NON_JWT_LICENSE: ${{ secrets.NON_JWT_LICENSE }}
          UNSCOPED_LICENSE: ${{ secrets.UNSCOPED_LICENSE }}
          VALID_LICENSE: ${{ secrets.VALID_LICENSE }}
          API_DOCS_FORMAT: yaml
        run: bash scripts/run_pytest_with_splits.sh test-message-processor
        shell: bash

      - name: Prepare test results
        if: success() || failure()
        run: |
          mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-message-processor-python-${{ matrix.python-version }}-${{ matrix.runner }}.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-test-message-processor-python-${{ matrix.python-version }}-${{ matrix.runner }}
          path: |
            ${{ github.workspace }}/unit-tests-results-test-message-processor-python-${{ matrix.python-version }}-${{ matrix.runner }}.xml

  test-builder:
    name: Run Builder Tests
    runs-on: warp-ubuntu-latest-x64-4x
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.builder-files == 'true') }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    needs: [install-and-cache-rasa, check-code-changes]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Test Code 🔍
        env:
          JOBS: logical
          PYTHONUTF8: 1
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          INKEEP_API_KEY: ${{ secrets.INKEEP_API_KEY }}
        run: make test-builder-tests
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: success() || failure()
        run: |
          mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-builder-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-test-builder-python-${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/unit-tests-results-test-builder-python-${{ matrix.python-version }}.xml

  test-anonymization:
    name: Run Anonymization Unit Tests
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    needs: install-and-cache-rasa

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        id: prepare-job
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RASA_INSTALL_GROUP: "anonymisation"

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        id: ubuntu-dependencies
        with:
          packages: libpq-dev graphviz graphviz-dev python3-tk
          version: ubuntu-${{ runner.os }}-dependencies-test-anonymization

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        env:
          UBUNTU_DEPENDENCIES_INSTALLED: ${{ steps.ubuntu-dependencies.outputs.cache-hit }}
          RASA_INSTALLED: ${{ steps.prepare-job.outputs.CACHE_LOADED }}
        run: |
          make install-mitie
          if [[ "${RASA_INSTALLED}" == 'false' ]]; then
            make install-nlu-pii-channels | tee .output
            make install-monitoring | tee .output
            if grep 'The lock file is not up to date' .output; then exit 1; fi
          fi
          if [[ "${UBUNTU_DEPENDENCIES_INSTALLED}" == 'false' ]]; then
            sudo apt-get -y install libpq-dev
            make prepare-tests-ubuntu
          fi

      - name: Install spaCy language model
        run: |
          poetry run python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          # Verify installation
          hf --help
        shell: bash

      - name: Download GliNER model for PII
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          git config --global credential.helper cache
          hf auth login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          hf download urchade/gliner_multi_pii-v1 --repo-type model --local-dir models --cache-dir models
        shell: bash

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@f4b026bb8b8b53f323960cf86a849a0231ff93b9 # v2.5.0
        with:
          languages: python
          api_key: ${{secrets.DD_API_KEY}}
          site: datadoghq.eu

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: logical
          PYTHONUTF8: 1
          HUGGINGFACE_HUB_CACHE_DIR: ${{ github.workspace }}/models
          GLINER_MODEL_PATH: ${{ github.workspace }}/models
          TRANSFORMERS_OFFLINE: 0
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          make test-anonymization
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: success() || failure()
        run: mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-test-anonymization-python-${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

  run-test-to-monitor-memory-consumption-and-display-on-PR:
    name: Run test to monitor memory consumption and display on PR
    runs-on: warp-ubuntu-latest-x64-2x
    needs: [install-and-cache-rasa, check-code-changes]
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.rasa-core-dependencies-files == 'true' || needs.check-code-changes.outputs.poetry-dependency-updates == 'true') }}
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Dry-run and capture output for hashing
        run: make install --dry-run > dry-run

        # Load cached Rasa if cache exists
      - name: Load cached Rasa
        id: cached-rasa
        uses: WarpBuilds/cache/restore@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}/.venv
          key: rasa-default-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'dry-run') }}

      - name: Install Rasa
        if: ${{ steps.cached-rasa.outputs.cache-hit != 'true' }}
        run: make install

      - name: Create tmp directory
        run: |
          mkdir /tmp/rasa-memory-test

      - name: Run rasa init and rasa train consumption test
        uses: ./.github/actions/rasa-memory-consumption-test
        id: read-max-rss
        with:
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Display max memory consumption for `rasa init` and `rasa train` exceeding threshold on PR
        if: github.event_name == 'pull_request' && success()
        run: |
          if [ "${{ steps.read-max-rss.outputs.max_rss_mb }}" -gt 30 ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "💔 The maximum resident set size (memory consumption) during \`rasa init\` is **${{ steps.read-max-rss.outputs.max_rss_mb }} MB**, which exceeds the average threshold of 30MB." --edit-last
          fi
          if [ "${{ steps.read-max-rss.outputs.max_rss_train_mb }}" -gt 30 ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "💔 The maximum resident set size (memory consumption) during \`rasa train\` is **${{ steps.read-max-rss.outputs.max_rss_train_mb }} MB**, which exceeds the average threshold of 30MB." --edit-last
          fi
        env:
          GH_TOKEN: ${{ secrets.RASABOT_GITHUB_TOKEN }}
        shell: bash

      - name: Remove tmp directory
        if: success() || failure()
        run: |
          rm -rf /tmp/rasa-memory-test

  checkout-code-for-sonarscan:
    runs-on: warp-ubuntu-latest-x64-4x
    # Do not run on scheduled-runs, as SonarScan does not run on them
    if: ${{ github.workflow != 'Scheduled CI Tests' }}
    steps:
      - name: Save Code
        id: save-code
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}
          key: rasa-private-code-${{ github.ref }}-${{ github.sha }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: ${{ steps.save-code.outputs.cache-hit != 'true' }}
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis, removing this messes with PR analysis

  sonarqube:
    name: SonarQube
    runs-on: warp-ubuntu-latest-x64-4x
    needs:
      [
        unit-test-other,
        unit-test-flaky,
        test-anonymization,
        unit-test-cli,
        unit-test-nlu,
        unit-test-agents,
        unit-test-policies,
        unit-test-message-processor,
        voice-unit-tests,
        test-builder,
        checkout-code-for-sonarscan,
      ]
      # We don't want to run the code quality checks on scheduled runs
    if: >-
      ${{ always() && (
        needs.unit-test-other.result != 'skipped' ||
        needs.unit-test-flaky.result != 'skipped' ||
        needs.test-anonymization.result != 'skipped' ||
        needs.unit-test-cli.result != 'skipped' ||
        needs.unit-test-nlu.result != 'skipped' ||
        needs.unit-test-agents.result != 'skipped' ||
        needs.unit-test-policies.result != 'skipped' ||
        needs.unit-test-message-processor.result != 'skipped' ||
        needs.voice-unit-tests.result != 'skipped' ||
        needs.test-builder.result != 'skipped'
      ) }}
    steps:
      - name: Restore checked-out code
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}
          key: rasa-private-code-${{ github.ref }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: "unit-tests-results-**"
          merge-multiple: true

      - name: SonarQube Scan
        if: >-
          needs.unit-test-other.result != 'failure' &&
          needs.unit-test-flaky.result != 'failure' &&
          needs.test-anonymization.result != 'failure' &&
          needs.unit-test-cli.result != 'failure' &&
          needs.unit-test-nlu.result != 'failure' &&
          needs.unit-test-agents.result != 'failure' &&
          needs.unit-test-policies.result != 'failure' &&
          needs.unit-test-message-processor.result != 'failure' &&
          needs.voice-unit-tests.result != 'failure' &&
          needs.test-builder.result != 'failure'
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.RASABOT_GITHUB_TOKEN }} # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  clean-docker-image-artifact:
    name: Clean docker image artifact
    runs-on: warp-ubuntu-latest-x64-2x
    needs:
      - train-templates-dev
      - rasa-private-dev-docker-image
      - tracing-integration-test
      - metric-integration-test
      - custom-action-integration-tests
      - enterprise-search-integration-tests
      - channel-connector-integration-tests
    if: >-
      ${{ always() && (
        needs.tracing-integration-test.result != 'skipped' ||
        needs.train-templates-dev.result != 'skipped' ||
        needs.rasa-private-dev-docker-image.result != 'skipped' ||
        needs.metric-integration-test.result != 'skipped' ||
        needs.enterprise-search-integration-tests.result != 'skipped' ||
        needs.custom-action-integration-tests.result != 'skipped' ||
        needs.sequential-integration-test.result != 'skipped' ||
        needs.non-sequential-integration-test.result != 'skipped' ||
        needs.concurrent-lockstore-integration-test.result != 'skipped' ||
        needs.broker-integration-test.result != 'skipped' ||
        needs.channel-connector-integration-tests.result != 'skipped'
      ) }}

    steps:
      - uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: |
            docker-image-*
            template-artifacts

  ci-required-checks:
    name: CI Required Check
    runs-on: warp-ubuntu-latest-x64-2x
    if: always()
    needs:
      # Core jobs that should always run
      - check-poetry-lock-is-up-to-date
      - check-for-merge-conflicts
      - install-and-cache-rasa
      - quality
      - unit-test-other
      - unit-test-flaky
      - test-anonymization
      # Conditional jobs based on file changes
      - check-code-changes
      - train-templates-dev
      - rasa-private-dev-docker-image
      - check-inspector-build-nextgen
      - check-inspector-build-legacy
      - inspector-lint
      - inspector-unit-tests
      - inspector-e2e
      - tracing-integration-test
      - metric-integration-test
      - custom-action-integration-tests
      - enterprise-search-integration-tests
      - sequential-integration-test
      - non-sequential-integration-test
      - mongo-tracker-store-integration-test
      - dynamo-tracker-store-integration-test
      - concurrent-lockstore-integration-test
      - broker-integration-test
      - channel-connector-integration-tests
      # Temporarily disabled since these jobs are flaky
      # - pii-management-in-calm-integration-tests-env-set
      # - pii-management-in-calm-integration-tests-deletion-no-env
      # - pii-management-in-calm-integration-tests-anonymization-no-env
      - voice-unit-tests
      - unit-test-policies
      - unit-test-agents
      - unit-test-nlu
      - unit-test-cli
      - unit-test-message-processor
      - run-test-to-monitor-memory-consumption-and-display-on-PR
      - sonarqube
      - clean-docker-image-artifact
      - test-builder
    steps:
      - name: Block CI merge for Dependabot PRs
        if: ${{ inputs.pr-author == 'dependabot[bot]' }}
        run: |
          echo "❌ CI blocked: PR author is dependabot[bot]."
          exit 1

      - name: Check job results
        id: check-job-results
        run: |
          set -eo pipefail
          passed_jobs=$(echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | select(.value.result == "success" or .value.result == "skipped") | .key')
          failed_jobs=$(echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | select(.value.result == "failure" or .value.result == "cancelled") | .key')

          echo "✅ Passed or skipped jobs:"
          echo "$passed_jobs"
          echo ""

          if [[ -n "$failed_jobs" ]]; then
            echo "❌ Failed or cancelled jobs:"
            echo "$failed_jobs"
            exit 1
          fi
          echo "No failed or cancelled jobs"

      # Code checkout required as GH API call - needed for commenting on PR - needs to be made from git repo
      - name: Check out code
        if: ${{ always() && github.event_name == 'pull_request' && steps.check-job-results.conclusion == 'failure' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: On failures, comment on PR, instructing that Claude can be used to analyse and auto-fix failures
        if: ${{ always() && github.event_name == 'pull_request' && steps.check-job-results.conclusion == 'failure' }}
        uses: RasaHQ/create-comment@da7b2ec20116674919493bb5894eea70fdaa6486
        with:
          mode: "delete-previous"
          id: "claude-notification"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          body: "Claude AI bot is available to investigate and fix failures. Invoke it by tagging it in a short comment: `@claude <optional message>` (e.g. `@claude` or `@claude fix CI failures`)"
