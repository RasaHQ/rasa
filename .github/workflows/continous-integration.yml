          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UBUNTU_DEPENDENCIES_INSTALLED: ${{ steps.ubuntu-dependencies.outputs.cache-hit }}
        run: |
          if [[ "${UBUNTU_DEPENDENCIES_INSTALLED}" == 'false' ]]; then
            make prepare-tests-ubuntu
          fi
          make prepare-spacy
          make test-integration

      - name: Prepare test results
        if: success() || failure()
        run: mv report_integration.xml integration-results-non-sequential.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Non-Sequential Integration Test Results
          path: integration-results-non-sequential.xml

      - name: Show container logs for non-sequential integration testing
        run: |
          make show-non-sequential-container-logs

      - name: Stop container for non-sequential integration testing
        run: |
          make stop-non-sequential-container

