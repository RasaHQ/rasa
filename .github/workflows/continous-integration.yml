  test-anonymization:
    name: Run Anonymization Unit Tests
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}
    needs: install-and-cache-rasa

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        id: prepare-job
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RASA_INSTALL_GROUP: "anonymisation"

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        id: ubuntu-dependencies
        with:
          packages: libpq-dev graphviz graphviz-dev python3-tk
          version: ubuntu-${{ runner.os }}-dependencies-test-anonymization

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        env:
          UBUNTU_DEPENDENCIES_INSTALLED: ${{ steps.ubuntu-dependencies.outputs.cache-hit }}
          RASA_INSTALLED: ${{ steps.prepare-job.outputs.CACHE_LOADED }}
        run: |
          make install-mitie
          if [[ "${RASA_INSTALLED}" == 'false' ]]; then
            make install-nlu-pii-channels | tee .output
            make install-monitoring | tee .output
            if grep 'The lock file is not up to date' .output; then exit 1; fi
          fi
          if [[ "${UBUNTU_DEPENDENCIES_INSTALLED}" == 'false' ]]; then
            sudo apt-get -y install libpq-dev
            make prepare-tests-ubuntu
          fi

      - name: Install spaCy language model
        run: |
          poetry run python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl

      - name: Install Hugging Face CLI
        run: |
          curl -LsSf https://hf.co/cli/install.sh | bash
          # Verify installation
          hf --help
        shell: bash

      - name: Download GliNER model for PII
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          git config --global credential.helper cache
          hf auth login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          hf download urchade/gliner_multi_pii-v1 --repo-type model --local-dir models --cache-dir models
        shell: bash

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: logical
          PYTHONUTF8: 1
          DD_ARGS: --junitxml=unit-tests-results.xml
          HUGGINGFACE_HUB_CACHE_DIR: ${{ github.workspace }}/models
          GLINER_MODEL_PATH: ${{ github.workspace }}/models
          TRANSFORMERS_OFFLINE: 0
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
          PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION: python
        run: |
          make test-anonymization
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: success() || failure()
        run: mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-test-anonymization-python-${{ matrix.python-version }}-runner
          path: |
            ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

  run-test-to-monitor-memory-consumption-and-display-on-PR:
    name: Run test to monitor memory consumption and display on PR
    runs-on: warp-ubuntu-latest-x64-2x
    needs: [install-and-cache-rasa, check-code-changes]
    if: ${{ needs.check-code-changes.outputs.rasa-core-dependencies-files == 'true' || needs.check-code-changes.outputs.poetry-dependency-updates == 'true' }}
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

        # Load cached Rasa if cache exists
      - name: Load cached Rasa
        id: cached-rasa
        uses: WarpBuilds/cache/restore@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}/.venv
          key: rasa-default-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}

      - name: Install Rasa
        if: ${{ steps.cached-rasa.outputs.cache-hit != 'true' }}
        run: make install

      - name: Create tmp directory
        run: |
          mkdir /tmp/rasa-memory-test

      - name: Run rasa init and rasa train consumption test
        uses: ./.github/actions/rasa-memory-consumption-test
        id: read-max-rss
        with:
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Display max memory consumption for `rasa init` and `rasa train` exceeding threshold on PR
        if: github.event_name == 'pull_request' && success()
        run: |
          if [ "${{ steps.read-max-rss.outputs.max_rss_mb }}" -gt 30 ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "💔 The maximum resident set size (memory consumption) during \`rasa init\` is **${{ steps.read-max-rss.outputs.max_rss_mb }} MB**, which exceeds the average threshold of 30MB." --edit-last
          fi
          if [ "${{ steps.read-max-rss.outputs.max_rss_train_mb }}" -gt 30 ]; then
              gh pr comment ${{ github.event.pull_request.number }} --body "💔 The maximum resident set size (memory consumption) during \`rasa train\` is **${{ steps.read-max-rss.outputs.max_rss_train_mb }} MB**, which exceeds the average threshold of 30MB." --edit-last
          fi
        env:
          GH_TOKEN: ${{ secrets.RASABOT_GITHUB_TOKEN }}
        shell: bash

      - name: Remove tmp directory
        if: success() || failure()
        run: |
          rm -rf /tmp/rasa-memory-test

