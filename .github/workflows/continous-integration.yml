name: Continuous Integration

on:
  workflow_call:
    inputs:
      # CI only runs tests for the lowest supported Python version
      python-versions:
        type: string
        default: '["3.10"]'
        required: false
        description: "Python versions to run the tests on."
      # Code Quality checks are enabled by default
      run_code_quality:
        type: string
        required: false
        default: "true"
        description: "Whether to run the Code Quality checks."
      # Only run partial workflow steps
      full_ci_mode:
        type: string
        required: false
        default: "false"
        description: "Whether to run all the CI checks."
      pr-author: # new input: PR author login (passed by caller)
        type: string
        required: false
        default: ""
        description: "PR author login (pass from caller workflow)"
      pr-is-draft: # new input: PR draft flag (passed by caller)
        type: string
        required: false
        default: "false"
        description: "Whether the PR is a draft (pass from caller workflow)"

concurrency:
  group: continous-integration-${{ github.ref }} # branch or tag name
  cancel-in-progress: true

# SECRETS
# - RASA_TELEMETRY_WRITE_KEY: key to write to segment. Used to report telemetry.
#                                 The key will be added to the distributions
#                      created at https://sentry.io/settings/account/api/auth-tokens/
# - RASA_PRO_LICENSE: license key for Rasa Pro. Used to run tests for Rasa Pro.
# - INTEGRATION_TESTS_STUDIO_LICENSE: license key for Studio. Used in integration tests. Expires in 2034.
# - INTEGRATION_TESTS_PRO_LICENSE: license key for Pro. Used in integration tests. Expires in 2034.

env:
  # Disable CUDA to prevent "failed call to cuInit" errors on CPU-only runners
  CUDA_VISIBLE_DEVICES: "-1"
  AWS_REGION: eu-west-1
  RASA_PRO_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-private-dev
  RASA_PRO_HELM_REPO: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts/rasa
  RASA_PRO_HELM_VERSION: 1.2.0
  DEFAULT_PYTHON_VERSION: "3.10"
  SONAR_ORGANIZATION: rasahq
  SONAR_PROJECT_KEY: RasaHQ_rasa-private
  TEMPLATES: "telco finance basic"
  POSTGRES_HOST: rasa-pro-integration-tests-db.cvgblmmqghrx.eu-west-1.rds.amazonaws.com
  POSTGRES_PORT: "5432"
  POSTGRES_USER: integration_tests_user
  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD_AWS }}
  POSTGRES_DB: integrationtestsdb
  CI: true

permissions:
  checks: write
  id-token: write
  pull-requests: write
  contents: read
  issues: read

jobs:
  check-poetry-lock-is-up-to-date:
    name: check poetry lock is up to date
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          RASA_INSTALL_GROUP: "default"

      - name: Check poetry lock
        run: |
          poetry check
          if grep 'Error: pyproject.toml changed significantly since poetry.lock was last generated' .output; then exit 1; fi

  check-for-merge-conflicts:
    name: Check for merge conflicts
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Merge Conflict finder
        run: |
          ./scripts/conflict-finder.sh
        shell: bash

  compute-docker-image-hash:
    name: Compute Docker image hash
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      hash: ${{ steps.docker-hash.outputs.hash }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Compute Docker image hash
        id: docker-hash
        run: |
          echo "hash=${{ hashFiles('poetry.lock', 'pyproject.toml', 'rasa/**/*.py', '!rasa/builder/**', 'docker/**/*', 'Dockerfile', '.dockerignore', 'Makefile', 'Makefile.docker', 'templates/**/*') }}" >> $GITHUB_OUTPUT

  install-and-cache-rasa:
    name: Install and cache Rasa for reuse across jobs
    runs-on: warp-ubuntu-latest-x64-2x
    if: inputs.pr-author != 'dependabot[bot]'
    strategy:
      matrix:
        installation:
          - default
          - nlu
          - full
          - channels
          - anonymisation
          - full-with-spacy-mitie-and-transformer-models
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Dry-run and capture output for hashing
        if: ${{ matrix.installation == 'default' }}
        run: make install --dry-run > dry-run

      - name: Dry-run and capture output for hashing
        if: ${{ matrix.installation == 'nlu' }}
        run: make install-nlu --dry-run > dry-run

      - name: Dry-run and capture output for hashing
        if: ${{ matrix.installation == 'full' || matrix.installation == 'full-with-spacy-mitie-and-transformer-models' }}
        run: make install-full --dry-run > dry-run

      - name: Dry-run and capture output for hashing
        if: ${{ matrix.installation == 'channels' }}
        run: make install-channels --dry-run > dry-run

      - name: Dry-run and capture output for hashing
        if: ${{ matrix.installation == 'anonymisation' }}
        run: |
          make install-nlu-pii-channels --dry-run > dry-run
          make install-monitoring --dry-run >> dry-run

      # Check if cached Rasa exists
      - name: Check Rasa cache
        if: ${{ matrix.installation != 'full-with-spacy-mitie-and-transformer-models' }}
        id: cached-rasa
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}/.venv
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'dry-run') }}
          lookup-only: true
          fail-on-cache-miss: true
        continue-on-error: true

      # Check if cached Rasa (with Spacy, Mitie and Transformer models) exists
      - name: Check Rasa (with Spacy, Mitie and Transformer models) cache
        if: ${{ matrix.installation == 'full-with-spacy-mitie-and-transformer-models' }}
        id: cached-rasa-with-spacy-mitie-and-transformer-models
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}/.venv
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'Makefile', 'data/test/hf_transformers_models.txt', 'dry-run') }}
          lookup-only: true
          fail-on-cache-miss: true
        continue-on-error: true

      - name: Prepare the job
        if: ${{ steps.cached-rasa.outcome == 'failure' }}
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          LOAD_CACHE: "false"

      # Install if no cache hits
      - name: Install Rasa with default installation
        if: ${{ steps.cached-rasa.outcome == 'failure' && matrix.installation == 'default' }}
        run: |
          make install | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

      # Install if no cache hits
      - name: Install Rasa with nlu installation
        if: ${{ steps.cached-rasa.outcome == 'failure' && matrix.installation == 'nlu' }}
        run: |
          make install-nlu | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

      # Install if no cache hits
      - name: Install Rasa with full installation
        if: ${{ steps.cached-rasa.outcome == 'failure' && matrix.installation == 'full' }}
        run: |
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

        # Install if no cache hits
      - name: Install Rasa with Channels installation
        if: ${{ steps.cached-rasa.outcome == 'failure' && matrix.installation == 'channels' }}
        run: |
          make install-channels | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

      # Install if no cache hits
      - name: Install Rasa with anonymisation prerequisites' installation
        if: ${{ steps.cached-rasa.outcome == 'failure' && matrix.installation == 'anonymisation' }}
        run: |
          make install-nlu-pii-channels | tee .output
          make install-monitoring | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

      - name: Setup Poetry
        if: ${{ steps.cached-rasa-with-spacy-mitie-and-transformer-models.outcome == 'failure' && matrix.installation == 'full-with-spacy-mitie-and-transformer-models' }}
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          LOAD_CACHE: "false"

      # Install if no cache hits
      - name: Install Rasa with full installation, and Spacy, Mitie and Transformer models included also
        if: ${{ steps.cached-rasa-with-spacy-mitie-and-transformer-models.outcome == 'failure' && matrix.installation == 'full-with-spacy-mitie-and-transformer-models' }}
        run: |
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-spacy
          make prepare-mitie
          make prepare-transformers

      # Save new Cache if no existing cache hits
      - name: Save Rasa
        if: ${{ matrix.installation != 'full-with-spacy-mitie-and-transformer-models' && steps.cached-rasa.outcome == 'failure' }}
        uses: WarpBuilds/cache/save@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'dry-run') }}
          path: ${{ github.workspace }}/.venv

      # Save new Cache if no existing cache hits
      - name: Save Rasa (with Spacy, Mitie and Transformer models) cache
        if: ${{ matrix.installation == 'full-with-spacy-mitie-and-transformer-models' && steps.cached-rasa-with-spacy-mitie-and-transformer-models.outcome == 'failure' }}
        uses: WarpBuilds/cache/save@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock', 'Makefile', 'data/test/hf_transformers_models.txt', 'dry-run') }}
          path: ${{ github.workspace }}/.venv

  quality:
    name: Code Quality
    if: ${{ inputs.run_code_quality == 'true' }}
    runs-on: warp-ubuntu-latest-x64-2x
    needs: install-and-cache-rasa
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job
        uses: ./.github/actions/test-prerequisites
        id: prepare-job
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Install Dependencies 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        env:
          RASA_INSTALLED: ${{ steps.prepare-job.outputs.CACHE_LOADED }}
        run: |
          sudo apt-get -y install libpq-dev
          if [[ "${RASA_INSTALLED}" == 'false' ]]; then
            make install-full
          fi

      - name: Checkout target branch to be able to diff on PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          echo "DOCSTRING_DIFF_BRANCH=origin/${{ github.base_ref }}" >> $GITHUB_ENV

      - name: Checkout target branch to be able to diff on merge queue
        if: github.event_name == 'merge_group'
        run: |
          git fetch origin ${{ github.event.merge_group.base_sha }}
          echo "DOCSTRING_DIFF_BRANCH=${{ github.event.merge_group.base_sha }}" >> $GITHUB_ENV

      - name: Fetch current branch
        run: |
          # Fetch entire history for current branch so that `make lint-docstrings`
          # can calculate the proper diff between the branches
          git fetch --unshallow origin "${{ github.ref }}"

      - name: Add github workflow problem matchers
        run: |
          echo "::add-matcher::.github/matchers/flake8-error-matcher.json"

      - name: Lint Code 🎎
        run: |
          # If it's not a pull request, $DOCSTRING_DIFF_BRANCH is unset.
          # This will result in an empty diff, which effictively means that
          # make lint-docstrings will be skipped for other events than `pull_request`
          make lint BRANCH=$DOCSTRING_DIFF_BRANCH

      - name: Check Types 📚
        run: make types

      - name: Lint Changelog Filenames 📝
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: make lint-changelog

  train-templates-dev:
    name: Train Project Templates for Dev
    runs-on: warp-ubuntu-latest-x64-2x
    needs: install-and-cache-rasa
    timeout-minutes: 10
    outputs:
      tag_version: ${{ steps.set-tag.outputs.tag_version }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set image tag
        id: set-tag
        uses: ./.github/actions/set-tag-version

      - name: Train templates
        uses: ./.github/actions/train-templates
        with:
          tag_version: ${{ steps.set-tag.outputs.tag_version }}
          templates: ${{ env.TEMPLATES }}
          rasa_pro_license: ${{ secrets.RASA_PRO_LICENSE }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}

  check-code-changes:
    name: Check for code changes
    if: inputs.pr-author != 'dependabot[bot]'
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 10
    outputs:
      # Unit test related outputs
      inspector-files: ${{ steps.filter.outputs.inspector-files }}
      voice-files: ${{ steps.filter.outputs.voice-files }}
      dm1-tensorflow-files: ${{ steps.filter.outputs.dm1-tensorflow-files }}
      nlu-files: ${{ steps.filter.outputs.nlu-files }}
      cli-files: ${{ steps.filter.outputs.cli-files }}
      agent-files: ${{ steps.filter.outputs.agent-files }}
      sub-agent-files: ${{ steps.filter.outputs.sub-agent-files }}
      policy-files: ${{ steps.filter.outputs.policy-files }}
      source-code-and-build-changes: ${{ steps.filter.outputs.docker }} # 'Docker' filter encompasses both source code and build related files
      tracing-and-metrics-files: ${{ steps.filter.outputs.tracing-and-metrics-files }}
      enterprise-search-policy-files: ${{ steps.filter.outputs.enterprise-search-policy-files }}
      pii-management: ${{ steps.filter.outputs.pii-management }}
      builder-files: ${{ steps.filter.outputs.builder-files }}
      # Integration test related outputs
      broker-files: ${{ steps.filter.outputs.broker-files }}
      poetry-dependency-updates: ${{ steps.filter.outputs.poetry-dependency-updates }}
      mongo-db-files: ${{ steps.filter.outputs.mongo-db-files }}
      custom-action-files: ${{ steps.filter.outputs.custom-action-files }}
      dynamo-db-files: ${{ steps.filter.outputs.dynamo-db-files }}
      channel-connector-files: ${{ steps.filter.outputs.channel-connector-files }}
      sequential-integration-files: ${{ steps.filter.outputs.sequential-integration-files }}
      non-sequential-integration-files: ${{ steps.filter.outputs.non-sequential-integration-files }}
      create_dev_docker_images: ${{ steps.set-dev-image-flag.outputs.create_dev_docker_images }}
      rasa-core-dependencies-files: ${{ steps.filter.outputs.rasa-core-dependencies-files }}
      concurrent-lockstore-files: ${{ steps.filter.outputs.concurrent-lockstore-files }}
      timer-store-files: ${{ steps.filter.outputs.timer-store-files }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: .github/change_filters.yml
      - id: set-dev-image-flag
        name: Set flag to create dev docker images if any relevant changes detected
        run: |
          if [ "${{ steps.filter.outputs.docker }}" = "true" ] || \
             [ "${{ steps.filter.outputs.pii-management }}" = "true" ] || \
             [ "${{ steps.filter.outputs.poetry-dependency-updates }}" = "true" ] || \
             [ "${{ steps.filter.outputs.rasa-core-dependencies-files }}" = "true" ] || \
             [ "${{ steps.filter.outputs.tracing-and-metrics-files }}" = "true" ] || \
             [ "${{ steps.filter.outputs.enterprise-search-policy-files }}" = "true" ] || \
             [ "${{ steps.filter.outputs.custom-action-files }}" = "true" ] || \
             [ "${{ steps.filter.outputs.broker-files }}" = "true" ] || \
             [ "${{ steps.filter.outputs.channel-connector-files }}" = "true" ]; then
            echo "create_dev_docker_images=true" >> $GITHUB_OUTPUT
          else
            echo "create_dev_docker_images=false" >> $GITHUB_OUTPUT
          fi
        shell: bash

  rasa-private-dev-docker-image:
    name: rasa-private dev docker image
    runs-on: warp-ubuntu-latest-x64-2x
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.create_dev_docker_images == 'true') }}
    needs: [train-templates-dev, check-code-changes, compute-docker-image-hash]
    outputs:
      rasa_image_tag: ${{ steps.set-tag.outputs.rasa_image_tag }}
      stack_name: ${{ steps.set-tag.outputs.stack_name }}
    env:
      PLATFORM: linux/amd64

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Check if cached Rasa Docker image exists
      - name: Check Rasa Docker image cache
        id: cached-docker-image
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: rasa-docker-image.tar.gz
          key: rasa-docker-image-${{ needs.compute-docker-image-hash.outputs.hash }}.tar.gz
          lookup-only: true
          fail-on-cache-miss: true
        continue-on-error: true

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Configure AWS credentials
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Set image tag
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        id: set-tag
        run: |
          TAG_VERSION="${{ needs.train-templates-dev.outputs.tag_version }}"
          echo "RASA_IMAGE_TAG=${TAG_VERSION}" >> $GITHUB_ENV
          echo "rasa_image_tag=${TAG_VERSION}" >> $GITHUB_OUTPUT
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            echo "stack_name=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            echo "stack_name=$(echo "${GITHUB_REF##*/}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          fi

      - name: Prepare template caches
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        uses: ./.github/actions/prepare-template-caches
        with:
          tag_version: ${{ needs.train-templates-dev.outputs.tag_version }}
          templates: ${{ env.TEMPLATES }}

      - name: Build Rasa Private Dev Docker Image
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        run: |
          POETRY_VERSION=$POETRY_VERSION \
          PLATFORM=${{ env.PLATFORM }} \
          RASA_REPOSITORY=${{ env.RASA_PRO_DEV_REPOSITORY }} \
          RASA_IMAGE_TAG=${{ env.RASA_IMAGE_TAG }} \
          make build-docker

      - name: Tag, and push image to Amazon ECR
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        run: |
          docker push ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }}

      - name: Tag Docker image by hash also for GHA caching
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        run: docker tag ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }} ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ needs.compute-docker-image-hash.outputs.hash }}

      # Leverage GitHub Actions cache to share Docker images between jobs,
      # reducing dependency on ECR and minimizing AWS costs
      - name: Save docker image
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        run: docker save ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ needs.compute-docker-image-hash.outputs.hash }} | gzip > rasa-docker-image.tar.gz

      - name: Cache Docker image
        if: ${{ steps.cached-docker-image.outcome == 'failure' }}
        uses: WarpBuilds/cache/save@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          key: rasa-docker-image-${{ needs.compute-docker-image-hash.outputs.hash }}.tar.gz
          path: rasa-docker-image.tar.gz

  check-inspector-build-legacy:
    name: Check Inspector Build (Legacy)
    if: inputs.pr-author != 'dependabot[bot]'
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: rasa/core/channels/inspector

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 #v4.4.0
        with:
          node-version-file: "rasa/core/channels/inspector/.nvmrc"

      - name: Cache node modules
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        id: yarn-cache
        with:
          path: "**/inspector/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/inspector/yarn.lock') }}

      - name: Install dependencies
        if: steps.yarn-cache.outputs.cache-hit != 'true'
        run: |
          yarn install --frozen-lockfile

      - name: Build Inspector
        run: |
          yarn build

      - name: Store build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: inspector-build
          path: rasa/core/channels/inspector/dist

      - name: Compare build output
        run: |
          if git diff --quiet -- dist; then
            echo "No changes in the Inspector build output."
          else
            echo "Detected changes in the Inspector build output. Please build the Inspector and commit the contents of rasa/core/channels/inspector/dist/ ."
            exit 1
          fi

  check-inspector-build-nextgen:
    name: Check Inspector Build (Nextgen)
    if: inputs.pr-author != 'dependabot[bot]'
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: rasa/core/channels/inspector-nextgen

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          WORKING_DIRECTORY: "rasa/core/channels/inspector-nextgen"

      - name: Build Inspector
        run: |
          yarn build

      - name: Store build output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: inspector-build-nextgen
          path: rasa/core/channels/inspector-nextgen/dist

      - name: Compare build output
        run: |
          if git diff --quiet -- dist; then
            echo "No changes in the Inspector build output."
          else
            echo "Detected changes in the Inspector build output. Please build the Inspector and commit the contents of rasa/core/channels/inspector-nextgen/dist/ ."
            exit 1
          fi

  inspector-lint:
    name: Inspector Linting
    if: ${{ inputs.full_ci_mode == 'true' || needs.check-code-changes.outputs.inspector-files == 'true' }}
    needs:
      - check-code-changes
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          WORKING_DIRECTORY: "rasa/core/channels/inspector-nextgen"

      - name: Run linting
        run: yarn lint
        env:
          # Prevent ESLint from running out of memory (JavaScript heap OOM in frontend)
          NODE_OPTIONS: --max-old-space-size=4096
        working-directory: rasa/core/channels/inspector-nextgen

  inspector-unit-tests:
    name: Inspector Unit Tests
    if: ${{ inputs.full_ci_mode == 'true' || needs.check-code-changes.outputs.inspector-files == 'true' }}
    needs:
      - check-code-changes
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          WORKING_DIRECTORY: "rasa/core/channels/inspector-nextgen"

      - name: Run tests
        run: yarn vitest run --coverage
        working-directory: rasa/core/channels/inspector-nextgen

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: inspector-coverage-report
          path: rasa/core/channels/inspector-nextgen/coverage

  inspector-e2e:
    name: Inspector E2E
    if: ${{ inputs.full_ci_mode == 'true' || needs.check-code-changes.outputs.inspector-files == 'true' }}
    needs:
      - install-and-cache-rasa
      - check-code-changes
    runs-on: warp-ubuntu-latest-x64-4x
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: ./.github/actions/setup-node
        with:
          FONTAWESOME_NPM_AUTH_TOKEN: ${{ secrets.FONTAWESOME_NPM_AUTH_TOKEN }}
          WORKING_DIRECTORY: "rasa/core/channels/inspector-nextgen"

      - name: Prepare the job
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Run Inspector E2E tests
        uses: ./.github/actions/inspector-e2e-tests
        with:
          PROJECT_TEMPLATE: finance
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          AWS_ASSUME_ROLE: ${{ vars.AWS_ASSUME_ROLE_REPORTS }}

  tracing-integration-test:
    name: Tracing Integration Tests
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.tracing-and-metrics-files == 'true' || needs.check-code-changes.outputs.poetry-dependency-updates == 'true') }}
    needs:
      [
        install-and-cache-rasa,
        check-code-changes,
        rasa-private-dev-docker-image,
        compute-docker-image-hash,
      ]
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load cached Rasa Docker image
        uses: WarpBuilds/cache/restore@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: rasa-docker-image.tar.gz
          key: rasa-docker-image-${{ needs.compute-docker-image-hash.outputs.hash }}.tar.gz
          fail-on-cache-miss: true

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Load Docker image
        run: |
          gunzip -c rasa-docker-image.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          mask-password: "true"

      - name: Set latest Rasa SDK release image tag and repo
        if: ${{ github.event_name == 'pull_request' && (contains(github.event.pull_request.base.ref, '.x') || contains(github.event.pull_request.head.ref, 'prepare-release')) }}
        run: |
          pip install tomlkit
          LATEST_RASA_SDK_VERSION=$(python scripts/get_rasa_sdk_version.py)
          echo "LATEST_RASA_SDK_VERSION=${LATEST_RASA_SDK_VERSION}" >> "${GITHUB_ENV}"
          echo "RASA_SDK_REPOSITORY=rasa/rasa-sdk" >> "${GITHUB_ENV}"

      - name: Set latest Rasa SDK dev image tag and repo
        if: ${{ !(github.event_name == 'pull_request' && (contains(github.event.pull_request.base.ref, '.x') || contains(github.event.pull_request.head.ref, 'prepare-release'))) }}
        run: |
          echo "LATEST_RASA_SDK_VERSION=latest" >> "${GITHUB_ENV}"
          echo "RASA_SDK_REPOSITORY=329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-sdk-dev" >> "${GITHUB_ENV}"

      - name: Tracing integration testing - Run docker containers
        env:
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.compute-docker-image-hash.outputs.hash }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_SDK_REPOSITORY: ${{ env.RASA_SDK_REPOSITORY }}
          RASA_SDK_IMAGE_TAG: ${{ env.LATEST_RASA_SDK_VERSION }}
        run: |
          make run-tracing-integration-containers

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@f4b026bb8b8b53f323960cf86a849a0231ff93b9 # v2.5.0
        with:
          languages: python
          api_key: ${{secrets.DD_API_KEY}}
          site: datadoghq.eu

      - name: Tracing integration testing - Test Code with Services 🩺
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}
        run: |
          make test-tracing-integration

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-tracing-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_tracing_deployment/docker-compose.yml

      - name: Tracing integration testing - Stop docker containers
        if: always()
        run: |
          make stop-tracing-integration-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Tracing Integration Test Results
          path: integration-results-tracing.xml

