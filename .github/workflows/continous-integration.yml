    if: ${{ inputs.run_mode != 'false' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Docker version
        run: docker --version && docker compose version

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz
      
      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Channel connector Integration Tests - Run docker containers
        run: |
          make run-channel-connectors-integration-containers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}

      - name: Channel connector Integration Tests -  Test Code with Services 🩺
        run: |
          make test-channel-connectors-integration-with-calm-bot
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}

      - name: Integration Test for Custom Broker
        run: make test-custom-broker-integration-with-calm-bot

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-rasa-pro-assistant-container-logs
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_channel_connectors/docker-compose.yml

      - name: Channel connector Integration Tests - Stop docker containers
        if: always()
        run: |
          make stop-channel-connectors-integration-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Channel connector Integration Tests Test Results
          path: |
           integration-results-channel-connectors-with-calm-bot-results.xml
           integration-results-custom-broker-with-calm-bot-results.xml

  check-pii-management-changes:
    runs-on: ubuntu-24.04
    outputs:
      pii-management: ${{ steps.filter.outputs.pii-management }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in DM1/Tensorflow related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: .github/change_filters.yml

  pii-management-in-calm-integration-tests:
    name: PII Management in CALM Bot Integration Tests
    needs: [rasa-private-dev-docker-image, check-pii-management-changes]
    if: ${{ inputs.run_mode != 'false' && (needs.check-pii-management-changes.outputs.pii-management == 'true') }}
    runs-on: ubuntu-24.04-4core
    env:
      RASA_SDK_IMAGE_TAG: latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: PII Integration Testing - Run docker containers
        run: |
          make run-pii-calm-containers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          RASA_SDK_REPOSITORY: ${{ env.RASA_SDK_DEV_REPOSITORY }}
          RASA_SDK_IMAGE_TAG: ${{ env.RASA_SDK_IMAGE_TAG }}

      - name: PII Management in CALM Testing -  Test Code with Services 🩺
        run: |
          make test-pii-integration-with-calm-bot
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-pii-management-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_pii_management_in_calm/docker-compose.yml
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
          BOT_PATH: "./tests_deployment/integration_tests_pii_management_in_calm/calm_demo_bot"

      - name: PII Integration Testing - Stop docker containers
        if: always()
        run: |
          make stop-pii-calm-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: PII Management in CALM Bot Integration Tests
          path: pii-management-in-calm-integration-results.xml

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-cli
          - test-policies
          - test-nlu-featurizers
          - test-nlu-predictors
          - test-full-model-training
          - test-other-unit-tests
          - test-performance
          - test-flaky
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ matrix.python-version }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install ddtrace on Linux
        run: poetry run pip install -U 'ddtrace==2.10.5'

      - name: Make direcory for Swagger/OpenAPI coverage results
        if: matrix.test == 'test-other-unit-tests'
        run: mkdir -p 'swagger-coverage-output/localhost:5005'

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 6
          PYTHONUTF8: 1
          DD_ENV: ${{ matrix.test }}
          DD_SERVICE: rasa
          DD_ARGS: --ddtrace --ddtrace-patch-all --junitxml=unit-tests-results.xml
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          BLOCKED_LICENSE: ${{ secrets.BLOCKED_LICENSE }}
          CHAMPION_LICENSE: ${{ secrets.CHAMPION_LICENSE }}
          CHAMPION_SERVER_INTERNAL_LICENSE: ${{ secrets.CHAMPION_SERVER_INTERNAL_LICENSE }}
          CHAMPION_SERVER_LIMITED_LICENSE: ${{ secrets.CHAMPION_SERVER_LIMITED_LICENSE }}
          EXPIRED_LICENSE: ${{ secrets.EXPIRED_LICENSE }}
          IMMATURE_LICENSE: ${{ secrets.IMMATURE_LICENSE }}
          INVALID_SCHEMA_LICENSE: ${{ secrets.INVALID_SCHEMA_LICENSE }}
          INVALID_SIGNATURE_LICENSE: ${{ secrets.INVALID_SIGNATURE_LICENSE }}
          NON_JWT_LICENSE: ${{ secrets.NON_JWT_LICENSE }}
          UNSCOPED_LICENSE: ${{ secrets.UNSCOPED_LICENSE }}
          VALID_LICENSE: ${{ secrets.VALID_LICENSE }}
          API_DOCS_FORMAT: yaml
        run: |
          make ${{ matrix.test }}
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: |
          mv coverage.xml ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

      - name: Generate Rasa server OpenAPI test coverage report
        if: always() && matrix.test == 'test-other-unit-tests'
        run: |
          .venv/lib/python${{ matrix.python-version }}/site-packages/swagger_coverage_py/swagger-coverage-commandline/bin/swagger-coverage-commandline \
          -c swagger-coverage-config-rasa-pro.json \
          -i swagger-coverage-output/localhost:5005 \
          -s swagger-doc-rasa-pro.yaml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

      - name: Save Rasa server OpenAPI tests coverage report
        if: always() && matrix.test == 'test-other-unit-tests'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Rasa Server OpenAPI tests coverage report on python-${{ matrix.python-version }}
          path: swagger-coverage-report-rasa-pro.html

  test-anonymization:
    name: Run Anonymization Unit Tests
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-pii | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install spaCy language model
        run: |
          poetry run python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl

      - name: Install Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1bad5a8c1bb08ac392c63b4587f3231cf80bb1a4

      - name: Install Hugging Face CLI
        run: |
          brew install huggingface-cli
        shell: bash

      - name: Download GliNER model for PII
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          git config --global credential.helper cache
          huggingface-cli login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          huggingface-cli download urchade/gliner_multi_pii-v1 --repo-type model --local-dir models --cache-dir models
        shell: bash

      - name: Install ddtrace on Linux
        run: poetry run pip install -U 'ddtrace==2.10.5'

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 6
          PYTHONUTF8: 1
          DD_SERVICE: rasa
          DD_ARGS: --ddtrace --ddtrace-patch-all --junitxml=unit-tests-results.xml
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          HUGGINGFACE_HUB_CACHE_DIR: ${{ github.workspace }}/models
          GLINER_MODEL_PATH: ${{ github.workspace }}/models
          TRANSFORMERS_OFFLINE: 0
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          make test-anonymization
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
            name: unit-tests-results-test-anonymization-python-${{ matrix.python-version }}
            path: |
              ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml


  publish-test-results:
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_mode != 'false' }}
    needs: [ tracing-integration-test,
             metric-integration-test,
             enterprise-search-integration-tests,
             custom-action-integration-tests,
             sequential-integration-test,
             non-sequential-integration-test,
             concurrent-lockstore-integration-test,
             broker_integration_test,
             channel_connector_integration_tests,
             unit-test, test-anonymization ]
    steps:
      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: artifacts

      - name: Publish integration test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@afb2984f4d89672b2f9d9c13ae23d53779671984 # v2.19.0
        with:
          files: "artifacts/**/integration-results-*.xml"
          check_name: "Integration Test Results"

      - name: Publish unit-test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@afb2984f4d89672b2f9d9c13ae23d53779671984 # v2.19.0
        with:
          files: "artifacts/unit-tests-results-*.xml"
          check_name: "Unit Test Results"

  publish-test-results-on-scheduled-runs:
    runs-on: ubuntu-24.04
    if: ${{ inputs.run_mode == 'false' }}
    needs: [ unit-test, test-anonymization ]
    steps:
      - name: Download test reports
        uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427 # v4.1.4
        with:
          path: artifacts

      - name: Publish integration test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@afb2984f4d89672b2f9d9c13ae23d53779671984 # v2.19.0
        with:
          files: "artifacts/**/integration-results-*.xml"
          check_name: "Integration Test Results"

      - name: Publish unit-test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@afb2984f4d89672b2f9d9c13ae23d53779671984 # v2.19.0
        with:
          files: "artifacts/**/unit-tests-results-*.xml"
          check_name: "Unit Test Results"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    needs: [ unit-test, test-anonymization ]
    if: '!cancelled()'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: "unit-tests-results-**"
          merge-multiple: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@aa494459d7c39c106cc77b166de8b4250a32bb97 # v5.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.RASABOT_GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  clean-docker-image-artifact:
