  check-pii-management-changes:
    runs-on: ubuntu-24.04
    outputs:
      pii-management: ${{ steps.filter.outputs.pii-management }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in DM1/Tensorflow related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: .github/change_filters.yml

  pii-management-in-calm-integration-tests:
    name: PII Management in CALM Bot Integration Tests
    needs: [rasa-private-dev-docker-image, check-pii-management-changes]
    if: ${{ inputs.full_ci_mode != 'false' && (needs.check-pii-management-changes.outputs.pii-management == 'true') }}
    runs-on: ubuntu-24.04-4core
    env:
      RASA_SDK_IMAGE_TAG: latest
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read Poetry Version 🔢
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Get latest Rasa Pro version
        id: get-latest-rasa-pro-version
        run: |
          chmod 755 scripts/get-latest-rasa-version.py
          echo "LATEST_RASA_PRO_VERSION=$(python scripts/get-latest-rasa-version.py)" >> $GITHUB_ENV

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Build Rasa Pro PII image with GLiNER and trained Rasa models
        id: build_rasa_pro_pii_image
        env:
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}
        working-directory: "./tests_deployment/integration_tests_pii_management_in_calm/calm_demo_bot"
        run: |
          docker build --build-arg RASA_REPOSITORY=${{ env.RASA_PRO_DEV_REPOSITORY }} \
                       --build-arg RASA_IMAGE_TAG=${{ env.RASA_IMAGE_TAG }} \
                       --build-arg LATEST_RASA_PRO_VERSION=${{ env.LATEST_RASA_PRO_VERSION }} \
                       -t ${{ env.RASA_PRO_DEV_REPOSITORY }}:${{ env.RASA_IMAGE_TAG }}-pii .

      - name: PII Integration Testing - Run docker containers
        run: |
          make run-pii-calm-containers
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}-pii
          RASA_SDK_REPOSITORY: ${{ env.RASA_SDK_DEV_REPOSITORY }}
          RASA_SDK_IMAGE_TAG: ${{ env.RASA_SDK_IMAGE_TAG }}

      - name: PII Management in CALM Testing -  Test Code with Services 🩺
        run: |
          make test-pii-integration-with-calm-bot
        env:
          PYTHONIOENCODING: "utf-8"
          RASA_TELEMETRY_WRITE_KEY: ${{ secrets.SEGMENT_WRITE_DEV_KEY }}

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-pii-management-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/integration_tests_pii_management_in_calm/docker-compose.yml
          RASA_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}-pii
          BOT_PATH: "./tests_deployment/integration_tests_pii_management_in_calm/calm_demo_bot"

      - name: PII Integration Testing - Stop docker containers
        if: always()
        run: |
          make stop-pii-calm-containers

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: PII Management in CALM Bot Integration Tests
          path: pii-management-in-calm-integration-results.xml

  check-voice-code-changes:
    runs-on: ubuntu-24.04
    outputs:
      voice-files: ${{ steps.filter.outputs.voice-files }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in voice related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: .github/change_filters.yml

  voice_unit_tests:
    name: Run Voice Unit Tests
    needs: [ check-voice-code-changes ]
    if: ${{ inputs.full_ci_mode != 'false' && (needs.check-voice-code-changes.outputs.voice-files == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-audio-manual
        python-version: [ "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install ddtrace on Linux
        run: poetry run pip install -U ddtrace

      - name: Install additional dependencies for voice tests
        if: matrix.test == 'test-audio-manual'
        run: |
          poetry run python -m pip install azure-cognitiveservices-speech

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 6
          PYTHONUTF8: 1
          DD_ENV: ${{ matrix.test }}
          DD_SERVICE: rasa
          DD_ARGS: --ddtrace --ddtrace-patch-all --junitxml=unit-tests-results.xml
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          AZURE_SPEECH_API_KEY: ${{ secrets.AZURE_SPEECH_API_KEY }}
          API_DOCS_FORMAT: yaml
        run: |
          make ${{ matrix.test }}
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: mv coverage.xml  ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test:
          - test-cli
          - test-policies
          - test-nlu-featurizers
          - test-nlu-predictors
          - test-full-model-training
          - test-other-unit-tests
          - test-performance
          - test-flaky
          - test-agents
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
            PYTHON_VERSION: ${{ matrix.python-version }}
            POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install ddtrace on Linux
        run: poetry run pip install -U ddtrace

      - name: Make direcory for Swagger/OpenAPI coverage results
        if: matrix.test == 'test-other-unit-tests'
        run: mkdir -p 'swagger-coverage-output/localhost:5005'

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 6
          PYTHONUTF8: 1
          DD_ENV: ${{ matrix.test }}
          DD_SERVICE: rasa
          DD_ARGS: --ddtrace --ddtrace-patch-all --junitxml=unit-tests-results.xml
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          BLOCKED_LICENSE: ${{ secrets.BLOCKED_LICENSE }}
          CHAMPION_LICENSE: ${{ secrets.CHAMPION_LICENSE }}
          CHAMPION_SERVER_INTERNAL_LICENSE: ${{ secrets.CHAMPION_SERVER_INTERNAL_LICENSE }}
          CHAMPION_SERVER_LIMITED_LICENSE: ${{ secrets.CHAMPION_SERVER_LIMITED_LICENSE }}
          EXPIRED_LICENSE: ${{ secrets.EXPIRED_LICENSE }}
          IMMATURE_LICENSE: ${{ secrets.IMMATURE_LICENSE }}
          INVALID_SCHEMA_LICENSE: ${{ secrets.INVALID_SCHEMA_LICENSE }}
          INVALID_SIGNATURE_LICENSE: ${{ secrets.INVALID_SIGNATURE_LICENSE }}
          NON_JWT_LICENSE: ${{ secrets.NON_JWT_LICENSE }}
          UNSCOPED_LICENSE: ${{ secrets.UNSCOPED_LICENSE }}
          VALID_LICENSE: ${{ secrets.VALID_LICENSE }}
          API_DOCS_FORMAT: yaml
        run: |
          make ${{ matrix.test }}
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: |
          mv coverage.xml ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

      - name: Generate Rasa server OpenAPI test coverage report
        if: always() && matrix.test == 'test-other-unit-tests'
        run: |
          .venv/lib/python${{ matrix.python-version }}/site-packages/swagger_coverage_py/swagger-coverage-commandline/bin/swagger-coverage-commandline \
          -c swagger-coverage-config-rasa-pro.json \
          -i swagger-coverage-output/localhost:5005 \
          -s swagger-doc-rasa-pro.yaml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}
          path: |
            ${{ github.workspace }}/unit-tests-results-${{ matrix.test }}-python-${{ matrix.python-version }}.xml

      - name: Save Rasa server OpenAPI tests coverage report
        if: always() && matrix.test == 'test-other-unit-tests'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Rasa Server OpenAPI tests coverage report on python-${{ matrix.python-version }}
          path: swagger-coverage-report-rasa-pro.html

  test-anonymization:
    name: Run Anonymization Unit Tests
    runs-on: ubuntu-24.04-4core
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(inputs.python-versions) }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-mitie
          make install-nlu-pii-channels | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install spaCy language model
        run: |
          poetry run python -m pip install https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl

      - name: Install Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@1bad5a8c1bb08ac392c63b4587f3231cf80bb1a4

      - name: Install Hugging Face CLI
        run: |
          brew install huggingface-cli
        shell: bash

      - name: Download GliNER model for PII
        env:
          HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          git config --global credential.helper cache
          huggingface-cli login --token ${{ env.HUGGINGFACE_API_KEY }} --add-to-git-credential
          if [[ ! -d models ]]; then
            mkdir models;
          fi
          huggingface-cli download urchade/gliner_multi_pii-v1 --repo-type model --local-dir models --cache-dir models
        shell: bash

      - name: Install ddtrace on Linux
        run: poetry run pip install -U ddtrace

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 6
          PYTHONUTF8: 1
          DD_SERVICE: rasa
          DD_ARGS: --ddtrace --ddtrace-patch-all --junitxml=unit-tests-results.xml
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          HUGGINGFACE_HUB_CACHE_DIR: ${{ github.workspace }}/models
          GLINER_MODEL_PATH: ${{ github.workspace }}/models
          TRANSFORMERS_OFFLINE: 0
          HF_TOKEN: ${{ secrets.HUGGINGFACE_API_KEY }}
        run: |
          make test-anonymization
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: mv coverage.xml ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
            name: unit-tests-results-test-anonymization-python-${{ matrix.python-version }}
            path: |
              ${{ github.workspace }}/unit-tests-results-test-anonymization-python-${{ matrix.python-version }}.xml


  run-test-to-monitor-memory-consumption-and-display-on-PR:
    name: Run test to monitor memory consumption and display on PR
    runs-on: ubuntu-24.04
    needs: rasa-private-dev-docker-image
    if: ${{ inputs.full_ci_mode != 'false' && github.event_name == 'pull_request' }}
    timeout-minutes: 30
    env:
      RASA_IMAGE_TAG: ${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python Environment
        uses: ./.github/actions/setup-python-env
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}

      - name: Download image artifact
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          name: docker-image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz

      - name: Load Docker image
        run: |
          gunzip -c image-${{ needs.rasa-private-dev-docker-image.outputs.rasa_image_tag }}.tar.gz | docker load

      - name: Create tmp directory
        run: |
          mkdir /tmp/rasa-memory-test

      - name: Run rasa init and rasa train consumption test
        uses: ./.github/actions/rasa-memory-consumption-test
        id: read-max-rss
        with:
            RASA_IMAGE_TAG: ${{ env.RASA_IMAGE_TAG }}
            RASA_PRO_DEV_REPOSITORY: ${{ env.RASA_PRO_DEV_REPOSITORY }}
            RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
            OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Display max memory consumption
        uses: marocchino/sticky-pull-request-comment@52423e01640425a022ef5fd42c6fb5f633a02728 #v2.9.1
        if: github.event_name == 'pull_request' && success()
        with:
          header: memory consumption for rasa init and rasa train
          recreate: true
          message: |
            🎉 The maximum resident set size (memory consumption) during `rasa init` is **${{ steps.read-max-rss.outputs.max_rss_mb }} MB**.
            🎉 The maximum resident set size (memory consumption) during `rasa train` is **${{ steps.read-max-rss.outputs.max_rss_train_mb }} MB**.

      - name: Remove tmp directory
        if: always()
        run: |
            rm -rf /tmp/rasa-memory-test


  publish-test-results:
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    needs: [ tracing-integration-test,
             metric-integration-test,
             enterprise-search-integration-tests,
             custom-action-integration-tests,
             sequential-integration-test,
             non-sequential-integration-test,
             concurrent-lockstore-integration-test,
             broker_integration_test,
             channel_connector_integration_tests,
             unit-test, test-anonymization ]
    steps:
      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: artifacts

      - name: Publish integration test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@afb2984f4d89672b2f9d9c13ae23d53779671984 # v2.19.0
        with:
          files: "artifacts/**/integration-results-*.xml"
          check_name: "Integration Test Results"

  sonarqube:
    name: SonarQube
    runs-on: ubuntu-24.04
    needs: [ unit-test, test-anonymization ]
     # We don't want to run the code quality checks on scheduled runs
    if: ${{ inputs.full_ci_mode != 'false' && !cancelled() }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis, removing this messes with PR analysis

      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: "unit-tests-results-**"
          merge-multiple: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25 # v5.3.1
        env:
          GITHUB_TOKEN: ${{ secrets.RASABOT_GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  clean-docker-image-artifact:
    name: Clean docker image artifact
    if: success()
    runs-on: ubuntu-24.04
    needs:
      - train-templates-dev
      - rasa-private-dev-docker-image
      - rasa-private-dev-train-the-model
      - deploy-rasa-private-helm-chart
      - tracing-integration-test
      - metric-integration-test
      - custom-action-integration-tests
      - enterprise-search-integration-tests
      - channel_connector_integration_tests

    steps:
      - uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: |
            docker-image-*
            template-artifacts
