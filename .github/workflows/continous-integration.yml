    name: Run Non-Sequential Integration Tests
    runs-on: warp-ubuntu-latest-x64-8x
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.non-sequential-integration-files == 'true' || needs.check-code-changes.outputs.poetry-dependency-updates == 'true') }}
