  broker_integration_test:
    name: Run Broker Integration Tests
    runs-on: ubuntu-24.04
    if: ${{ inputs.full_ci_mode != 'false' }}
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Free up disk-space
        uses: RasaHQ/rasa-private/.github/actions/free-disk-space@fe77d93db58f0412e2162fdaa34e2ed596f8536b

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          POETRY_CACHE_VERSION: ${{ secrets.POETRY_CACHE_VERSION }}

      - name: Install Dependencies Full (Linux) 📦
        run: |
          sudo apt-get -y install libpq-dev
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu
          make prepare-spacy

      - name: Run the pika test separately
        # these tests need to be run separately as they turn on and off docker container and interfere with the other broker tests
        run: |
          poetry run pytest tests/integration_tests/core/brokers/test_pika.py --junitxml=report_pika_test_integration.xml

      - name: Prepare pika test results
        if: always()
        run: mv report_pika_test_integration.xml integration-results-pika-broker-integration.xml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
            name: Pika Broker Integration Test Results
            path: integration-results-pika-broker-integration.xml

      - name: Run rabbitmq, kafka and zookeeper containers for integration testing
        run: |
          docker compose -f tests_deployment/docker-compose.broker.yml up -d

      - name: Test Code with Services 🩺(broker_integration_test)
        env:
          JOBS: 1
          INTEGRATION_TEST_PYTEST_MARKERS: "broker"
          PYTHONIOENCODING: "utf-8"
        run: |
            make test-integration

      - name: Show container logs
        if: always()
        uses: ./.github/actions/debug-broker-tests
        with:
          COMPOSE_FILE_PATH: tests_deployment/docker-compose.broker.yml

      - name: Prepare test results
        if: always()
        run: mv report_integration.xml integration-results-broker-integration.xml

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
            name: Broker Integration Test Results
            path: integration-results-broker-integration.xml

      - name: Stop rabbitmq, kafka and zookeeper containers for integration testing
        run: |
          docker compose -f tests_deployment/docker-compose.broker.yml down

  channel_connector_integration_tests:
