  broker-integration-test:
    name: Run Broker Integration Tests
    runs-on: warp-ubuntu-latest-x64-2x
    needs:
      [
        install-and-cache-rasa,
        check-code-changes,
        rasa-private-dev-docker-image,
        compute-docker-image-hash,
      ]
    if: ${{ inputs.full_ci_mode == 'true' || (needs.check-code-changes.outputs.broker-files == 'true' || needs.check-code-changes.outputs.poetry-dependency-updates == 'true') }}
    timeout-minutes: 60

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Load cached Rasa Docker image
        uses: WarpBuilds/cache/restore@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: rasa-docker-image.tar.gz
          key: rasa-docker-image-${{ needs.compute-docker-image-hash.outputs.hash }}.tar.gz
          fail-on-cache-miss: true

      - name: Prepare the job for integration tests
        id: prepare-job
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          RASA_INSTALL_GROUP: "full"

      - name: Load Docker image
        run: |
          gunzip -c rasa-docker-image.tar.gz | docker load

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        id: ubuntu-dependencies
        with:
          packages: libpq-dev graphviz graphviz-dev python3-tk
          version: ubuntu-${{ runner.os }}-dependencies-broker-integration-test

      - name: Install Dependencies Full (Linux) 📦
        env:
          RASA_INSTALLED: ${{ steps.prepare-job.outputs.CACHE_LOADED }}
          UBUNTU_DEPENDENCIES_INSTALLED: ${{ steps.ubuntu-dependencies.outputs.cache-hit }}
        run: |

          if [[ "${RASA_INSTALLED}" == 'false' && "${UBUNTU_DEPENDENCIES_INSTALLED}" == 'false' ]]; then
            make install-full | tee .output
            if grep 'The lock file is not up to date' .output; then exit 1; fi
            sudo apt-get -y install libpq-dev
            make prepare-tests-ubuntu
          fi
          make prepare-spacy

      - name: Run the pika test separately
        # these tests need to be run separately as they turn on and off docker container and interfere with the other broker tests
        run: |
          poetry run pytest tests/integration_tests/core/brokers/test_pika.py --junitxml=report_pika_test_integration.xml --reruns 3 --reruns-delay 1

      - name: Prepare pika test results
        if: success() || failure()
        run: mv report_pika_test_integration.xml integration-results-pika-broker-integration.xml

      - name: Save Test Results
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: Pika Broker Integration Test Results
          path: integration-results-pika-broker-integration.xml

      - name: Run rabbitmq, kafka and zookeeper containers for integration testing
