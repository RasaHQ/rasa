  sonarqube:
    name: SonarQube
    runs-on: warp-ubuntu-latest-x64-16x
    needs:
      [unit-test, test-anonymization]
      # We don't want to run the code quality checks on scheduled runs
    if: ${{ inputs.full_ci_mode != 'false' && !cancelled() }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis, removing this messes with PR analysis

      - name: Download test reports
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e #v4.2.1
        with:
          path: ${{ github.workspace }}/artifacts
          pattern: "unit-tests-results-**"
          merge-multiple: true

      - name: SonarQube Scan
