          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          BLOCKED_LICENSE: ${{ secrets.BLOCKED_LICENSE }}
          CHAMPION_LICENSE: ${{ secrets.CHAMPION_LICENSE }}
          CHAMPION_SERVER_INTERNAL_LICENSE: ${{ secrets.CHAMPION_SERVER_INTERNAL_LICENSE }}
