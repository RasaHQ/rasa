name: Backup Rasa Private repo to S3
on:
  schedule:
    # Run cron job at 7AM Monday to Sunday.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.GIT_BACKUP_ROLE_ARN }}
          aws-region: eu-central-1

      # Determine the date in the right format for us to tag the image.
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT

      - name: Create Git bundle
        run: git bundle create --progress rasa-private-${{ steps.date.outputs.date }}.bundle --all

      - name: Verify Git bundle
        run: git bundle verify rasa-private-${{ steps.date.outputs.date }}.bundle

      - name: Upload bundle to S3
        run: aws s3 cp rasa-private-${{ steps.date.outputs.date }}.bundle s3://github-backups-dr/rasa-private/
