name: CI On Pull Request Closure
on:
  pull_request:
    types: [closed]

env:
  AWS_REGION: eu-west-1

permissions:
  id-token: write # Required for GCP workload identity (npm-inspector job)
  contents: read # Required for actions/checkout

jobs:
  aws-ecr-private:
    # Skip any PR created by dependabot to avoid permission issues
    if: (github.actor != 'dependabot[bot]')
    name: Delete PR docker images from private ECR
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Remove docker images from all ECR repositories
        run: |
          REPO_NAMES=("rasa/rasa-private-dev")
          SEARCH_STRING="pr${{ github.event.number }}"
          # Iterate through each repository
          for REPO_NAME in "${REPO_NAMES[@]}"
          do
            # List all image tags in the repository that match the search string
            # Escape empty strings and null character
            IMAGES=$(aws ecr list-images --repository-name $REPO_NAME --query "imageIds[?imageTag!=null&&imageTag!=''&&contains(imageTag, '$SEARCH_STRING')].imageTag" --output text)

            # Print the image tags
            echo "Images to be deleted in repository $REPO_NAME:"
            echo "$IMAGES"
            # Delete each image by its tag
            for IMAGE in $IMAGES
            do
              aws ecr batch-delete-image --repository-name $REPO_NAME --image-ids imageTag=$IMAGE
            done
          done

  aws-ecr-public:
    # Skip any PR created by dependabot to avoid permission issues
    if: (github.actor != 'dependabot[bot]')
    name: Delete PR docker images from public ECR
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1
        with:
          registry-type: public
        env:
          # ECR Public authentication must use us-east-1 regardless of repository region
          AWS_REGION: us-east-1

      - name: Remove docker images from all ECR repositories
        run: |
          REPO_NAME="rasa/rasa-private-dev"
          SEARCH_STRING="pr-${{ github.event.number }}"

          echo "=== DEBUGGING ECR PUBLIC ==="
          echo "Repository Name: $REPO_NAME"
          echo "Search Pattern: $SEARCH_STRING"
          echo ""

          echo "1. Testing AWS CLI access..."
          aws sts get-caller-identity
          echo ""

          echo "2. Listing all repositories in the public registry..."
          aws ecr-public describe-repositories --region us-east-1 || echo "Failed to list repositories"
          echo ""

          echo "3. Listing all images in the target repository..."
          aws ecr-public describe-images --repository-name $REPO_NAME --region us-east-1 --query "imageDetails[?imageTags!=null].{Tags:imageTags,Digest:imageDigest}" --output table || echo "Failed to list images"
          echo ""

          echo "4. Listing all tags in the target repository..."
          ALL_TAGS=$(aws ecr-public describe-images --repository-name $REPO_NAME --region us-east-1 --query "imageDetails[?imageTags!=null].imageTags[]" --output text 2>/dev/null || echo "")
          echo "All tags found:"
          echo "$ALL_TAGS"
          echo ""

          echo "5. Filtering tags that contain '$SEARCH_STRING'..."
          if [ -n "$ALL_TAGS" ]; then
            MATCHING_IMAGES=$(echo "$ALL_TAGS" | tr '\t' '\n' | grep "$SEARCH_STRING" || echo "")
          else
            MATCHING_IMAGES=""
          fi

          if [ -z "$MATCHING_IMAGES" ]; then
            echo "No images found matching pattern: $SEARCH_STRING"
          else
            echo "Images matching pattern '$SEARCH_STRING':"
            echo "$MATCHING_IMAGES"
            echo ""

            echo "6. Would delete the following images (DRY RUN):"
            for IMAGE in $MATCHING_IMAGES
            do
              echo "  - $IMAGE"
            done

            echo ""
            echo "7. Deleting images..."
            for IMAGE in $MATCHING_IMAGES
            do
              echo "Deleting image: $IMAGE"
              aws ecr-public batch-delete-image --repository-name $REPO_NAME --region us-east-1 --image-ids imageTag=$IMAGE
            done
          fi

  # Delete Rasa Inspector npm package versions published from this PR (0.0.0-pr-<number>-*) from GCP Artifact Registry.
  npm-inspector-pr-versions:
    if: (github.actor != 'dependabot[bot]')
    name: Delete PR-scoped Rasa Inspector npm versions
    runs-on: warp-ubuntu-latest-x64-2x
    env:
      GCP_PROJECT: rasa-releases
      GCP_LOCATION: europe-west3
      NPM_REPOSITORY: rasa-inspector
      NPM_PACKAGE_ID: "@rasahq/rasa-inspector"
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@71f986410dfbc7added4569d411d040a91dc6935 # v2.1.8
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_OIDC }}
          service_account: "github-actions-oidc-atom@rasa-releases.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a # v2.1.4

      - name: Delete PR-scoped package versions from Artifact Registry
        env:
          VERSION_PREFIX: "0.0.0-pr-${{ github.event.pull_request.number }}-"
        run: |
          echo "Listing npm package versions with prefix: ${VERSION_PREFIX}"
          GCLOUD_STDERR=$(mktemp)
          VERSIONS=$(gcloud artifacts versions list \
            --project="${GCP_PROJECT}" \
            --repository="${NPM_REPOSITORY}" \
            --location="${GCP_LOCATION}" \
            --package="${NPM_PACKAGE_ID}" \
            --format="value(name)" 2>"$GCLOUD_STDERR") || {
            echo "::error::gcloud artifacts versions list failed."
            cat "$GCLOUD_STDERR"
            rm -f "$GCLOUD_STDERR"
            exit 1
          }
          rm -f "$GCLOUD_STDERR"
          if [ -z "${VERSIONS}" ]; then
            echo "No package versions found for PR #${{ github.event.pull_request.number }}"
            exit 0
          fi
          # Each line is either a full resource path or a bare version ID; extract version for prefix match, pass through for delete
          TO_DELETE=$(echo "${VERSIONS}" | while read -r v; do
            [ -z "$v" ] && continue
            version_id="${v##*/}"
            [[ "$version_id" == "${VERSION_PREFIX}"* ]] && echo "$v" || true
          done)
          if [ -z "${TO_DELETE}" ]; then
            echo "No PR-scoped versions to delete for PR #${{ github.event.pull_request.number }}"
            exit 0
          fi
          echo "Versions to delete:"
          echo "${TO_DELETE}"
          echo "${TO_DELETE}" | while read -r full_name; do
            [ -z "$full_name" ] && continue
            version_id="${full_name##*/}"
            echo "Deleting ${NPM_PACKAGE_ID}@${version_id}"
            gcloud artifacts versions delete "${full_name}" \
              --project="${GCP_PROJECT}" \
              --repository="${NPM_REPOSITORY}" \
              --location="${GCP_LOCATION}" \
              --package="${NPM_PACKAGE_ID}" \
              --delete-tags \
              --quiet
          done
