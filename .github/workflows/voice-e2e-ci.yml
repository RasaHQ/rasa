name: Voice E2E CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.[0-9]+.x'
  pull_request:
permissions:
  id-token: write
  contents: read
  pull-requests: read


env:
  DEFAULT_PYTHON_VERSION: '3.10'
  RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
  AWS_REGION: eu-west-1
  VOICE_FILES: data/e2e_voice/user_remove_contact_from_list/1.wav
  CALM_BENCHMARKING_BOT_READ_TOKEN: ${{ secrets.CALM_BENCH_CLONE }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-voice-code-changes:
    name: Check for code changes
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]') }}
    runs-on: warp-ubuntu-latest-x64-2x
    timeout-minutes: 10
    outputs:
      # Unit test related outputs
      voice-files: ${{ steps.filter.outputs.voice-files }}
      poetry-dependency-updates: ${{ steps.filter.outputs.poetry-dependency-updates }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: .github/change_filters.yml

  install-and-cache-rasa:
    name: Install and cache Rasa for reuse across jobs
    needs: [ check-voice-code-changes ]
    if: ${{ (needs.check-voice-code-changes.outputs.voice-files == 'true' || needs.check-voice-code-changes.outputs.poetry-dependency-updates == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    runs-on: warp-ubuntu-latest-x64-2x
    strategy:
      matrix:
        installation:
          - channels
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Check if cached Rasa exists (cache-hit output used so a miss is not a step failure)
      - name: Check Rasa cache
        id: cached-rasa
        uses: WarpBuilds/cache@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          path: ${{ github.workspace }}/.venv
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          lookup-only: true
          fail-on-cache-miss: true
        continue-on-error: true

      - name: Prepare the job
        if: ${{ steps.cached-rasa.outputs.cache-hit != 'true' }}
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: ${{ env.DEFAULT_PYTHON_VERSION }}
          LOAD_CACHE: "false"

      # Install if no cache hits
      - name: Install Rasa with channels installation
        if: ${{ steps.cached-rasa.outputs.cache-hit != 'true' && matrix.installation == 'channels' }}
        run: |
          make install-channels | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi

      # Save new Cache if no existing cache hits
      - name: Save Rasa
        if: ${{ steps.cached-rasa.outputs.cache-hit != 'true' }}
        uses: WarpBuilds/cache/save@8f10197bad216ec3a6ba6188e7e41e5f52f894cc # v1.4.7
        with:
          key: rasa-${{ matrix.installation }}-install-${{ runner.os }}-${{ env.DEFAULT_PYTHON_VERSION }}-${{ hashFiles('poetry.lock') }}
          path: ${{ github.workspace }}/.venv


  voice-e2e:
    name: Voice E2E happy path tests (${{ matrix.python-version }} | ${{ matrix.credentials }})
    runs-on: warp-ubuntu-latest-x64-2x
    needs: [ install-and-cache-rasa, check-voice-code-changes ]
    if: ${{ (needs.check-voice-code-changes.outputs.voice-files == 'true' || needs.check-voice-code-changes.outputs.poetry-dependency-updates == 'true') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        credentials:
          - calm-benchmarking-bot/credentials.tts.deepgram.yml
          - calm-benchmarking-bot/credentials.tts.rime.yml
          - calm-benchmarking-bot/credentials.tts.cartesia.yml
          - calm-benchmarking-bot/credentials.tts.azure.yml
        python-version:
          - "3.10"

    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
      DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
      RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
      RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
      AZURE_SPEECH_API_KEY: ${{ secrets.AZURE_SPEECH_API_KEY }}
      AZURE_OPENAI_ENDPOINT: "https://eastus.api.cognitive.microsoft.com/"
      AZURE_SPEECH_REGION: "germanywestcentral"
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Checkout `calm-benchmarking-bot` git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: RasaHQ/calm-benchmarking-bot
          path: calm-benchmarking-bot
          token: ${{ secrets.CALM_BENCH_CLONE }}
          ref: voice-simulation-ci-test-branch

      - name: Prepare the job for unit tests
        uses: ./.github/actions/test-prerequisites
        id: prepare-job
        with:
          PYTHON_VERSION: ${{ matrix.python-version }}
          RASA_INSTALL_GROUP: "channels"

      - uses: awalsh128/cache-apt-pkgs-action@acb598e5ddbc6f68a970c5da0688d2f3a9f04d05 #v1.6.0
        id: ubuntu-dependencies
        with:
          packages: libpq-dev graphviz graphviz-dev python3-tk
          version: ubuntu-${{ runner.os }}-dependencies-voice-unit-tests

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@ef8406bf5f987037fcbe3bf8ecf023f5dd1f9e36 # v2.8.0
        with:
          languages: python
          api_key: ${{ secrets.DD_API_KEY }}
          site: datadoghq.eu
          python-tracer-version: "4.6.7"

      - name: Train model and run rasa server
        id: train_and_run_rasa
        env:
          PR_TITLE: ${{ github.event.pull_request.head.ref || github.ref_name }}
        run: |
          set -euo pipefail
          rm -rf models .rasa
          cp -r calm-benchmarking-bot/docs .
          poetry run rasa train \
          --config calm-benchmarking-bot/config/baseline-config.yml \
          --endpoints calm-benchmarking-bot/endpoints.yml \
          --data calm-benchmarking-bot/data \
          -d calm-benchmarking-bot/domain \
          --fixed-model-name "voice-$PR_TITLE"
          echo "==== rasa.log start ===="
          stdbuf -oL -eL poetry run rasa run --port 5005 --model models \
          --enable-api \
          --endpoints calm-benchmarking-bot/endpoints.yml \
          --credentials ${{ matrix.credentials }} 2>&1 | tee rasa.log &
          for i in $(seq 1 60); do
            if curl -sSf http://localhost:5005/ >/dev/null 2>&1; then
              echo "Rasa is up"
              break
            fi
            echo "Waiting for Rasa... ($i/60)"
            sleep 2
          done
          # Final verification: fail the job if Rasa never became available
          if ! curl -sSf http://localhost:5005/ >/dev/null 2>&1; then
          echo "ERROR: Rasa did not start within the timeout (120s)." >&2
          echo "==== Last lines of rasa.log ===="
          tail -n 200 rasa.log || true
          exit 1
          fi
        shell: bash

      - name: Run calm-benchmarking-bot happy path scenario for all voice primitives
        env:
          SENDER_ID: 'test-voice_user-${{ github.run_number }}'
        run: |
          poetry run pytest -s -vv -o log_cli=true -o log_cli_level=DEBUG tests/integration_tests/core/channels/test_voice_primitives.py \
            --voice-files=calm-benchmarking-bot/e2e_audio/happy_path/activate_card_elaborate_utterances/1.wav
        shell: bash

  send_slack_notification_on_failure:
    name: Notify Slack
    if: always()
    runs-on: warp-ubuntu-latest-x64-2x
    needs: [check-voice-code-changes, voice-e2e]

    steps:
      - name: Notify Slack of failure ⛔️
        # send notification if 'voice-e2e' failed or was skipped on main branch.
        # skip notification when the run/job was cancelled (e.g. by a newer push to main).
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.voice-e2e.result != 'success' && needs.voice-e2e.result != 'cancelled' }}
        uses: slackapi/slack-github-action@af78098f536edbc4de71162a307590698245be95 # v3.0.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Send notification to #rasa-pro-alerts (channel C01M5TAHDHA)
          payload: |
            {
              "channel": "C01M5TAHDHA",
              "text": "<!subteam^S08R2BLUZC6> :broken_heart: Voice E2E CI on Main failed 😱! Please check out GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
