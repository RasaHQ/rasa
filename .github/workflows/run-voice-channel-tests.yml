name: Run Voice Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "[0-9]+.[0-9]+.x"
  pull_request:
permissions:
  id-token: write
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-voice-code-changes:
    runs-on: warp-ubuntu-latest-x64-2x
    outputs:
      voice-files: ${{ steps.filter.outputs.voice-files }}
    steps:
      - name: Checkout git repository 🕝
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in voice related files
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: .github/change_filters.yml
      - name: Debug voice-files output
        run: |
          echo "voice-files: ${{  steps.filter.outputs.voice-files }}"

  voice-integration-tests:
    name: Run Voice Integration Tests
    runs-on: warp-ubuntu-latest-x64-4x
    needs: [check-voice-code-changes]
    if: needs.check-voice-code-changes.outputs.voice-files == 'true' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60
    strategy:
      fail-fast: false

    steps:
      - name: Debug voice-files output
        run: |
          echo "voice-files: ${{ needs.check-voice-code-changes.outputs.voice-files }}"
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Prepare the job for integration tests
        uses: ./.github/actions/test-prerequisites
        with:
          PYTHON_VERSION: "3.13"

      - name: Install Dependencies (Linux) 📦
        # Poetry intermittently fails to install dependency if it is not PEP 517 compliant
        # This is a workaround for that issue
        run: |
          sudo apt-get -y install libpq-dev
          make install-full | tee .output
          if grep 'The lock file is not up to date' .output; then exit 1; fi
          make prepare-tests-ubuntu

      - name: Install additional dependencies for voice tests
        run: |
          poetry run python -m pip install azure-cognitiveservices-speech

      - name: Configure Datadog Test Optimization
        uses: datadog/test-visibility-github-action@f4b026bb8b8b53f323960cf86a849a0231ff93b9 # v2.5.0
        with:
          languages: python
          api_key: ${{secrets.DD_API_KEY}}
          site: datadoghq.eu

      - name: Test Code 🔍 (multi-process)
        env:
          JOBS: 2
          PYTHONUTF8: 1
          RASA_PRO_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          RIME_API_KEY: ${{ secrets.RIME_API_KEY }}
          AZURE_SPEECH_API_KEY: ${{ secrets.AZURE_SPEECH_API_KEY }}
          AZURE_OPENAI_ENDPOINT: "https://eastus.api.cognitive.microsoft.com/"
          AZURE_SPEECH_REGION: "eastus"
        run: |
          make test-voice-integration
        shell: bash # bash shell is a way to make code run for both Linux and Windows

      - name: Prepare test results
        if: always()
        run: |
          if [ -f integration-test-results.xml ]; then
            mv integration-test-results.xml ${{ github.workspace }}/integration-results-voice-ready-and-stream-results-python-3.13.xml
          else
            echo "No test results file (tests may have failed before writing XML), skipping move"
          fi

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: integration-results-voice-ready-and-stream-results-python-3.13
          path: |
            ${{ github.workspace }}/integration-results-voice-ready-and-stream-results-python-3.13.xml
          if-no-files-found: ignore

  send_slack_notification_on_failure:
    name: Notify Slack
    runs-on: warp-ubuntu-latest-x64-2x
    if: always()
    needs: [check-voice-code-changes, voice-integration-tests]

    steps:
      - name: Notify Slack of failure ⛔️
        # send notification if 'voice-integration-tests' failed or was skipped (e.g. dependency failed) on main branch.
        # skip notification when the run/job was cancelled (e.g. by a newer push to main).
        if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && needs.voice-integration-tests.result != 'success' && needs.voice-integration-tests.result != 'cancelled' }}
        uses: slackapi/slack-github-action@485a9d42d3a73031f12ec201c457e2162c45d02d # v2.0.0
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          # Send notification to #rasa-pro-alerts (channel C01M5TAHDHA)
          payload: |
            {
              "channel": "C01M5TAHDHA",
              "text": "<!subteam^S08R2BLUZC6> :broken_heart: Voice Integration Tests on Main failed 😱! Please check out GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }
