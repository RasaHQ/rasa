name: Continous Integration Tests

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:

# Reusing continous-integration.yml workflow with default values
# Inputs:
# - python-versions: Python versions to run the tests on
# - run_code_quality: Whether to run the Code Quality checks
jobs:
  ci-tests:
    uses: ./.github/workflows/continous-integration.yml
    secrets: inherit
    with:
      # Disable code quality checks on push events (e.g., pushes to main), enable for pull requests and merge groups
      run_code_quality: ${{ github.event_name == 'push' && 'false' || 'true' }}
      # Full CI mode is enabled for push on main branch or when PR has 'full_ci_mode' label
      full_ci_mode: ${{ (github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full_ci_mode'))) && 'true' || 'false' }}
      pr-author: ${{ github.event.pull_request.user.login }}
      pr-is-draft: ${{ github.event.pull_request.draft }}

  send_slack_notification_on_failure:
    name: Notify Slack
    runs-on: warp-ubuntu-latest-x64-2x
    if: always() && github.event_name == 'push'
    needs:
      - ci-tests

    steps:
      - name: Notify Slack of failure ⛔️
        # send notification only if ci-tests actually failed (not on skipped or cancelled)
        if: ${{ needs.ci-tests.result == 'failure' }}
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_ASSISTANT_ATOM_ALERTS_WEBHOOK }}
        uses: Ilshidur/action-slack@689ad44a9c9092315abd286d0e3a9a74d31ab78a
        with:
          args: "⛔️ *CI on Main* failed 😱! Please check out GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
