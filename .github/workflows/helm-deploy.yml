# This workflow deploys Rasa Pro to the existing CI EKS cluster using a
# timestamp-based (ephemeral) deployment.
#
# It builds and trains Rasa Pro, publishes a uniquely tagged Docker image,
# uploads the trained model, and deploys all required Rasa Pro infrastructure
# (via Helm and Pulumi) into the CI cluster under an isolated namespace/stack.
#
# Each run uses a unique identifier (timestamp) to avoid collisions and to
# allow multiple deployments to coexist safely.
#
# The deployment is designed to be fully disposable. Once testing is complete,
# all resources (Pulumi stack, Kubernetes resources, Docker image, and model
# artifacts) can be cleaned up automatically.
#
# This workflow is intended to serve as the foundation for future automated
# integration tests running against a real Rasa Pro deployment.

name: Helm Deploy on CI cluster

on:
  workflow_dispatch:
  push:
    branches:
      - INFRA-1712

permissions:
  id-token: write
  contents: read

jobs:
  build-train-deploy:
    name: Build train and deploy to CI EKS
    runs-on: warp-ubuntu-latest-x64-2x

    env:
      RASA_PRO_DEV_REPOSITORY: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/rasa/rasa-private-dev
      RASA_PRO_HELM_REPO: oci://europe-west3-docker.pkg.dev/rasa-releases/helm-charts/rasa
      PULUMI_ACCESS_TOKEN: ${{ secrets.HELM_DEPLOY_PULUMI_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.PULUMI_COMPONENTS_GITHUB_TOKEN }}
      AWS_REGION: eu-west-1
      RASA_PRO_HELM_VERSION: 1.2.3
      CI_CLUSTER_NAME: rasa-pro-ci-cluster
      TEMPLATES: 'telco finance basic'

    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set branch-timestamp
        run: |
          echo "UNIQUE_IDENTIFIER=$(echo "${GITHUB_REF##*/}-$(date +%Y%m%d%H%M%S)" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ececac1a45f3b08a01d2dd070d28d111c5fe6722 #v4.1.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 #v2.0.1

      - name: Train templates
        uses: ./.github/actions/train-templates
        with:
            tag_version: ${{ env.UNIQUE_IDENTIFIER }}
            templates: ${{ env.TEMPLATES }}
            rasa_pro_license: ${{ secrets.RASA_PRO_LICENSE }}
            openai_api_key: ${{ secrets.OPENAI_API_KEY }}

      - name: Prepare template caches
        uses: ./.github/actions/prepare-template-caches
        with:
          tag_version: ${{ env.UNIQUE_IDENTIFIER }}
          templates: ${{ env.TEMPLATES }}
     
      - name: Build, Tag and Push Docker Image
        uses: ./.github/actions/build-tag-push-docker-image
        with:
          platform: linux/amd64
          repository: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          image-tag: ${{ env.UNIQUE_IDENTIFIER }}

      - name: Train and Upload Final Model Artifact
        uses: ./.github/actions/train-and-upload-model
        with:
          tag-version: ${{ env.UNIQUE_IDENTIFIER }}
          rasa-pro-dev-repository: ${{ env.RASA_PRO_DEV_REPOSITORY }}
          rasa-image-tag: ${{ env.UNIQUE_IDENTIFIER }}
          make-target: train-rds-tracker-bot
          aws-region: ${{ env.AWS_REGION }}
          model-file-path: tests_deployment/integration_tests_tracker_stores/sql_tracker_store/calm-demo-bot/models/model-${{ env.UNIQUE_IDENTIFIER }}.tar.gz
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          rasa-pro-license: ${{ secrets.RASA_PRO_LICENSE }}

      - name: Set up kubeconfig
        env:
            AWS_REGION: ${{ env.AWS_REGION }}
        shell: bash
        run: |
            aws eks update-kubeconfig --name $CI_CLUSTER_NAME --region $AWS_REGION
    
      - name: Pulumi
        uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 #v6.6.1
        
      - name: Prepare pulumi configuration
        working-directory: ./infrastructure/eks-helm
        run: |
            # 1. Select the Pulumi Stack
            pulumi stack select rasa/eks-helm/${{ env.UNIQUE_IDENTIFIER }} --create

            # 2. Set the regular Pulumi configuration variables
            pulumi config set eks-helm:clusterName rasa/eks-cluster/ci
            pulumi config set eks-helm:projectName rasa-pro-${{ env.UNIQUE_IDENTIFIER }}
            pulumi config set eks-helm:rasaPro ${{ env.UNIQUE_IDENTIFIER }}
            pulumi config set eks-helm:rasaProRepository ${{ env.RASA_PRO_DEV_REPOSITORY }}
            pulumi config set eks-helm:rasaProHelmRepo ${{ env.RASA_PRO_HELM_REPO }}
            pulumi config set eks-helm:rasaProHelmVersion ${{ env.RASA_PRO_HELM_VERSION }}
            pulumi config set eks-helm:rasaProModelBucketName rasa-pro-ci-trained-models
            pulumi config set eks-helm:rasaProModelFileName model-${{ env.UNIQUE_IDENTIFIER }}.tar.gz
            
            # 3. Link the ESC environment
            yq eval '.environment += ["atom/atom-ci"]' -i Pulumi.${{ env.UNIQUE_IDENTIFIER }}.yaml
            
      - name: Run pulumi up
        working-directory: ./infrastructure/eks-helm
        run: |
            pulumi install
            pulumi up --yes

      - name: Wait for deployment to stabilize
        run: |
            sleep 120 # wait for 2 minutes to allow services to stabilize

      - name: Clean everything up
        if: always()
        working-directory: ./infrastructure/eks-helm
        run: |
            # Clean up the deployed stack
            pulumi destroy -s rasa/eks-helm/${{ env.UNIQUE_IDENTIFIER }} --yes
            yes "rasa/eks-helm/${{ env.UNIQUE_IDENTIFIER }}" | pulumi stack rm rasa/eks-helm/${{ env.UNIQUE_IDENTIFIER }} --force --yes
            # Delete docker image from ECR
            aws ecr batch-delete-image --repository-name rasa/rasa-private-dev --region ${{ env.AWS_REGION }} --image-ids imageTag=${{ env.UNIQUE_IDENTIFIER }}
            # Delete model from S3
            aws s3 rm s3://rasa-pro-ci-trained-models/model-${{ env.UNIQUE_IDENTIFIER }}.tar.gz --region ${{ env.AWS_REGION }} --endpoint-url https://s3.${{ env.AWS_REGION }}.amazonaws.com