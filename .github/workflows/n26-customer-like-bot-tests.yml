name: E2E tests on N26 customer-like bot

on:
    workflow_dispatch:

    push:
        tags:
            - '[0-9]+.[0-9]+[0-9]?.0rc[0-9]'

    schedule:
      - cron: '0 2 * * SUN'

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    train_bot_and_run_e2e_tests:
        runs-on: warp-ubuntu-latest-x64-2x
        timeout-minutes: 60
        steps:
            - name: Checkout `rasa-private` repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

            - name: Checkout `customer-bot-qa` repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                repository: RasaHQ/customer-bot-qa
                path: customer-bot-qa
                token: ${{ secrets.CLONE_CUSTOMER_BOT_QA }}

            - name: Setup Python and install rasa-pro
              uses: ./.github/actions/setup-python-env
              with:
                PYTHON_VERSION: '3.11' # Using Python 3.11 as that is the version used by N26

            - name: Train Rasa bot
              working-directory: customer-bot-qa
              env:
                RASA_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                LLM_API_HEALTH_CHECK: true
              run: rasa train --debug

            - name: Run E2E tests
              id: e2e
              working-directory: customer-bot-qa
              env:
                RASA_LICENSE: ${{ secrets.RASA_PRO_LICENSE }}
                OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                LLM_API_HEALTH_CHECK: true
                RASA_PRO_BETA_STUB_CUSTOM_ACTION: true
              run: rasa test e2e tests -o tests/e2e_qa_results --debug

            - name: Save test results
              if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
              with:
                name: E2E-results
                path: customer-bot-qa/tests/e2e_qa_results/**/*.yml

            - name: Notify Slack of failure ⛔️
              if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
              env:
                SLACK_WEBHOOK: ${{ secrets.SLACK_RELEASE_ASSISTANT_ATOM_ALERTS_WEBHOOK }}
              uses: Ilshidur/action-slack@689ad44a9c9092315abd286d0e3a9a74d31ab78a
              with:
                args: "⛔️ *E2E tests on N26-customer-like bot failed 😱! Please check out GitHub Actions: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
