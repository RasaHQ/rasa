name: Build and Push Custom Rasa Image

on:
  push:
    branches:
      - 3.6.x
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      # Tag name used for images created during Docker image builds, e.g. 3886 - a PR number
      image_tag: ${{ steps.set_output.outputs.image_tag }}

    steps:
      - name: Checkout repositorys
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read Poetry Version
        run: |
          echo "POETRY_VERSION=$(scripts/poetry-version.sh)" >> $GITHUB_ENV
        shell: bash

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: docker buildx bake -f docker/docker-bake.hcl base --push

      - run: docker buildx bake -f docker/docker-bake.hcl base-mitie --push

      - run: docker buildx bake -f docker/docker-bake.hcl base-poetry --push
      
      - run: docker buildx bake -f docker/docker-bake.hcl base-builder --push

      - name: Extract metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,prefix=rasa_lib:

      - uses: docker/build-push-action@v6
        with:
          context: ..
          file: docker/Dockerfile.full
          push: true
          sbom: true
          build-args: |
            IMAGE_BASE_NAME=ghcr.io/TAProjectGermany/rasa-base
            BASE_IMAGE_HASH=latest
            BASE_BUILDER_IMAGE_HASH=latest
          tags: ${{ github.actor }}
          labels: ${{ github.actor }}