name: Build and Push Custom Rasa Image

on:
  push:
    branches:
      - 3.6.x
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorys
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker Image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch:

      - name: Build, push, and generate SBOM for Rasa image
        uses: docker/build-push-action@v6
        with:
          context: ..
          file: docker/Dockerfile.full
          push: true
          sbom: true
          build-args: |
            IMAGE_BASE_NAME=python:3.11-slim
            BASE_IMAGE_HASH=latest
            BASE_MITIE_IMAGE_HASH=latest
            BASE_BUILDER_IMAGE_HASH=latest
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
