name: Capture Rasa Pro installation time

on:
  pull_request:

permissions:
  contents: read

jobs:
  check_poetry_lock:
    permissions:
      contents: read  # for dorny/paths-filter to fetch a list of changed files
      pull-requests: read  # for dorny/paths-filter to read pull requests
    name: Detect changes in poetry.lock
    runs-on: warp-ubuntu-latest-x64-2x
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    outputs:
      lock_file: ${{ steps.filter.outputs.lock_file }}
    steps:
      - name: Check out code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: filter
        name: Check for changes in poetry.lock
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36  # v3.0.2
        with:
          filters: .github/change_filters.yml

  trigger_installation_workflow:
    needs: check_poetry_lock
    name: Trigger installation workflow
    runs-on: warp-ubuntu-latest-x64-2x
    if: ${{ needs.check_poetry_lock.outputs.lock_file == 'true' && github.event.pull_request.user.login != 'dependabot[bot]' }}
    steps:
      - name: Trigger installation workflow
        uses: peter-evans/repository-dispatch@ff45666b9427631e3450c54a1bcbee4d9ff4d7c0  #v3.0.0
        with:
          event-type: trigger-installation-performance
          client-payload: '{"branch": "${{ github.head_ref }}", "pr_number": "${{ github.event.pull_request.number }}"}'
          token: ${{ secrets.GITHUB_TOKEN }}
