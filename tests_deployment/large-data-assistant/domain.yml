    - text: "Based on your input, it appears to be a topic that can be traced back to a provider or mobile communications issue. In this case, contact the mobile communications support by email at [FMB DTSE Mobilfunk](mailto:DTSE_Mobilfunk@telekom.de) or look for your contact person in this list: [YAM-Link](https://tiny.telekom.de/no0jgjh7)\n \n[Here](https://tiny.telekom.de/0zefrjfh) you will also find the YAM link to the internal mobile communications management and FAQ."
  utter_mycard_backup_karte:
    - text: "Eine MyCard kann nur eine bestimmte Anzahl an Zertifikaten gleichzeitig speichern. Um historische Zertifikate zu behalten und zu vermeiden, dass neue Zertifikate diese überschreiben, besteht die Möglichkeit einer BackUp MyCard. Hier findest du weitere Informationen zu dem Thema: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/09b7d6cf-3bc7-4b9f-b56a-65f4279acf93)"
    - text: "A MyCard can only store a certain number of certificates at the same time. In order to keep historical certificates and avoid new certificates overwriting them, there is the option of a BackUp MyCard. You can find more information on this topic here: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/09b7d6cf-3bc7-4b9f-b56a-65f4279acf93)"
  utter_mycard_defect:
    - text: "In diesem Fall ist deine Karte defekt. Besorge dir eine neue Karte. Wende dich entweder an das Sekretariat/Geschäftszimmer oder bestelle dir selber eine neue MyCard:\n1. Öffne [MyPortal](https://myportal.corp.telekom.de/)\n2. Drücke auf den Einkaufswagen \n3. Wähle  die Kachel \"Meine Einkäufe\"\n4. Klicke danach auf \"Einkaufen\"\n5. Nachdem sich \"myStore\" geöffnet hat, \n trage im Suchfeld \"myCard\" ein\n6. Wähle den Artikel \"MyCard 4.0 Smartcard\" aus und lege ihn in den Einkaufswagen"
    - text: "In this case your card is broken. Please order a new card. Either contact the secretariat/business office or order a new MyCard yourself:\n1. Open [MyPortal](https://myportal.corp.telekom.de/)\n2. Click on the shopping cart  \"Procurement\"\n3. Select the “My Purchases” tile\n4. Then choose “Shop”\n5. After “myStore” opens, \n enter “myCard” in the search field\n6. Select the item “MyCard 4.0 Smartcard” and add it to the shopping cart"
  utter_mycard_defekt_verloren:
    - text: "Im Falle eines Verlustes/Defektes deiner MyCard wende dich an das Sekretariat/Geschäftszimmer oder bestelle eine neue Karte über MyStore. MyStore ist erreichbar über [MyPortal](myportal.telekom.de) unter der Kachel \"Einkauf\". [Hier](https://tiny.telekom.de/ixgisvkd) erreichst du MyCard-FAQ."
    - text: "If your MyCard is lost/broken, contact the secretary/office or order a new card via MyStore. MyStore can be reached via [MyPortal](myportal.telekom.de) under the menu \"procurement\". [Here](https://tiny.telekom.de/ixgisvkd) you can access the MyCard FAQ."
  utter_mycard_email_datenaenderung:
    - text: "Wenn sich deine Personaldaten ändern (z.B. bei Namenswechsel durch Heirat / konzerninterner Wechsel), muss ebenfalls eine Aktualisierung deiner MyCard durchgeführt werden. Nachdem sich deine Personalstammdaten in den Hintergrundsystemen erneuert haben, erhältst du automatisch eine E-Mail mit dem Betreff: Aktualisierung Ihrer MyCard. \n\nBitte auch **SPAM-Ordner** prüfen. Bitte achtet darauf dass die Links zur MyCard Aktualisierung nicht in Chrome oder Firefox funktionieren. Benutze bitte den Edge Browser. Wenn die Seite nicht richtig angezeigt wird, bitte auch Browserdaten/Cookies löschen und den Link nochmal aufrufen. Alle Hilfedokumente zum Thema MyCard erreichst du über der YAMU-Seite: [MyCard-Hilfedokumente](https://tiny.telekom.de/p8ykwdhz)"
    - text: "If your personal data have been changed (e.g. due to a name change through marriage / internal company change), an update of your MyCard must also be carried out. After your master personal data has been renewed in the background systems, you will automatically receive an email with the subject: Update of your MyCard.\n\nPlease also check **SPAM folder**. Please note that the links to the MyCard update do not work in Chrome or Firefox. Please use the Edge browser. If the page is not displayed correctly, please also delete browser data/cookies and open the link again. You can access all MyCard help documents via the YAMU page: [MyCard help documents](https://tiny.telekom.de/p8ykwdhz)"
  utter_mycard_ersteinrichtung:
    - text: "Voraussetzung für die Nutzung der MyCard ist ein aktives Arbeitsverhältnis. \nNach der Erstanmeldung an Windows (die Erstanmeldedaten werden an den KostV versendet) erhältst du innerhalb von 6 Stunden\nautomatisch eine E-Mail mit dem Betreff „MyCard - Aktivierung und Personalisierung“ mit Detailinformationen\nzur Aktivierung deiner MyCard. \nDu hast nun 28 Tage Zeit deine MyCard zu aktivieren. Die genannte E-Mail enthält alle notwendigen Informationen und Links zur Aktivierung deiner MyCard. Beim Wiedereintritt ist der Prozess gleich."
    - text: "The prerequisite for using the MyCard is an active employment relationship. After the initial login in Windows (the initial registration data will be sended to the cost center representative), you will automatically receive an email with the subject \"MyCard - Activation and Personalization\" with detailed information on activating your MyCard within 6 hours. You now have 28 days to activate your MyCard. The aforementioned email contains all the necessary information and links for activating your MyCard. The process is the same for re-entry."
