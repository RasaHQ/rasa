    - text: "If the MyCard email was not processed in time, the EMEA account will be automatically deactivated. The account can only be activated by an agent. Note: when the account is activated, it can take up to 1 hour for the Office applications to work again. (Outlook, portal.office.com etc.)"
  utter_mycard_wa_replace_mycard_vorhanden:
