  utter_chicago_style_deep_dish:
    - text: "Amerikanische Pizza ist nicht gleich amerikanische Pizza. In Chicago war man 1943 kreativ und kreierte die Pizza im Chicago Style, die auch „deep dish“ genannt wird. Den charakteristischen Namen verdankt diese Variation ihrem Boden: Der Teig wird wie eine Schale mit hohem Rand in die Form gelegt, so bildet sich eine Art Teigschale. Gefüllt wird der fluffige Teig dann mit allem, was das Herz begehrt: Tomatensauce, Käse und Co. Dabei wird die Tomatensauce zuletzt über die Zutaten gegeben. Bei 170 °C wird die Pizza anschließend indirekt 30-40 Minuten im Grill gebacken."
    - text: "American pizza is not the same as American pizza. In 1943, Chicago was creative and created the Chicago Style pizza, also known as \"deep dish\". This variation owes its characteristic name to its base: The dough is placed in the form like a shell with a high edge, forming a kind of dough shell. The fluffy dough is then filled with everything the heart desires: tomato sauce, cheese and co. The tomato sauce is then poured over the ingredients last. The pizza is then baked indirectly in the grill at 170 °C for 30-40 minutes."
  utter_cms_ios_org_group_corpios_fehler:
    - text: "Zur CMS Installation deines Gerätes fehlt ein wichtiger Parameter in unserem System (sogenannte \"Organisationsgruppe\"), daher soll der Fall von einem Agenten untersucht werden."
    - text: "For the CMS installation of your device, an important parameter is missing in our system (so-called \"organisation group\"), so the case should be investigated by an agent."
  utter_emea2_inm_portal:
    - text: "Leider kann ich dir an dieser Stelle nicht weiterhelfen.\nIm Moment beschränken sich meine Features auf die Unterstützung der Domäne EMEA1.\nWir arbeiten daran, EMEA2 Usern den selben Service zu ermöglichen.\nWir informieren über YAM United, wenn neue Funktionen zur Verfügung stehen.\nBitte nutze bis dahin das INM Portal um ein Störungsticket  beim iWSD zu eröffnen.\n[Link INM Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/home)"
    - text: "Unfortunately, I can't help you at this point.\nAt the moment, my features are limited to supporting the EMEA1 domain.\nWe are working on providing the same service to EMEA2 users.\nWe will inform you via YAM United when new features are available.\nUntil then, please use the INM Portal to open an incident ticket with iWSD.\n[Link INM Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/home)"
  utter_feedback_nicht_gegeben:
    - text: "Du hast leider keine Feedback-Option ausgewählt. Wenn du ein neues/anderes Thema hast, starte bitte eine neue Chat-Session und formuliere deine Frage neu. "
    - text: "Unfortunately, you have not selected a feedback option. If you have a new/different topic, please start a new chat session and rephrase your question."
  utter_hw_bluetooth_egoseccheck_accessnegative:
    - text: "You have received the access restrictions to protect company and customer data from the responsible security manager. If you have any questions, contact your supervisor or your cost center manager. You can find more information under [Process to deactivate USB port lock](https://yam-united.telekom.com/pages/89d4ca57-3103-4071-8140-ca6a86b63778/apps/wiki/1f2beee7-5dab-4fd9-892c-9ce346c3c391/list/view/2c9e6574-867b-428f-9724-8023c051062a)."
    - text: "Du hast die Zugriffseinschränkungen zum Schutz von Unternehmens- und Kundendaten vom zuständigen Security-Manager bekommen. Bei Fragen wende dich an deinen Vorgesetzten oder an deinen Kostenstellenverantwortlichen. Weitere Informationen findest du unter [Prozess USB-Portsperre deaktivieren](https://yam-united.telekom.com/pages/89d4ca57-3103-4071-8140-ca6a86b63778/apps/wiki/1f2beee7-5dab-4fd9-892c-9ce346c3c391/list/view/2c9e6574-867b-428f-9724-8023c051062a)."
