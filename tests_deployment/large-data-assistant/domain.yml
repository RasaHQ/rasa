    - text: "I'm glad I could help you."
  utter_freut_mich:
    - text: "Großartig! \nIch habe für dich ein Ticket erstellt, die Ticketnummer kommt per Email an.\nIch wünsche Dir einen schönen Tag!"
    - text: "Great! \nI have created a ticket for you, the ticket number will be sent by email.\nI wish you a nice day!"
  utter_gab_aktualisierung:
    - text: "Nach Aktivierung/Aktualisierung der MyCard oder im Falle von Änderung der persönlichen Daten müssen diese Änderungen auch im Globalen Adressbuch grundsätzlich automatisch aktualisiert werden. Wenn nicht, dann entstehen Probleme mit der Verschlüsselung/Entschlüsselung von E-Mails. Damit das Outlook Adressbuch mit all möglichen Änderungen vom Server heruntergeladen werden kann, versuche bei dir und ggf. auch bei deinen Kolleg*innen die folgenden Einstellungen vorzunehmen:\n\n1. Gehe in Outlook zum Reiter \"Senden/Empfangen\"\n2. Öffne  \"Senden-Empfangen-Gruppen\"\n3. Wähle \"Adressbuch herunterladen...\"\n4. Nehme den Punkt \"Offlineadressbuch herunterladen\"\n5. Starte dann Outlook neu."
    - text: "After activating/updating the MyCard or in the event of changes to personal data, these changes must also be automatically updated in the global address book. If not, problems will arise with the encryption/decryption of e-mails. To ensure that the Outlook address book can be downloaded from the server with all possible changes, try to make the following settings for yourself and, if necessary, for your colleagues:\n\n1. go to the \"Send/Receive\" tab in Outlook\n2. open \"Send/Receive groups\"\n3. select \"Download address book...\"\n4. select the item \"Download offline address book\"\n5. then restart Outlook."
  utter_gpupdate:
    - text: "Führe bitte den Befehl \"gpupdate /force\" aus!\n\n1. Gib \"cmd.exe\" in das Suchfeld auf der Taskleiste ein und starte es.\n2. Kopiere den Befehl \"gpupdate /force\" und füge ihn ein, dann drücke die Enter-Taste.\n\nEs kann einige Minuten dauern, bis der Befehl abgeschlossen wird, danach musst du eine Windows Ab- und Anmeldung durchführen."
    - text: "Please execute the command \"gpupdate /force\"!\n\n1. Enter \"cmd.exe\" into the search field on the taskbar and start it.\n2. Copy the command \"gpupdate /force\" and paste it, then press the Enter key.\n\nIt may take a few minutes for the command to complete, after which you will need to perform a Windows log off and log on."
  utter_h2_unavailable_see_ticket:
    - text: "Im Moment ist leider kein Agent erreichbar. Dein Anliegen wurde in dem Störungsticket {sm9_ticket_id} beschrieben und unsere Agenten werden sich mit Dir in Verbindung setzen. Wenn du weitere Informationen , wie zum Beispiel Screenshots etc. dem Ticket hinzufügen willst, nutze bitte die Updatefunktion im [myIT INM-Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/incidents/status), nachdem du eine Eingangsbestätigung per eMail erhalten hast."
    - text: "At the moment, unfortunately no agent is available. Your concern has been described in the trouble ticket {sm9_ticket_id} and our agents will get in touch with you. If you want to add more information, such as screenshots etc. to the ticket, please use the update function in the [myIT INM-Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/incidents/status), after you have received a confirmation of receipt by email."
  utter_headset_allgemein_message:
