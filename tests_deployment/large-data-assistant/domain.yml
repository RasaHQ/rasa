  utter_lmd_compliancestate_transer_fehlerbehebung:
    - text: "Hier findest du einige Tipps, wie Fehler bei der Microsoft Cloud Registrierung behoben werden können.  \n\nFall 1: Die Registrierung ist unterbrochen, hat einen Schritt übersprungen oder bleibt hängen -> Die Registrierung soll erneut gestartet werden.\n\nFall 2: Die Registrierung funktioniert nicht ->  Starte bitte das Endgerät neu und prüfe die Internetverbindung, dann starte den Prozess erneut."
    - text: "Here you can find some tips on how to fix errors during the Microsoft Cloud registration.\n\nCase 1: The registration is interrupted, skipped a step or is stuck -> The registration should be restarted.\n\nCase 2: The registration does not work -> Please restart the device and check the internet connection, then restart the process."
