  utter_mycard_verschluesselungsprobleme_dateien:
    - text: "Die Anwendung EgoSecure dient zur Verschlüsselung von Dateien. Wenn du Fragen zu EgoSecure hast, dann empfiehlt es sich zuerst, die folgende EgoSecure-Anleitung durchzublättern: [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/4877b1a1-5ab3-4f79-b7d8-87abf5847330)"
    - text: "The EgoSecure application is used to encrypt files. If you have any questions about EgoSecure, we recommend that you first browse through the following EgoSecure instructions: [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/4877b1a1-5ab3-4f79-b7d8-87abf5847330)"
  utter_mycard_verschluesselungsprobleme_emails_voraussetzungen:
    - text: "Hier findest du die Voraussetzungen zur E-Mail-Verschlüsselung mit der MyCard, die erfüllt werden sollen:\n\n1. die MyCard muss aktiviert sein\n2. eine Replikationszeit von 48 Stunden muss nach der MyCard-Aktivierung/Aktualisierung abgewartet werden\n3. die PIN bzw. Zertifikate der MyCard dürfen nicht gesperrt sein\n4. das globale Adressbuch (GAB) muss im Outlook aktuell sein"
    - text: "Here you will find the requirements for e-mail encryption with MyCard that must be met:\n\n1. the MyCard must be activated\n2. a replication time of 48 hours must be waited for after MyCard activation/update\n3. the PIN or certificates of the MyCard must not be blocked\n4. the global address book (GAB) must be up-to-date in Outlook"
  utter_mycard_verschluesselungsprobleme_mobiles_endgeraet:
    - text: "Falls eine Störung mit verschlüsselten E-Mails auf deinem mobilen Endgerät auftritt, versuche bitte die SMIME Zertifikate neu zu laden. Anleitung zur Installation der SMIME Zertifikate kannst du unter diesem Link erreichen: [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/15ec3b23-a4d5-47fa-9e8b-de41d9bf350c)"
    - text: "If there is a problem with encrypted emails on your mobile device, please try to reload the SMIME certificates. Instructions for installing the SMIME certificates can be found under this link: [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/15ec3b23-a4d5-47fa-9e8b-de41d9bf350c)"
  utter_mycard_verschluesselungsprobleme_outlook:
    - text: "Prüfe bitte, ob das richtige aktuelle MyCard Zertifikat im Outlook unter Email-Sicherheitseinstellungen ausgewählt ist: \nGehe im Outlook auf Datei → Optionen → Trust Center → Einstellungen für das Trust Center... → E-Mail Sicherheit → Einstellungen → Zertifikate und Algorithmen→ wähle sowohl beim Signaturzertifikat als auch beim Verschlüsselnungszertifikat das aktuelle MyCard Zertifikat aus und klicke anschließend auf OK.\nHinweis: Oben bei \"Name der Sicherheitseinstellung\" soll \"Meine S/MIME-Einstellungen\" ausgewählt werden."
    - text: "Please check whether the correct current MyCard certificate is selected in Outlook under Email security settings: \nIn Outlook, go to File → Options → Trust Center → Trust Center settings... → Email security → Settings → Certificates and algorithms → select the current MyCard certificate for both the signature certificate and the encryption certificate and then click OK.\nNote: ‘My S/MIME-Settings’ should be selected at the top under ‘Name of security setting’."
