  utter_kein_pizza_sondern_spagetti:
    - text: "Ich habe verstanden, du möchtest heute keine Pizza, sondern Spagetti essen. "
    - text: "I understood, you don't want to eat pizza today, but spaghetti instead."
  utter_lokaldrucker_zubehoerbestellung:
    - text: "Zubehör kannst du in myStore bestellen. In [MyPortal](myportal.telekom.de) erreichst du myStore über die Kachel \"Einkauf\"."
    - text: "You can order supply in myStore. In [MyPortal](myportal.telekom.de) you can access myStore via the \"procurement\" tile."
  utter_m365_anmeldezeit_durch:
    - text: "Ob die Lizenzzuweising bereits erfolgt ist, kann folgendermaßen geprüft werden: Versuche dich an [portal.office.com](portal.office.com) anzumelden. Zur Anmeldung nimm deine E-Mail Adresse und falls abgefragt wird, gib ins Dialogfeld dein EMEA-PW ein.\n\nHinweis:\n1. Anmeldung klappt → Lizenz vorhanden\n2. Anmeldung klappt nicht → Lizenz nicht vorhanden"
    - text: "Alternatively, you can check whether the license has already been assigned as follows: Try logging in to [portal.office.com](portal.office.com). Use your email address to log in and if asked, enter your EMEA password in the dialog box.\n\nNote:\n1. log in works → license exists\n2. log in does not work → license does not exist"
  utter_m365_anmeldezeit_nichtdurch:
    - text: "Die Lizenzzuweisung von Microsoft 365 wird nach dem ersten Anmelden an Active Directory angestoßen. Es kann unter Umständen bis zu 8 Stunden dauern, bis die Lizenz zugewiesen wird. Diese Replikationszeit soll abgewartet werden. Versuche die M365-Produkte erst nach dem Ablauf dieser Zeit zu starten."
    - text: "The Microsoft 365 license assignment is initiated after the first login to Active Directory. It may take up to 8 hours for the license to be assigned. This replication time should be waited for. Please attempt to start the M365 products only after this time has elapsed."
  utter_m365_gastaccount_fehlerbild_sharepoint:
    - text: "Der Gast Account wurde bereits erstellt und er ist erfolgreich für einen SharePoint berechtigt, aber der Zugriff funktioniert trotzdem nicht? Es kommt sogar die Meldung: \"Sie benötigen eine Berechtigung für den Zugriff auf diese Webseite.\"\nWie man das am schnellsten löst, wird in diesem [BLOG-Artikel](https://tiny.telekom.de/l3bbwzja) beschrieben - bitte folge den dort aufgeführten Schritten."
    - text: "The guest account has already been created and is successfully authorised for a SharePoint, but access is still not working? You even get the message: ‘You need authorisation to access this website.’\nThe quickest way to solve this is described in this [BLOG article](https://tiny.telekom.de/l3bbwzja) - please follow the steps listed there."
  utter_m365_gastaccount_produktbeschreibung:
    - text: "A Microsoft 365 (M365) guest account allows you to collaborate with externals within the M365 services (e.g. MS Teams, SharePoint Online, OneNote, Planner) in the Telekom M365 environment.\n\nThe guest account can be ordered by internal EMEA1 and EMEA2 colleagues in MyIT. The internal orderer is the sponsor for the M365 guest account. Once the guest account is set up, the external person can be invited to join a team from MS Teams, become authorized to SharePoint Online resources, and become a member of M365 groups. It is free and is set up for a maximum of 180 days. The sponsor will be informed by email in time about the upcoming expiration and can then extend the sponsorship if necessary."
    - text: "Ein Microsoft 365 (M365) Gastkonto ermöglicht dir die Zusammenarbeit mit externen Personen innerhalb der M365-Dienste (z. B. MS Teams, SharePoint Online, OneNote, Planner) in der Telekom M365-Umgebung.  \n\nDas Gastkonto kann von internen EMEA1 und EMEA2-Kolleg*innen in MyIT bestellt werden. Die interne bestellende Person ist der Sponsor für das M365-Gastkonto. Wenn das Gastkonto eingerichtet ist, kann die externe Person in ein Team von MS Teams eingeladen, auf SharePoint Online Ressourcen berechtigt und Mitglied in M365-Gruppen werden. Es ist kostenlos und wird für maximal 180 Tage eingerichtet. Der Sponsor wird per E-Mail rechtzeitig über den bevorstehenden Ablauf informiert und kann die Sponsorship dann ggf. verlängern."
  utter_m365_gastaccount_produktbeschreibung02:
    - text: "Please note: It is not necessary to order a guest account:\n- for persons with an e-mail address @external.telekom.de, @external.telekom.com, @external.t-systems.com\n- for additional persons in one of the international companies belonging to TDG or T-Systems and using a Nucleus Client → these already have an M365 account with which collaboration within M365 services works\n- for members of the Collaboration Network. For these, an account is automatically provided which can be used"
    - text: "Bitte beachte: Die Bestellung eines Gastkontos ist nicht nötig:\n- für Personen mit einer E-Mailadresse @external.telekom.de, @external.telekom.com, @external.t-systems.com\n- für weitere Personen in einer der internationalen Firmen, die zur TDG oder T-Systems gehören und die einen Nucleus Client nutzen → diese haben bereits einen M365-Account mit dem die Zusammenarbeit innerhalb der M365-Dienste funktioniert\n- für Mitglieder des Collaboration Networks. Für diese wird automatisch ein Account bereitgestellt, welcher verwendet werden kann"
  utter_m365_gastaccount_produktbeschreibung03:
    - text: "The CSD ChatBot is primarily designed for troubleshooting purposes, but to find out more about Microsoft Guest Accounts, please visit our information collection on [YAMU via this link](https://tiny.telekom.de/rbef8z4n). There you will find everything about processes such as ordering, personnel changes and termination, etc.\n\n**ATTENTION:** Only those who have ordered the affected Guest Account and who accordingly have **SPONSOR** authorization are authorized to report issues relating to Guest Accounts."
    - text: "Der CSD ChatBot ist vor allem für Zwecke der Störungsbeseitigung ausgedacht, aber damit du weiteres Wissenswertes im Thema Microsoft Gast Accounts erfährst, besuche bitte dazu unsere Informationssammlung auf [YAMU über diesen Link](https://tiny.telekom.de/rbef8z4n). Da findest du alles über Prozesse wie Bestellung, personale Änderungen und Kündigung, etc.\n\n**ACHTUNG:** Für Störungsmeldungen in Bezug auf Gast Accounts sind nur und ausschließlich diejenigen berechtigt,  die den betroffenen Gast Account bestellt haben und dem entsprechend über eine **SPONSOREN**-Berechtigung verfügen."
  utter_m365_lokalapps_fehlerbild_makros:
    - text: "As far as macros are concerned, my hands are unfortunately tied - they are not supported by the Common Service Desk. As a suggestion, I give you a link from [YAMU](https://tiny.telekom.de/906puq57), where you can find more information about macro settings. For more complex questions or depending on the complexity of the problem, contact the macro creator.\n\n**NOTE:** After the M365 update to versions 2208 and 2302, changes were made to macro security. This resulted in the macros in Office / PSL / Planbuch / Visio being identified as untrusted and therefore blocked. Macros only work in version 2202. If you have any further questions on the topic, use this [link](https://tiny.telekom.de/fcujcqxc)."
    - text: "Was die Makros betrifft, sind meine Hände leider gebunden - supportet werden die vom Common Service Desk nicht. Als Vorschlag gebe ich dir einen Link von [YAMU](https://tiny.telekom.de/906puq57), unter dem du weitere Informationen zu Makro-Einstellungen findest. Bei komplexeren Fragen bzw. der Komplexität der Störung angemessen, wende dich an den Makro-Ersteller.\n\n**HINWEIS:** Nach M365 Update auf Version 2208 und 2302 wurden Änderungen im Macro-Security durchgeführt, es führte dazu, dass die Makros in Office / PSL / Planbuch / Visio als nicht vertrauenswürdig identifiziert, dadurch blockiert sind. Makros funktionieren nur in Version 2202. Bei weiteren Fragen zum Thema nimm diesen [Link](https://tiny.telekom.de/fcujcqxc). "
  utter_m365_lokalapps_generell:
    - text: "With regard to the locally available applications/software products from Microsoft (e.g. Excel, Access, Visio, etc.) it is difficult to cover every type of fault. Nevertheless, I will try to list some of the most common ones (e.g. total application failure, performance problems, etc.) - perhaps you will find your issue among them."
    - text: "In Bezug auf die lokal vorhandenen Applikationen/Softwareprodukte von Microsoft (z.B. Excel, Access, Visio, etc.) ist es schwierig jede Art der Störungsbilder abzudecken. Ich versuche dir trotzdem ein paar der meist vorkommenden davon (z.B. totaler Anwendungsausfall, Performanceprobleme, etc.) aufzulisten - vielleicht findest du dein Anliegen gerade unter denen."
  utter_m365_moderngroups_fehlerbild_besitzer:
    - text: "Um den Besitzer - sei er/sie bereits gekündigt oder noch angestellt - herauszufinden, gehe wie folgt vor:\n1. rufe das Globales Adressbuch auf\n2. suche nach der Gruppe anhand des Namens\n3. rufe die Gruppeneigenschaften auf\n4. check den Namen im Bereich \"Besitzer\"\n\n**ACHTUNG:** Eine Neuzuweisung der Besitzerberechtigungen ist nicht vorgesehen. Als mögliche Lösungsoption kann/muss eine neue Gruppe angelegt werden, in die ggf. die Informationen aus der bestehenden Gruppe überführt werden. Es handelt sich bei Modern Groups um einen reinen UserSelfService. Ein Grund hierfür ist u.a., dass ein Anwender sich über diesen Weg ggf. den Zugriff auf vertrauliche Informationen verschaffen könnte. Zudem wird in der Servicebeschreibung explizit darauf hingewiesen, dass **für jede Gruppe mindestens 2 Besitzer** benannt werden müssen.\n\n"
    - text: "To find out the owner - whether he/she has already been terminated or is still employed - proceed as follows:\n1. open the global address book\n2. search for the group by name\n3. open the group properties\n4. check the name in the \"Owner\" area\n\n**ATTENTION:** There is no provision for reassigning the owner permissions. As a possible solution, a new group can/must be created, into which the information from the existing group can be transferred if necessary. \"Modern Groups\" is a pure user self-service. One reason for this is that a user could potentially gain access to confidential information in this way. In addition, the service description explicitly states that **at least 2 owners** must be named for each group."
  utter_m365_moderngroups_fehlerbild_extern:
    - text: "External Modern Groups can also be contacted. This only requires activation in the Modern Group:\n1. select the relevant Modern Group in Outlook\n2. click on \"Group settings\" at the top\n3. go to \"Edit group\"  \n4. tick the box ‘Allow people from outside the organisation to send emails to the group’"
    - text: "Auch Modern Groups von extern können angemailt werden. Notwendig ist dazu nur die Aktivierung in der Modern Group:\n1. Wähle die betroffene Modern Group im Outlook aus\n2. Klicke oben auf \"Gruppeneinstellungen\"\n3. Gehe auf \"Gruppe bearbeiten\"\n4. Setze den Haken bei \"Personen von außerhalb der Organisation das senden von E-mails an die Gruppe gestatten\""
  utter_m365_moderngroups_fehlerbild_freigebucht:
    - text: "Werden die frei/gebucht Zeiten im Kalender nicht für alle Teilnehmer einer Modern Groups angezeigt? Prüfe ob die frei/gebucht Informationen nur bei der Erstellung eines Termins im Gruppenkalender nicht zu sehen sind oder im eigenen Kalender auch nicht. Wenn die Informationen im eigenen Kalender auch nicht zu sehen sind, dann gibt es hier ein paar Vorschläge, die dir dabei helfen können:\n\n**Anpassung der Berechtigungsstufe**\n- rufe den Kalender auf\n- gehe unter \"Start\" auf \"Kalenderberechtigungen\"\n- nimm auf der Registerkarte \"Berechtigungen\" die gewünschten Änderungen an den Berechtigungen zur Freigabe von Kalendern vor (empfehlenswert ist \"Alle Details\")\n- bestätige alles mit OK\n\n**Bereinigung der Frei-/Gebuchtinformationen**\n- schließe Outlook\n- drücke Windows Taste+R\n- trage den Befehl \"outlook.exe /CleanFreeBusy\" ein\n- führe den Befehl aus\n- starte Outlook und teste"
    - text: "Are the free/busy times not displayed in the calendar for all participants in a Modern Group? Check whether the free/busy information is only not visible when creating an appointment in the group calendar or not in your own calendar either. If the information is not visible in your own calendar either, here are a few suggestions that can help you:\n\n**adjusting the permission level**\n- open the calendar\n- go to \"Start\" and then \"Calendar permissions\"\n- on the \"Permissions\" tab, make the desired changes to the permissions for sharing calendars (we recommend \"All details\")\n- confirm everything with OK\n\n**cleaning up the free/busy information**\n- close Outlook\n- press Windows key+R\n- enter the command \"outlook.exe CleanFreeBusy\"\n- execute the command\n- start Outlook and test"
  utter_m365_moderngroups_fehlerbild_geloescht:
    - text: "Wenn eine Microsoft 365-Gruppe (oder eine Gruppe mit dazugehörigem Team in MS Teams oder ein Plan in MS Planner) gelöscht wurde, wird sie/er standardmäßig 30 Tage lang aufbewahrt. Innerhalb dieses Zeitraums können die bisherigen Besitzer diese Gruppe samt deren Inhalte problemlos wiederherstellen. Nach 30 Tagen werden die Gruppe und die dazugehörigen Inhalte endgültig gelöscht und können nicht wiederhergestellt werden. Wie die Wiederherstellung funktioniert, findest du [in diesem YAMU-Artikel](https://tiny.telekom.de/1a5eynl8) beschrieben."
    - text: "If a Microsoft 365 group (or a group with an associated team in MS Teams or a plan in MS Planner) has been deleted, it is retained for 30 days by default. During this period, the previous owners can easily restore this group and its contents. After 30 days, the group and its associated contents are permanently deleted and cannot be restored. You can find out how the restoration works [in this YAMU article](https://tiny.telekom.de/1a5eynl8)."
  utter_m365_moderngroups_fehlerbild_outlook_anzeige:
    - text: "Der Bereich \"Gruppen\" wird unterhalb der persönlichen Mailbox nur angezeigt, wenn im Outlook der ExchangeCacheModus aktiviert ist.\nStandardmäßig ist der ExchangeCacheMode aktiviert und kann vom Anwender nicht dauerhaft deaktiviert werden. Lediglich bei VDS Arbeitsplätzen ist der CacheMode deaktiviert. In dem Fall sollte der Anwender über OWA auf diese Gruppen zuzugreifen.\nOWA erreichst du unter folgendem [link](https://outlook.office.de/mail/inbox)."
    - text: "The ‘Groups’ area is only displayed below the personal mailbox if ExchangeCacheMode is activated in Outlook.\nExchangeCacheMode is activated by default and cannot be permanently deactivated by the user. CacheMode is only deactivated for VDS users. In this case, the user should access these groups via ‘OWA’.\nOWA can be accessed via the following [link](https://outlook.office.de/mail/inbox)."
  utter_m365_moderngroups_produktbeschreibung:
    - text: "[M365-Gruppen](https://tiny.telekom.de/rfqmz394) kann als flexibles Instrument für die temporäre Zusammenarbeit in Gruppen und Teams genutzt werden.  Die zentrale Basis sind so genannte Gruppen. Du erstellst eigene Gruppen, deren eindeutiger Name auch im globalen Adressbuch sichtbar ist und wählst Personen aus, mit denen du zu einem bestimmten Thema zusammenarbeiten möchtest. Der Zugriff auf den Service erfolgt über Outlook (auch in der Online-Version). Ein Zugriff über das blaue Wolkensymbol OneDrive in der Taskleiste ist ebenso möglich.\n\nWeiteres Wissenswertes zum Thema ist auf [M365-YAMU-Portal](https://tiny.telekom.de/xo8s1ppj) zu finden."
    - text: "[M365 Groups](https://tiny.telekom.de/rfqmz394) can be used as a flexible tool for temporary collaboration in groups and teams. The central basis is so-called groups. You create your own groups, whose unique name is also visible in the global address book, and select people with whom you want to collaborate on a specific topic. The service is accessed via Outlook (also in the online version). Access via the blue OneDrive cloud symbol in the taskbar is also possible.\n\nFurther information on the topic can be found on the [M365-YAMU portal](https://tiny.telekom.de/xo8s1ppj)."
  utter_m365_msteams_fehlerbild_outlokaddin02:
    - text: "Als Alternative kann auch \"Microsoft Teams Meeting Add-in for Microsoft Office\" wie folgt deinstalliert werden:\n1. Start Menü von Windows → Einstellungen → Apps → Installierte Apps\n2. suche unter \"Installiere Apps\" nach \"Microsoft Teams Meeting Add-in for Microsoft Office\"\n3. klicke rechts auf das \"Drei-Punkte-Symbol\" und wähle \"Deinstallieren\"\n4. schließe dann Outlook\n5. beende MS Teams über die Taskleiste\n6. starte deinen Rechner neu\n7. öffne MS Teams\n\nDadurch wird \"New Teams\" gezwungen, das \"Microsoft Teams Meeting Add-in\" neu zu installieren, wodurch das Problem behoben werden sollte. Wenn das Teams Meeting Add-in wieder in der Liste der installierten Apps steht, dann starte Outlook neu und es sollte wieder funktionieren."
    - text: "Alternatively, \"Microsoft Teams Meeting Add-in for Microsoft Office\" can be uninstalled as follows:\n1. Windows Start menu → Settings → Apps → Installed apps\n2. under \"Install apps\" look for \"Microsoft Teams Meeting Add-in for Microsoft Office\"\n3. right-click on the \"three dots icon\" and select \"Uninstall\"\n4. then close Outlook\n5. quit MS Teams via the taskbar\n6. restart your computer\n7. open MS Teams\n\nThis will force \"New Teams\" to reinstall the \"Microsoft Teams Meeting Add-in\", which should fix the problem. If the Teams Meeting Add-in is back in the list of installed apps, restart Outlook and it should work again."
  utter_m365_msteams_fehlerbild_outlookaddin:
    - text: "Abhängig von der installierten MS Team Version sind unterschiedliche Lösungen im Thema vorgesehen, um das Outlook Add-In für MS Teams aktiv zu schalten.\n\nVor allem ist es aber zu überprüfen, ob der Schiebeschalter für \"NEW TEAMS\" unter dem \"Drei-Punkte-Symbol\" neben deinem Teams-Profilbild vorhanden ist. Falls ja, dann deaktiviere den Schalter kurz, schließe MS Teams, öffne dann MS Teams erneut und aktiviere \"NEW TEAMS\" erneut - dieser Vorgang soll in 99% der Fälle helfen."
    - text: "Depending on the installed MS Team version, different solutions are provided in the topic to activate the Outlook Add-In for MS Teams.\n\nAbove all, however, it is important to check whether the slide switch for \"NEW TEAMS\" is present under the \"three-dot symbol\" next to your Teams profile picture. If so, then briefly deactivate the switch, close MS Teams, then reopen MS Teams and activate \"NEW TEAMS\" again - this process should help in 99% of cases."
  utter_m365_msteams_fehlerbild_startetautomatisch:
    - text: "If MS Teams starts automatically every time you start your computer, you can stop the corresponding start process as follows:\n1. open the MS Teams settings (\"three-dot-symbol\" at the top next to your profile picture)\n2. select the menu item \"General\" on the left-hand side\n3. remove the check mark from \"Auto-start Teams\""
    - text: "Falls sich MS Teams bei jedem einzelnen Rechnerstart automatisch startet, kannst du den entsprechenden Start-Prozess bei Bedarf wie folgt abstellen:\n1. öffne die MS Teams Einstellungen (\"Drei-Punkte-Symbol\" oben neben deinem Profilbild)\n2. wähle auf der linken Seite den Menüpunkt \"Allgemein\"\n3. nimm das Häkchen von \"Anwendung automatisch starten\" raus"
  utter_m365_msteams_fehlerbild_updatebenoetigt:
    - text: "If the message \"Update required\" or \"Teams needs an update\" appears when starting MS Teams, then the only solution is to reinstall MS Teams. However, the installation requires the support of a CSD agent. Let me forward your request accordingly."
    - text: "Falls beim Starten von MS Teams die Meldung \"Update erforderlich\" bzw. \"Teams benötigt ein Update\" erscheint, dann gibt es nur die Lösung, MS Teams neu aufzuspielen. Die Zuweisung erfordert aber die Unterstützung von einem Agenten des CSD. Lass mich dem entsprechend deine Anfrage weiterleiten."
  utter_m365_msteams_fehlerbild_verfügbarkeit_status_ol:
    - text: "Um dir den Verfügbarkeitsstatus deiner Kontakte aus MS Teams im Outlook anzeigen zu lassen, führe die folgende Einstellung durch:\n1. Schliesse Outlook\n2. Öffne MS Teams → rufe Einstellungen auf\n3. Unter Einstellungen → Allgemein → System → setze Haken bei : „Das Neue Teams als Chat-App für Microsoft 365 registrieren...“ \n4. Starte Outlook neu und teste es\n\nDiese Information kannst du auch mit Bildern illustriert auf [YAMU](https://tiny.telekom.de/2m89k5no)nach lesen.\n"
    - text: "To display the availability status of your contacts from MS Teams in Outlook, follow the steps below:\n1. Close Outlook\n2. Open MS Teams → go to Settings\n3. Under Settings → General → System → set the hook: “Register the new Teams as a chat app for Microsoft 365...” \n4. Restart Outlook and test it\n\nYou can also read this information illustrated with pictures on [YAMU](https://tiny.telekom.de/2m89k5no)."
  utter_m365_msteams_neuanmeldung:
    - text: "Es empfiehlt sich, dich aus MS Teams einmal ab- und dann wieder neu anzumelden - führe dazu die folgenden Schritte durch:\n1. aus MS Teams abmelden (Profilbild in MS Teams anklicken → in der rechten obigen Ecke \"Abmelden\" auswählen)\n2. MS Teams schliessen\n3. MS Teams neustarten\n4. an MS Teams die Anmeldung durchführen"
    - text: "It is recommended that you log out of MS Teams and then log in again - to do this, follow these steps:\n1. log out of MS Teams (click on the profile picture in MS Teams → select \"Sign Out\" in the top right corner)\n2. close MS Teams\n3. restart MS Teams\n4. log in to MS Teams"
  utter_m365_msteams_onlinetest:
    - text: "Vor allem ist es bei Problemen mit MS Teams notwendig, die Störung entweder über [portal.office.com](portal.office.com) oder über [https://teams.microsoft.com/](https://teams.microsoft.com/) versuchen nachzustellen.\n\nErgebnisse des Online-Versuchs können folgende sein:\n- online funktioniert → möglicher lokaler Fehler\n- online funktioniert auch nicht → möglicher inhaltlicher Fehler"
  utter_m365_msteams_produktbeschreibung:
    - text: "Microsoft Teams is the cockpit for collaboration in the Microsoft 365 world and brings people, conversations and content together in a user-friendly interface.\n\nThe already familiar M365 groups (formerly Modern Groups) are an elementary component, i.e. they are also the focus of Teams. Existing groups can be integrated into Teams, and new ones can be created from Teams at any time. All M365 users who are already active today can use it. Teams is currently released for \"internal\". The protection classes for the existing M365 services remain unchanged.\n\nThe YAMU portal offers more on the topic [under this link](https://tiny.telekom.de/ln8qwgc6)."
    - text: "Microsoft Teams ist das Cockpit zur Zusammenarbeit in der Microsoft 365-Welt und bringt Personen, Unterhaltungen und Inhalte in einer benutzerfreundlichen Oberfläche zusammen.\n\nDie bereits bekannten M365 Gruppen (vormals Modern Groups) sind elementarer Bestandteil, d.h. sie stehen auch bei Teams im Mittelpunkt. Bestehende Gruppen können in Teams integriert werden, neue jederzeit aus Teams heraus erstellt werden. Nutzen können es alle heute schon aktiven M365 Anwender. Teams ist aktuell freigegeben für \"intern\". Die Schutzklassen für die vorhandenen M365 Services bleiben unverändert.\n\nWeiteres zum Thema bietet [unter diesem Link](https://tiny.telekom.de/ln8qwgc6) das YAMU-Portal an."
  utter_m365_msteams_reparieren:
    - text: "Als Nächstes repariere MS Teams, da es nach Erfahrungen viele der gemeldeten MS Teams-bezogene Probleme bislang gelöst hat. Wie man es meistert, sieht so aus: MS Teams Einstellungen → Apps → Installierte Apps → nach Teams Suchen → \"Drei-Punkt-Symbol\" → Erweiterte Optionen → nach unten scrollen → Reparieren"
    - text: "Next, repair MS Teams as it has been proven to resolve many of the reported MS Teams related issues so far. How to do it is as follows: MS Teams Settings → Apps → Installed Apps → Search for Teams → \"Three-Dot-Symbol\" → Advanced Options → scroll down → Repair"
  utter_m365_msteams_zuruecksetzen:
    - text: "Anschließend setze MS Teams folgendermaßen zurück: MS Teams Einstellungen → Apps → Installierte Apps → nach Teams Suchen → \"Drei-Punkt-Symbol\" → Erweiterte Optionen → nach unten scrollen → Zurücksetzen"
    - text: "Next reset MS Teams as follows: Settings → Apps → Installed Apps → Search for Teams → \"Three-Dot-Symbol\" → Advanced Options → scroll down → Reset"
  utter_m365_onedrive_fehlerbild_startet_nicht_automatisch:
    - text: "Wenn OD4BSyncClient nicht mehr automatisch mit der Anmeldung an Windows startet, dann führt dies dazu, dass  Dateien in der Cloud seit dem Update nicht mehr lokal synchronisiert werden.\nDas Starten der Synchronisierung mit der Windowsanmeldung kannst du wie folgt vornhemen:\n\n1. Starte OneDrive unter Start -> Alle Programme -> Microsoft OneDrive\n2. Rechtsklick auf das blaue Wolkensymbol (OneDrive) auf der Taskleiste -> Wähle Einstellungen -> Synchronisieren und Sichern\n3. Schalte \"OneDrive beim Anmelden bei Windows starten\" ein\n"
    - text: "If OD4BSyncClient no longer starts automatically when you log on to Windows, this means that files in the cloud are no longer synchronised locally.\nYou can start synchronisation with the Windows login as follows:\n1. start OneDrive under Start -> All programmes -> Microsoft OneDrive\n2. right-click on the blue cloud icon (OneDrive) on the taskbar -> Select Settings -> Sync and backup\n3. switch on ‘Start OneDrive when I sign in to Windows’"
  utter_m365_onedrive_produktbeschreibung:
    - text: "[OneDrive](https://tiny.telekom.de/7qk1xikp) ist mehr als ein einfaches Datenarchiv, das nur für die Ablage von Dateien geeignet ist. Nutzer können Dateien organisieren, indem sie auch in der Cloud eine ordnerähnliche Struktur anlegen. Die Navigation in OneDrive oder im Windows Explorer unterscheidet sich daher nur anhand der verwendeten Oberfläche, aber nicht prinzipiell. Über den Sync Client lassen sich die Inhalte des OneDrive zudem im Windows Explorer einbinden. Eine Änderung in OneDrive hat durch die Synchronisation auch die Änderung der Daten auf dem eigenen Gerät zur Folge. Nutzer, die an mehreren Geräten arbeiten, haben es dadurch leichter, eine einheitliche Arbeitsumgebung zu schaffen und Daten ohne Aufwand von Gerät A zu Gerät B und umgekehrt zu transferieren.\n\nWeiteres zum Thema ist unter den folgenden Links zu finden:\n1. [OneDrive - Allgemeine Produktbeschreibung](https://tiny.telekom.de/7qk1xikp)\n2. [OneDrive - Good-To-Know](https://tiny.telekom.de/5i2884om)\n3. [OneDrive - Synchronisierung](https://tiny.telekom.de/qt3lzz4i)"
    - text: "[OneDrive](https://tiny.telekom.de/7qk1xikp) is more than a simple data archive that is only suitable for storing files. Users can organize files by creating a folder-like structure in the cloud. Navigation in OneDrive or in Windows Explorer therefore only differs in terms of the interface used, but not in principle. The contents of OneDrive can also be integrated into Windows Explorer via the Sync Client. A change in OneDrive also results in changes to the data on your own device due to synchronization. This makes it easier for users who work on multiple devices to create a uniform working environment and to transfer data from device A to device B and vice versa without any effort.\n\nFurther information on the topic can be found under the following links:\n1. [OneDrive - General Product Description](https://tiny.telekom.de/7qk1xikp)\n2. [OneDrive - Good-To-Know](https://tiny.telekom.de/5i2884om)\n3. [OneDrive - Synchronization](https://tiny.telekom.de/qt3lzz4i)"
  utter_m365_onenote_fehlerbild_schreibgeschuetzt:
    - text: "Die in OneNote 2007 erstellten Dokumente sind mit OneNote 2016 inkompatibel und müssen konvertiert werden um geöffnet werden zu können. Dies kann eine Ursache sein, dass sich OneNote Seiten nur schreibgeschützt öffnen.\n\nUm dies vorzubeugen, mach folgendes:\n1. im OneNote 2016 links oben auf Datei → Informationen → Einstellungen → Eigenschaften klicken\n2. im kommenden Fenster rechts unten \"In 2010-2016 konvertieren\" klicken (wenn es ausgegraut ist, kann die Datei nicht konvertiert werden)\n3. falls nicht konvertierbar → kopiere den Inhalt der alten OneNote-Datei und erstelle einfach ein neues Notizbuch"
    - text: "Documents created in OneNote 2007 are incompatible with OneNote 2016 and must be converted in order to be opened. This can be a reason why OneNote pages only open in read-only mode.\n\nTo prevent this, do the following:\n1. in OneNote 2016, click File → Information → Settings → Properties at the top left\n2. in the window that appears, click \"Convert to 2010-2016\" at the bottom right (if it is grayed out, the file cannot be converted)\n3. if it cannot be converted → copy the contents of the old OneNote file and simply create a new file"
  utter_m365_onenote_fehlerbild_synchronfehler:
    - text: "Prüfe bitte folgendermaßen, ob das fehlerhafte Notizbuch online erreichbar ist:\n1. Klicke dazu auf das fehlerhaft synchronisierende Notizbuch mit der rechten Maustaste.\n2. Wähle dort im Menü \"Notizbuch-Synchronisierungsstatus...\".\n3. Klicke auf den Link, der in derselben Ansicht unterhalb des betroffenen Notizbuchs dargestellt wird.\n\nFalls der Online-Zugang besteht, lass das Notizbuch von der Online-Ansicht aus erneut synchronisieren.\n\nFalls der Fehler „404 FILE NOT FOUND” kommt (mit einer leere Seite), dann wurde der originale Notizbuch verschoben/umbenannt/gelöscht. Wende dich in diesem Fall direkt an die Person, die für die Erstellung/Änderung des betroffenen Notizbuchs verantwortlich ist/war. \n\nHinweis: Die Mehrheit nicht zugänglicher Notizbücher gehören im Allgemeinen zu gelöschten Modern Groups, deren Inhalt mittlerweile offline geschaltet wurde."
    - text: "Please check whether the broken notebook is accessible online as follows:\n1. Right-click on the notebook that is syncing incorrectly.\n2. Select \"Notebook sync status...\" from the menu.\n3. Click on the link that is displayed below the affected notebook in the same view.\n\nIf online access is available, sync the notebook again from the online view.\n\nIf the error \"404 FILE NOT FOUND\" appears (with a blank page), then the original notebook has been moved/renamed/deleted. In this case, contact the person who is/was responsible for creating/modifying the affected notebook directly.\n\nNote: The majority of inaccessible notebooks generally belong to deleted Modern Groups whose content has since been taken offline."
  utter_m365_onenote_fehlerbild_synchronfehler02:
    - text: "Als Lösung kannst du auch das Notizbuch direkt im OneDrive erstellen, nun gehe dazu wie folgt vor:\n1. Öffne OneNote über die lokale Anwendung auf deinem Laptop.\n2. Nimm \"Datei → Neu\".\n3. Erstelle eine neue Notiz direkt auf dem OneDrive.\n4. Bestimme dann, ob du die Datei für andere Personen freigeben möchtest.\n5. Kopiere den Inhalt der alten und beschädigten Notiz in die neu erstellte Datei - klicke dazu auf der OneNote Kartei mit der rechten Maustaste und gehe auf \"Verschieben oder Kopieren\".\n6. Schließe anschließend die defekte Notiz und führe einen Test durch."
    - text: "As a solution, you can also create the notebook directly in OneDrive. To do this, proceed as follows:\n1. Open OneNote using the local application on your laptop.\n2. Choose \"File → New\".\n3. Create a new note directly on OneDrive.\n4. Then decide whether you want to share the file with other people.\n5. Copy the contents of the old and damaged note into the newly created file - to do this, right-click on the OneNote file and click \"Move or Copy\".\n6. Then close the broken note and run a test."
  utter_m365_portalofficeanmeldung_erfolgreich:
    - text: "So, deine Microsoft Lizenz scheint in Ordnung zu sein. An dieser Stelle hast du die Chance dein Problem weiter bearbeiten zu lassen - im Grunde genommen hat die Lizenz-Problematik keinen Einfluss auf deine Störung."
    - text: "So, your Microsoft license seems to be OK. At this point you have the chance to have your issue further worked on - basically the license issue has no influence on it."
