  utter_hs_funktioniert_nicht:
    - text: "Falls es Probleme mit dem Headset aufgetreten sind, trenne alle der folgenden externen Audio/Sound-Geräte:\n- USB-Kabel des Headsets\n- USB-Kabel der Headset Dect-Station\n- USB-Dongle des Headset\n- USB-Klinken Adapter für 3,5 mm Klinken-Headset\n- USB-WebCam\n- Bluetooth-Headsets trennen/entfernen, die mit dem Notebook Bluetooth-Chip gekoppelt wurden.\nStarte den Laptop  sowie das Headset nach dem Trennen neu, verbinde sie mit dem Kabel oder Dongle erneut und führe einen Test durch."
    - text: "If you are experiencing problems with the headset, disconnect all of the following external audio/sound devices:\n- Headset USB cable\n- Headset Dect station USB cable\n- Headset USB dongle\n- USB jack adapter for 3.5 mm jack headset\n- USB webcam\n- Disconnect/remove Bluetooth headsets that have been paired with the notebook's Bluetooth chip.\nAfter disconnecting, restart the laptop and the headset, reconnect them with the cable or dongle and perform a test."
  utter_hw_bluetooth_egoseccheck:
