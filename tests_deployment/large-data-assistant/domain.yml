    - text: "Diese Nachricht wird dem User nie angezeigt."
  utter_emea_kennwortrichtlinien:
    - text: "Informationen über Komplexitätsanforderungen und Kennwortrichtlinien erfährst du [hier](https://tiny.telekom.de/gd8cmky8)"
    - text: "You can find information about complexity requirements and password guidelines [here](https://tiny.telekom.de/gd8cmky8)"
  utter_emea_passwort_aktualisierung_android:
    - text: "Nach einer EMEA Passwortänderung (z.B. am Rechner) soll das Passwort auf dem mobilen Endgerät ebenso aktualisiert werden: \n1. Für die Postfachsynchronisierung in Boxer: Die Passwortabfrage poppt nach der Passwortänderung in 60 Minuten automatisch auf. Falls du diese Zeit nicht abwarten möchtest: Einstellungen → Apps → Boxer → Stoppen erzwingen → Boxer starten, ggf. eine De- und Neuinstallation von Boxer versuchen.\n2. Für die weiteren dienstlichen Apps (z.B. M365 Apps): Die Passwortabfrage erscheint automatisch."
    - text: "After an EMEA password change (e.g. on the computer), the password should also be updated on the mobile device: \n1. for mailbox synchronisation in Boxer: The password prompt pops up automatically after the password change in 60 minutes. If you don't want to wait this time: Settings → Apps → Boxer → Force stop → Start Boxer, try uninstalling and reinstalling Boxer if necessary.\n2. for the other business apps (e.g. M365 apps): The password prompt appears automatically."
  utter_emea_passwort_aktualisierung_ios_boxer:
    - text: "Nach einer EMEA Passwortänderung (z.B. am Rechner) soll das Passwort auf dem mobilen Endgerät ebenso aktualisiert werden: \n1. Für die Postfachsynchronisierung in Boxer: Die Passwortabfrage poppt nach der Passwortänderung in 60 Minuten automatisch auf. Falls du diese Zeit nicht abwarten möchtest: Boxer → Einstellungen → Exchange o365 SMIME → Erneut authentifizieren.\n2. Für die weiteren dienstlichen Apps (z.B. M365 Apps): Die Passwortabfrage erscheint automatisch."
    - text: "After an EMEA password change (e.g. on the computer), the password should also be updated on the mobile device: \n1. for mailbox synchronisation in Boxer: The password prompt pops up automatically after the password change in 60 minutes. If you do not want to wait this time: Boxer → Settings → Exchange o365 SMIME → Re-authenticate.\n2. for the other business apps (e.g. M365 apps): The password prompt appears automatically."
  utter_emea_passwort_aktualisierung_ios_nativ:
    - text: "Nach einer EMEA Passwortänderung (z.B. am Rechner) soll das Passwort auf dem mobilen Endgerät ebenso aktualisiert werden: \n1. Für die Postfachsynchronisierung in der nativen Mail App: Einstellungen → Mail → Accounts → Exchange o365 SMIME → Passwort erneut eingeben → Anmeldedaten eingeben (E-Mailadresse und EMEA Passwort).\n2. Für die weiteren dienstlichen Apps (z.B. M365 Apps): Die Passwortabfrage erscheint automatisch.\n"
    - text: "After an EMEA password change (e.g. on the computer), the password should also be updated on the mobile device: \n1. for mailbox synchronisation in the native mail app: Settings → Mail → Accounts → Exchange o365 SMIME → Enter password again → Enter login data (email address and EMEA password).\n2. for the other business apps (e.g. M365 apps): The password prompt appears automatically."
  utter_emea_passwort_zuruecksetzen:
    - text: "Zur Entsperrung oder Neuvergabe deines EMEA Passworts hast du mehr Möglichkeiten:\n\n1. Auf einem Rechner: Öffne das Selfservice Portal [passwort.telekom.de](https://passwort.telekom.de/cgi-bin/start.pl) und setze dein EMEA Passwort mit Hilfe der MyCard zurück. Die Anleitung findest du [hier](https://tiny.telekom.de/eibaydfy).\n\n2. Auf einem mobilen Endgerät mit Corporate Mobile Service Dienst: Verwende die EmployeeApp. Die Beschreibung zur Passwortrücksetzung findest du [hier](https://tiny.telekom.de/uneapmk0)\n\n**Wichtig**: Wenn du keine Selfservice-Möglichkeit hast, brauchst du die Hilfe deiner Kostenstelle (oder Vertretung). In MyIT soll dazu ein [Service-Auftrag zur Passwortrücksetzung](https://tiny.telekom.de/skpgvrgt) eingestellt werden."
    - text: "You have more options for unlocking or resetting your EMEA password:\n\n1. on a computer: Open the self-service portal [passwort.telekom.de](https://passwort.telekom.de/cgi-bin/start.pl) and reset your EMEA password using MyCard. You can find the instructions [here](https://tiny.telekom.de/eibaydfy).\n\n2. on a mobile device with Corporate Mobile Service: Use the EmployeeApp. You can find the description for resetting the password [here](https://tiny.telekom.de/uneapmk0)\n\n**Important**: If you do not have a self-service option, you need the help of your cost centre (or representative). A [Service order for password reset](https://tiny.telekom.de/skpgvrgt) should be set up in MyIT for this purpose."
  utter_emea_pw_aendern_neu:
    - text: "Hier findest du die Möglichkeiten für die Passwortänderung:\n- auf einem **Dienstrechner**: Über die Tastenkombination Strg+Alt+Entf → Kennwort ändern.\n- auf einem **mobilen Endgerät mit CMS Dienst**: Über die Web App → 9 Punkte → Lesezeichen → „O365 Password Change“ ODER über die Webadresse owa-intern.telekom.de\n- auf einem **macOS Gerät mit LMD Dienst**: Über MS Edge aus der Favoritenleiste \"AD Password renewal\" ODER über die Webadresse owa-intern.telekom.de\n- auf einem **DevClient**: Über [MyAccount](https://myaccount.microsoft.com) ODER [OWA](owa-intern.telekom.de)\n- über **VDS**: In einer laufenden Sitzung ändern (wo eine andere Person angemeldet ist) → STRG + F1 drücken → \"Kennwort ändern\" ODER bei der VDS Startseite."
    - text: "Here you will find the options for changing your password:\n- on a **service computer**: Via the combination Ctrl+Alt+Del → Change password.\n- on a **mobile device with CMS service**: Via the web app → 9 dots → Bookmarks → \"O365 Password Change\" OR via the web address owa-intern.telekom.de\n- on a **macOS device with LMD service**: Via MS Edge from the favourites bar \"AD Password renewal\" OR via the web address owa-intern.telekom.de\n- on a **DevClient**: Via [MyAccount](https://myaccount.microsoft.com) OR [OWA](owa-intern.telekom.de)\n- via **VDS**: Change in a running session (where a colleague is logged in) → press CTRL + F1 → \"Change password\" OR on the VDS start page."
  utter_erstanmeldung_vorbereitungen:
    - text: "Vergewissere dich bitte darüber, dass dein Device im Home Office eingeschaltet und über den Router per Lan oder Wlan mit dem Internet verbunden ist. Eine kleine bildnerische Hilfe stell ich dir hier zur Verfügung: [Verbindungsaufbau im HomeOffice](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/be416689-0064-4954-b661-5842285b80b9)"
    - text: "Please make sure that your device is turned on and connected with a router to the internet via LAN or WLAN in home office. I am providing a small pictorial help here: [Setting up connection in the HomeOffice](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/be416689-0064-4954-b661-5842285b80b9)"
  utter_externer_kartenleser_kreuztest:
    - text: "At this point I would suggest checking the cabling. Test another card (from a colleague) on your card reader. You can check the MyCard login in MyPortal, for example."
