  utter_72_Stunden_Synchzeit_nicht_vorbei:
    - text: "Warte bitte die Synchronisationszeit ab! Wenn die E-Mail nach 72 Stunden immer noch nicht ankommt, chatte erneut. "
    - text: "Please wait for the synchronization time! If the e-mail still hasn't arrived after 72 hours, chat again. "
  utter_APS_HW_devclient_sw_ibn_devint_besitzernichtok:
    - text: "Die Inbetriebnahme ist ein personenbezogener Vorgang und ist nur dem tatsächlichen MyIT-Inhaber des Laptops erlaubt durchzuführen. Falls auf den betroffenen DevClient bei der Erstinstallation ein anderes Profil als das vom Besitzer aufgespielt wird, dann läuft die Inbetriebnahme nie vollständig durch. In diesem Fall soll man das falsch aufgespielte Userprofil einmal zurücksetzen und komplett löschen und dann die Ersteinrichtung erneut aber mit den richtigen Besitzerangaben über DSL (nie über Firmenlan) versuchen. Hilfe zum Durchführen der Inbetriebnahme findest du [hier](https://tiny.telekom.de/0sz0nwu1)."
    - text: "Initial setup is a user-based process and is only permitted to be carried out by the actual MyIT owner of the laptop. If a different profile than that of the owner is installed on the affected DevClient during the first installation, the initial setup will never be completed. In this case, you should reset the incorrectly installed user profile and delete it completely and then try the initial setup again but with the correct user details ofthe owner via DSL (never via the company LAN). You can find help with initial setup [here](https://tiny.telekom.de/0sz0nwu1)."
  utter_APS_HW_devclient_sw_ibn_devint_besitzerok:
    - text: "Ein DevClient mit Internet-Profil muss über DSL-Verbindung (Kabel- oder WLAN-Router) in Betrieb genommen werden. Falls du den Vorgang doch im Büro versuchst, dann laufen sämtliche Profileinstellungen leider auf Fehler.  So empfiehlt es sich bei Problemen mit der Inbetriebnahme dein Userprofil auf dem Gerät zurückzusetzen und den Inbetreibnahme-Vorgang über DSL neu anzustoßen. Hilfe zum Durchführen der Inbetriebnahme findest du [hier](https://tiny.telekom.de/0sz0nwu1)."
    - text: "DevClient with an Internet profile must be initially set up via a DSL connection (cable or WLAN router). If you try the process in the office via company LAN, all profile settings will unfortunately fail. If you have problems installing the profile, we recommend resetting your user profile on the device and restarting the initial setup process via DSL. You can find help with initial setup [here](https://tiny.telekom.de/0sz0nwu1)."
  utter_APS_HW_devclient_sw_ibn_devrd_besitzernichtok:
    - text: "Die Inbetriebnahme eines DevClients ist ein personenbezogener Vorgang und ist nur dem tatsächlichen myIT-Inhaber des Laptops gestattet. Falls auf den betroffenen DevClient bei der Erstinstallation ein anderes Profil als das vom Besitzer aufgespielt wird, dann läuft die Inbetriebnahme nie durch. In diesem Fall soll man das falsch aufgespielte Userprofil einmal zurücksetzen und komplett löschen und dann die Ersteinrichtung erneut aber mit den richtigen Besitzerangaben über RD-Netzwerk (nie im HomeOffice) versuchen. Hilfe zum Durchführen der Inbetriebnahme findest du [hier](https://tiny.telekom.de/0sz0nwu1)."
    - text: "Initial setup of DevClients is a user based process and is only permitted to the actual MyIT owner of the laptop. If a different profile than that of the owner is to be installed on the affected DevClient during the initial installation, the initial setup will never be completed. In this case, you should reset the incorrectly installed user profile and delete it completely and then try the initial setup again but with the correct user details of the owner via the RD network (never in the home office via DSL). You can find help with initial setup [here](https://tiny.telekom.de/0sz0nwu1)."
  utter_APS_HW_devclient_sw_ibn_devrd_besitzerok:
    - text: "Ein DevClient mit RD-Profil muss an einem der Telekom-Standorte in Betrieb genommen werden, die auch mit RD-Netzwerk ausgestattet sind. Welcher solch ein Standort ist, findest du [in dieser Liste](https://tiny.telekom.de/yh8ul2th). Wichtig ist es noch dabei, dass die Verbindung direkt über das LAN-Kabel aufgebaut werden muss. Falls du den Vorgang weder über RD-Netzwerk noch über ein LAN-Kabel (sondern z.B. über WLAN) versuchst, dann laufen sämtliche Profileinstellungen leider auf Fehler. So empfiehlt es sich bei Problemen mit der Inbetriebnahme dein Userprofil auf dem Gerät zurückzusetzen und den Inbetreibnahme-Vorgang an einem RD-Standort über das LAN Kabel neu anzustoßen. Hilfe zum Durchführen der Inbetriebnahme findest du [hier](https://tiny.telekom.de/0sz0nwu1)."
    - text: "DevClient with an RD profile must be initially set up at one of the Telekom locations that are also equipped with an RD network. Locations with RD network can be found [in this list](https://tiny.telekom.de/yh8ul2th). It is also important that the connection must be established directly via the LAN cable. If you do not attempt the process via the RD network or a LAN cable (but rather via WLAN, for example), then unfortunately all profile settings will fail. If you have problems with the initial setup, it is recommended that you reset your user profile on the device and restart the initial setup process at an RD location via the LAN cable again. You can find help with initial setup [here](https://tiny.telekom.de/0sz0nwu1)."
  utter_APS_HW_devclient_sw_inbetriebnahme_generell:
    - text: "Wenn ich das richtig verstanden habe, brauchst du etwas Unterstützung bei der Inbetriebnahme eines DevClients. Generell muss es erstmal betrachtet werden, welcher Profiltyp auf dem DevClient aufgespielt werden soll."
    - text: "If I understand correctly, you need some support when setting up a DevClient. In general, you first need to consider which profile type should be installed on the DevClient."
  utter_APS_NW_lan_dtag_kreuztest01_kabeldefekt_desksharing:
    - text: "The broken LAN cable at a desk sharing workstation should be reported to the on-site service. To exchange the cable, please provide the following information:"
    - text: "Das defekte LAN-Kabel an einem Desk Sharing Arbeitsplatz soll an den Vor-Ort-Service weiter gemeldet werden. Zum Tausch gib bitte die folgenden Angaben an:"
  utter_APS_NW_lan_dtag_kreuztest01_kabeldefekt_regulaer:
    - text: "Geht es um einen regulären Arbeitsplatz, ist das LAN Kabel im [MyStore](myportal.telekom.de) zu bestellen. MyStore ist folgendermaßen zu erreichen: myportal.telekom.de → Menüpunkt \"Meine Einkäufe\" → Kategorie \"IT Service, Hardware und Software\". Häufig gestellte Fragen zu MyStore sind unter folgendem [Link](https://tiny.telekom.de/h2knmwi0) zu finden."
    - text: "If it is a regular workstation, the LAN cable must be ordered from [MyStore](myportal.telekom.de). MyStore can be reached as follows: myportal.telekom.de → menu item \"My purchases\" → category \"IT service, hardware and software\". Frequently asked questions about MyStore can be found at the following [link](https://tiny.telekom.de/h2knmwi0)."
  utter_APS_NW_tunnelfreischaltung_rechnerauswahl:
    - text: "Die Tunnelfreischaltung muss für den **neuen Rechner** aktiviert werden. \nBitte beachte, dass der neue Rechner mit einer **neuen Service ID** (SID) ausgeliefert wird.\nIn der Regel befindet sich ein Aufkleber auf der Unterseite des neuen Gerätes auf dem du die SID finden kannst."
    - text: "The tunnel activation must be activated for the **new computer**. \nPlease note that the new computer will be delivered with a **new Service ID** (SID).\nThere is usually a sticker on the bottom of the new device where you can find the SID."
  utter_BESTELLUNG_portalauswahl_caiman_beratung:
    - text: "[CAIMAN](https://myportal-websso.corp.telekom.de/caiman/) is a central IAM system of DTAG and will be the successor system to CIAM. Both systems - CIAM and CAIMAN - will be operated in parallel for a while! Only at a later point in time, after all migration steps have been completed, will CAIMAN take over the function of the central IAM system alone. The role shop will gradually be moved from CIAM to the Caiman role shop. Roles for this system will then only be able to be ordered via Caiman. If you have any questions about operation, please visit the following [YAMU page](https://tiny.telekom.de/6awgvd72)."
    - text: "[CAIMAN](https://myportal-websso.corp.telekom.de/caiman/) ist ein zentrales IAM System der DTAG und wird das Nachfolgesystem von CIAM. Beide Systeme - CIAM und CAIMAN - werden eine Zeit lang parallel betrieben! Erst zu einem späteren Zeitpunkt nach Abschluss aller Migrationsschritte übernimmt CAIMAN alleine die Funktion des zentralen IAM Systems. Aus CIAM wird die Rollenshop nach und nach ins Caiman Rollenshop verlagert. Rollen für diese System sollen dann nur über Caiman bestellbar sein. Bei Fragen zur Bedienung suche bitte die folgende [YAMU Seite](https://tiny.telekom.de/6awgvd72) auf."
  utter_BESTELLUNG_portalauswahl_myit_stoerungsart_speziell_auftrag_haengt:
    - text: "Wenn du vor längerem einen Auftrag aufgegeben hast, sich dessen Status allerdings nicht ändert und du das Gefühl hast, dass der Auftrag irgendwo hängt, dann kontaktiere in diesem Fall immer zuerst deinen Kostenstellenverantwortlichen (KostV), bevor du eine Störung meldest. Deinen Kostv ermittelst du ganz einfach [hier](https://myit.telekom.de/reporting/report/myReports/myCostcenter).\nSollte sich nach der Prüfung des KostVs heraustellen, dass es sich um eine Störung im Auftrag handelt, dann gib bitte ein Störungsticket im [Incident Portal](https://tiny.telekom.de/4t8vuilz)auf. "
    - text: "If you placed an order some time ago, but its status has not changed and you have the feeling that the order is stuck somewhere, then in this case always contact your cost centre manager (KostV) first before reporting a fault. You can easily determine your cost centre manager [here](https://myit.telekom.de/reporting/report/myReports/myCostcenter).\nIf, after checking the cost centre manager, it turns out to be a fault in the order, please submit a fault ticket in the [incident portal](https://tiny.telekom.de/4t8vuilz). "
  utter_Bestellung_portalauswahl_usm_beratung:
    - text: "Die Anwendung Usermanagement macht Applikationszugänge bestellbar. Nach einem Regelprozess können T-Systems-Mitarbeiter securitykonform Zugänge für bestimmte Applikationen bestellen, ändern oder kündigen. \nHilfe bekommst du auf der [USM Seite](https://usm.t-systems.com/) nach der Anmeldung unter \"Hilfe und Support\". Schriftlich kannst du Anfragen an das FMB USM SUPPORT stellen."
    - text: "The Usermanagement application makes it possible to order application access. T-Systems employees can order, change or cancel access to certain applications in accordance with security regulations. \nYou can get help on the [USM page](https://usm.t-systems.com/) after logging in under ‘Help and support’. You can send written enquiries to the FMB USM SUPPORT."
  utter_M365_allgemein_H2A:
    - text: "To resolve general issues that have occurred with M365 and have not yet been offered as a solution, or if the proposed solution steps have not helped, the support of an agent is necessary. Unfortunately, human assistance is essential for the complete reinstallation of Microsoft products such as Outlook, Excel, Access, etc. as well."
    - text: "Zur Beseitigung von allgemeinen Störungen, die in Bezug auf M365 aufgetreten sind und bislang nicht als Lösungsvorschlag angeboten wurden oder wenn die angebotenen Lösungsschritte nicht geholfen haben, ist die Unterstützung von einem Agenten notwendig. Leider ist auch für die komplette Neuinstallation von Microsoft Produkten wie Outlook, Excel, Access, etc. die menschliche Mithilfe unerlässlich."
  utter_M365_produktbeschreibung:
    - text: "[Microsoft Office 365](https://tiny.telekom.de/xax32fix) ist die Verbindung aktueller Office-Komponenten mit moderner Cloudtechnologie. Jeder Mitarbeiter mit einem IT-Standardarbeitsplatz in Deutschland kann zukünftig mit der aktuellen Office-Version arbeiten und hat damit standardmäßig Zugriff auf Word, Excel, PowerPoint, Outlook, OneNote, Access und Publisher. Mit Office Online ist zudem das Arbeiten an Word-, Excel-, PowerPoint- und OneNote-Dokumenten über den Browser über den Link [\"portal.office.com\"](https://portal.office.com) möglich.\n\nMithilfe der Cloud-Technologie sind alle Office-Komponenten miteinander verbunden. Hierdurch kann jeder Mitarbeiter flexibel entscheiden, mit welchem Endgerät er auf Office-Dokumente zugreifen möchte. Auf OneDrive abgelegte Daten können praktisch [von jedem gemanagten Endgerät](https://tiny.telekom.de/1b7gaj8x), also Desktop-PC/Laptop, Tablet oder Smartphone, erstellt, bearbeitet und gespeichert werden."
    - text: "[Microsoft Office 365](https://tiny.telekom.de/xax32fix) is the combination of current Office components with modern cloud technology. In the future, every employee with a standard IT workstation in Germany will be able to work with the current version of Office and will therefore have standard access to Word, Excel, PowerPoint, Outlook, OneNote, Access and Publisher. With Office Online, it is also possible to work on Word, Excel, PowerPoint and OneNote documents via the browser using the link [\"portal.office.com\"](https://portal.office.com).\n\nWith the help of cloud technology, all Office components are connected to one another. This gives every employee the flexibility to decide which device they want to use to access Office documents. Data stored on OneDrive can be created, edited and saved from practically any managed device](https://tiny.telekom.de/1b7gaj8x), i.e. desktop PC/laptop, tablet or smartphone."
  utter_M365_voraussetzungen:
    - text: "Um M365 Produkte benutzen zu können, sind (leider) ein paar Voraussetzungen zu erfüllen. Vor allem braucht man einen  aktiven EMEA-Account mit vorhandenem M365-Lizenz und auch die Nutzung von der [Microsoft Authenticator App](https://tiny.telekom.de/um7sugly) ist unerlässlich. Falls die genannten Faktoren nicht vorhanden sind, kann es zu komplexeren Fehlerbildern führen."
    - text: "In order to use M365 products, a few requirements must (unfortunately) be met. First and foremost, you need an active EMEA account with an existing M365 license and the use of the [Microsoft Authenticator App](https://tiny.telekom.de/um7sugly) is also essential. If the above factors are not present, it can lead to more complex issues."
  utter_OL_verschluesselung_eegw_produktbeschreibung:
    - text: "With the help of the new E-Mail Encryption Gateway (EEGW), secure e-mail communication with external recipients is now very easy. The secure sending of confidential, signed and encrypted e-mails to recipients in foreign Telekom companies and German companies that have not yet participated in the Office Standardization program is now also guaranteed.\n\nRegarding the requirements for the problem-free functionality of EEGW, please note the points [in this linked user manual](https://tiny.telekom.de/yxe5thmi)."
    - text: "Mit Hilfe des neuen E-Mail Encryption Gateway (EEGW) wird die sichere E-Mail Kommunikation mit externen Empfängern jetzt ganz einfach. Auch das sichere Versenden von vertraulichen, signierten und verschlüsselten E-Mails an Empfänger in ausländischen Telekom Gesellschaften und deutschen Gesellschaften, die bisher nicht am Programm Office Standardisierung teilnehmen, ist nun gewährleistet.\n\nIn Bezug auf die Voraussetzungen der problemlosen Funktionalität von EEGW beachte bitte die Punkte [dieses verlinkten Benutzerhandbuchs](https://tiny.telekom.de/yxe5thmi)."
  utter_akku_kurze_laufzeit:
    - text: "In diesem Fall solltest du dir noch die Energieeinstellungen anschauen.\nWie das geht, findest du bei dieser Anleitung [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/fa2213b8-a1fb-4a65-910f-3cbd3b8f4af5#jive_content_id_Energiesparplne)."
    - text: "In this case, you should also look at the power settings.\nYou can find out how to do this in this guide [YAM-Link](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/fa2213b8-a1fb-4a65-910f -3cbd3b8f4af5#jive_content_id_Energiesparplne)."
  utter_akku_wird_nicht_geladen:
    - text: "In diesem Fall sollten wir prüfen, ob dein Akku über ein anderes Ladekabel ebenso nicht geladen wird.\nFühre also bitte einen Kreuztest durch und gib mir Bescheid über dein Ergebnis."
    - text: "In this case, we should check whether your battery is also not being charged using a different charging cable. So please do a cross test and let me know your result."
  utter_allgemein_info_bluetooth_gerät:
    - text: "**Wichtig:** Head-Set/Tastatur/Maus sollen immer per Dongle oder Kabel direkt über die entsprechenden Anschlüsse an das Notebook angeschlossen sein. Die Nutzung von Bluetooth Geräten läuft aufgrund von zentralen Maßnahmen nur eingeschränkt."
    - text: "**Important:** Headset/keyboard/mouse should always be connected to the notebook directly via the corresponding ports using a dongle or cable. The use of Bluetooth devices is limited due to central measures."
  utter_american_style:
    - text: "Die Italiener brachten sie bei ihrer Einwanderung mit über den Atlantik, wo sie ein „amerikanisches Upgrade“ bekam. Die erste amerikanische Pizza entstand im Lombardi´s in New York. Eine traditionsreiche, heute noch existierende Pizzeria mit dem wohl berühmtesten Pizzaiolo der Welt. Was Teig und Belag angeht, unterscheidet sie sich sehr von der italienischen Pizza:\n\nAmerican Style Pizza hat charakteristisch einen dicken, luftigen Teig und einen knusprigen Rand. Anders als der dünne Teig einer italienischen Pizza erinnert der amerikanische Pizzateig schon fast an Focaccia.\nBeim Belag gilt bei der American Style Pizza das Motto „Alles kann, nichts muss“. Das beginnt schon bei der Tomatensauce, die mit Gewürzen und Kräutern zum Aroma-Star der Pizza wird.\nAuf dem Grill wird die American Style Pizza bei 300 °C in nur 5 Minuten gebacken. Unser Tipp vom Grillmeister: Ein Pizzastein ist ein wahrer Meister im Speichern von Hitze und sorgt dafür, dass die Pizza in kürzester Zeit perfekt durchgebacken wird."
    - text: "The Italians brought it with them when they immigrated across the Atlantic, where it received an \"American upgrade\". The first American pizza was created at Lombardi's in New York. A traditional pizzeria that still exists today, with arguably the most famous pizzaiolo in the world. In terms of dough and toppings, it differs greatly from Italian pizza:\n\nAmerican Style Pizza characteristically has a thick, airy dough and a crispy edge. Unlike the thin dough of an Italian pizza, the American pizza dough is almost reminiscent of focaccia.\nFor the toppings, the motto for American Style Pizza is \"anything goes, nothing is mandatory\". This starts with the tomato sauce, which becomes the aroma star of the pizza with spices and herbs.\nThe American Style Pizza is baked on the grill at 300 °C in just 5 minutes. Our tip from the grill master: A pizza stone is a true master at storing heat and ensures that the pizza is perfectly baked in the shortest possible time."
  utter_anmeldung_nimbusportal_administration:
    - text: "Bei weiteren Zugangsproblemen wende dich bitte per E-Mail an die [Nimbus-Administration](mailto:Nimbus.Administration@telekom.de)."
    - text: "If you have further access problems, please contact the [Nimbus Administration](mailto:Nimbus.Administration@telekom.de) by email."
  utter_anmeldung_nimbusportal_fm_echtheitsbestaetigung:
    - text: "Diese Fehlermeldung erscheint, wenn man versucht sich in [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) anzumelden, dafür aber keine Berechtigung (mehr) hat. Wenn man sich anschließend in [https://nimbus.telekom.de](https://nimbus.telekom.de) anmelden möchte, gelingt das nur in einer Inkognito Browser-Session oder einem anderen Browser oder 24 Stunden später."
    - text: "This error message appears when you try to log in to [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) but you no longer have permission to do so. If you then try to log in to [https://nimbus.telekom.de](https://nimbus.telekom.de), you will only be able to do so in an incognito browser session or another browser, or 24 hours later."
  utter_anmeldung_nimbusportal_fm_keinzugriff:
    - text: "Versuche bitte in diesem Fall die Workarounds durchzuführen:\n- Workaround 1: Noch einmal in [https://nimbus.telekom.de](https://nimbus.telekom.de) anmelden und über den Abmelden-Link wieder beenden. Anschließend [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) aufrufen.\n- Workaround 2: Eine Inkognito-Browser-Session starten und [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) aufrufen. (Dabei muss das Windows-Passwort eingegeben werden oder die MyCard-Pin.)\n- Workaround 3: [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) in einem anderen Browser öffnen. (Empfehlung:  für nimbus.telekom.de immer den Edge benutzen und für Nimbus2002 immer Chrome.)"
    - text: "In this case, please try the workarounds:\n- Workaround 1: Log in to [https://nimbus.telekom.de](https://nimbus.telekom.de) again and exit using the logout link. Then open [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de).\n- Workaround 2: Start an incognito browser session and open [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de). (You must enter your Windows password or your MyCard PIN.)\n- Workaround 3: Open [https://nimbus2002.telekom.de](https://nimbus2002.telekom.de) in a different browser. (Recommendation: always use Edge for nimbus.telekom.de and always use Chrome for Nimbus2002.)"
  utter_anmeldung_nimbusportal_onlinehilfe:
