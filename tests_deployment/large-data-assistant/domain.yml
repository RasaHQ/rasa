  utter_audiogeraet_deaktiviert:
    - text: "Um dein Headset/Gerät wieder zu aktivieren, führe die folgenden Schritte durch:\n1. Öffne Systemsteuerung → Sound → Wiedergabe und Rechtsklick auf die leere Stelle → Deaktivierte Geräte anzeigen\n2. Entsprechendes Gerät auswählen → Rechtsklick → Aktivieren → OK"
    - text: "So that your headset/device is activated again, proceed with these steps:\n1. Open Control Panel → Sound → Playback and right-click on the empty space → Show disabled devices\n2. Select the corresponding device → right-click → Enable → OK"
  utter_audioprobleme_beim_eingebaute_lautsprecher_mikrofon:
    - text: "Beim Onboard (eingebauten) Lautsprecher/Mikrofon vom Laptop sind die Töne manchmal verzerrt bzw. schlecht zu hören. Um dies zu verbessern, führe die folgenden Schritte durch:\n\n1. Gebe ins Windows Suchfeld \"Systemsounds ändern\" ein und drücke Enter\n2. Öffne im Reiter \"Wiedergabe\" alle aktiven Lautsprecher einzeln mit Doppelklick und entferne im Reiter \"Erweitert\" bei der Option \"Signalverbesserungen aktivieren\" den Haken, falls es vorhanden ist und gehe auf \"OK\"\n3. Führe die selben Schritte auch im Reiter \"Aufnahme\" durch\n4.  Starte das Notebook neu"
    - text: "With the onboard (built-in) speaker/microphone of the laptop, the sounds are sometimes distorted or difficult to hear, to solve this, carry out the following steps:\n\n1. enter \"Change system sounds\" in the Windows search field and press Enter\n2. open all active speakers individually in the \"Playback\" tab by double-clicking on them and uncheck the \"Enable audio enhancements\" option in the \"Advanced\" tab if it is available and click \"OK\"\n3. carry out the same steps in the \"Recording\" tab\n4. restart the notebook"
