  utter_m365_sharepoint_fehlerbild_anderes:
    - text: "SharePoint Online sind fest in die Office 365-Welt integriert. Der Zugriff auf den Service erfolgt über Outlook (auch in der Online-Version). Ein Zugriff über OneDrive ist ebenso möglich.\n\nDamit nicht spezifische Störungsbilder behoben werden können, empfiehlt es sich, die allgemeinen Funktionseinstellungen von SharePoint einmal zu überprüfen - gehe dazu wie folgt vor:\n1. Beende die Synchronisierung für alle Modern Groups über OneDrive:\n- Rechtsklick auf Wolke (unten rechts auf der Taskleiste) → Einstellungen (rechts oben über das Zahnradsymbol) → Konto\n- nimm \"Synchronisierung beenden\" für alle Speicherorte\n2. Falls das nicht möglich ist, entferne bitte die Modern Groups manuell vom Client:\n- OneDrive über die Taskleiste beenden\n- Windows-Explorer öffnen\n- links im Schnellzugriff auf \"Deutsche Telekom AG\" klicken\n- alle Verknüpfungen dort markieren und RK/Löschen\n3. Beim nächsten OneDrive-Start sollten Meldungen kommen, dass die nicht mehr vorhanden sind, bitte \"Verknüpfung aufheben\" klicken.\n4. Anschließend sollte der Sync wieder starten (von den Dateien die der User im eigenen OneDrive hat).\n5. Modern Groups können anschließend wieder Online über \"Synchronisieren\" hinzugefügt werden."
    - text: "SharePoint Online is firmly integrated into the Office 365 world. The service is accessed via Outlook (also in the online version). Access via OneDrive is also possible.\n\nTo avoid specific problems, it is recommended to check the general SharePoint function settings - to do this, proceed as follows:\n1. Stop synchronization for all Modern Groups via OneDrive:\n- right-click on Cloud (bottom right on the taskbar) → Settings (top right via the gear symbol) → Account\n- select \"Stop synchronization\" for all storage locations\n2. If this is not possible, please remove the Modern Groups manually from the client:\n- stop OneDrive via the taskbar\n- open Windows Explorer\n- click on \"Deutsche Telekom AG\" in the quick access on the left\n- mark all links there and RK/Delete\n3. The next time you start OneDrive, you should see messages saying that they are no longer there, please click \"Remove link\".\n4. The sync should then start again (from the files that the user has in their own OneDrive).\n5. Modern Groups can then be added online again via \"Synchronize\"."
  utter_m365_sharepoint_fehlerbild_gruppenmitglieder:
    - text: "Ein Konzern-Mitarbeiter der DTAG kann zu eine SharePoint Gruppe aus den Grunde nicht hinzugefügt werden, weil der Mitarbeiter keine M365-Lizenz besitzt. Um die Lizenz- bzw. Berechtigungsvergabe zu überprüfen, schaue dir die folgende [YAMU-Seite](https://tiny.telekom.de/ahp4cq3g) an.\n\n"
    - text: "A DTAG employee cannot be added to a SharePoint group because the employee does not have an M365 license. To check the license or authorization assignment, take a look at the following [YAMU page](https://tiny.telekom.de/ahp4cq3g)."
  utter_m365_sharepoint_fehlerbild_synchfehler_anstehend:
    - text: "If the sync is either pending or already completed, then you have nothing more to do - just wait until the sync process is completely processed."
    - text: "Falls die Synchronisierung entweder anstehend oder bereits durch ist, dann hast du nichts weiteres zu tun - warte einfach ab, bis der Synchronisierunsprozess komplett abgefertigt wird."
  utter_m365_sharepoint_fehlerbild_synchfehler_onlinefehlt:
    - text: "Wenn lokal fehlende Dateien/Ordner/Inhaltselemente über portal.office.com ebenso nicht zu finden sind, dann ist es fast sicher, dass die betroffenen Dateien/Ordner/Inhaltselemente gelöscht/entfernt wurden oder deren Speicherort geändert wurde. Frage bei Kollegen nach, ob sie dieselbe Ansicht haben und gib dem SharePoint-Besitzer über den angeblichen Verlust Bescheid.\n\nACHTUNG: Zufällig gelöschte Elemente sind über portal.office.com auch im Online-Papierkorb zu finden., den man wie folgt erreicht:\n1. Öffne die betroffene SharePoint Seite online.\n2. Gehe links auf den Menüpunkt \"Papierkorb\".\n3. Schaue dir an, ob du da etwas findest.\n4. Setze die betroffenen Elemente zurück.\n\nNach dem Löschen hast du 30 Tage, um die wiederherzustellen."
    - text: "If locally missing files/folders/content items cannot be found via portal.office.com either, then it is almost certain that the affected files/folders/content items have been deleted/removed or their storage location has been changed. Ask colleagues whether they have the same view and inform the SharePoint owner of the alleged loss.\n\nNOTE: Accidentally deleted items can also be found in the online recycle bin via portal.office.com, which can be accessed as follows:\n1. Open the affected SharePoint page online.\n2. Go to the \"Recycle Bin\" menu item on the left.\n3. See if you can find anything there.\n4. Reset the affected items.\n\nAfter deletion, you have 30 days to restore."
  utter_m365_sharepoint_fehlerbild_synchfehler_onlineok:
    - text: "Ein Zugriff auf SharePoint ist über OneDrive ebenso möglich. Damit dein Störungsbild behoben werden kann, empfiehlt es sich, die allgemeinen Funktionseinstellungen von SharePoint einmal zu überprüfen - gehe dazu wie folgt vor: 1. Beende die Synchronisierung für alle Modern Groups über OneDrive: - Rechtsklick auf Wolke (unten rechts auf der Taskleiste) → Einstellungen (rechts oben über das Zahnradsymbol) → Konto - nimm \"Synchronisierung beenden\" für alle Speicherorte 2. Falls das nicht möglich ist, entferne bitte die Modern Groups manuell vom Client: - OneDrive über die Taskleiste beenden - Windows-Explorer öffnen - links im Schnellzugriff auf \"Deutsche Telekom AG\" klicken - alle Verknüpfungen dort markieren und RK/Löschen 3. Beim nächsten OneDrive-Start sollten Meldungen kommen, dass die nicht mehr vorhanden sind, bitte \"Verknüpfung aufheben\" klicken. 4. Anschließend sollte der Sync wieder starten (von den Dateien die der User im eigenen OneDrive hat). 5. Modern Groups können anschließend wieder Online über \"Synchronisieren\" hinzugefügt werden."
    - text: "Access to SharePoint is via OneDrive also possible. To avoid your problem, it is recommended to check the general SharePoint function settings - to do this, proceed as follows: 1. Stop synchronization for all Modern Groups via OneDrive: - right-click on Cloud (bottom right on the taskbar) → Settings (top right via the gear symbol) → Account - select \"Stop synchronization\" for all storage locations 2. If this is not possible, please remove the Modern Groups manually from the client: - stop OneDrive via the taskbar - open Windows Explorer - click on \"Deutsche Telekom AG\" in the quick access on the left - mark all links there and RK/Delete 3. The next time you start OneDrive, you should see messages saying that they are no longer there, please click \"Remove link\". 4. The sync should then start again (from the files that the user has in their own OneDrive). 5. Modern Groups can then be added online again via \"Synchronize\"."
  utter_m365_sharepoint_fehlerbild_synchronfehler:
    - text: "Ratsam ist es, die Daten bei stabiler Netzwerkverbindung zu verwalten - sei es kopieren in einen oder anlegen in einem neuen Ordner. Falls es ständig Probleme mit dem Abspeichern bzw. Synchronisieren von Daten auf einem Gruppenspeicher auftreten sollten, empfiehlt es sich, auf die Netzwerkverbindung zu schauen und deren Stabilität für später zu sichern.\n\nAußerdem ist es wichtig, dass der Synchronisierungsprozess trotz stabiler Netzwerkverbindung einige Minuten dauern kann - wie der Status aussieht, wird durch Symbole gekennzeichnet:\n- blaues Kreis-Symbol neben der Datei in der Spalte \"Status\"→ Synch läuft\n- grünes Häkchen-Symbol neben der Datei in der Spalte \"Status\"→ Synch durch\n- blaues Wolke-Symbol neben der Datei in der Spalte \"Status\" → Abspeichern auf OneDrive fertig\n- rotes X-Symbol entweder direkt auf dem OneDrive-Symbol oder neben der Datei-Symbol → Synch fehlerhaft"
    - text: "It is recommended to manage the data with a stable network connection - be it copying it into a new folder or creating it in one. If you are constantly having problems saving or synchronizing data on a group storage, it is advisable to check the network connection and ensure its stability for later.\n\nIt is also important to note that the synchronization process can take a few minutes despite a stable network connection - the status is indicated by symbols:\n- blue circle symbol next to the file in the \"Status\" column → sync in progress\n- green check mark symbol next to the file in the \"Status\" column → sync completed\n- blue cloud symbol next to the file in the \"Status\" column → saving to OneDrive completed\n- red X symbol either directly on the OneDrive icon or next to the file icon → sync error"
  utter_m365_sharepoint_produktbeschreibung:
    - text: "[SharePoint](https://tiny.telekom.de/6svw9mvw) erleichtert Projektgruppen und Abteilungen die Zusammenarbeit im Team und ermöglicht einen gemeinsamen \"Arbeitsort\" mit einer Teamwebsite. Es gibt derzeit verschiedene SharePoint-Typen innerhalb der Telekom, die teilweise Unterschiede im Nutzerkreis oder Funktionsumfang aufweisen. Beide sind bis zur Schutzklasse \"Vertraulich\" freigegeben, frei verfügbar und sofort nutzbar:\n- SharePoint Online über Microsoft 365 Modern Groups - für konzernweite Teamzusammenarbeit in Deutschland und teilweise in T-Systems Local Business Units.\n- International SharePoint - für konzernweite Zusammenarbeit international und mit externen Partnern.\n\n**ACHTUNG:** Von CSD wird nur SharePoint Online supportet. Im Falle von einem anderen SharePoint wende dich an den SharePoint-Administrator oder an den Ansprechpartner auf der SharePoint-Seite."
    - text: "[SharePoint]https://tiny.telekom.de/6svw9mvw) makes it easier for project groups and departments to work together as a team and enables a shared \"workplace\" with a team website. There are currently various SharePoint types within Telekom, some of which have differences in the user group or range of functions. Both are released up to the \"Confidential\" protection class, freely available and immediately usable:\n- SharePoint Online via Microsoft 365 Modern Groups - for group-wide team collaboration in Germany and partly in T-Systems Local Business Units.\n- International SharePoint - for group-wide collaboration internationally and with external partners.\n\n**ATTENTION:** CSD only supports SharePoint Online. In case of another SharePoint, contact the SharePoint administrator or the contact person on the SharePoint page."
  utter_mycard_wa_button_mycard_email:
    - text: "Wenn die MyCard Anmeldung wegen der fehlenden/ungültigen Zertifikate nicht mehr möglich ist (Konto deaktiviert) oder die MyCard defekt/verloren ist, brauchst du zur Reaktivierung immer eine MyCard E-Mail. Wichtig! Zurzeit kannst du diese MyCard E-Mail nur durch die Hilfe von einem CSD Agenten bekommen."
    - text: "If the MyCard registration is no longer possible due to missing/invalid certificates (account deactivated) or the MyCard is defective/lost, you always need a MyCard email for reactivation. Important! Currently, you can only get this MyCard email with the help of a CSD agent."
  utter_mycard_wa_email_nicht_rechtzeitig_abgearbeitet:
