  utter_clientvorgang_fehlgeschlagen:
    - text: "Wenn in den Postfächern separate einzelne Unterordner erstellt werden, so müssen diese separat durch den Manager oder Besitzer der Mailbox mit einem Rechtsklick auf den Unterordner freigegeben werden. Der Grund ist:\nBerechtigungen, welche im Outlook/Postfach auf einen Oberordner vergeben werden, welcher Unterordner beinhaltet, werden nicht vererbt. Im Outlook/Exchangepostfach werden Berechtigungen generell nicht vererbt."
    - text: "If separate subfolders are created in the mailboxes, these must be released separately by the manager or owner of the mailbox by right-clicking on the subfolder. The reason is:\nPermissions that are assigned in Outlook/mailbox to a parent folder that contains subfolders are not inherited. In the Outlook/Exchange mailbox, permissions are generally not inherited.\n\nYou can find more information and a description of the allocation process in this YAMU article (https://tiny.telekom.de/71wli5e8)."
  utter_cms-compliance_mail_start:
    - text: "Ich prüfe jetzt im Hintergrund, ob ein Compliance-Verstoß für eines deiner mobilen Endgeräte vorliegt.\nWarte bitte einen Moment. "
    - text: "I am now checking in the background to see if there is a compliance violation for one of your mobile devices. \nPlease wait a moment."
  utter_cms_ANDtunnel_deletecache:
    - text: "Lösche bitte den Cache und die Daten von VMware Tunnel. (Beachte bitte, dass diese Schritte bei Xiaomi und Fairphone Geräten nicht möglich sind.)\n1. Halte das Symbol von der Tunnel App etwas länger gedrückt \n2. Klicke bei dem Popup-Menü oben auf \"i\" (für App Info) \n3. Gehe auf Speicherplatz\n4. Führe unten die zwei Optionen \"Cache leeren\" und \"Daten löschen\" aus. \n5. Öffne erneut die Tunnel App und bestätige die VPN Verbindungsanfragen."
    - text: "Please delete the cache and the data from VMware Tunnel. (Please note that these steps are not possible for Xiaomi and Fairphone devices).\n1. press and hold the tunnel app icon a little longer \n2. click on \"i\" (for app Info) in the pop-up menu at the top \n3. go to storage space\n4. select the two options \"clear cache\" and \"clear data\" at the bottom \n5. open the tunnel app again and confirm the VPN connection requests"
  utter_cms_IOS_timezone:
    - text: "Überprüfe bitte unter Geräteeinstellungen → Allgemein → Datum & Uhrzeit, ob die Optionen \"24-Stunden\" und \"Automatisch einstellen\" aktiviert sind. Falls nicht, dann aktiviere bitte diese beiden Punkte."
    - text: "Please check under Device Settings → General → Date & Time, whether the options \"24-hour\" and \"Automatically set\" are activated. If not, please activate these two points."
  utter_cms_LMD_Passwoerter_AppleID:
    - text: "Zur Benutzung des Apple App Stores ist eine Apple ID nötig, diese kann nach der Einrichtung erstellt werden. Es wird empfohlen eine dienstliche Apple ID einzurichten, auch wenn bereits eine private Apple ID vorhanden ist. Weitere Informationen:\n[Apple Support](https://tiny.telekom.de/1g4c4cut)\n[Neue Apple-ID erstellen](https://tiny.telekom.de/87yrace5)\n[Eine Apple-ID verwalten und verwenden](https://tiny.telekom.de/cdvi4lxh)"
    - text: "To use the Apple App Store, an Apple ID is required, which can be created after setup. It is recommended to set up a business Apple ID, even if a private Apple ID already exists. For more information:\n[Apple Support](https://support.apple.com/)\n[How to create a new Apple ID](https://support.apple.com/en-us/108647)\n[Manage and use your Apple ID](https://support.apple.com/en-us/105023)"
  utter_cms_Passwoerter_Geraetepasscode:
    - text: "Der Gerätepasscode: \n- Komplexität: 6 Ziffern \n- Wechselintervall: 360 Tage \n- Die letzten drei Passcodes sind nicht erlaubt\n- Max. Falscheingaben: 8 → Danach wird das Gerät automatisch auf den Werkszustand zurückgesetzt.\n\nDer Gerätepasscode wird am Gerät für den Zugriff der Displaysperre verlangt und verwendet. Wenn der Gerätepasscode vergessen wurde oder abgelaufen ist, dann muss es mithilfe einem Agenten geändert werden."
    - text: "The device passcode:\n- Complexity: 6 digits\n- Change interval: 360 days\n- The last three passcodes are not allowed\n- Max. Incorrect entries: 8 → After that, the device will automatically be reset to factory settings.\n\nThe device passcode is required and used on the device to access the display lock. If the device passcode has been forgotten or has expired, it must be changed using an agent."
  utter_cms_Passwoerter_GoogleKonto:
    - text: "Wenn du mit deinem Google Passwort Schwierigkeiten hast, wende dich bitte an den [Google Support](https://support.google.com/android/?hl=de#topic=7313011).\n\nHier findest du einige Tipps um deine Störung beheben zu können: [Google Konto verwalten](https://support.google.com/googleplay/answer/2521798?hl=de) oder [Google FAQ](https://support.google.com/accounts#topic=3382296)\n\n"
    - text: "If you have difficulties with your Google password, please contact the [Google support](https://support.google.com/?hl=en).\n \nHere you can find some tips to fix your problem: [Manage your Google account](https://support.google.com/accounts/answer/3118621?hl=en) or [Google FAQ](https://support.google.com/accounts#topic=3382296)"
  utter_cms_Passwoerter_SIMPINPUK:
    - text: "Falls deine SIM PIN oder SIM PUK gesperrt ist, wende dich bitte an die Mobilfunkbetreuer*innen per E-Mail an [FMB DTSE Mobilfunk](mailto:DTSE_Mobilfunk@telekom.de) oder suche deinen direkten Ansprechpartner aus der Liste aus: [Deine Mobilfunkbetreuer](https://tiny.telekom.de/no0jgjh7)"
    - text: "If your SIM PIN or SIM PUK is locked, please contact the mobile phone support via email at [FMB DTSE Mobilfunk](mailto:DTSE_Mobilfunk@telekom.de) or find your direct contact from the list: [Your mobile phone supervisors](https://tiny.telekom.de/no0jgjh7)"
  utter_cms_account_unlocked_abfrage:
    - text: "Dein CMS Konto war auf dem Server deaktiviert, aber ich habe es gerade eben für dich reaktiviert. Versuche bitte die CMS Installation erneut."
    - text: "Your CMS account was deactivated on the server, but I have just reactivated it for you. Please try the CMS installation again."
  utter_cms_activesync_order:
    - text: "Zur Synchronisierung fehlt ein wichtiger Parameter (\"Active Sync\") in unserem System, dieser kann nur von einem Agenten bestellt werden."
    - text: "An important parameter (\"Active Sync\") for synchronisation is missing in our system, this can only be ordered by an agent."
  utter_cms_compliance_affected_device:
    - text: "Für folgendes Device habe ich mindestens einen Compliance Verstoß festgestellt: {slot_device_name} mit IMEI: {slot_device_imei}"
    - text: "I have identified at least one compliance violation for the following device: {slot_device_name} with IMEI: {slot_device_imei}"
  utter_cms_compliance_blacklisted_apps:
    - text: "Nach unserem System scheinst du auf dem Gerät blacklisted Applikation aufgespielt zu haben. Die Nutzung solcher Softwareprodukten ist nicht gestattet und müssen  daher vom Gerät entfernt werden. Zur Info werden die nicht erlaubten Applikationen unter diesem Link aufgelistet: [YAM-Link](https://tiny.telekom.de/r3n83vns)"
    - text: "According to our system, it appears you have installed a blacklisted application on your device. The use of such software products is not permitted and must therefore be removed from the device. For your information, the unauthorized applications are listed under this link: [YAM-Link](https://tiny.telekom.de/r3n83vns)"
  utter_cms_compliance_fingerprint:
    - text: "Im System wurde ein Konformitätsverstoß bzgl. Encryption/Verschlüsselung entdeckt. Überprüfe bitte zuerst, ob du einen Fingerabdruck auf dem Gerät bereits verwendest. Falls nicht, so richte es bitte ein."
    - text: "A conformity violation regarding Encryption/Encryption was detected in the system. Please first check if you are already using a fingerprint on the device. If not, please set it up."
  utter_cms_compliance_lastseen_35AT:
    - text: "Dein mobiles Endgerät scheint schon mehr als 35 Tage nicht aktiv gewesen zu sein.\nUm das mobile Endgerät erneut aktiv zu schalten, soll es ans Netz gebracht werden.\nSchalte bitte auf dem Gerät entweder die WLAN- oder die LTE-Verbindung ein, damit es eine Datenverbindung entstehen kann.\nFalls das mobile Endgerät im Weiteren nicht mehr gebraucht wird, dann soll der Corporate Mobile Service Dienst für das betroffene Gerät über myIT gekündigt werden.\nDen Kündigungsvorgang findest du unter diesem Link veranschaulicht: [YAM-Link](https://tiny.telekom.de/81lfg1n8)"
    - text: "Your mobile device appears to have been inactive for more than 35 days. \nTo reactivate the mobile device, it should be connected to the network. \n Please turn on either the WLAN or LTE connection on the device so that a data connection can be established. \nIf the mobile device is no longer needed, then the Corporate Mobile Service for the affected device should be cancelled via myIT. \nThe cancellation process is illustrated under this link: [YAM-Link](https://tiny.telekom.de/81lfg1n8)"
  utter_cms_compliance_nolongerexists:
    - text: "Das betroffene Device wurde auf Konformitätsverstoß überprüft und es liegt dabei keine Störung mehr vor. Du kannst das Gerät ohne Sorge weiter verwenden."
    - text: "The affected device has been checked for compliance violation and there is no longer any malfunction. You can continue to use the device without worry."
  utter_cms_compliance_update_version:
    - text: "Nach unserem System ist die Version des Betriebssystems auf dem Gerät veraltet. Schaue nach, ob es Systemupdates vorhanden sind, die ggf. noch nicht installiert wurden. Falls es welche gibt, zögere nicht, die aufzuspielen. Sie spielen ja eine hohe Relevanz beim Aktivierungsprozess und auch beim Verwenden von Applikationen bei."
    - text: "According to our system, the version of the operating system on the device is outdated. Check if there are system updates available that may not have been installed yet. If there are any, do not hesitate to apply them. They play a high relevance in the activation process and also when using applications."
  utter_cms_devclient_bestand_vorhanden:
    - text: "In diesem Fall beachte bitte, dass die Postfachsynchronisierung auf den mobilen Endgeräten ausschließlich mit der Boxer App funktioniert.  Eine Änderung der Mail App auf die Boxer App ist in MyIT möglich. \n[Schritt für Schritt Anleitung](https://tiny.telekom.de/wtw41fq3)"
    - text: "In this case, please note that mailbox synchronisation on mobile devices only works with the Boxer app.  It is possible to change the mail app to the Boxer app in MyIT. \n[Step by step instructions](https://tiny.telekom.de/wtw41fq3)"
  utter_cms_eas_profilreinstall:
    - text: "Das erforderliche Profil wurde für dein Gerät im System neu installiert. Überprüfe bitte die Synchronisation erneut, ob es nun funktioniert.\nHinweis: Möglicherweise ist eine Neuanmeldung unter Einstellungen → Mail → Accounts → Exchange (bei IOS 18: Einstellungen → Apps → Mail → Mail-Accounts → Exchange) erforderlich. Wenn hier die Meldung \"Passwort erneut eingeben\" erscheint, klicke darauf und melde dich mit deiner E-Mailadresse und deinem EMEA Passwort an."
    - text: "The required profile has been reinstalled in the system for your device. Please check the synchronisation again to see if it now works.\nNote: It may be necessary to log in again under settings → mail → accounts → exchange (for IOS 18: settings → apps → mail → mail accounts → exchange). If the message \"enter password again\" appears here, click on it and log in with your email address and your EMEA password."
  utter_cms_hardware_defekt:
    - text: "Die dienstlich genutzten mobilen Endgeräte (Android/IOS) können unter 2828 oder 0800-330 2828 als defekt gemeldet werden.\n\nLeitfaden für das Vorgehen und weitere Informationen zur Handy-Reparatur: [hier](https://yam-united.telekom.com/pages/supply-chain-management-scm/apps/wiki/5219451a-77d8-41d4-85bb-b1d44d040945/list/view/1e32c370-0798-46cc-88ad-3268919ee874?currentLanguage=NONE)."
    - text: "The officially used mobile devices (Android/IOS) can be reported as broken by calling 2828 or 0800-330 2828.\n\nGuide for the procedure and further information on mobile phone repair: [here](https://yam-united.telekom.com/pages/supply-chain-management-scm/apps/wiki/5219451a-77d8-41d4-85bb-b1d44d040945/list/view/1e32c370-0798-46cc-88ad-3268919ee874?currentLanguage=NONE)."
  utter_cms_ios_dep_spaeter_starten:
    - text: "Alles klar, kehre gern bei weiteren Schwierigkeiten zu mir zurück."
    - text: "All right, feel free to come back to me if you have any further difficulties."
  utter_cms_ios_nativ_exchange_account:
    - text: "Zur weiteren Analyse prüfe bitte unter Geräteeinstellungen→ Mail → Accounts (bei IOS 18: Einstellungen → Apps → Mail → Mail-Accounts → Exchange), ob zwei Exchange Konten angezeigt werden. \nFalls ja, lösche dasjenige von den beiden, bei dem die Option \"Account löschen\" vorhanden ist, damit du nur einen Exchange Account siehst. "
    - text: "For further analysis, please check under device settings→ mail → accounts (for IOS 18: settings → apps → mail → mail accounts → Exchange) whether two exchange accounts are displayed. \nIf so, delete the one with the \"delete account\" option so that you only see one exchange account. "
  utter_cms_nativ_sync_settings:
    - text: "Überprüfe bitte unter Einstellungen → Mail → Accounts → das Exchange Konto (bei IOS 18: Einstellungen → Apps → Mail → Mail-Accounts → Exchange), ob die Synchronisierung der E-Mail/Kalender/Kontakte aktiv ist. Eventuell kannst du sie deaktivieren und nach einem Geräteneustart reaktivieren. \nTipp: Hier kannst du auch die Option \"Mail synchronieren\" von \"Keine Begrenzung\" z.B. auf \"1 Monat\" ändern."
    - text: "Please check under Settings → Mail → Accounts → the Exchange account (for IOS 18: Settings → Apps → Mail → Mail accounts → Exchange) whether the synchronisation of emails/calendars/contacts is active. You may be able to deactivate it and reactivate it after a device restart. \nTip: Here you can also change the \"Synchronise mail\" option from \"No limit\" to \"1 month\", for example."
  utter_cms_owacheck:
    - text: "Als Letztes versuche bitte noch Folgendes auf deinem Rechner:\n1. Öffne [OWA](https://owa-intern.telekom.de) \n2. Gehe rechts oben auf  \"Einstellungen\" (Zahnradsymbol)\n3. Klicke auf der linken Seite auf \"Allgemein\", dann im Untermenü auf \"Mobile Geräte\"\n4. Lösche dort das mobile Endgerät\nHinweis: Nach diesem Schritt wird das ganze Postfach auf deinem mobilen Gerät neu synchronisiert und eine Neuanmeldung ist ggf. erforderlich."
    - text: "Finally, please try the following on your computer:\n1. open [OWA](https://owa-intern.telekom.de) \n2. go to \"settings\" at the top right\n3. click on \"general\" on the left-hand side, then on \"mobile devices\" in the submenu\n4. delete the mobile device there\nNote: After this step, the entire mailbox on your mobile device will be re-synchronised and you may need to log in again."
  utter_cms_replikation_abwarten:
    - text: "Ich habe im System prüfen können, du hast dein Gerät erst vor Kurzem eingerichtet. Beachte bitte daher die Wartezeit nach der Einrichtung deines CMS Gerätes: Je nach Postfachgröße und Datenverbindung kann die Mail-, Kalender- und Kontaktesynchronisierung von ca. 10 Minuten bis zu einer Stunde dauern."
    - text: "I have been able to check in the system that you have only recently set up your device. Please note the waiting time after setting up your CMS device: Depending on the mailbox size and data connection, mail, calendar and contact synchronisation can take from approx. 10 minutes to an hour."
  utter_cms_smime_abruf_native:
    - text: "Zur Postfachsynchronisierung bei der nativen App ist es erforderlich das SMIME Zertifikat auf dem Gerät abzurufen. Folge bitte den Anweisungen dieser Beschreibung: [SMIME Abruf](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/15ec3b23-a4d5-47fa-9e8b-de41d9bf350c)"
    - text: "For mailbox synchronisation in the native app it is necessary to retrieve the SMIME certificate on the device. Please follow the instructions in this description: [SMIME retrieval](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/15ec3b23-a4d5-47fa-9e8b-de41d9bf350c)"
  utter_cms_smime_abruf_wartezeit_nativ:
    - text: "Nach dem Abruf des SMIME Zertifikats erhältst du für die Anmeldung deines Exchange Postfachs ein Pop-Up Fenster. Nutze hier deine dienstliche E-Mailadresse und dein EMEA Passwort. "
    - text: "After retrieving the SMIME certificate, you will receive a pop-up window to log in to your Exchange mailbox. Use your work e-mail address and your EMEA password here. "
  utter_cms_synchronisation_nach_renew:
    - text: "Prüfe bitte erst nach der erfolgreichen MyCard Aktualisierung die Synchronisierung auf deinem mobilen Endgerät. Rufe danach ggf. die SMIME Zertifikate anhand dieses [YAMU-Link](https://tiny.telekom.de/56v0e7q6) für das iOS Gerät ab."
    - text: "Only after the successful MyCard update, please check the synchronization on your mobile device again. If necessary, retrieve the SMIME certificates using this [YAMU-Link](https://tiny.telekom.de/56v0e7q6) for the iOS device."
  utter_cms_synchronisation_requirement:
    - text: "Prüfe bitte, ob eine aktive Wlan oder LTE Verbindung vorhanden ist. Es ist unerlässlich zur Synchronisierung."
    - text: "Please check whether an active Wi-Fi or LTE connection is available. It is indispensable for synchronisation."
  utter_cms_token_bei_ios:
    - text: "Bei IOS Geräten wird kein Token (QR Code) für die CMS Einrichtung benötigt. Sobald der CMS Dienst (nach erfolgreicher Bestellung) in deinem MyIT Shop Bestand erscheint, kannst du grundsätzlich die CMS Installation jederzeit anhand der Welcome Mail durchführen."
    - text: "For IOS devices, no token (QR code) is required for the CMS setup. As soon as the CMS service appears in your MyIT Shop inventory (after a successful order), you can carry out the CMS installation at any time using the welcome email."
  utter_cms_token_nach_renew:
    - text: "Nach der erfolgreichen MyCard Aktualisierung kannst du den neuen Token anhand dieses [YAMU-Links](https://tiny.telekom.de/w72r9p1l) für dein Android Gerät besorgen."
    - text: "After the successful MyCard update, you can get the new token for your Android device using this [YAMU link](https://tiny.telekom.de/w72r9p1l)."
  utter_cms_tunnel_reinstalltunnelapp:
    - text: "Installiere bitte die Tunnel App auf deinem mobilen Endgerät neu. Wichtig: Die App muss zuerst deinstalliert (das Symbol von der App länger gedrückt halten und auf \"Deinstallieren\" klicken) und erst dann wieder aus der Hub App neu aufgespielt werden."
    - text: "Please reinstall the tunnel app on your mobile device. Important: The app must first be uninstalled (press and hold the app icon and click on \"uninstall\") and then reinstalled from the hub app."
  utter_compliancestate_transer_info_macos:
