  utter_faq_yam_mycard:
    - text: "Leider kann ich keine weitere Hilfe liefern. FAQ MyCard erreichst du jeder Zeit über die folgende [YAMU-Seite](https://tiny.telekom.de/5slsn0jd). \nHilfe und Support/Ansprechpartner rund um eine Störung oder eine Beschwerde sind [hier](https://tiny.telekom.de/9rg7x62w) zu finden. Solltest du veraltete Inhalte oder Dokumente auf YAMU finden, schick [das Kontaktformular](https://tiny.telekom.de/rbooosq5) dem YAMU Redaktionsteam zu."
    - text: "Unfortunately, I cannot provide any further help. You can reach FAQ MyCard at any time via the following [YAMU page](https://tiny.telekom.de/5slsn0jd).\nHelp and support/contact persons for problems or complaints can be found [here](https://tiny.telekom.de/9rg7x62w). If you find outdated content or documents on YAMU, send [the contact form](https://tiny.telekom.de/rbooosq5) to the YAMU editorial team."
  utter_feedback_negative:
    - text: "Es tut mir leid, dass ich  dir nicht helfen konnte. Dein Feedback wird zu meiner Verbesserung verwendet."
    - text: "I'm sorry that I couldn't help you. Your feedback will be used for my improvement."
  utter_feedback_positive:
