    - text: "Please perform a new login!\n\n1. Please open the OneDrive settings.\n2. Click on \"Unlink this PC\"\n3. After 1-2 minutes, sign in to OD4B again."
  utter_od4b_windows_explorer_pruefen:
    - text: "Prüfe bitte im Windows Explorer, ob unter dem \"OneDrive - Deutsche Telekom AG\" Verknüpfungen mit einem blauen Symbol angezeigt werden (z.B. Dokumente).\n\nToDo: Öffne diese Verknüpfung im Office Portal (die Verknüpfung wird unter \"Eigene Dateien\" erscheinen) und lösche diese im Portal. Danach klicke auf Synchronisieren Button, somit wird eine erneute Synchronisation angestoßen."
    - text: "Please check in Windows Explorer if shortcuts with a blue icon are displayed under \"OneDrive - Deutsche Telekom AG\" (e.g. Documents).\n\nToDo: Open this shortcut in the Office Portal (the shortcut will appear under \"My Documents\") and delete it in the portal. Then click on the Sync button, this will initiate a new synchronization."
  utter_od4b_zuruecksetzen:
    - text: "Setze bitte die Anwendung zurück!\n\n1. Gib \"Ausführen\" in das Suchfeld auf der Taskleiste ein und starte es.\n2. Ins Feld \"Öffnen\" gib den Befehl \"C:\\Program Files\\Microsoft OneDrive\\onedrive.exe /reset\" ein.\n3. Drücke OK.\n\nDas Symbol für OD4B auf dem Taskleiste  verschwindet und erscheint wieder nach ein paar Minuten.\n\nWenn das Symbol nach einige Minuten doch nicht erscheint, bitte:\n1. Gib \"Ausführen\" in das Suchfeld auf der Taskleiste ein und starte es.\n2. Ins Feld \"Öffnen\" gib den Befehl \"C:\\Program Files\\Microsoft OneDrive\\onedrive.exe\"\n3. Drücke OK.\n\n"
    - text: "Please reset the application!\n\n1. Enter \"Run\" into the search box on the taskbar and start it.\n2. In the \"Open\" field, enter the command \"C:\\Program Files\\Microsoft OneDrive\\onedrive.exe /reset\".\n3. Press OK.\n \nThe icon for OD4B on the taskbar disappears and reappears after a few minutes.\n \nIf the icon does not appear after a few minutes, please:\n1. Enter \"Run\" into the search box on the taskbar and start it.\n2. In the \"Open\" field, enter the command \"C:\\Program Files\\Microsoft OneDrive\\onedrive.exe\"\n 3. Press OK."
  utter_office_neuanmeldung:
    - text: "Führe bitte eine Office Neuanmeldung durch!\n\n1. Starte bitte den Word\n2. Klicke auf Datei -> Konto \n3. Oben links, bei den Benutzerinformationen kannst du dich abmelden\n4. Warte kurz, und versuche dich erneut anzumelden.\nWICHTIG: Wenn die Meldung \"Serverprobleme\" erscheint, warte bitte 1 Minute und wiederhole danach die Anmeldung.\n5. Starte Outlook neu.\nINFO: es kann etwas länger dauern als üblich."
    - text: "Please perform a new Office sign-in!\n\n1. Please start Word\n2. Click on File -> Account\n3. At the top left, in the user information, you can log out\n4. Wait a moment, and try to log in again.\nIMPORTANT: If the message \"Server problems\" appears, please wait 1 minute and then repeat the login.\n 5. Restart Outlook.\nNOTE: it may take a little longer than usual."
  utter_otp_anmeldung_vds:
    - text: "Wusstest du, dass viele VDS User eine zweite Möglichkeit haben sich ohne die MyCard, aber per OTP (One Time Password) anzumelden.\nDazu musst du nur eine SMS mit dem Text \"vds\" an die [+491717299837](tel:+491717299837) senden.\nZurück zur Anmeldemaske: nun solltest du die Zertifikatsabfrage abbrechen und auf \"weiter ohne MyCard\" klicken.\nBeachte bitte, dass du nur dann eine Rückmeldung erhälst, wenn deine Telefonnummer in MyIT hinterlegt und für den Dienst OTP registriert ist. "
    - text: "Did you know that many VDS users have a second option to log in without the MyCard, but via OTP (One Time Password)?\nAll you have to do is send an SMS with the text \"vds\" to [+491717299837](tel:+491717299837).\nBack to the login mask: now you should cancel the certificate query and click on \"continue without MyCard\".\nPlease note that you will only receive feedback if your phone number is stored in MyIT and registered for the OTP service."
  utter_outlook_exchange_cache:
    - text: "Die Größe des Exchange Cache sollte auch reduziert werden.  Das geht über Systemsteuerung (Anzeige: Große Symbole) -> Mail -> E-Mail-Konten -> Doppelklick auf die Mailadresse -> Standard-Wert: 1 Jahr – hier kann der Wert auf 6 Monate oder beim Bedarf auf weniger gestellt werden."
    - text: "The size of the Exchange Cache should also be reduced. This can be done via Control Panel (Display: Large Icons) -> Mail -> Email Accounts -> Double click on the email address -> Default value: 1 year - here the value can be set to 6 months or less if needed."
  utter_outlook_freigegebeneordner_haken:
    - text: "Zum nächsten Schritt prüfe bitte noch ob die Option \"Freigegebene Ordner herunterladen\" für Outlook aktiviert ist. Das geht über Systemsteuerung (Anzeige: Große Symbole) -> Mail -> E-Mail-Konten -> Doppelklick auf die Mailadresse -> Weitere Einstellungen -> Erweitert -> Haken von Freigegebe Ordner herunterladen rausnehmen -> Übernehmen -> OK -> Weiter -> Fertigstellen."
    - text: "For the next step, please check if the option \"Download shared folders\" for Outlook is activated. You can do this via Control Panel (Display: Large Icons) -> Mail -> Email Accounts -> Double click on the email address -> More Settings -> Advanced -> Remove check from Freigegebe Ordner herunterladen -> Apply -> OK -> Next -> Finish."
  utter_outlook_neustart:
    - text: "Starte bitte Outlook neu!"
    - text: "Please restart Outlook!"
  utter_outlook_ost_loeschen:
    - text: "Schließe bitte alle Office Anwendungen auf deinem Rechner und öffne das Verzeichnis C:\\DT\\CE_SUPPORT\\CEScript im Windows Explorer.\nHier sollte die Datei RemoveOutlookOST.exe ausgeführt werden. Damit wird die .OST Datei gelöscht."
    - text: "Please close all Office applications on your computer and open the directory C:\\DT\\CE_SUPPORT\\CEScript in Windows Explorer. Here, the file RemoveOutlookOST.exe should be executed. This will delete the .OST file."
  utter_outlook_ost_verkleinern:
    - text: "Nach diesem Schritt sollte noch die Größe der .OST Datei verkleinert werden. Wichtig: Die .OST Dateigröße darf auf der Festplatte max. 50 GB sein. Hier findest du die Beschreibung dafür: [HowDoI - .OST Datei verkleinern](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/b10e9678-a123-4ae1-bed1-017c8ef9cceb)"
    - text: "After this step, the size of the .OST file should be reduced. Important: The .OST file size on the hard drive must be max. 50 GB. Here you can find the description for this: [HowDoI - .OST file reduce](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/b10e9678-a123-4ae1-bed1-017c8ef9cceb)"
  utter_passwort_sekundaere_pin_ricoh_zuruecksetzen:
    - text: "Ich habe verstanden, dass deine vierstellige Sekundäre PIN für RICOH gesperrt ist. \nDu erhältst gleich eine Benachrichtigungsemail über die Sperrung von einem RICOH-Automaten. Danach beim nächsten Anmeldevorgang am Drucker versuche bitte dich erneut zu registrieren und eine neue 4-stellige Benutzer-PIN zu vergeben. Weiteres über die Einrichtung der RICOH PIN sowie die MyCard-Aktivierung findest du [über diesen YAM-Link](https://tiny.telekom.de/og1o0238)."
    - text: "I understood that your four-digit secondary PIN for RICOH is locked. You will soon receive a notification email about the lock in form of an automated process. After having the email received, please try to register again and assign a new 4-digit user PIN during the next login process on the printer. You can find out more about setting up the RICOH PIN and activating MyCard [via this YAM link](https://tiny.telekom.de/og1o0238)."
  utter_plotter_supportsuspended_01:
    - text: "Telekom-IT hat sein Portfolio bereinigt und muss dir daher leider mitteilen, dass er den Plotterservice künftig nicht mehr in der bisherigen Form anbieten wird. Seit dem 1. Juli 2024 sind Backendsysteme abgeschaltet, Plotter können nicht mehr als Netzwerkdrucker genutzt/betrieben werden.\n\n\n"
    - text: "Telekom-IT has streamlined its portfolio and unfortunately has to inform you that it will no longer offer the plotter service in its current form. Since July 1, 2024, backend systems have been switched off and plotters can no longer be used/operated as network printers."
  utter_plotter_supportsuspended_02:
    - text: "Drucken ist nur noch offline per USB-Stick möglich. Daher ist es notwendig, rechtzeitig einen USB 2.0-Stick zu bestellen. Wichtig: **NUR USB 2.0-STICKS KÖNNEN GENUTZT WERDEN.** Für die T790 Modelle gibt es keinen Support mehr. Anwender müssen sich einen neuen Plotter über [MyIT](myit.telekom.de) bestellen. Das alte Modell muss gekündigt werden, damit es abgeholt werden kann. Bei weiteren Fragen kontaktiere den folgenden [FMB](mailto:MPS_Telekom@telekom.de)."
    - text: "Printing is only possible offline using a USB stick. It is therefore necessary to order a USB 2.0 stick in good time. Important: **ONLY USB 2.0 STICKS CAN BE USED.** There is no longer any support for the T790 models. Users must order a new plotter via [MyIT](myit.telekom.de). The old model must be canceled so that it can be picked up. If you have any further questions, contact the following [FMB](mailto:MPS_Telekom@telekom.de)."
  utter_ricoh_fehlermeldung_nach_der_manuell_starten_von_mps:
    - text: "In diesem Fall kannst du trotzdem drucken! Wenn dich die Fehlermeldung dennoch stört, starte bitte den Rechner neu."
    - text: "In this case, you can still print! If the error message still bothers you, please restart the computer."
  utter_ricoh_mycard_auf_dem_kartenleser_drauflegen:
    - text: "Bitte halte die MyCard so lange vor dem Kartenleser , bis das Display reagiert. "
    - text: "Please hold the MyCard in front of the card reader until the display responds.\n"
  utter_ricoh_mycard_neu_einrichten:
    - text: "Sollte der Fehler weiterhin bestehen, registriere deine MyCard erneut im Druckersystem. Eine Anleitung dazu findest du [hier](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/4eea3963-01e0-4486-9257-432ef2385168)."
    - text: "If the error persists, register your MyCard in the printer system again. You can find instructions for this [here](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/4eea3963-01e0-4486-9257-432ef2385168)."
  utter_ricoh_neustart:
    - text: "Starte bitte zuerst den Drucker neu, bei dem der Fehler auftritt.\nWICHTIG: Der Drucker sollte unbedingt per Ein- und Ausschaltknopf neu gestartet werden! \nDer Schalter verbirgt sich hinter einer kleinen weißen Klappe rechts am Gerät auf der Höhe des ersten Papierfachs.\nTeste bitte nach dem Neustart, ob es geholfen hat."
    - text: "Please first restart the printer where the error occurs.\nIMPORTANT: The printer should definitely be restarted using the on and off button! \nThe switch is hidden behind a small white flap on the right side of the device at the height of the first paper tray.\nPlease test after the restart if it has helped."
  utter_ricoh_streamline_starten:
    - text: "Gib bitte \"RICOH Streamline NX PC Client\" in das Windows Suchfeld ein und starte ihn neu.\nAnschließend führe einen neuen Druckjob durch und prüfe, ob es nun funktioniert."
    - text: "Please start the RICOH Streamline NX PC Client via the  windows search. Then start a new print job and check if it works now."
  utter_ricohstreamline_manuell_starten:
    - text: "Gib bitte in das Windows Suchfeld das Wort \"Ricoh\" ein und starte den Ricoh Streamline NX PC Client. Starte danach bitte einen neuen Druckauftrag und prüfe bei dem Drucker, ob der Auftrag jetzt ankommt.\n"
    - text: "Please enter the word \"Ricoh\" into the windows search field and start the Ricoh Streamline NX PC Client. Then start a new print job and check the printer to see if the job is now arriving."
  utter_router_geraet_neustart:
    - text: "Starte bitte den Router neu. Anschließend starte auch deinen Rechner neu."
    - text: "Please restart the router. Then also restart your computer."
  utter_slot_richtig_verstanden_check_bestellportal:
    - text: "Habe ich richtig verstanden, dass du generelle Probleme mit der Bearbeitung von Aufträgen hast - sei der betroffene Prozess Bestellung. Umbuchung, Kündigung, Genehmigung, Rollenverwaltung oder dass du bisher unbeantwortete Fragen zu inhaltlichen Störungen hast, die in myIT, myStore oder CAIMAN aufgetreten sind?"
      buttons:
        - title: "ja, das stimmt"
          payload: "ja, das stimmt"
        - title: "nein, ich habe ein anderes Thema"
          payload: "nein, ich habe ein anderes Thema"
    - text: "Have I understood correctly that you have general problems with processing orders - be it the affected process of ordering, rebooking, cancellation, approval, role management or that you have unanswered questions about content-related problems that have occurred in myIT, myStore or CAIMAN?"
      buttons:
        - title: "ja, das stimmt"
          payload: "ja, das stimmt"
        - title: "nein, ich habe ein anderes Thema"
          payload: "nein, ich habe ein anderes Thema"
  utter_software_fehlt_aus_myit:
    - text: "Nur die für Nucleus zertifizierten Applikationen werden supportet.\n\nSoftwareliste hier: [YAM-Link](https://tiny.telekom.de/vl7i5xdm)\n\nBitte immer hier prüfen, ob die Applikation für OS Nucleus Windows zertifiziert ist!\nWenn die Applikation nicht OS-ready ist:\n\n- geht es um eine Telekom/T-Systems interne Applikation/Software → in diesem Fall soll der Applikations- oder Produktverantwortliche die entsprechende Anforderung stellen. Um den Applikationsverantwortlichen zu finden kannst du dich an die [IT-Workplace community wenden] (https://yam-united.telekom.com/pages/workplace-experience).\n\n- geht es um eine externe Applikation oder Software von einem Drittanbieter → Setze dich in Verbindung mit dem  Requirement-Management Team um eine Beratungsanfrage einzustellen. Telekom-IT Workplace Services Requirement Portal ist [hier](https://jira.telekom.de/plugins/servlet/desk/site/reqwxn) erreichbar. Solltest du keine Beratung benötigen, kannst du die Anforderung auch direkt in [SoLiMaT](https://solimat.azurewebsites.net/#/help/main) eröffnen."
    - text: "Only applications certified for Nucleus are supported.\n\nSoftware list here: [YAM-Link](https://tiny.telekom.de/vl7i5xdm)\n\nPlease always check here whether the application is certified for OS Nucleus Windows!\nIf the application is not OS-ready:\n\n- it is about a Telekom/T-Systems internal application/software → in this case, the application or product owner should make the corresponding request. To find the person responsible for the application, you can contact the [IT-Workplace community] (https://yam-united.telekom.com/pages/workplace-experience).\n\n- If it is an external application or software from a third-party provider → Contact the requirement management team to submit a consulting request. Telekom-IT Workplace Services Requirement Portal is available [here](https://jira.telekom.de/plugins/servlet/desk/site/reqwxn). If you do not need advice, you can also open the request directly in [SoLiMaT](https://solimat.azurewebsites.net/#/help/main)."
  utter_tastatur_externe_USB:
    - text: "Bitte erstmal das Kabel entfernen und neu anschließen (ggf. an einem anderen USB-Anschluss bzw. Rechner), starte danach auch den Rechner neu. Die Tastatur soll auch ohne Dockingstation (direkt am Rechner angeschlossen) getestet werden, weil es möglich ist, dass die Dockingstation selber den Fehler verursacht. WICHTIG: Apple Tastaturen sind nicht zertifiziert, deshalb werden sie auch nicht supportet."
    - text: "Please first remove the cable and reconnect it (if applicable via another USB port or computer), then restart the computer. The keyboard should also be tested without a docking station (connected directly to the computer), because it is possible that the docking station itself is causing the error. IMPORTANT: Apple keyboards are not certified, so they are not supported."
  utter_ticketnachfrage_selbst_pflegen:
    - text: "Wenn du den Status eines existierenden  Störungstickets einsehen / updaten, oder dem Ticket eine Datei hinzufügen möchtest, nutze bitte das Störungsmanagement in MyIT. Da hast du die Möglichkeit deine Tickets selbst zu pflegen oder Reklamation zu starten. Das Störungsmanagement erreichst du direkt hier: [Link zum Incident Portlet](https://tiny.telekom.de/4t8vuilz)\nWeitere wichtige Information und Tipps zu MyIT Seite erreichst du hier: [YAM-Link](https://tiny.telekom.de/b6m8wfog)"
    - text: "If you want to view/update the status of an existing trouble ticket, or add a file to the ticket, please use the trouble management in MyIT. There you have the opportunity to maintain your tickets yourself or to start a complaint. You can reach the trouble management directly here: [Link to the Incident Portlet](https://tiny.telekom.de/4t8vuilz)\n Further important information and tips on the MyIT page can be found here: [YAM-Link](https://tiny.telekom.de/b6m8wfog)"
  utter_tunnel_worksasdesigned:
    - text: "Works as designed - ohne aktive Internetverbindung ist der VMware Tunnel nicht funktionsfähig und es kann keine VPN-Konnektivität aufgebaut werden. Kontaktiere bitte in diesem Fall deinen zuständigen Internet Provider."
    - text: "Works as designed - without an active internet connection, the VMware Tunnel is not functional and VPN connectivity cannot be established. In this case, please contact your Internet provider."
  utter_unbekannte_smartcard:
    - text: "Then your card itself is OK, but the card reader seems to be affected."
    - text: "Dann ist deine Karte an sich in Ordnung aber der Kartenleser scheint betroffen zu sein."
  utter_unterstuetzte_themen_von_csd:
    - text: "**CSD unterstützt bei folgenden Themen:**\n\n- **Arbeitsplatzsysteme** (Standard Laptops, Windows Tablets, ADZ, DevClient, VDS, VDI) – Hardware- und Softwarestörungen \n- **CMS** (Abkürzung für Corporate Mobile Service) – Android- und iOS Geräte \n- **LMD** (Abkürzung für Light-managed Device Service) - MacBooks\n- **MyCard** \n- **Passwortrücksetzungen** \n- Telefonie in **Cisco WebEx** und **MS Teams**  \n- **Netzwerkstörungen**\n- **Printer**, zertifizierte lokale Drucker, Ricoh Drucker - Hardware- und Softwarestörungen"
    - text: "**CSD supports the following topics:**\n\n- **Workplace systems** (Standard Laptops, Windows Tablets, ADZ, DevClient, VDS, VDI) - Hardware and software malfunctions\n- **CMS** (abbreviation for Corporate Mobile Service) - Android and iOS devices\n- **LMD** (abbreviation for Light-managed Device Service) - MacBooks\n- **MyCard**\n- **Password resets**\n- Telephony in **Cisco WebEx** and **MS Teams**\n- **Network disruptions**\n- **Printers**, certified local printers, Ricoh printers - Hardware and software malfunctions"
  utter_user_another_card:
    - text: "Prüfe bitte, ob der Kartenleser eine andere Karte mit einem Chip erkennt. Du kannst das z.B. mit einer Kreditkarte ohne Bedenken prüfen. "
    - text: "Please check whether the card reader recognises another card with a chip. You can check this  for example with a credit card without hesitation. "
  utter_vds_nichterkannt_browser_cookies_loeschen:
    - text: "Wenn deine MyCard vorhanden ist, aber nicht erkannt wird, kann eine Bereinigung der Browserdaten und Cookies helfen.\nHilfe dazu findest du hier: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/6c8a0423-3e55-43b9-8da5-516d1f23753f).\nWenn das Löschen der Browserdaten kein Ergebnis liefert, teste die Anmeldung bitte in einem anderen Browser."
    - text: "If your MyCard is present but not recognized, clearing your browser data and cookies may help. You can find help here: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/6c8a0423-3e55-43b9-8da5-516d1f23753f). If clearing the browser data does not yield any results, please try logging in with a different browser."
  utter_verbinden_ueber_dongle:
    - text: "Versuche in erster Linie das Headset über USB Dongle zu verbinden."
    - text: "First try to connect the headset via USB dongle."
  utter_verbinden_ueber_usb_kabel:
    - text: "Versuche in erster Linie das Headset über USB Kabel zu verbinden."
    - text: "First try to connect the headset via USB cable."
  utter_verbindung_trennen:
    - text: "Bitte trenne die Verbindung, das Headset sollte nur mit dem Rechner verbunden sein."
