  utter_römische:
    - text: "Das klassische Gegenstück der neapolitanischen Pizza: die römische Variante. Der Rand der römischen Pizza ist im Gegensatz zur neapolitanischen dünn und kross. Da der gesamte Teig dünn ausgerollt wird, ist römische Pizza in der Regel größer als die neapolitanische. Ganz im Geiste Roms, dessen Alltag hektisch und rustikal ist, wird auch die Pizza meist für den Verzehr On-the-Go eckig geschnitten und zusammengeklappt serviert. Das luftige Mundgefühl der neapolitanischen Variante sucht man hier aber vergebens: eine römische Pizza ist eher knusprig als locker-luftig. Für die Zubereitung stellt ihr am besten einen Vorteig her, den ihr 48 Stunden lang ruhen lasst und dann mit dem Hauptteig verarbeitet. Nachdem auch dieser Teig 2 Stunden geruht hat, könnt ihr loslegen: Im Gasgrill wird die römische Pizza bei 280 °C indirekt gegrillt und ist in 10-15 Min. fertig."
    - text: "The classic counterpart to the Neapolitan pizza: the Roman variant. The crust of the Roman pizza is thin and crispy, unlike the Neapolitan. Since the entire dough is rolled out thin, Roman pizza is usually larger than the Neapolitan. True to the spirit of Rome, whose everyday life is hectic and rustic, the pizza is usually cut into squares for on-the-go consumption and served folded. However, you won't find the airy mouthfeel of the Neapolitan variant here: a Roman pizza is more crispy than light and fluffy. For preparation, it's best to make a pre-dough, let it rest for 48 hours, and then process it with the main dough. After this dough has also rested for 2 hours, you can get started: The Roman pizza is indirectly grilled in a gas grill at 280 °C and is ready in 10-15 minutes."
  utter_sauerteig:
    - text: "Zu Zeiten, als man klassische Hefe noch nicht so einfach überall kaufen konnte, bestand italienische Pizza aus sehr mildem Sauerteig aus Weizenmehl und wurde „Pizza mit Lievito Madre“ genannt. Die Gärung ist dadurch natürlicher, aber auch langsamer und unbeständiger. Daher wird heute in der Regel frische Hefe verwendet, um einen Pizzateig herzustellen. Aber es lohnt sich trotzdem, eine Sauerteig-Pizza zu backen, denn Sauerteig gilt als besonders bekömmlich, da er gesunde Bakterien enthält. Wichtig: Vorm Backen sollte der Teig mindestens 1-2 Tage ruhen, damit diese Bakterien aktiv werden. Anschließend kannst du ihn wie den klassischen Pizzateig belegen und auf dem Grill backen."
    - text: "In times when classic yeast was not so easily available everywhere, Italian pizza was made from very mild sourdough made from wheat flour and was called \"Pizza with Lievito Madre\". The fermentation is thus more natural, but also slower and less stable. Therefore, fresh yeast is usually used today to make a pizza dough. But it is still worth baking a sourdough pizza, because sourdough is considered particularly digestible as it contains healthy bacteria. Important: Before baking, the dough should rest for at least 1-2 days so that these bacteria become active. Afterwards, you can top it like the classic pizza dough and bake it on the grill."
  utter_sendenAs_grups-mailbox_nicht_verfuegbar:
