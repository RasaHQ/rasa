  utter_ios_lostmode_icloud_entsperren:
    - text: "Damit du das Gerät wieder nutzen kannst, versuche bitte den verlorenen Modus in iCloud zu deaktivieren: \n1. Melde dich (z.B. an einem Rechner) mit deiner Apple ID in [iCloud](https://www.icloud.com/find) an.\n2. Klicke auf \"Alle Geräte\" und wähle das Gerät aus, das sich im verlorenen Modus befindet (also gesperrt ist). \n3. Klicke auf \"Verlorener Modus\" bzw. dann auf \"Verlorenen Modus stoppen\"."
    - text: "So that you can use the device again, please try to deactivate the lost mode in iCloud: \n1. Log in (e.g. on a computer) with your Apple ID in [iCloud](https://www.icloud.com/find). \n2. Click on \"All Devices\" and select the device that is in lost mode (i.e. is locked). \n3. Click on \"Lost Mode\", then click on \"Stop Lost Mode\"."
  utter_iphone_ipad_verloren_workaround:
    - text: "Versuche bitte folgenden **Workaround**:\n1. Stecke die SIM-Karte temporär in ein anderes Gerät (z.B. das Privathandy) und deaktiviere auf dem Gerät die SIM PIN-Abfrage unter den Einstellungen.\n2. Danach kann die Karte wieder in das Dienstgerät gesteckt werden. So bekommt das gesperrte Gerät eine Internetverbindung über die SIM Karte. Es sollte damit erkennen, dass der verlorene Modus in iCloud deaktiviert wurde und du solltest dann auf das Gerät Zugriff haben.\n3. Zum Schluss kannst du die SIM PIN-Abfrage unter den Einstellungen wieder aktivieren. \n4. Um die Störungsursache zu beheben, öffne eine dienstliche App (z.B. EmployeeApp) und vergebe einen neuen SSO Passcode."
    - text: "Please try the following **workaround**:\n1. Insert the SIM card into another device (e.g. the private mobile phone) and deactivate the SIM PIN query in the settings on the device.\n2. Afterwards, the card can be reinserted into the service device. This way, the locked device gets an internet connection via the SIM card. It should then recognize that the lost mode in iCloud has been deactivated and you should then gain access to the device.\n3. Finally, you can reactivate the SIM PIN query in the settings.\n4. To rectify the cause of the fault, open a company app (e.g. EmployeeApp) and assign a new SSO passcode."
  utter_irrp_kontakt:
