    - text: "The password reset for the AD-Client is done in the [Adminportal](https://adserver.telekom.de/adminportal/showLoginAction.do)."
  utter_ANDinstall_tokenreset_aborted:
    - text: "Alles klar. Ich stoppe den Vorgang."
    - text: "All clear. I'll stop the process."
  utter_ANDinstall_tokenreset_myit:
    - text: "1. Rufe bitte [MyIT-Shop](https://myit.telekom.de/MyIT/) auf.\n2. Klicke nun auf die Schaltfläche „Bestand anzeigen“.\n3. Wähle dann die Kachel „Corporate Mobile Service“ aus.\n4. Wähle nun das betroffene Endgerät auf der linken Seite aus: Android Smartphone oder Tablet „CMS für xxx“\n5. Betätige in der nächsten Ansicht rechts oben die Schaltfläche „Löschung und Neuinstallation CMS Gerät“\nIn der Regel bekommst du nach wenigen Minuten, in Ausnahmefällen innerhalb von 2 Stunden deinen neuen Token in Form einer Aktivierungsmail.\n\nEine kurze **Schritt für Schritt Anleitung** findest du unter diesem Link: [Löschung und Neuinstallation Android](https://tiny.telekom.de/w72r9p1l)"
    - text: "1. please open [MyIT-Shop](https://myit.telekom.de/MyIT/).\n2. now click on the \"View inventory\" button\n3. then select the \"Corporate Mobile Service\" tile.\n4. now select the relevant device on the left-hand side Android smartphone or tablet \"CMS for xxx\"\n5. in the next view, click the \"Resetting and New Enrollment CMS Device\" button at the top right\nGenerally, you will receive your new token in the form of an activation email after a few minutes, in exceptional cases within 2 hours.\n\nYou can find a short **step-by-step guide** under this link: [Deletion and reinstallation android](https://tiny.telekom.de/w72r9p1l)"
  utter_ANDtunnel_airplanemode:
    - text: "Setzte nun das Gerät in den Flugmodus und deaktiviere ihn einige Sekunden später. "
    - text: "Now set the device to flight mode and deactivate it a few seconds later. "
  utter_ANDtunnel_dnssettings:
    - text: "An dieser Stelle ist es notwendig, auf dem Gerät unter \"Einstellungen\" den Menüpunkt \"Privates DNS\" zu deaktivieren. Tipp: Öffne die Einstellungen des Gerätes und trage oben ins Suchfeld den Begriff \"DNS\" ein, um diese Option schnell finden zu können."
    - text: "At this point, it is necessary to disable the \"Private DNS\" menu item under \"Settings\" on the device. Tip: Open the device's settings and enter the term \"DNS\" in the search field at the top to quickly find this option."
  utter_ANDtunnel_restarttunnel:
    - text: "Die Tunnel App muss neu gestartet werden:\n1. Halte das Symbol von der Tunnel App etwas länger \n gedrückt\n2. Klicke bei dem Popup-Menü oben auf \"i\" (für App Info)\n3. Wähle unten den Befehl \"Stopp erzwingen\" aus\n4. Öffne erneut die Tunnel App und bestätige die VPN-Verbindungsanfragen."
    - text: "The Tunnel app must be restarted:\n1. hold down the tunnel app icon a little longer \n pressed \n2. click on \"i\" (for app Info) in the pop-up menu at the top\n3. select the \"Force stop\" command at the bottom\n4. open the tunnel app again and confirm the VPN connection requests."
  utter_APS_HW_Maus_Touchpad:
    - text: "Bei einem Problem mit der Maus, schließe die Maus an einem anderen USB-Port oder an einem anderen Grundgerät an, um zu schauen, ob die Maus selbst defekt ist. Falls ja, bestelle bitte einfach eine neue über [myStore](https://yam-united.telekom.com/pages/procure-to-pay-ptp/apps/content/mystore). Wenn die Maus an einem anderen Gerät funktioniert bzw. sie generell über Bluetooth verbunden benutzt wird oder das Touchpad betroffen ist, dann wird hierzu wohl Unterstützung von einem Agenten benötigt. Wähle im Weiteren je nach Verbindungs-/Störungsart den entsprechenden Button."
    - text: "If you have an issue with the mouse, please try to connect the mouse to a different USB port or to a different device to see if the mouse itself is broken. If so, please simply order a new one via [myStore](https://yam-united.telekom.com/pages/procure-to-pay-ptp/apps/content/mystore). If either the mouse works fine on a different device or the touchpad is affected, you will probably need support from an agent. If the mouse works on another device or is generally used via Bluetooth or the touchpad is affected, then support from an agent will probably be required. Then select the appropriate button depending on the type of connection/problem."
  utter_APS_HW_devclient_emea_authapp:
    - text: "Die Useranmeldung ans Telekom-Profil ist für DevClient-User beider Profiltypen (R&D und Internet) ohne installierte und eingerichtete [Microsoft Authenticator App](https://tiny.telekom.de/zzxz57l6) unvorstellbar. Falls du die App noch nicht hättest, kümmere dich um deren schnellstmögliche Einrichtung - zur Multi-Faktor-Authentisierung wird es unerlässlich sein."
    - text: "User registration to the Telekom profile is unimaginable for DevClient users (for those with both profile types as R&D and Internet) without the [Microsoft Authenticator App](https://tiny.telekom.de/zzxz57l6) installed and set up. If you don't have the app yet, set it up as soon as possible - it will be essential for multi-factor authentication."
  utter_APS_HW_devclient_emea_generell:
    - text: "Normalerweise funktioniert die Anmeldung auf einem DevClient mit lokalen Anmeldemöglichkeiten, die du bei/nach der Inbetriebnahme festgelegt hattest. Kombiniert mit EMEA-Anmeldung, die folgenden Optionen sind noch vorhanden: Windows PIN, Gesichtserkennung, Fingerabdruck. Dem entsprechend stehen dir die folgenden Workarounds bei DevClient-Anmeldeproblemen zur Verfügung: (1) biometrische Anmeldung nicht erkannt → Login über lokale PIN (2) Windows PIN vergessen → Anmeldung mit Domäne Passwort (3) Domäne Passwort ebenfalls vergessen → Domäne Passwort an einem anderen APS über [Selfservice](https://passwort.telekom.de) oder über die Mitarbeiter APP zurücksetzen (4) Passwortänderung  - auch mit neu definiertem Initial Passwort - über diesen [Link](https://myaccount.microsoft.com), entweder auf dem APS eines Kollegen oder über „Web“ auf dem Firmenhandy (5) keine Option mehr möglich → komplette Profilrücksetzung"
    - text: "Normally, logging in to a DevClient works with local login options that you specified during/after commissioning. Combined with EMEA login, the following options are still available: Windows PIN, facial recognition, fingerprint. Accordingly, the following workarounds are available to you for DevClient login problems: (1) biometric login not recognized → login via local PIN (2) Windows PIN forgotten → login with domain password (3) domain password also forgotten → reset domain password on another APS via [Selfservice](https://passwort.telekom.de) or via the employee APP (4) password change - even with newly defined initial password - via this [link](https://myaccount.microsoft.com), either on a colleague's APS or via \"Web\" on the company cell phone (5) no longer an option possible → complete profile reset"
  utter_APS_HW_devclient_hw_generell:
    - text: "Den Hardware-Störungen eines Nucleus Clients gegenüber behandelt der Common Service Desk die Probleme eines DevClients im selben Themenkreis unterschiedlich. Mit Hinsicht auf die Beschaffung wird Unterstützung gegeben. Vorsicht: eigenbesorgte Peripherien und weitere Hardwarekomponenten, die nicht direkt über die Telekom beschafft wurden, gelten als nicht supportet."
    - text: "In contrast to hardware problems with a Nucleus client, the Common Service Desk handles problems with a DevClient in the same area differently. Support is provided with regard to procurement. Caution: self-procured peripherals and other hardware components that were not procured directly from Telekom are considered unsupported."
  utter_APS_HW_devclient_hw_grundgeraet_ibnnichterledigt:
    - text: "Falls die Inbetriebnahme noch nicht erfolgt ist, ist es unbedingt wichtig, diesen Schritt durchzuführen. Wenn der DevClient von einem Kollegen übernommen wurde, ist eine Rücksetzung bei der Übernahme vorgesehen, damit die lokalen und personenbezogenen Einstellungen vor der Einrichtung entfernt werden. Informationen über die Inbetriebnahme sind [unter diesem YAM-Link](https://tiny.telekom.de/0sz0nwu1) zu finden."
    - text: "If initial setup has not yet been completed, it is absolutely important to complete this step. If the DevClient has been taken over by a colleague, a reset is to be done during the takeover so that the local and personal settings are removed before the initial setup. Information about commissioning can be found [under this YAM link](https://tiny.telekom.de/0sz0nwu1)."
  utter_APS_HW_devclient_hw_lokalerdrucker:
    - text: "Da beide Typen von DevClients - sowohl R&D als auch Internet - mit Administratorenrechten eingerichtet sind, ist es den Usern möglich, lokale Drucker nach Geschmack einzurichten und später bei Problemen selber zu verwalten. Einen vollständigen Support kann der Common Service Desk erst in Fällen leisten, wenn der betroffene lokale Drucker direkt über die Telekom (z.B. myIT) besorgt wurde. Bei eigenbesorgten lokalen Druckern trägt der User Eigenverantwortung. Weiteres zum Thema DevClient findest du [unter diesem YAM-Link](https://tiny.telekom.de/avennlko)."
    - text: "Since both types of DevClients - both R&D and Internet - are set up with administrator rights, users are able to set up local printers as they wish and later manage them themselves if problems arise. The Common Service Desk can only provide full support in cases where the local printer in question was obtained directly from Telekom (e.g. myIT). If the user has obtained the printer themselves, the user is responsible for any kind of issues. You can find out more about DevClient [under this YAM link](https://tiny.telekom.de/avennlko)."
  utter_APS_HW_devclient_hw_monitor:
    - text: "Die Nutzung von Monitoren an einem DevClient unterscheidet sich wenig von der Nutzung der Nucleus Rechner. Der größte Unterschied ist die Neuinstallation des Monitortreibers. Dies läuft bei Nucleus Geräten über ein zentrales Treiberpaket. Auf einem DevClient soll der betroffene Monitor bzw. der dazu gehörige Treiber im Gerätemanager mit den vorhandenen Administratorenrechten selber neu installiert werden. Als Ausgangspunkt schaue dir unsere Vorschläge zur Entstörung von Monitorstörungen an."
    - text: "Using monitors on a DevClient is not much different from how they work when connected to a Nucleus computer. The biggest difference is the reinstallation of the monitor driver. For Nucleus devices, this is done via a central driver package, but on a DevClient, the affected monitor or the associated driver should be reinstalled in the device manager with the existing administrator rights. As a starting point, however, take a look at our suggestions for troubleshooting monitor problems."
  utter_APS_HW_devclient_hw_netzwerkdrucker:
    - text: "Beachte bitte, dass die Nutzung der zentralen Telekom-Netzwerkdrucker nur für User mit DevClient R&D gestattet ist. Der Rechnertyp DevClient Internet kann für das zentrale Drucksystem nicht eingerichtet werden. Falls du über einen DevClient R&D verfügst, schaue dir die folgenden Informationen bzw. Vorschläge zum zentralen Druckverfahren an."
    - text: "Please note that the use of the central Telekom network printers is only permitted for users with DevClient R&D. The computer type DevClient Internet cannot be set up for the central printing system. However, if you do have a DevClient R&D, then take a look at the following information or suggestions for the central printing process."
  utter_APS_HW_devclient_hw_peripherien:
    - text: "Da beide Typen von DevClients - sowohl R&D als auch Internet - mit Administratorenrechten eingerichtet sind, ist es möglich, Peripherien nach Geschmack einzurichten und später bei Problemen selber zu verwalten - die Installation spezieller Treiber ist direkt vom Internet aus ebenso erlaubt. Für Peripherien trägt der User dementsprechend Eigenverantwortung und wird vom Common Service Desk nicht supportet. Weiteres zum Thema DevClient findest du [unter diesem YAM-Link](https://tiny.telekom.de/avennlko)."
    - text: "As both types of DevClients - both R&D and Internet - are set up with administrator rights, it is possible to set up peripherals as required and to manage them yourself later if problems arise - the installation of special drivers is also permitted directly from the Internet. Accordingly, the user is responsible for peripherals and the Common Service Desk cannot intervene. You can find more information about DevClient [under this YAM link](https://tiny.telekom.de/avennlko)."
  utter_APS_HW_devclient_nw_internet:
    - text: "Die Verwendung des DevClient Internets ist vom Telekom-Netzwerk nicht möglich. Der DevClient Internet wird ausschließlich über das externe DSL-Internet betrieben. Intranetressourcen wie myIT, CIAM etc. können auch nur darüber erreicht werden. Bei Einrichtungs-, Verwaltungs- und Entstörungsproblemen, innerhalb der Internetverbindung, trägt der DevClient Internet User immer Eigenverantwortung. Es ist zwar nicht vorgesehen, Intranetressourcen zu verwenden, aber falls es doch gewünscht wäre, dann kann der User, einen [VDS-Zugang über myIT](https://tiny.telekom.de/wnzye9vl) bestellen. Dies ermöglicht einem eine virtualisierte Arbeits-Oberfläche, mit der Abbildung des Telekom Intranets, zu erhalten."
    - text: "DevClient Internet is completely removed from the Telekom network, the use of intranet resources such as myIT, CIAM etc. is only possible via a detour, as DevClient Internet is only operated via the external DSL Internet. The DevClient Internet user is always responsible for setting up, managing and troubleshooting problems within the Internet connection. It is not intended to use intranet resources, but if it is desired, the user is forced to order [VDS access via myIT](https://tiny.telekom.de/wnzye9vl). This enables a virtualized work surface with a representation of the Telekom intranet."
  utter_APS_HW_devclient_nw_rd:
    - text: "DevClient R&D ist vom Profiltyp her mit einem Nucleus Client fast identisch - daher sind auch die unterschiedlichen Optionen gemeinsam, wenn man sich ins Telekom Netzwerk einwählen will. Lass uns einmal auf die Voraussetzungen schauen, die dazu unerlässlich sind, sowohl die direkte Büro LAN- als auch dire remote VPN-Verbindung herzustellen."
    - text: "DevClient R&D is almost identical to a Nucleus Client in terms of profile type - so the different options are also common when you want to dial into the Telekom network. Let's take a look at the requirements that are essential to establish both the direct office LAN and the direct remote VPN connection."
  utter_APS_HW_devclient_sw_generell:
    - text: "Installationsprobleme, die auf DevClients auftreten, sind nach Art des Installationspakets bzw. der Methode, wie Installationen ausgeführt werden, unterschiedlich. Um mit der Analyse einfach weitergehen zu können, bestimme bitte, genau mit welcher Aktion du das Problem hast."
    - text: "Installation problems that occur on DevClients vary depending on the type of installation package or the method by which installations are performed. To be able to proceed with the analysis easily, please determine exactly with which action you have the problem."
  utter_APS_HW_devclient_sw_installkommtnichtan_generell:
    - text: "Es kann unterschiedliche Gründe haben, falls Softwareprodukte - bestellt über MyIT - auf einem DevClient zur Installation nicht angeboten werden. Im Grunde genommen soll es in erster Linie ein Blick darauf geworfen werden, ob das gewünschte Softwarepaket wirklich über MyIT bestellbar ist. Softwarepakete lassen sich ja auf einem DevClient aufgrund der vorhandenen Administratorenrechte auch vom User (sogar vom Internet aus) selber installieren. Außerdem bietet das Unternehmensportal unter dem Kachel 'APPS' zahlreiche, zur Softwareentwicklung unerlässliche Softwarepakete in Form von Direktinstallation an, ohne dass der User die Softwarepakete im Voraus bestellen sollte. Welche Pakete sie genau sind, die über das Unternehmensportal ohne vorherige MyIT-Bestellung oder Demand aufgespielt werden können, werden in der [DevClient-Softwareliste](https://tiny.telekom.de/hr3635if) bekannt gegeben - beachte bitte, dass die Liste ständig aktualisiert wird und mit der Zeit weitere Softwareprodukte darin enthalten sein können."
    - text: "There can be various reasons why software products ordered via MyIT are not available for installation on a DevClient. Basically, the first thing to look at is whether the desired software package can really be ordered via MyIT. Software packages can be installed on a DevClient by the user themselves (even from the Internet) due to the existing administrator rights. In addition, the company portal offers numerous software packages that are essential for software development in the form of direct installation under the 'APPS' tile, without the user having to order the software packages in advance. The exact packages that can be installed via the company portal without a prior MyIT order or demand are announced in the [DevClient software list](https://tiny.telekom.de/hr3635if) - please note that the list is constantly updated and may contain additional software products over time."
  utter_APS_HW_devlcient_generell:
    - text: "Sollte ich das richtig verstanden haben, du hast Probleme mit einem der gemanagten Laptop-Modelle der Telekom,  nämlich dem DevClient. Bevor wir aber mit der Störungsanalyse weiter gehen, empfiehlt es sich, das Umfeld der Störung ein wenig einzugrenzen."
    - text: "If I have understood correctly, you are having problems with one of Telekom's managed laptop models, namely the DevClient. Before we continue with the fault analysis, however, it is advisable to narrow down the scope of the fault a little."
  utter_APS_HW_generell_h2a:
    - text: "Die Weiterbearbeitung wird von einem Agenten übernommen."
    - text: "Further processing is carried out by an agent."
  utter_APS_HW_generell_hardreset:
    - text: "Falls die vorhin vorgeschlagenen Schritte nicht geholfen haben, führe einen Hard-Reset bei deinem Gerät durch. Wie man das meistert, wird im folgenden [YAM-Artikel](https://yam-united.telekom.com/pages/ws-deployment-hw-zertifizierung/apps/content/home) im Bereich \"Hardware\" und unter dem Menüpunkt \"Notebook\" oder \"Tablet\" usw. beschrieben. Um genau zu dem Punkt des Hard-Reset zu gelangen, wähle in der Liste das Modell deines Gerätes aus und nimm den Punkt \"Tipps zur Fehlerbehebung\".  ACHTUNG: Das Verfahren hilft dir auch bei Problemen mit der Erkennung von Peripherien, die an dem Gerät angeschlossen sind."
    - text: "If the steps suggested above did not help, perform a hard reset on your device. How to do this is described in the following [YAM article](https://yam-united.telekom.com/pages/ws-deployment-hw-zertifizierung/apps/content/home) in the \"Hardware\" section and under the menu item \"Notebook\" or \"Tablet\" etc. To get to the exact point of the hard reset, select the model of your device in the list and select the item \"Troubleshooting tips\". NOTE: This procedure will also help you if you have problems recognizing peripherals connected to the device."
  utter_APS_HW_generell_rebootunddock:
    - text: "Starte den Laptop ohne externe Geräte so wie MyCard/SD-Karte neu, entferne dabei auch die Dockingstation falls angebunden."
    - text: "Restart the laptop without external devices such as MyCard/SD card and remove the docking station if connected."
  utter_APS_HW_monitor_anzeigeeinstellungen:
    - text: "Überprüfe und korrigiere ggf. die Windows Anzeigeeinstellungen unter Start → Einstellungen → System → Anzeigen. "
    - text: "Check and if necessary, correct the Windows display settings under Start → Settings → System → Displays."
  utter_APS_HW_monitor_daisychain:
    - text: "Bei Problemen mit der Daisy-Chain-Anschlussvariante schaue dir bitte den folgenden [YAM-Artikel](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/5a543927-56c3-41a7-a194-334856ea5506) an, um einfach zu schauen, ob die Verkabelung bei dir richtig eingerichtet ist.\nWenn ein Desksharing Arbeitsplatz Monitor betroffen ist und sich heraus stellt, dass der Monitor Kabel/ Daisy Chain defekt ist oder fehlt, wende dich an die [FMB Future-Work-Incident](Future-Work-Incident@telekom.de) mit Angabe des Standortes, Raumes und der Platznummer."
    - text: "If you have problems with the daisy chain connection variant, please take a look at the following [YAM article](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/5a543927-56c3-41a7-a194-334856ea5506) to simply see whether your cabling is set up correctly.\nIf a desk-sharing workstation monitor is affected and it turns out that the monitor cable/ daisy chain is defective or missing, contact the [FMB Future Work Incident](Future-Work-Incident@telekom.de) stating the location, room and seat number."
  utter_APS_HW_monitor_extern_defekt:
    - text: "Falls der externe Monitor einem anderen Laptop angeschloßen ebenso nicht erkannt wird oder immer noch nicht optimal funktioniert, dann scheint er defekt zu sein und in dem Falle ist ein Tausch des Gerätes vorgesehen. Beachte dabei, dass es vom Common Service Desk nur Monitore getauscht werden, die jünger als 72 Monate sind - bei älteren Geräten ist eine Vorprüfung darauf notwendig,  ob der Tausch für das Gerät überhaupt gestattet ist. Ausnahmefälle sind Monitore von Future-Work-Arbeitsplätzen (Desksharing)."
    - text: "If the external monitor is not recognized when connected to another laptop or is still not working properly, then it appears to be defective and in this case the device will need to be replaced. Please note that the Common Service Desk only replaces monitors that are less than 72 months old - for older devices, a preliminary check is necessary to determine whether the device can be replaced at all. Exceptions are monitors from Future Work Workstations (desk sharing)."
  utter_APS_HW_monitor_extern_direktanschluss:
    - text: "Falls der Monitor direkt mit dem Laptop verbunden ist, ohne eine Dockingstation dazwischen, sind einige Testläufe vorzunehmen, um den Auslöser zu finden. (1) Nimm ein anderes Kabel aber von demselben Typ (HDMI, DisplayPort, VGA) und schliesse den Monitor mit dem anderen Kabel direkt am Laptop an. (2) Versuche einen unterschiedlichen Kabeltyp zu nehmen und schliesse den Monitor darüber an. (3) Schliesse den Monitor über eine Dockingstation mit demselben Kabel an. (4) Starte eventuell auch den Laptop neu - ziehe davor alle Kabel raus und stecke die Kabel erst wieder, wenn der Rechner hochgefahren ist."
    - text: "If the monitor is connected directly to the laptop without a docking station in between, you need to do a few tests to find the cause. (1) Use a different cable but of the same type (HDMI, DisplayPort, VGA) and connect the monitor directly to the laptop with the other cable. (2) Try using a different type of cable and connect the monitor to it. (3) Connecting directly to a docking station with the same cable is also recommended - try this as well. (4) Restart the laptop if necessary - unplug all cables first and only plug them back in after the restart has finished."
  utter_APS_HW_monitor_extern_kreuztest:
    - text: "Falls der Monitor über Dockingstation angebunden ist, sind paar Testläufe vorzunehmen, um den Auslöser zu finden. (1) Nimm ein anderes Kabel aber von demselben Typ (HDMI, DisplayPort, VGA) und schliesse den Monitor mit dem anderen Kabel genauso über die Dockingstation an. (2) Versuche den Anschluss über die Dockingstation mit einem unterschiedlichen Kabeltyp . (3) Schliesse den Monitor direkt mit demselben Kabel an das Laptop an. (4) Starte eventuell auch die Dockingstation neu - mach sie komplett stromlos und ziehe dabei alle Kabel raus, drücke den Netzschalter für 30 Sekunden, stecke dann wieder alle Verkabelungen an die Dockingstation."
    - text: "If the monitor is connected via a docking station, you need to do a few tests to find the cause. (1) Use a different cable of the same type (HDMI, DisplayPort, VGA) and connect the monitor to the docking station using the other cable. (2) Try using a different type of cable and connect the monitor to that and to the docking station separately. (3) Connecting directly to the laptop using the same cable is also recommended - try this as well. (4) Restart the docking station if necessary - completely disconnect it from the power supply and unplug all cables, press the power button for 30seconds and after that plug cables back in."
  utter_APS_HW_monitore_extern_kreuztest:
    - text: "Monitore, die über Kabel angeschlossen werden, lassen sich mobil an einen anderen Arbeitsplatz tragen. Versuche bitte, den betroffenen Monitor an einem anderen Laptop anzuschließen und schaue dir an, ob er da richtig funktioniert."
    - text: "Monitors hat are connected via cable can be moved to another workstation. Please try connecting the monitor to another laptop and see if it works properly there."
  utter_APS_HW_zertifizierung:
    - text: "Bei Problemen mit der Erkennung von Hardwarekomponenten ist es auch entscheidend, ob das benutzte Gerät bei der Telekom zertifiziert ist. Es spielt eine große Rolle bei der Installation der Hardwarekomponente, da das aufgespielte Driver Utility Pack nur für die Zertifizierten einen Treiber mit installiert. Führe bitte eine Überprüfung auf die Zertifizierung [dieser Liste entsprechend](https://tiny.telekom.de/2qm2422x) durch. Sollte dein Gerät bzw. das Modell nicht in der Liste vorhanden sein, dann empfehle ich dir, ein Modell aus der Zertifizierungsliste zu besorgen."
    - text: "If you have problems recognizing hardware components, it is also important whether the device you are using is certified by Telekom. This plays a major role in installing the hardware component, as the Driver Utility Pack only installs a driver for those that are certified. Please check the certification [according to this list](https://tiny.telekom.de/2qm2422x). If your device or model is not on the list, I recommend that you get a model from the certification list."
  utter_APS_NW_lan_dtag:
    - text: "Wenn die Kabelverbindung an einem der Telekom Standorte aufgebaut wurde, dann ist vor allem die technische Ausstattung der Kabelverbindung zu beachten. Einer der wichtigsten Faktoren ist dabei, dass das Netzwerkkabel (LAN-Kabel) ohne Zwischengerät (wie Adapter, Repeater, usw.) direkt in der Tankdose auf dem Boden oder an der Wand angeschlossen sein soll.  Falls ein  Adapter genutzt wird, muss dieser vom Netzwerkkabel unbedingt entfernt werden, damit die LAN-Verbindung ohne Wackelkontakte bzw. Abbrüche zu Stande kommt."
    - text: "If the cable connection has been set up at one of the Telekom locations, then the main thing to consider is how the technical equipment of the cable connection looks like. One of the most important factors is that the network cable (LAN cable) should be connected directly to the tank socket on the floor or on the wall without an intermediate device (adapter, repeater, etc.). If an adapter is used, it must be disconnected from the network cable so that the LAN connection is established without loose connections or interruptions."
  utter_APS_NW_lan_dtag_daisychain:
    - text: "Der Common Service Desk leistet nur eingeschränkt Support in Störungsfällen mit Daisy-Chain, da die Verbindungsvariante optional ist - es kann funktionieren, muss aber nicht. Zu weiteren Einzelheiten im Thema studiere bitte den folgenden [YAMU-Eintrag](https://tiny.telekom.de/s4ym934p).\n\n"
    - text: "Common Service Desk only provides limited support in the event of a Daisy Chain issue, as the connection variant is optional - it may work, but it doesn't have to. For further details on the topic, please read the following [YAMU entry](https://tiny.telekom.de/s4ym934p)."
  utter_APS_NW_lan_dtag_dockingstation:
    - text: "Ziehe am besten das LAN-Kabel aus der Dockingstation und stecke es direkt in die LAN-Buchse des Laptops und nach einem kompletten Reboot versuche die LAN-Verbindung wieder aufzubauen. Du kannst eventuell auch erstmal die Dockingstation durch einen HardReset neu starten, um die LAN-Verbindung von Wackelkontakten zu schützen."
    - text: "It is best to unplug the LAN cable from the docking station and plug it directly into the LAN socket of the laptop and try to re-establish the LAN connection after a complete reboot. You can also restart the docking station with a hard reset to protect the LAN connection from loose contacts."
  utter_APS_NW_lan_dtag_dockingstation_nichtgeholfen:
    - text: "Wenn die LAN-Verbindung weder über die Dockingstation noch direkt über den Rechner angeschlossen funktioniert, dann sollen die Netzwerkdaten des Laptops auf unseren Servern überprüft werden. Bleib bitte aber kurz noch dran, bis ich mich um die Weiterbearbeitung kümmere..."
    - text: "If the LAN connection does not work either via the docking station or directly connected to the computer, then the laptop's network data should be checked on our servers. Please stay tuned for a moment until I take care of further processing..."
  utter_APS_NW_lan_dtag_kreuztest02_geholfen:
    - text: "Es ist Zeit, deinen Laptop wieder an den zuvor verwendeten (defekten) LAN-Port anzuschließen, da dort eine Port-Überprüfung bzw. ein Port-Reset vorgenommen werden soll. Wichtig ist es, den Rechner während der Störungsbeseitigung an dem defekten LAN-Port angeschlossen zu lassen. Bleibe aber bitte noch kurz dran, bis ich mich um die Weiterbearbeitung kümmere..."
    - text: "It's time to reconnect your laptop to the previously used (defective) LAN port, as a port check or port reset needs to be carried out there. It's important to leave the computer connected to the defective LAN port while the problem is being fixed. But please stay with me for a moment until I take care of the further processing..."
  utter_APS_NW_lan_dtag_kreuztest02_nichtgeholfen:
    - text: "Wenn die LAN-Verbindung weder über den üblichen noch über den anderen Port zu Stande kommt, müssen als Nächstes die Netzwerkkarte des Laptops sowie weitere netzwerkbezogene Eigenschaften geprüft werden. Wichtig ist es, den Rechner während der Störungsbeseitigung an dem defekten LAN-Port angeschlossen zu lassen. Bleibe aber bitte noch kurz dran, bis ich mich um die Weiterbearbeitung kümmere..."
    - text: "If the LAN connection cannot be established via either the usual or the other port, the next step is to check the laptop's network card and other network-related properties. It is important to leave the computer connected to the faulty LAN port while troubleshooting. Please stay connected for a short time until I take care of the next steps."
  utter_APS_NW_lan_dtag_laptop_kreuztest01:
    - text: "An dieser Stelle kann ein Kreuztest gut feststellen, ob die LAN-Verbindung selber oder die technische Ausstattung die Störung verursacht. Nimm bitte zum Testen ein anderes LAN-Kabel im Büro und schließe es dem LAN-Port an, an dem gerade dein Rechner hängt und schaue dir an, ob die LAN-Verbindung darüber zu Stande kommt."
    - text: "At this point, a cross test can be a good way to determine whether the LAN connection itself or the technical equipment is causing the issue. To test this, please take a different LAN cable from the office and connect it to the LAN port that your computer is currently connected to and see if the LAN connection is established through it again."
  utter_APS_NW_lan_dtag_laptop_kreuztest01_geholfen:
    - text: "Falls die LAN-Verbindung über ein anderes Kabel aufgebaut wurde, dann empfiehlt es sich, das LAN-Kabel deines (temporär gebuchten) Arbeitsplatzes als defekt zu melden."
    - text: "If the LAN connection was established via a different cable, it is recommended that you report the LAN cable of your (temporarily booked) workstation as broken."
  utter_APS_NW_lan_dtag_laptop_kreuztest02:
    - text: "Du kannst dich gerne auch an einen anderen Platz setzen und dort über einen anderen Port und ein anderes LAN-Kabel einen Versuch durchführen. Beachte dabei bitte, dass immer ein Neustart des Laptops vorgenommen wird, damit die Netzwerkdaten vom DHCP-Server neu gezogen werden können."
    - text: "You can also sit to a different work desk and try using a different port and a different LAN cable. Please note that you should always restart the laptop so that the network data is retrieved again from the DHCP server."
  utter_APS_NW_lan_dtag_ohne_dockingstation_geholfen:
    - text: "Falls die Dockingstation nicht einmal nach dem HardReset die LAN-Verbindung aufbaut, dann empfiehlt es sich, in der Richtung der Entstörung der Dockingstation weiter zu gehen. Lass mich dich an dieser Stelle dahin weiter leiten."
    - text: "If the docking station does not establish the LAN connection even after the hard reset, then it is advisable to continue in the direction of troubleshooting the docking station. Let me guide you there at this point."
  utter_APS_NW_lan_itenos:
    - text: "Einige CN DTAG Standorte (ca. 80 Standorte) werden auf das Internet von der Firma ITENOS umgestellt. Die Einwahl erfolgt dann, wie im Home Office per RAS/Cisco AnyConnect Client für die Mitarbeiter. Für diese neue LAN/WAN Verbindung von ITENOS nimmt der Common Service Desk bei umgestellten CN DTAG Standorten keine LAN/WAN/WLAN Störung auf. In Störungsfällen übernimmt die Beseitigung die Firma ITENOS. Achtung: Die komplette Neuinstallation des Rechners läuft an einem ITENOS-Netzwerk angebunden nicht durch. ITENOS ist unter folgenden Kontaktdaten zu erreichen: Servicedesk@itenos.de und +492287293310"
    - text: "Some CN DTAG locations (approx. 80 locations) are being switched to the Internet by ITENOS. Employees can get connected, as in the home office, via RAS/Cisco AnyConnect Client. For this new LAN/WAN connection from ITENOS, the Common Service Desk will not assist by any LAN/WAN/WLAN issues at converted CN DTAG locations. In the event of issues, ITENOS will take care of the resolution. Attention: The complete reinstallation of the computer will not run if it is connected to an ITENOS network. ITENOS can be contacted using the following contact details: Servicedesk@itenos.de and +492287293310"
  utter_APS_NW_lan_precheck:
    - text: "Wenn ich das richtig verstanden habe, hast du Schwierigkeiten im Büro über LAN/WLAN ins Intranet zu kommen. Es gibt einige Vorbedingungen, die erfüllt sein müssen, damit du auf die Intranetverbindung direkt zugreifen kannst."
    - text: "If I understand correctly, you are having difficulties accessing the intranet in the office via LAN/WLAN. There are a few prerequisites that must be met in order for you to be able to access the intranet connection directly."
  utter_APS_NW_lan_precheck_cwlan:
    - text: "CWLAN ist eine Art LAN-Verbindung an Telekom-Standorten, die den Mitarbeitern während einer Dienstreise einfach zur Verfügung steht - aber diese Möglichkeit gibt es nicht überall. Schaue dir bitte erstmal in dieser [CWLAN-Standortliste](https://wlan.telekom.de/ssid) an, ob da dein Ziel-Standort auffindbar ist."
    - text: "CWLAN is a type of LAN connection at Telekom locations that is easily available to employees during a business trip - but this option is not available everywhere. Please first check this [CWLAN location list](https://wlan.telekom.de/ssid) to see if your target location can be found there."
  utter_APS_NW_lan_precheck_cwlan_rechnergetauscht:
    - text: "Bei einem Rechnertausch wird die MAC-Adresse des integrierten Netzwerkadapters geändert und diese muss auch auf allen unseren Servern richtig angelegt sein. Bei dir kann es dazu gekommen sein, dass bei uns immer noch die Daten deines alten Rechners abgespeichert sind - ein Pre-Check wäre in diesem Fall sinnvoll. Bleib bitte noch kurz dran, bis ich mich um die Weiterbearbeitung kümmere..."
    - text: "When you replace your computer, the MAC address of the integrated network adapter is changed and this must be set up correctly on all of our servers. In your case, we may still have the data from your old computer stored - a pre-check would be useful in this case. Please stay tuned for a moment until I take care of further processing..."
  utter_APS_NW_lan_precheck_cwlan_standortnichtauffindbar:
    - text: "Sollte deine derzeitige Lokation in der angefügten Liste nicht auffindbar und für CWLAN-Nutzung nicht freigeschaltet sein, dann solltest du statt der CWLAN-Verbindung eine andere Art von Netzwerkaustattung nutzen. Weitere Möglichkeiten sind LAN-Verbindung über Kabel oder HotSpot-Verbindung mit der Nutzung des Cisco AnyConnect Clients inklusive. Welche Möglichkeiten genau am Standort vorhanden sind,  erfährst du direkt von den lokalen Kollegen."
    - text: "If your current location cannot be found in the attached list and is not enabled for CWLAN use, then you should use a different type of network equipment instead of the CWLAN connection. Other options include a LAN connection via cable or a HotSpot connection using Cisco AnyConnect. Please ask your local colleagues what options are available at your location."
  utter_APS_NW_lan_precheck_cwlan_wlanaus:
    - text: "Aktiviere das WLAN-Signal auf deinem Gerät neben der Datum-/Uhranzeige bzw. dem Lautsprechersymbol und/oder führe ein Reboot aus. Dann versuche die CWLAN-Verbindung erneut."
    - text: "Enable the Wi-Fi signal on your device next to the date/time display or the speaker symbol and/or reboot it. Then try the Wi-Fi connection again."
  utter_APS_NW_lan_precheck_kabellan:
    - text: "Direkte LAN-Verbindung wird zwar an jedem Telekom-Standort zur Verfügung gestellt, aber nicht jedes Netzwerk wird direkt von unserem Support betreut. ITENOS und T-SHOP-Netzwerke bilden da eine Ausnahme."
    - text: "Direct LAN connections are available at every Telekom location, but not every network is directly managed by our support team. ITENOS and T-SHOP networks are an exception."
  utter_APS_NW_lan_tshop:
    - text: "WLAN ZTN (in den Own-Shops) und WLANTPP (in den Partneragenturen) Drahtlosnetzwerk in den T-Shops ist für die Tablets und Logistikscanner vorgesehen. Mit einem Notebook und Cisco AnyConnect kann keine Verbindung über diese Netzwerke aufgebaut werden. Wenn sich ein Shop-Mitarbeiter mit Nucleus Notebook per VPN/AnyConnect ins DTAG-Firmennetz einwählen möchte, muss er sich über ein vorhandenes WLAN (Magenta TV-Vorführanschluss, Telefonie-Anschluss, Prüfanschluss), UMTS/LTE oder den HotSpot im Shop verbinden. Eine komplette Rechnerneuinstallation (PXE) ist in T-Shops nicht möglich. Das Notebook muss an einen Telekom Standort gebracht werden - Information über solche Telekom Standorte kannst du entweder von deinem Vorgesetzten, deinem Shopleiter oder seinem Vertreter erhalten."
    - text: "WLAN ZTN (in the own shops) and WLANTPP (in the partner agencies) are wireless networks in the T-Shops that are intended for the tablets and logistics scanners; a connection cannot be established via these networks with a notebook and Cisco AnyConnect. If a shop employee with a Nucleus notebook wants to get connected into the DTAG company network via VPN/AnyConnect, they must connect via an existing WLAN (Magenta TV demonstration connection, telephony connection, test connection), UMTS/LTE or the hotspot in the shop. A complete computer reinstallation (PXE) is not possible in T-Shops; the notebook must be brought to a Telekom location - you can get information about such Telekom locations from your supervisor, your shop manager or his representative."
  utter_APS_NW_lte_nichterkannt_esimaktiv:
    - text: "Stelle unter den Mobilfunkeinstellungen eSIM auf SIM um."
    - text: "Switch eSIM to SIM under the Windows mobile settings."
  utter_APS_NW_lte_nichterkannt_generell:
    - text: "Bei Problemen mit der Erkennung des eingebauten LTE-Adapters ist es unbedingt sicherzustellen, dass kein Netzwerkkabel über den LAN-Anschluss verbunden ist, da dann alle Drahtlosverbindungen deaktiviert sind - LTE-Verbindung wird über den selben Netzwerkadapter weiter verarbeitet, der für den normalen WLAN-Verbindungsaufbau zuständig ist."
    - text: "If you have issues detecting the built-in LTE adapter, it is essential to ensure that no network cable is connected via the LAN port, as this will deactivate all wireless connections - LTE connections are processed via the same network adapter that is responsible for establishing the normal WLAN connection."
  utter_APS_NW_lte_nichterkannt_simsperre:
    - text: "Stelle sicher, dass die SIM-Karte nicht gesperrt ist. Versuche bitte die SIM in ein anderes Gerät einzustecken, oder falls es in ein Handy reinpasst, dann führe dort eine Deaktivierung durch die Eingabe der PIN-Nummer der SIM durch. Du kannst eventuell unter den Windows-Einstellungen Mobilfunk - Verbindungseinstellungen nehmen und dort einen Sperr-Check durchführen."
    - text: "Make sure that the SIM card is not locked. Please try inserting the SIM into another device, or if it fits into a cell phone, then deactivate it by entering the SIM PIN number. You also may be able to go to the Windows settings, mobile network - connection settings and perform a lock check there."
  utter_APS_NW_netzstorungen_generell:
    - text: "Innerhalb der Telekom-Netzwerkumgebung kann es zu unterschiedlichen Störungen kommen. Hierbei ist zu unterscheiden, ob die Störung generell remote über den Cisco AnyConnect Client oder direkt im Büro am Firmennetzwerk über Kabel/WLAN angeschlossen auftaucht."
    - text: "Different types of issues can occur within the Telekom network environment. It is important to consider whether the issue generally occurs remotely via the Cisco AnyConnect client or directly in the office connected to the company network via cable/WLAN."
  utter_APS_NW_vpn_aktiverinternet_nichtverbunden:
    - text: "Um die VPN-Verbindung über den Cisco AnyConnect aufzubauen, ist eine aktive Internetverbindung notwendig. Aktiviere den WLAN-Adapter falls er momentan deaktiviert ist. Lasse deinen Laptop sich über einen WLAN-Router oder einen Mobile-HotSpot ins Internet einwählen. Falls vorhanden, kannst du auch den Router über Kabel verbinden."
    - text: "To establish the VPN connection via Cisco AnyConnect, an active Internet connection is required. Activate the WLAN adapter if it is currently deactivated and let your laptop access the Internet via a WLAN router or a mobile hotspot. If available, you can also connect the router via cable."
  utter_APS_NW_vpn_dnknaw_tunnelfreischaltung:
    - text: "Neue Rechner müssen nach der Übernahme einmal auf unserem DHCP-Server registriert werden. Es erfolgt entweder über das Firmen-LAN im Büro einfach durch das Anschließen des LAN-Kabels oder im HomeOffice durch das Tunnelfreischaltung-Verfahren, zu dem unbedingt die Unterstützung eines Agenten notwendig sein wird."
    - text: "New computers must be registered on our DHCP server once they have been taken over. This can be done either via the company LAN in the office by simply connecting the LAN cable or in the home office by using the tunnel activation process, which requires the support of an agent."
  utter_APS_NW_vpn_fm_eskaszv:
    - text: "Wenn du kürzlich dein Domainpasswort (EMEA1 \\ A-Kennung) geändert hast, kann es sein, dass am Rechner immer noch das \"alte\" Domänenpasswort gespeichert ist.  Der Rechner sollte kurz zum Accountserver Kontakt aufnehmen, dann mit bekommen, dass du mittlerweile ein neues Passwort vergeben hast. So wäre es möglich, das lokal-gecachte Passwort zu überschreiben."
    - text: "If you have recently changed your domain password (EMEA1 \\ A identifier), it is possible that the “old” domain password is still stored on the computer.  The computer should briefly contact the account server and then be informed that you have now assigned a new password. This would make it possible to overwrite the locally cached password."
  utter_APS_NW_vpn_fm_eskaszv_erstanmeldung_neuanmeldung:
    - text: "Du sollst dich einmal offline mit deinem alten, gecachten Passwort anmelden, dann die VPN-Verbindung über den Cisco AnyConnect herstellen, anschließend den Rechner sperren. Dann warte kurz ab und entsperre dann mit dem neuen Passwort den Rechner erneut."
    - text: "You should log in offline once with your old, cached password, then establish the VPN connection via Cisco AnyConnect, then lock the computer. Then wait a moment and then unlock the computer again with the new password."
  utter_APS_NW_vpn_fm_paf_mycardziehen:
    - text: "Falls die Fehlermeldung \"Posture Assessment Failed\" beim VPN-Verbindungsversuch erscheint, dann ziehe bitte die MyCard aus dem Kartenleser heraus und teste danach die VPN-Verbindung erneut."
    - text: "If the error message \"Posture Assessment Failed\" appears when attempting to connect to the VPN, please remove the MyCard from the card reader and then test the VPN connection again."
  utter_APS_NW_vpn_fm_verbindenausgegraut:
    - text: "If the \"Connect\" button is deactivated, the following workarounds can help:\n1. First, remove the MyCard if it is plugged in and test the connection again.\n2. Make sure that a power cable is plugged in.\n3. If available, use a LAN cable to connect.\n4. Instead of an automatic WiFi connection, connect your laptop to the desired WiFi network manually.\n5. Put the computer in airplane mode for a short time and then deactivate it again.\n6. If none of the mentioned points have helped, restart the computer."
    - text: "Wenn der „Verbinden”-Button ausgegraut ist, können die folgenden Workarounds helfen:\n1.\tZiehe erstmal die MyCard raus, falls sie gesteckt ist und teste die Verbindung erneut.\n2.\tAchte darauf, dass ein Stromkabel steckt.\n3.\tFalls vorhanden, nimm zur Verbindung ein LAN-Kabel.\n4.\tStatt automatischer WLAN-Verbindung, verbinde dein Laptop mit dem gewünschten WLAN-Netzwerk manuell.\n5.\tSetze den Rechner kurzzeitig in Flugmodus und nach kurzer Zeit deaktiviere den.\n6.\tFalls keine der genannten Punkte geholfen haben, starte den Rechner neu."
  utter_APS_NW_vpn_fm_vertrauenswürdigesnetzwerk:
    - text: "Du scheinst bereits mit einem internen Netzwerk (z.B. CWLAN, LAN) verbunden zu sein.Aus dem internen Netzwerk heraus kann keine (extra) VPN-Verbindung aufgebaut werden. Das ist leider technisch nicht möglich und produziert die Fehlermeldung in Bezug auf die bestehende vertrauenswürdige Netzwerkanbindung. "
    - text: "An (extra) VPN connection cannot be established from the internal network (e.g. CWLAN, LAN). Dial-in from the internal network has been made technically impossible - this produces the error message in relation to the existing trusted network connection."
  utter_APS_NW_vpn_fm_vseb:
    - text: "Sollte Cisco AnyConnect während des Verbindungsaufbaus nach einem Browser verlangen, dann ist es fast sicher, dass sich dein Laptop mit einem HotSpot verbunden hat und das HotSpot wird erst nach der Eingabe des dazu gehörigen WLAN-Passworts aktiv geschaltet. Nach Erscheinen der Fehlermeldung öffne bitte eine beliebige Website (bspw. google.de) in einem beliebigen Browser (Edge, Chrome, Firefox etc.). Normalerweise wird man dann auf die Anmeldeseite des Hotspot-Anbieters (bspw. Telekom, Vodafone, in Hotels, in Cafés etc.) weitergeleitet und die HotSpot-Anmeldung sollte dann somit möglich sein. Falls beim Aufrufen einer Website keine Weiterleitung zur HotSpot-Anmeldeseite erfolgt, dann hilft es, die Verbindung zum HotSpot nochmal aufzubauen (WLAN-Verbindungen trennen und neu verbinden). Nach der Bestätigung auf der Hotspot-Anmeldeseite wird der Cisco AnyConnect Secure Mobility Client die Internetverbindung erkennen und die VPN-Einwahl automatisch abschließen."
    - text: "If Cisco AnyConnect asks for a browser when establishing the connection, then it is almost certain that your laptop has connected to a hotspot and the hotspot will only be activated after you enter the corresponding WLAN password. After the error message appears, please open any website (e.g. google.de) in any browser (Edge, Chrome, Firefox, etc.). You will then normally be redirected to the login page of the hotspot provider (e.g. Telekom, Vodafone, in hotels, in cafés, etc.) and you should then be able to log in to the hotspot. If you are not redirected to the hotspot login page when you open a website, it helps to establish the connection to the hotspot again (disconnect WLAN connections and reconnect). After confirmation on the hotspot login page, the Cisco AnyConnect Secure Mobility Client will recognize the Internet connection and complete the VPN dial-in automatically."
  utter_APS_NW_vpn_fm_wlav_anmeldevoraussetzung:
    - text: "Da die VPN-Verbindung so genannt User- und Rechner abhängig ist, bitten wir dich darum, dich mit deiner eigenen EMEA-Kennung anzumelden. Dies ist wichtig, um auf dem VPN-Server als zugelassener User erkannt zu werden. Solange auf dem Rechner jemand anderer als der Besitzer selber eingeloggt ist, bleibt die Meldung \"White List Access\" vorhanden und die VPN-Verbindung bleibt dadurch solange blockiert, bis sich der in myIT eingetragene Besitzer anmeldet."
    - text: "Since the VPN connection is user and computer dependent, we ask you to log in with your own EMEA ID. This is important in order to be recognized as an authorized user on the VPN server. As long as a user other than the owner is logged in to the computer, the \"White List Access\" message remains and the VPN connection remains blocked until the owner registered in myIT logs in."
  utter_APS_NW_vpn_fm_wlav_besitzeraufforderung:
    - text: "Cisco AnyConnect lässt nur dem in MyIT eingetragenen Besitzer zu, die VPN-Verbindung auf einem bestimmten Rechner aufzubauen. Falls du den Rechner nicht als Besitzer nutzt, lass ihn auf deinen Namen umschreiben, damit die VPN-Verbindung ohne Einschränkungen zu Stande kommt. Sollte der Besitzerwechsel schon bereits in Bearbeitung sein, dann warte bitte mindestens 48 Stunden ab, bis die erneuerten Userdaten in allen Systemen aktiv geschaltet werden."
    - text: "Cisco AnyConnect only allows the owner registered in MyIT to establish the VPN connection on a specific computer. If you are not the owner of the computer, have it re-registered under your name so that the VPN connection can be established without restrictions. If the change of ownership is already in process, please wait at least 48 hours until the updated user data is activated in all systems."
  utter_APS_NW_vpn_hotspot:
    - text: "Mit Cisco AnyConnect wird eine weitere Möglichkeit bereitgestellt, sich von unterwegs in das Corporate Network der Telekom (CNDTAG) einzuwählen. Mit der Aktualisierung dieses Services können sich alle Nutzer neben den bereits vorhandenen Verbindungsoptionen, wie zum Beispiel UMTS/LTE, auch über einen öffentlichen HotSpot mit dem Netzwerk der Telekom verbinden. Weiteres über die Voraussetzungen bzw. Telekom-HotSpot-Einwahlmöglichkeiten sind unter den folgenden Links [1st YAMU-Link](https://tiny.telekom.de/2bvqbkby) und [2nd YAMU-Link](https://tiny.telekom.de/ita4p4zt) zu finden."
    - text: "Cisco AnyConnect provides another option for dialing into Telekom's corporate network (CNDTAG) while on the move. With the update of this service, all users can connect to Telekom's network via a public hotspot in addition to the existing connection options, such as UMTS/LTE. Further information on the requirements and Telekom hotspot dial-in options can be found under the following links: [1st YAMU link](https://tiny.telekom.de/2bvqbkby) and [2nd YAMU link](https://tiny.telekom.de/ita4p4zt)."
  utter_APS_NW_vpn_kreuztest:
    - text: "Kreuztests sind auch hilfreich dabei, den Grund der Störung zu lokalisieren. Nimm ein Netzwerkmedium, das sich vom jetzigen abweicht: DSL WLAN → DSL KABEL oder DSL KABEL → DSL WLAN oder DSL WLAN → Handy HotSpot usw. Beobachte dann einfach, ob die VPN-Verbindung mit einem anderen Medium hergestellt werden kann."
    - text: "Cross tests are also helpful in locating the cause of the issue. Use a network medium that differs from the current one: DSL WLAN → DSL CABLE or DSL CABLE → DSL WLAN or DSL WLAN → mobile hotspot etc. Then simply observe whether the VPN connection can be established using a different medium."
  utter_APS_NW_vpn_routerundrechnerreboot:
    - text: "An dieser Stelle starte sowohl den Router als auch deinen Laptop folgendermaßen neu:\n1. Schliesse alle Programme/ Prozesse auf dem Rechner. \n2. Fahre den Rechner vollständig herunter. \n3. Starte den Router neu indem du das Netzteil entfernst, grob 30Sekunden wartest. Schliesse das Netzteil wieder an und warte nun bis alle LED-Lämpchen wieder leuchten. \n4. Jetzt kannst du den Rechner wieder neu starten."
    - text: "At this point, restart both the router and your laptop as follows:\n1. close all programmes/processes on the computer \n2. shut down the computer completely \n3. restart the router by removing the power supply unit, wait roughly 30 seconds. Reconnect the power supply and wait until all LED lights come on again. \n4. now you can restart the computer again"
  utter_APS_SW_deinstallation_laeuft_auf_fehler:
    - text: "Falls bei dir Probleme mit dem Ausführen einer Deinstallation - erkennbar durch die \"DEL\"-Prefix im Software Center - auftauchen würden, kannst du folgendes ausprobieren: Alle Programme schließen und Rechnerneustart durchführen und danach die betroffene Deinstallation erneut ausführen. Geöffnete Programme können die Deinstallation blockieren, bei Webex, OneNote, Citrix (zB.) sind im Infobereich noch laufende Tasks zu finden, diese bitte im Task-Manager auch prüfen und ggf. schliessen. Prüfe bitte auch, ob im Software Center noch wichtige Windows-Updates anstehen, die noch nicht durchgelaufen sind oder einen Neustart anfordern. In solchen Fällen empfiehlt es sich, die Updates vollständig zu installieren und einen Rechnerneustart durchzuführen."
    - text: "If you encounter problems with executing an uninstallation - recognizable by the \"DEL\" prefix in the Software Center - you can try the following: Close all programs and restart your computer, then run the affected uninstallation again. Open programs can block the uninstallation, with Webex, OneNote, Citrix (for example), there are still running tasks to be found in the info area, please also check these in the Task Manager and close if necessary. Please also check whether there are any important Windows updates pending in the Software Center that have not yet been completed or are requesting a restart. In such cases, it is recommended to fully install the updates and restart your computer."
  utter_APS_SW_foxit_generell:
    - text: "Der Foxit PDF-Editor ist ein vollwertiger PDF Editor zum Erstellen, Bearbeiten, Anzeigen und Drucken von PDF-Dateien. Er stellt eine Alternative zum Adobe Acrobat dar. Bitte prüfe vor Bestellung, ob die kostenfreie Alternative PDF-XChange Editor für die täglich Arbeit ausreichend ist."
    - text: "The Foxit PDF Editor is a full-fledged PDF editor for creating, editing, viewing, and printing PDF files. It represents an alternative to Adobe Acrobat. Please check before ordering whether the free alternative PDF-XChange Editor is sufficient for daily work."
  utter_APS_SW_foxit_nutzungsfragen:
    - text: "Um mehr über die alternativen PDF-Applikationen zu erfahren, schaue dir am besten die folgenden Links an: (1) [PDF XChange Editor Plus - Features](https://tiny.telekom.de/3wp) oder (2) [Foxit PDF-Editor Pro - Features](https://tiny.telekom.de/bvffu1qi)"
    - text: "To learn more about alternative PDF applications, it's best to check out the following links: (1) [PDF XChange Editor Plus - Features](https://tiny.telekom.de/3wp) or (2) [Foxit PDF-Editor Pro - Features](https://tiny.telekom.de/bvffu1qi)"
  utter_APS_SW_foxit_problem_pdfexport:
    - text: "Hast du Interesse daran, wie Mails inklusive Anlagen mithilfe von Foxit als PDF exportiert werden können? Dann stelle dazu bitte folgendes ein: in Outlook unter dem Reiter Foxit PDF → Allgemeine Einstellungen → Erweitert anklicken → im kommenden Fenster in der Mitte unter Anwendungseinstellungen → Haken bei Anhang einbeziehen setzen"
    - text: "Are you interested in how emails, including attachments, can be exported as PDF using Foxit? Then please set the following: in Outlook under the Foxit PDF tab → General Settings → click Advanced → in the upcoming window in the middle under Application Settings → check Include Attachment."
  utter_APS_SW_foxit_problem_standardprogramm:
    - text: "Wird Foxit PDF Editor gestartet und danach kommt eine Abfrage, dass das Programm als Standardprogramm für die PDF Vorschau festgelegt werden soll? Diese Abfrage kann im Foxit PDF Editor ausgeschaltet werden, unter: Datei -> Einstellungen -> Dateizuordnungen -> Haken von \"Diese Prüfung bei jedem Start von Foxit PDF Editor ausführen\" entfernen."
    - text: "Does Foxit PDF Editor start and immediately afterwards a query appears asking if the program should be set as the default program for PDF preview? This query can be turned off in Foxit PDF Editor, under: File -> Settings -> File Associations -> Remove check from \"Perform this check every time Foxit PDF Editor starts\"."
  utter_APS_SW_ilaf_swbezeichnung_biosupdate:
    - text: "Bei der Installation des BIOS-Updates sind einige technischen Voraussetzungen zu beachten:\n1. Der Rechner muss direkt über das Stromkabel am Strom angeschlossen sein. Es ist auch möglich, die Stromversorgung entweder über die Dockingstation angeschlossen oder direkt mit dem Reise-Netzteil des Laptops zu unternehmen.\n2. Der Akku muss über 40% Ladekapazität haben. \n3. Es darf keine externe Festplatte oder SD-Karte dem Rechner angeschlossen sein."
    - text: "When installing the BIOS update, a few technical requirements must be fit:\n1. The computer must be connected to the power supply directly via the power cable. It is also possible to connect the power supply either via the docking station or directly using the laptop's travel power adapter.\n2. The battery must have over 40% charge capacity.\n3. No external hard drive or SD card may be connected to the computer."
  utter_APS_SW_ilaf_swbezeichnung_drvutilpack:
    - text: "Beachte, bitte, dass es während der Installation von DrvUtilPack keine externen Peripherien wie HDMI Anschluss, SD/MMC Karten, USB-Sticks angeschlossen sein dürfen. Solltest du einige doch angeschlossen haben, dann stecke die alle aus und lass die Installation weiter laufen. Wenn es in dem Laptop externe Geräte doch angeschlossen bleiben, kann es oft zu einem Bluescreen kommen. Wenn die Peripherien dabei aber entfernt werden und der Laptop einmal neu gestartet wird, läuft die Installation automatisch weiter."
    - text: "Please note that no external peripherals such as HDMI ports, SD/MMC cards, USB sticks may be connected during the installation of DrvUtilPack. If you have some connected, unplug them all and let the installation continue. If external devices remain connected to the laptop, a blue screen can often occur. However, if the peripherals are removed and the laptop is restarted, the installation will continue automatically."
  utter_APS_SW_ilaf_swbezeichnung_drvutilpack_fm_eplorerexe:
    - text: "Die Fehlermeldung \"explorer.exe - Systemfehler\" kann während der DrvUtilPack-Installation leicht vorkommen, deutet aber auf nichts Schwerwiegendes hin. Falls du auf \"OK\" klickst, wird zwar der Explorer neu gestartet, die Installation des Treibers läuft hier aber weiter. Nach der Installation des Treiberpakets soll der Rechner (in einigen Fällen sogar mehrmals) neu gestartet werden. Dieser wird aber sowieso vom Software Center angefordert."
    - text: "The error message \"explorer.exe - system error\" can easily occur during the DrvUtilPack installation, but it does not indicate anything serious. If you click \"OK\", Explorer will restart, but the driver installation will continue. After installing the driver package, the computer should be restarted (in some cases even several times). However, this is requested by the Software Center anyway."
  utter_APS_SW_installation_laeuft_auf_fehler:
    - text: "Falls es bei dir Probleme mit dem Ausführen einer Installation - erkennbar durch den \"ADD\"-Prefix im Software Center - auftauchen würden, kannst du folgendes ausprobieren: Alle Programme schließen und Rechnerneustart durchführen und danach die betroffene Installation erneut ausführen."
    - text: "If you have issues running an installation - recognizable by the \"ADD\" prefix in the Software Center - you can try the following: Close all programs and restart your computer, then run the affected installation again."
  utter_APS_SW_installation_laeuft_auf_fehler_winupdates:
    - text: " Prüfe bitte auch, ob im Software Center noch wichtige Windows-Updates anstehen, die noch nicht durchgelaufen sind oder einen Neustart anfordern. In solchen Fällen empfiehlt es sich, die Updates vollständig zu installieren und einen Rechner Neustart durchzuführen."
    - text: "Please also check whether there are any important Windows updates pending in the Software Center that have not yet been completed or that require a restart. In such cases, it is recommended that you install the updates completely and restart your computer."
  utter_APS_SW_installationsschleife:
    - text: "Falls das Download Problem nur seit ein paar Stunden besteht, warte bitte noch mindestens bis zu 48 Stunden, da die Downloadzeit aufgrund der Paketgröße variiert."
    - text: "If the download problem has only been occurring for a few hours, please wait at least 48 hours, as the download time varies depending on the package size."
  utter_APS_SW_installationsschleife_zeitnichtvorbei:
    - text: "Falls die Installation nach 48 Stunden immer noch nicht startet bzw. der Download immer noch nicht durch ist, öffne das Ticket anhand der per E-Mail zugesandten Ticketnummer über das [Incident Portlet](https://inmportlet-myit.t-systems.com/INMPortlet) neu. Unser Support Team kümmert sich danach so schnell wie möglich um die Weiterbearbeitung."
    - text: "If the installation still does not start after 48 hours or the download is still not complete, reopen the ticket using the ticket number sent to you by email via the [Incident Portlet](https://inmportlet-myit.t-systems.com/INMPortlet). Our support team will then take care of further processing as quickly as possible."
  utter_APS_SW_skna_internetdownload:
    - text: "Softwareinstallation aus nicht geschützten Quellen wie Internet oder externe Peripherien ist einerseits gemäß Konzernrichtlinien andererseits aufgrund fehlender Administratorenrechte nicht gestattet bzw. möglich. Um eine gewünschte Software zu bekommen,  wende dich entweder an deinen Kostenstellenverantwortlichen oder bestelle diese falls vorhanden - über myIT direkt.\nNur die für Nucleus zertifizierten Applikationen werden supportet. Softwareliste hier: [YAM-Link](https://tiny.telekom.de/vl7i5xdm)"
    - text: "Software installation from unprotected sources such as the Internet or external peripherals is not permitted or possible in accordance with Group guidelines or due to a lack of administrator rights. To obtain the desired software, either contact your cost center manager or, if available, order it directly via myIT.\nOnly applications certified for Nucleus are supported. Software list here: [YAM-Link](https://tiny.telekom.de/vl7i5xdm)"
  utter_APS_SW_skna_neubestellung:
    - text: "Nach Neubestellung einer Applikation kann es bis zu 48 Stunden dauern, bis die tatsächliche Zuweisung erfolgt. Normalerweise geht es schnell, aber alles liegt an dem Zeitstempel der Genehmigung, wann dir das Softwarepaket vom Automaten bereitgestellt wird. Wenn du dir unsicher bist, ob deine Softwarebestellung genehmigungspflichtig ist, prüfe es am besten in myIT unter den Bestellinformationen.  Weitere Informationen kannst du bei deinem Kostenstellenverantwortlichen einholen."
    - text: "After ordering a new application, it can take up to 48 hours for the actual allocation to take place. Normally it is fast, but it all depends on the time stamp of the approval when the software package is provided to you by the vending machine. If you are unsure whether your software order is subject to approval, it is best to check it in myIT under the order information.  You can obtain further information from your cost center manager."
  utter_APS_SW_skna_stoerungsbeseitigung_swcheck:
    - text: "Falls ein Softwarepaket schon installiert wurde, wird das gewünschte Paket durch eine normale Installationszuweisung am Rechner nicht mehr ankommen. Um den Zustand der Installation der Softwarepakete zu prüfen, öffne das ClientInfo über das Start-Menü und nimm den Reiter \"Software\" und suche einfach nach dem Softwarenamen. Wenn du die Software in der Liste findest und sie den Status \"Installiert/Installed\" hat, dann bedeutet das, dass die Softwareinstallation seit längerem erfolgt ist. Da hast du nichts Weiteres zu berücksichtigen.\n"
    - text: "If a software package is already installed, the desired package will no longer arrive or be reassigned through a normal installation assignment on the computer. To check the status of the installation of some software packages, open the ClientInfo via the Start menu and select the \"Software\" tab and simply search for the expected software name. If the name is included in the list and has the status \"Installed/Installed\", then it means that the software installation has been done for a long time. You have nothing else to consider."
  utter_APS_SW_softwarestoerungen_generell:
    - text: "Probleme, die während der (De-)Installation von Softwarepaketen auftreten, können von einander in der Art sehr abweichend sein. Um dich am optimalsten zu unterstützen, wähle bitte eins von den aufgelisteten Problemfeldern aus."
    - text: "Problems that occur during the (de-)installation of software packages can vary greatly from each other in nature. To support you in the best possible way, please choose one of the listed problem areas."
  utter_Accountnavigator_PW_zuruecksetzen:
    - text: "Die Anmeldung an Accountnavigator erfolgt generell über MyPortal mit Hilfe der MyCard.  "
    - text: "Registration for Accountnavigator is generally done through MyPortal using the MyCard."
  utter_AuthenticatorApp_PW_zuruecksetzen:
    - text: "Link zur Anleitung der Installation und Einrichtung findest du hier: [YAM-Link](https://tiny.telekom.de/iq20596i)\n\nMöchtest du die Multi-Faktor-Authentifizierung (MFA) zurücksetzen? Du erfährst weitere Informationen hier: [YAM-Link](https://tiny.telekom.de/fwibn394)\n\nZeigt die App die Meldung \"Authenticator gesperrt\" an, dann melde dich bitte entweder mit der Touch-ID oder dem Gerätepasscode an."
    - text: "You can find the link to the installation and setup guide here: [YAM-Link](https://tiny.telekom.de/iq20596i)\n \nDo you want to reset the Multi-Factor Authentication (MFA)?  You can find more information here: [https://tiny.telekom.de/fwibn394)\n \nDoes the app show the message \"Authenticator locked\"? Then please log in either with the Touch-ID or the device passcode."
  utter_AvayaAgent_PW_zuruecksetzen:
    - text: "Also du hast ein Problem mit deinem Avaya Agent Passwort. Hier kann ich leider nicht weiterhelfen. Wende dich bitte an folgende [Hotline](+498003307877) → Auswahl 2."
    - text: "So you have a problem with your Avaya Agent password. Unfortunately, I can't help you here. Please contact the following [hotline](+498003307877) → option 2."
  utter_BIOS_PW_zuruecksetzen:
    - text: "Ich habe verstanden, du hast ein Thema mit dem BIOS-Passwort. BIOS-Passwörter werden leider nicht kommuniziert."
    - text: "I understand you have an issue with the BIOS password. Unfortunately, BIOS passwords are not communicated."
  utter_BISBISS_PW_zuruecksetzen:
    - text: "DFMG BESTANDSINFORMATIONSSYSTEM_BIS Wirkbetriebsverantwortung liegt bei Reinhard Harmann, Erreichbarkeit: [Reinhard Harmann](mailto:reinhard.harmann@dfmg.de) oder unter [+49 251 1338 2012](+4925113382012)\n\nBISSKDM Wirkbetriebsverantwortung liegt bei Harald Huwer, Errechbarkeit: [Harald Huwer](mailto:Harald.Huwer@t-systems.com) oder unter [+49 681 909 2237](tel:+496819092237)\n\nBISS TECHNIK Wirkbetriebsverantwortung liegt bei Nimbus.\nLink zum Nimbus Störungsportal: [Nimbus Support](https://nimbus.telekom.de/arsys/forms/nim-produktion.telekom.de/NIM-Kundenportal/Kundenportal/?cacheid=8eac1e50)\nNimbushotline: [+49 800 330 7877](tel:+498003307877)"
    - text: "DFMG INVENTORY INFORMATION SYSTEM_BIS operational responsibility lies with Reinhard Harmann, contact: [Reinhard Harmann](mailto:reinhard.harmann@dfmg.de) or at [+49 251 1338 2012](+4925113382012)\n\nBISSKDM operational responsibility lies with Harald Huwer, contact: [Harald Huwer](mailto:Harald.Huwer@t-systems.com) or at [+49 681 909 2237](tel:+496819092237)\n\nBISS TECHNIK operational responsibility lies with Nimbus.\nLink to the Nimbus fault portal: [Nimbus Support](https://nimbus.telekom.de/arsys/forms/nim-produktion.telekom.de/NIM-Kundenportal/Kundenportal/?cacheid=8eac1e50)\n Nimbus hotline: [+49 800 330 7877](tel:+498003307877)"
  utter_Bomgar_PW_zuruecksetzen:
    - text: "Ich habe verstanden, du hast eine Anfrage zum Bomgar-Login. In Bomgar kannst du dich mit deiner A-Kennung und dem Windows Passwort anmelden. Für die Rücksetzung des EMEA Passworts nutze bitte die [passwort.telekom.de](passwort.telekom.de) Seite."
    - text: "I understood you have a request for Bomgar login. In Bomgar, you can log in with your A-identification and the Windows password. For resetting the EMEA password, please use the [passwort.telekom.de](passwort.telekom.de) page."
  utter_CAIMAN_PW_zuruecksetzen:
    - text: "CAIMAN erreicht man in der Regel über [myPortal](myportal.telekom.de). Falls es Probleme mit der Anmeldung auftreten, berücksichtige die Anmeldekriterien, die dein EMEA-/CIAM Passwort betreffen. Um mehr über das Thema zu erfahren, nimm diesen [CAIMAN-YAM-Link](https://tiny.telekom.de/cggsuaxc)."
    - text: "CAIMAN is usually accessed via [myPortal](myportal.telekom.de). If you experience problems logging in, consider the login criteria that relate to your EMEA/CIAM password. To learn more about the topic, use this [CAIMAN-YAM-Link](https://tiny.telekom.de/cggsuaxc)."
  utter_CIAM_PW_zuruecksetzen:
    - text: "Das Selfserviceportal zur CIAM Passwort Verwaltung (auch für technische Accounts wie ROBOT und GRP) erreichen Sie unter folgendem [Link](https://myportal-websso.corp.telekom.de/ciam/ciam.ui.selfregistration/pwdmanagementpage/)\n\nTipp des Tages: Neu setzen des Passworts, entsperrt auch den Account.\n\nDas CIAM-Passwort hat eine Gültigkeitsdauer von einem Jahr!\nDas Passwort muss mindestens 12 Zeichen lang sein.\nDas Passwort darf nicht länger als 16 Zeichen sein.\nDas neue Passwort muss sich von den letzten 5 Passwörtern unterscheiden.\nDas Passwort muss drei von vier der folgenden Zeichenklassen enthalten:\nKleinbuchstaben (a-z)\nGroßbuchstaben (A-Z)\nZiffern (0-9)\nFolgende Sonderzeichen: ~ ! # $ % ^ & * ( ) _ - + =  [ ] \\ | : ; \" ' < > , . ? /\nDas Passwort darf keine sonstigen Zeichen enthalten.\n\nWenn das CIAM Passwort zu oft falsch eingegeben wird, aktiviert sich eine so genannte Passwortsperre - in diesem Fall kannst du für dich das Passwort selbst auch auf der MyPortal Startseite unter \"Passwort vergessen / Forgotten your password\" neu setzen.\n\nSolltest du die Antwort auf die geheime Frage (persönliche Frage) zu oft falsch eingegeben haben oder nicht mehr wissen, dann aktiviert sich eine so genannte Fragesperre. In diesem Fall öffne ein Ticket über myIT: [Incident Management Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/home)"
    - text: "You can access the self-service portal for CIAM password management (also for technical accounts such as ROBOT and GRP) at the following [link](https://myportal-websso.corp.telekom.de/ciam/ciam.ui.selfregistration/pwdmanagementpage/)\n \nTip of the day: Resetting the password also unlocks the account.\n\nThe CIAM password has a validity period of one year!\nThe password must be at least 12 characters long.\nThe password must not be longer than 16 characters.\nThe new password must differ from the last 5 passwords.\nThe password must contain three of the four following character classes:\nLowercase letters (a-z)\nUppercase letters (A-Z)\nDigits (0-9)\nThe following special characters: ~ ! # $ % ^ & * ( ) _ - + =  [ ] \\ | : ; \" ' < > , . ? /\nThe password may not contain any other characters.\n\nIf the CIAM password is entered incorrectly too many times, a so-called password lock is activated - in this case, you can reset the password yourself on the MyPortal homepage under \"Forgot password / Forgotten your password\".\n\nIf you have entered the answer to the secret question (personal question) incorrectly too many times or no longer know it, a so-called question lock is activated. In this case, open a ticket via myIT: [Incident Management Portal](https://inmportlet-myit.t-systems.com/INMPortlet#/home)"
  utter_CICDSolutions_PW_zuruecksetzen:
    - text: "Sollte das Passwort bei CI/CD Solutions gesperrt sein, besteht die Möglichkeit dieses selbstständig unter folgendem Link zu entsperren oder zurückzusetzen:  [CICD Solutions Konto entsperren](https://home.devops.telekom.de/de/selfservice/request_unlock_user/new)"
    - text: "Should the password be locked at CI/CD Solutions, there is the possibility to unlock or reset it independently at the following link: [Unlock CICD Solutions Account](https://home.devops.telekom.de/de/selfservice/request_unlock_user/new)"
  utter_CISCO_VPN_leitunggabbrueche_netzteil:
    - text: "Bei vielen modernen Rechnern taktet im Idle (Ruhephase des Rechners) während des Akkubetriebs die CPU so weit runter, dass es zu Problemen bei der Einwahl mit dem Cisco AnyConnect kommen kann. Einwahlprobleme wurden vor allem beobachtet, wenn der Akku weniger als 20% Ladezustand hat, da hier dann teilweise auch die Akku-Spannung nachlässt. Empfehlung: Schließe bitte dein Notebook an das Netzteil an und versuche die Einwahl erneut."
    - text: "In many modern computers, during battery operation, the CPU clocks down so much in idle (computer's resting phase) that there can be problems with the connection using Cisco AnyConnect. Connection problems have been observed especially when the battery has less than 20% charge, as the battery voltage sometimes drops here. Recommendation: Please connect your notebook to the power supply and try the connection again."
  utter_CISCO_VPN_leitunggabbrueche_routerdirekt:
    - text: "Der Rechner ist bspw. per WLAN mit einem AccessPoint oder per DLAN über das Stromnetz mit dem Router verbunden. Hierbei kommt es öfter vor, dass Verbindungsstörungen oder Verbindungsausfälle auftreten. Tausche bitte das Netzwerkkabel zwischen dem Notebook und dem Router und prüfe die VPN-Verbindung nochmals. Falls keine LAN-Verbindung möglich ist, stelle eine Direkt-Verbindung per WLAN in Sichtweite vom Router her - wenn es möglich ist, wechsle WLAN von 2.4GHz auf 5GHz oder von 5GHz auf 2.4GHz."
    - text: "The computer is, for example, connected via WLAN to an AccessPoint or via DLAN through the power grid to the router. It often happens that connection issues or connection failures occur. Please exchange the network cable between the notebook and the router and check the VPN connection again. If no LAN connection is possible, establish a direct connection via WLAN in sight of the router - if possible, switch WLAN from 2.4GHz to 5GHz or from 5GHz to 2.4GHz."
  utter_CISCO_VPN_leitungsabbreuche_reboot:
    - text: "Starte sowohl den Router als auch deinen Laptop folgendermaßen neu: 1. Schliesse alle Programme/ Prozesse auf dem Rechner. 2. Fahre den Rechner vollständig herunter. 3. Starte den Router neu indem du das Netzteil entfernst, grob 30Sekunden wartest. Schliesse das Netzteil wieder an und warte nun bis alle LED-Lämpchen wieder leuchten. 4. Jetzt kannst du den Rechner wieder neu starten.\nBeachte bitte, dass ggf. WLAN-Access-Points, DLAN-Geräte, Switche etc. auch entfernt werden müssen!"
    - text: "At this point, restart both the router and your laptop as follows: 1. Close all programmes/processes on the computer. 2. Shut down the computer completely. 3. Restart the router by removing the power supply unit, wait roughly 30 seconds. Reconnect the power supply and wait until all LED lights come on again. 4. now you can restart the computer again. Please note that WLAN access points, DLAN devices, switches, etc. may need to be removed."
  utter_CISCO_VPN_leitungsabbrueche_doppelanschaltung:
    - text: "Der Rechner ist bspw. per WLAN und per LAN (z.B. an der Dockingstation) gleichzeitig verbunden. Dadurch kann es zu Verbindungsabbrüchen im Cisco AnyConnect kommen.  Um die doppelte Verbindun zu überprüfen, öffne \"cmd.exe\" und gib den Befehl \"ipconfig /all\" ein, drücke danach auf \"Enter\".  Wenn WLAN und LAN Adapter je eine IP-Adresse haben, deaktiviere die WLAN-Verbindung auf deinem Notebook mit der Eingabe der dafür vorgesehenen Tastenkombination bzw. über die Taskleiste. Du kannst nun die VPN-Verbindung erneut testen."
    - text: "The computer is, for example, simultaneously connected via WLAN and LAN (e.g. at the docking station). This can lead to connection interruptions in Cisco AnyConnect. To check the double connection, open \"cmd.exe\" and use the command \"ipconfig /all\", press \" enter\". If WLAN and LAN adapters each have an IP address, disable the WLAN connection on your notebook using the appropriate key combination or via the taskbar icon. You can now test the VPN connection again."
  utter_CISCO_VPN_leitungsabbrueche_mycard:
    - text: "Wenn deine MyCard im Kartenleser steckt, entferne diese bitte und baue die VPN-Verbindung ohne MyCard auf."
    - text: "If MyCard is inserted in the card reader of the computer, please remove it and establish the VPN connection without MyCard."
  utter_CISCO_VPN_leitungsabbrueche_routerfirmware:
    - text: "Noch ein paar Tipps, die dir für einen erfolgreichen Verbindungsaufbau helfen können: Wenn der Rechner aus dem Standby/ Energiesparmodus geholt wurde,  und der Netzwerkadapter zwar eine IP-Adresse, aber keine Verbindung bekommt, dann ist ein Neustart des Rechners zu empfehlen. In einigen Fällen kann sich auf Routern eine veraltete Firmware befinden mit nicht aktuellen Patches oder Updates.  Bei Störungen mit deinem Router, nehme bitte Kontakt mit deinem Provider auf."
    - text: "A few more tips to help you establish a successful connection: If the computer has been brought out of standby/energy-saving mode and the network adapter receives an IP address but no connection, then a restart of the computer is recommended. In some cases, routers may have outdated firmware with outdated patches or updates.  If you have problems with your router, please contact your provider."
  utter_CISCO_VPN_leitungsabbrueche_statecheck:
    - text: "Bei der täglichen Nutzung von Cisco AnyConnect kann es öfter dazu kommen, dass die Verbindung nicht stabil läuft. Die folgenden Fehlerbilder kannst du - auch im Home Office - ganz einfach selbst entstören :\n1. Reconnects – AnyConnect verbindet mehrfach am Tag neu oder\n2. Fall vom \"Schlafenden Tunnel – kein Datentraffic\" – AnyConnect zeigt verbunden an jedoch werden weder Intranetseiten geladen, noch Outlook verschickt E-Mails nicht mehr. Nützliche Informationen sind im Thema unter folgendem [YAM-Link](https://tiny.telekom.de/3olr991j) zu lesen."
    - text: "During daily use of Cisco AnyConnect, it can often happen that the connection is not stable. The following error patterns are all findings that you can troubleshoot yourself - even in the home office: \n1. Reconnects - AnyConnect reconnects several times a day or \n2. Case of the \"Sleeping Tunnel - no data traffic\" - AnyConnect shows connected but neither intranet pages are loaded, nor Outlook sends emails anymore. Useful information can be read on the topic under the following [YAM-Link](https://tiny.telekom.de/3olr991j)."
  utter_CISCO_VPN_leitungssabbrueche_wlansignal:
    - text: "Wenn der Rechner per WLAN mit dem Router (oder einem Accesspoint) verbunden ist, aber das WLAN-Signal zu schwach ist, dann kommt es häufig zu niedrigen Internetgeschwindigkeiten, Verbindungsaussetzern oder Verbindungsabbrüchen. Um die Stärke des WLAN-Signals zu überprüfen, öffne \"cmd.exe\" und gib den Befehl \"netsh wlan show interfaces\" ein, drücke danach \"Enter\". Bei \"Signal\" sollte der Wert mindestens 80% sein. Sollte die Signalstärke unter 80% sein, dann befindest du dich nicht in der optimalen Reichweite des Routers oder der Router selber soll einmal neu gestartet werden, damit auch der integrierte WLAN-Adapter neu  gestartet wird."
    - text: "If the computer is connected to the router (or an access point) via WLAN, but the WLAN signal is too weak, this often leads to low internet speeds, connection dropouts or disconnections. To check the strength of the WLAN signal, open \"cmd.exe\" and enter the command \"netsh wlan show interfaces\", then press \"enter\". The \"Signal\" value should be at least 80%. If the signal strength is below 80%, then you are not within the optimal range of the router or the router itself should be restarted so that the integrated WLAN adapter is also restarted."
  utter_CMS_PASSWORTAENDERUNG_PW_zuruecksetzen:
    - text: "Hier findest du den Weg, wie das EMEA Passwort auf den mobilen Geräten nach einer Änderung aktualisiert werden kann:\n\n- **ANDROID**\n1. Boxer: Die Passwortabfrage poppt nach der Passwortänderung in 60 Minuten automatisch auf. Falls du diese Zeit nicht abwarten möchtest: Einstellungen → Apps → Boxer → Stoppen erzwingen → Boxer starten, ggf. eine De- und Neuinstallation von Boxer versuchen.\n\n- **IOS**\n1. native Mail App: Einstellungen → Mail → Accounts → Exchange o365 SMIME → Passwort erneut eingeben → Anmeldedaten eingeben (E-Mailadresse und Windows Passwort)\n2. Boxer: Die Passwortabfrage poppt nach der Passwortänderung in 60 Minuten automatisch auf. Falls du diese Zeit nicht abwarten möchtest: Boxer → Einstellungen → Exchange o365 SMIME → Erneut authentifizieren."
    - text: "Here you can find the way to update the Windows password on mobile devices after a change:\n\n- **ANDROID**\n1. Boxer: The password prompt automatically pops up 60 minutes after the password change. If you don't want to wait this long: Settings → Apps → Boxer → Force Stop → Start Boxer, if necessary, try uninstalling and reinstalling Boxer.\n\n- **IOS**\n1. native Mail App: Settings → Mail → Accounts → Exchange o365 SMIME → Re-enter password → Enter login data (email address and Windows password)\n2. Boxer: The password prompt automatically pops up 60 minutes after the password change. If you don't want to wait this long: Boxer → Settings → Exchange o365 SMIME → Re-authenticate."
  utter_CMS_SSO_PASSCODE_PW_zuruecksetzen:
    - text: "Der SSO Passcode:\n- Komplexität: 6 Ziffern\n- Wechselintervall: 360 Tage\n- Die letzten drei Passcodes sind nicht erlaubt\n- Max. Falscheingaben: 8 → Danach wird das Gerät automatisch auf den Werkszustand zurückgesetzt.\n\nDer SSO Passcode wird für den Zugriff von dienstlichen Apps (z.B. EmployeeApp) verwendet. Wenn der SSO Passcode vergessen wurde oder abgelaufen ist bzw. einfach geändert werden soll, folge bitte diesen Schritten:\n\n1. Öffne eine dienstliche App, z.B. die Web App und klicke auf \"Passcode vergessen\"\n2. Führe die Anmeldung mit der A-Kennung und dem EMEA-Passwort durch\n3.  Vergebe ein neues SSO Passcode und bestätige es erneut."
    - text: "The SSO Passcode:\n- Complexity: 6 digits\n- Change interval: 360 days\n- The last three passcodes are not allowed\n- Max. incorrect entries: 8 → After this, the device will automatically be reset to factory settings.\n\nThe SSO passcode is used for accessing company apps (e.g. EmployeeApp). If the SSO passcode has been forgotten, has expired or simply needs to be changed, please follow these steps:\n\n1. open an official app, e.g. the Web App and click on \"Forgot passcode\"\n2. log in with the A-account and the EMEA password\n3. assign a new SSO passcode and confirm it again."
  utter_CO2_PW_zuruecksetzen:
    - text: "Bei Passwort- und Anmeldeproblemen mit der CO2 App wende dich bitte per E-Mail an folgenden Ansprechpartner: [FMB movegreen](mailto:movegreen@telekom.de)"
    - text: "For password and login issues with the CO2 App, please contact the following person via email: [FMB movegreen](mailto:movegreen@telekom.de)"
  utter_CRMT_ZLOGIN_PW_zuruecksetzen:
    - text: "Anmeldung in CRM-T wurde geändert. Am 03.04.2023 wurde die Anmeldung an CRM-T über Startuptool/zLogin gesperrt. Die CRM-T Anmeldung wird dann nur noch über das [Web-Login](https://crmt.telekom.de) mittels Umleitung auf CIAM möglich sein. Anmeldung ins Web-Login kann auch mit MyCard durchgeführt werden. zLogin Passwort wird dabei als gesperrt angezeigt. Eine Passwortrücksetzung für B- oder C-Kennung sind daher nicht mehr vorgesehen."
    - text: "Registration in CRM-T has been changed. On 03.04.2023, the registration to CRM-T was blocked via Startuptool/zLogin. The CRM-T registration will then only be possible via the [Web-Login](https://crmt.telekom.de) by redirection to CIAM. Registration into Web-Login can also be done with MyCard. The zLogin password will be displayed as blocked. Therefore, a password reset for B- or C-identifier is no longer planned."
  utter_Carmen_PW_zuruecksetzen:
    - text: "Wenn du DT Service Mitarbeiter bist (gilt auch für OSP-Agenten), dann beantrage bitte die Carmen Passwortrücksetzung über [AMT/ZEUS](https://tiny.telekom.de/bgpoxv0h). Alle anderen Benutzer sollen die Passwortrücksetzungsanfrage über Caiman einstellen. Zugang zu Caiman: [Myportal](myportal.telekom.de) - Gabelschlüssel Symbol - meine Werkzeuge - mein Rollenshop - Caiman Rollenshop. Passwortrücksetzung für Carmen in Caiman: Klicke bitte auf \"Neue Bestellung\" auf der Startseite, wähle bitte die Kachel „Kennwortzurücksetzung“ aus. Hinweis: Du kannst diese Kachel nur dann sehen, falls du einen Account für ein Zielsystem besitzt."
    - text: "If you are a DT Service employee (also applies to OSP agents), please apply for the Carmen password reset via [AMT/ZEUS](https://tiny.telekom.de/bgpoxv0h). All other users should submit the password reset request via Caiman. Access to Caiman: [Myportal](myportal.telekom.de) - wrench symbol - my tools - my role shop - Caiman role shop. Password reset for Carmen in Caiman: Please click on \"New Order\" on the homepage, please select the tile \"Password Reset\". Note: You can only see this tile if you have an account for a target system."
  utter_DMSPW_Fax:
    - text: "Solltest du ein neues Passwort für den DMS Client brauchen, kannst du es über ein Fax-Formular beantragen. Das Formular findest du unter dem Link: [Fax Formular](https://passwort.telekom.de/faq/Faxformular.pdf) "
    - text: "If you need a new password for the DMS Client, you can request it via a fax form. You can find the form under the link: [Fax Formular](https://passwort.telekom.de/faq/Faxformular.pdf)"
  utter_DMSPW_zuruecksetzen_kollege:
    - text: "Das Passwort für den DMS Client kann nur für den Passwortinhaber zurückgesetzt werden. Leite bitte die Nachricht weiter und bitte den Inhaber sich bei mir zu melden."
    - text: "The password for the DMS Client can only be reset for the password holder. Please forward the message and ask the holder to contact me."
  utter_EMEA_PW_aendern:
    - text: "Wenn du dein altes Passwort nicht mehr kennst oder du hast keine Selfservice-Möglichkeit, [musst du dich an deinen Kostenstellenverantwortlichen (oder Vertretung) wenden. Er soll dir dann in MyIT einen Service-Auftrag zur Passwortrücksetzung einstellen](https://tiny.telekom.de/blfedgq7). \n\nHier findest du die Möglichkeiten für die Passwortänderung:\n- auf einem Dienstrechner: Über die Tastenkombination Strg+Alt+Entf → Kennwort ändern.\n- auf einem mobilen Endgerät mit CMS Dienst: Über die Web App → 9 Punkte → Lesezeichen → „O365 Password Change“ ODER über die Webadresse owa-intern.telekom.de\n- auf einem macOS Gerät mit LMD Dienst: Über MS Edge aus der Favoritenleiste \"AD Password renewal\" ODER über die Webadresse owa-intern.telekom.de\n- auf einem DevClient: Über [MyAccount](https://myaccount.microsoft.com) oder [OWA](owa-intern.telekom.de)\n- über VDS: In einer laufenden Sitzung ändern (wo ein Kollege angemeldet ist) → STRG + F1 drücken → \"Kennwort ändern\" ODER bei der VDS Startseite."
    - text: "If you don't remember your old password or you don't have a self-service option, [you'll need to contact your cost center manager (or representative). He should then set up a password reset service order for you in MyIT](https://tiny.telekom.de/blfedgq7). \n\nHere you can find the options for changing the password:\n- on a service computer: Using the keyboard shortcut Ctrl+Alt+Del → Change password.\n- on a mobile device with CMS service: Via the Web App → 9 points → Bookmarks → \"O365 Password Change\" OR via the web address owa-intern.telekom.de\n- on a macOS device with LMD service: Via MS Edge from the favorites bar \"AD Password renewal\" OR via the web address owa-intern.telekom.de\n- on a DevClient: Via [MyAccount](https://myaccount.microsoft.com) or [OWA](owa-intern.telekom.de)\n- via VDS: Change in an ongoing session (where a colleague is logged in) → press CTRL + F1 → \"Change password\" OR at the VDS homepage."
  utter_EMEA_PW_zuruecksetzen:
    - text: "Zur Entsperrung oder Neuvergabe deines EMEA Passworts hast du mehr Möglichkeiten.\n\n**Wichtig**: wenn du dein altes Passwort nicht mehr kennst oder du keine Selfservice-Möglichkeit hast, brauchst du die Hilfe des Kostenstellenverantwortlichen (oder Vertretung). Es muss in MyIT ein Service-Auftrag zur Passwortrücksetzung eingestellt werden.\n\n1. Auf einem Rechner: Führe die Anmeldung an das Selfservice Portal [passwort.telekom.de](https://passwort.telekom.de/cgi-bin/start.pl) mit der MyCard durch und setzte dein EMEA Passwort zurück. Die Anleitung findest du [hier](https://tiny.telekom.de/eibaydfy).\n\n2. Auf einem mobilen Endgerät mit Corporate Mobile Service Dienst: Verwende die EmployeeApp. Eine Beschreibung über die Bedienung, wie das durchgeführt werden kann, findest du [hier](https://tiny.telekom.de/uneapmk0)\n\nWeitere Informationen über Komplexitätsanforderungen und Kennwortrichtlinien erfährst du [hier](https://tiny.telekom.de/gd8cmky8)"
    - text: "To unlock or reassign your EMEA password, you have several options.\n\n**Important**: if you don't remember your old password or you don't have a self-service option, [you'll need to contact your cost center manager (or representative). He should then set up a password reset service order for you in MyIT](https://tiny.telekom.de/blfedgq7). \n\n1. On a computer: Perform it with the MyCard in the Selfservice Portal [passwort.telekom.de](https://passwort.telekom.de/cgi-bin/start.pl). You can find the instructions [here](https://tiny.telekom.de/eibaydfy).\n\n2. On a mobile device with Corporate Mobile Service: Use the EmployeeApp. A description of how this can be done can be found [here](https://tiny.telekom.de/uneapmk0)\n \nYou can find more information about complexity requirements and password policies [here](https://tiny.telekom.de/gd8cmky8)"
  utter_ESSO_TSSO_PW_ruecksetzung:
    - text: "Ich habe verstanden du benötigst eine Passwortrücksetzung für dein Single Sign On. Je nachdem welches SSO du nutzt, benötigst du einen unterschiedlichen Account. Für E-SSO benötigst Du deinen EMEA-Account. Für T-SSO benötigst du deinen CIAM-Account."
    - text: "I understood that you need a password reset for your Single Sign On. Depending on which SSO you use, you need a different account. For E-SSO you need your EMEA account. For T-SSO you need your CIAM account."
  utter_ErsteHilfeApp_PW_zuruecksetzen:
    - text: "Die Anmeldung bei der \"Erste Hilfe/SOS Connect\"-App erfolgt zu Beginn einmalig über die CIAM-Kennung. Dazu wird die dienstliche Email-Adresse und das CIAM-Passwort benötigt. Sollte das Passwort nicht mehr bekannt sein, dann bitte einfach auf den Button „Passwort vergessen“ unten in der Anmeldemaske klicken. Über die Beantwortung einer Sicherheitsfrage kann das Passwort schnell zurückgesetzt und schon kann die App in Gebrauch genommen werden. Solltest du eine Änderung an deinem Passwort lieber über den Desktop vornehmen (oder deinen Account initial einrichten müssen), dann folge bitte diesem Link: [CIAM Passwort Verwaltung](https://myportal-websso.corp.telekom.de/ciam/ciam.ui.selfregistration/pwdmanagementpage/)\n\nHinweis: Hier werden bzgl. der App die wichtigsten Fragen beantwortet: [Fragen und Antworten zur SOS Connect App](https://tiny.telekom.de/yej7qrlw)\nWeitere Fragen richte gerne an den [FMB SOS Connect App](mailto:sos-connect@telekom.de)"
    - text: "Registration for the \"First Aid/SOS Connect\" app is done once at the beginning using the CIAM identification. For this, the official email address and the CIAM password are required. If the password is no longer known, simply click on the \"Forgot password\" button at the bottom of the login mask. By answering a security question, the password can be quickly reset and the First Aid app can be put into use. If you prefer to make a change to your password via the desktop (or need to set up your account initially), please follow this link: [CIAM Password Management](https://myportal-websso.corp.telekom.de/ciam/ciam.ui.selfregistration/pwdmanagementpage/)\n\nNote: Here, the most important questions about the app are answered: [Questions and Answers about the SOS Connect App](https://tiny.telekom.de/yej7qrlw)\n For further questions, please contact the [FMB SOS Connect App](mailto:sos-connect@telekom.de)"
  utter_IMAWEB_IMAGEMASTER_PW_zuruecksetzen:
    - text: "Für die PW-Rücksetzung / Freischaltung für die Anwendung IMA-Web / Imagemaster musst du ein Passwortrücksetzungsformular versenden und dort die Anwendung IMAGEMASTER auswählen: [Link zum FAX Formular](https://passwort.telekom.de/faq/Faxformular.pdf)"
    - text: "For the PW reset / activation for the application IMA-Web / Imagemaster, you need to send a password reset form and select the IMAGEMASTER application there: [Link to the FAX form](https://passwort.telekom.de/faq/Faxformular.pdf)"
  utter_Kontes_Andi_Orka_PW_zuruecksetzen:
    - text: "Bist du sicher, dass du eine Passwortrücksetzung für Kontes / Andi / Orka benötigst? Nach meinen Informationen wurde diese Anwendung abgeschaltet."
    - text: "Are you sure you need a password reset for Kontes / Andi / Orka? According to my information, this application has been shut down."
  utter_LMD_passwoerter_lokales_geraetekennwort:
    - text: "Das lokale Gerätekennwort ist vom Benutzer frei wählbar, mindestens 12-stellig und muss mindestens 3 der folgenden Kriterien erfüllen:\n- Kleinbuchstaben enthalten\n- Großbuchstaben enthalten\n- Ziffern enthalten\n- Sonderzeichen enthalten\n\n**Sperrung** → Das Lokale Konto kann nicht remote durch den Support entsperrt werden. Bei der Sperrung des lokalen Benutzerkontos (nach 10x Passwort Falscheingabe) bleibt das Konto 60 Minuten gesperrt und entsperrt sich nach Ablauf der Zeit automatisch.\n\n**Passwortrücksetzung** → Falls das Kennwort nicht mehr bekannt ist, kann das per Wiederherstellungsschlüssel zurückgesetzt/geändert werden."
    - text: "The local device password can be chosen freely by the user, must be at least 12 characters long and must meet at least 3 of the following criteria:\n- contains lowercase letters\n- contains uppercase/capital letters\n- contains numbers\n- contains special characters\n\n**lockout** → The local account cannot be unlocked remotely by support. If the local user account is locked (after 10x incorrect password entry), the account remains locked for 60 minutes and automatically unlocks after this time has elapsed.\n\n**password reset** → If the password is no longer known, it can be reset/changed using a recovery key."
  utter_Lastpass_PW_zuruecksetzen:
    - text: "Wir haben ein Dokument, in dem das Zurücksetzen des Lastpass Master Passworts beschrieben ist: [YAM-Link](https://tiny.telekom.de/n5pienux)"
    - text: "We have a document that describes how to reset the Lastpass Master Password: [YAM-Link](https://tiny.telekom.de/n5pienux)"
  utter_MAD_PW_zuruecksetzen:
    - text: "Bei Anfragen zu MAD / MAD Tab / MAD Beta / MAD Pdf nutze bitte folgende Supportmöglichkeiten: [TEL](tel:+49699731799171) oder [MAIL](mailto:FMB_Helpdesk_MAD@t-systems.com)"
    - text: "For inquiries about MAD / MAD Tab / MAD Beta / MAD Pdf, please use the following support options: \n[TEL](tel:+49699731799171) or [MAIL](mailto:FMB_Helpdesk_MAD@t-systems.com)"
  utter_MSTeams_PW_zuruecksetzen:
    - text: "An MS-Teams meldet man sich normalerweise mit Hilfe der dienstlichen E-Mail Adresse an und falls du schon einmal über eine der M365-Applikationen (z.B. MS-Word) eingeloggt warst, dann erfolgt dieser Schritt automatisch durch SSO. Sollte die Anmeldung an MS-Teams über das Handy erfolgen, dann soll erstmal direkt ins Teams die dienstliche E-Mail Adresse angegeben werden. Danach kommt ein O365 Anmeldefenster, in dem die dienstliche E-Mail Adresse mit EMEA-Passwort erneut eingetragen werden soll."
    - text: "Normally, you log in into MS-Teams using your work email address, and if you have ever logged in via one of the M365 applications (e.g. MS-Word), then this step is automatically done by SSO. If you are logging in into MS-Teams via your mobile phone, you should first enter your work email address directly into Teams. After that, an O365 login window will appear where you should re-enter your work email address with your EMEA password."
  utter_MYCARD_mcportal_generell:
    - text: "Das Öffnen von [MyID](https://mycard-portal.telekom.de/MyID/de/) ist über Edge vorgesehen. Falls du einen anderen Browser genommen hast, kopiere bitte den Link und öffne ihn in Edge. \nTIPP: unter dem Link findest du eine Anleitung, wie du Edge als Standardbrowser einrichten kannst: [Standardbrowser festlegen](https://tiny.telekom.de/r5opeahb)"
    - text: "[MyID](https://mycard-portal.telekom.de/MyID/de/) is intended to be opened via Edge. If you have used a different browser, please copy the link and open it in Edge.\nTIP: under the link you will find instructions on how to set Edge as your default browser: [Set default browser](https://tiny.telekom.de/r5opeahb)"
  utter_MagentaForce_PW_zuruecksetzen:
    - text: "Um dich erstmalig für MagentaForce zu registrieren oder die eigene Berechtigungsrolle anzupassen, bitte folgende Seite verwenden: [Magenta Force](https://magentaforce.telekom.de/)\n\nDer Neuantrag oder die Berechtigungsänderung muss von eurer jeweiligen Führungskraft freigegeben werden. Der Login von MagentaForce kann über CIAM, E-Mail+Passwort oder Windows-Anmeldung erfolgen. \n\nWenn du dein CIAM-Passwort vergessen hast, kannst du über unser [Passwort-Management](https://passwort.telekom.de/cgi-bin/start.pl) eine Rücksetzung anstoßen. \n\nFür die Nutzung von MagentaForce wird ein aktueller Browser (Google Chrome, Edge oder Firefox) benötigt. Bei Zugangsproblemen bitte ein Nimbus-Ticket einstellen: [Nimbus Support](https://nimbus.telekom.de/arsys/forms/nim-produktion.telekom.de/NIM-Kundenportal/Kundenportal/?cacheid=8eac1e50)\n\nWeiteres zum Thema 'MagentaForce' findest du hier: [MagentaForce Allgemein](https://yam-united.telekom.com/workspaces/magentaforce/apps/wiki/faq/list/view/90ac2d15-ebe4-4c3b-aaad-295e8afa6da2?currentLanguage=NONE)"
    - text: "To register for the first time for MagentaForce or to adjust your own authorization role, please use the following page: [Magenta Force](https://magentaforce.telekom.de/)\n \nThe new application or the change of authorization must be approved by your respective manager. The login to MagentaForce can be done via CIAM, email+password or Windows login.\n\nIf you have forgotten your CIAM password, you can initiate a reset via our [Password Management](https://passwort.telekom.de/cgi-bin/start.pl).\n \nFor the use of MagentaForce, a current browser (Google Chrome, Edge or Firefox) is required. If you have access problems, please submit a Nimbus ticket: [Nimbus Support](https://nimbus.telekom.de/arsys/forms/nim-produktion.telekom.de/NIM-Kundenportal/Kundenportal/?cacheid=8eac1e50)\n \nYou can find more on the topic 'MagentaForce' here: [MagentaForce General](https://yam-united.telekom.com/workspaces/magentaforce/apps/wiki/faq/list/view/90ac2d15-ebe4-4c3b-aaad-295e8afa6da2?currentLanguage=NONE)"
  utter_Megaplan_PW_zuruecksetzen:
    - text: "Grundsätzlich erfolgt der Login über deinen Windows Account (EMEA). Bitte überprüfe zunächst über die bekannten Selfservices, ob dein A-Account gesperrt ist. Sollte dies nicht der Fall sein, könnte es sein, dass dir eine Rolle fehlt."
    - text: "In principle, the login is done via your Windows Account (EMEA). Please first check via the known self-services whether your A-Account is locked. If this is not the case, it could be that you are missing a role. Please then contact the CSD."
  utter_MilesPlus_PW_zuruecksetzen:
    - text: "Bei Störungen und fachlichen Anfragen zu MILES PLUS, wende dich bitte an den für deinen Bereich verantwortlichen lokalen Ansprechpartner aus folgender Liste: [MILES-PLUS-Support](https://tiny.telekom.de/cpeb1zel)"
    - text: "For disruptions and technical inquiries about MILES PLUS, please contact the local representative responsible for your area from the following list: [MILES-PLUS-Support](https://tiny.telekom.de/cpeb1zel)"
  utter_MyCard_PINUnblock_MyID_intro:
    - text: "Gerne werde ich dich dabei unterstützen, deine MyCard PIN online zu entsperren. Du kannst hierzu unser HowDoI Dokument auf YAM-United verwenden, hier findest du auch hilfreiche Screenshots unter dem folgenden [YAM-Link](https://tiny.telekom.de/7il4vmgb)"
    - text: "I would be happy to assist you in unlocking your MyCard PIN online. You can use our HowDoI document on YAM-United for this, where you will also find helpful screenshots via the following [YAM-Link](https://tiny.telekom.de/7il4vmgb)"
  utter_MyCard_Zertifikat_Bereinigung_intro:
    - text: "Nicht gewünschte Zertifikate, die durch Zurücksetzen eines Domänen-Passwortes am Rechner eines Kollegen, oder durch Zertifikatsverlängerung entstanden sind, können natürlich gelöscht werden. Mit dem [HowDoI Dokument auf YAM-United](https://tiny.telekom.de/x8rf7a8a) kannst du die Zertifikatsbereinigung ganz einfach durchführen. Bitte achte darauf deine MyCard vor dem Start des Löschprozesses aus dem Kartenleser zu ziehen!"
    - text: "Unwanted certificates, which have been created by resetting a domain password on a colleague's computer, or by certificate renewal, can of course be deleted. With the [HowDoI document on YAM-United](https://tiny.telekom.de/x8rf7a8a) you can easily perform the certificate cleanup. Please make sure to remove your MyCard from the card reader before starting the deletion process!"
  utter_PW_biometrisch:
    - text: "Um Windows Hello zu aktivieren, öffne die Einstellungen → Konten → Anmeldeoptionen und wähle Windows Hello. Wenn Windows Hello in den Anmeldeoptionen nicht angezeigt wird, ist diese Option für dein Gerät möglicherweise nicht verfügbar. Um Identifizierungsdaten zu entfernen, öffne die Einstellungen → Konten → Anmeldeoptionen. Unter „Windows Hello“ wähle „Entfernen” aus. Sollte eine der eingerichteten biometrischen Anmeldeoptionen nicht mehr funktionell sein, dann kannst du gerne von den anderen eine probieren."
    - text: "To activate Windows Hello, open Settings → Accounts → Sign-in options and select Windows Hello. If Windows Hello is not displayed in the sign-in options, this option may not be available for your device. To remove identification data, open Settings → Accounts → Sign-in options. Under \"Windows Hello\" select \"Remove\". If one of the set up biometric sign-in options is no longer functional, then you are welcome to try one of the others."
  utter_PW_bitlocker_fehlermeldung_benutzerungueltig:
    - text: "Self-Services sind manchmal tricky und lösen Probleme anders wie erwünscht... Lass mir auf das Problem schauen und ich versuche dir schnellstmöglich einen Bitlocker-Wiederherstellungsschlüssel zu generieren."
    - text: "Self-services can sometimes be tricky and solve problems differently than desired... Let me look at the issue and I will try to generate a bitlocker recovery key for you as soon as possible."
  utter_PW_bitlocker_fehlermeldung_keine:
    - text: "Falls es während der Bitlocker-Wiederherstellung keine bzw. nicht eine der schon benannten Fehlermeldungen produziert wird, aber sich der Schlüssel doch nicht generieren lässt, dann muss das Problem über einen anderen Weg mit Hilfe vom Second Level geklärt werden."
    - text: "If there are no error messages produced during the Bitlocker recovery, or not one of the already named error messages, but the key still cannot be generated, then the problem must be resolved in another way with the help of the Second Level."
  utter_PW_bitlocker_fehlermeldung_keynotfound:
    - text: "Es empfiehlt sich, den kompletten Vorgang der Bitlocker-Wiederherstellung erneut durchzuführen und lass dir bitte den Wiederherstellungsschlüssel / Recovery Key erneut generieren. Die von dir angegebene Wiederherstellungsschlüssel-ID / Recovery Key ID scheint nämlich nicht richtig eingegeben worden zu sein.\n"
    - text: "It is recommended to perform the entire process of bitlocker recovery again and please have the recovery key regenerated. The recovery key ID you provided seems to have not been entered correctly."
  utter_PW_bitlocker_nichtgefolfen01:
    - text: "Zur Lösung des Problems kann unter Umständen eine zweimalige Eingabe eines Recovery Keys notwendig sein.\nNach der Anmeldung direkt am Netz oder VPN Verbindungsaufbau zum Firmennetz warte bitte ca. 10 Minuten und durch Drücken von STRG + ALT + ENTF und Auswahl \"Neustart\" führe bitte einen Neustart des Rechners durch. Sollte hier erneut eine Recovery Key Abfrage erscheinen und so versuche den neuen Recovery Key über den Wiederherstellungsschlüssel-Generator (im Self-Service) erneut zu validieren."
    - text: "To solve the problem, it may be necessary to enter a Recovery Key twice in some cases.\nAfter logging in directly to the network or establishing a VPN connection to the company network, please wait about 10 minutes and restart the computer by pressing CTRL + ALT + DEL and selecting \"Restart\". If a Recovery Key query appears again, try to validate the new Recovery Key via the Recovery Key Generator (in Self-Service)."
  utter_PW_bitlocker_nichtgeholfen02:
    - text: "Ich versuche für dich einen Bitlocker-Schlüssel über andere Wege zu finden, damit dein Rechner wieder entschlüsselt wird."
    - text: "I am trying to find a Bitlocker key for you through other ways, so that of your computer will be decrypted again."
  utter_PW_myit:
    - text: "Für den Login an MyIT benötigst du kein separates Passwort, die Anmeldung erfolgt automatisch über deinen EMEA-Account mit dem du aktuell angemeldet bist. Bei Problemen entsperre dein EMEA-Passwort oder lass es neu setzen. Beide Optionen sind über [Passwort Selfservice](https://passwort.telekom.de) einfach zu erledigen."
    - text: "For logging into MyIT, you don't need a separate password, the login is automatically done through your EMEA account with which you are currently registered. If you have problems, unlock your EMEA password or have it reset. Both options can be easily done via [Password Selfservice](https://passwort.telekom.de)."
  utter_PW_personalportal:
    - text: "Du hast zwei Möglichkeiten, das Personal-Portal zu nutzen: Du kannst dich entweder personalisiert mit deinen CAIMAN-Zugangsdaten (ehemals CIAM) oder anonym als „Gast\" anmelden. Bei weiteren Fragen wende dich bitte an den Personal-Portal-Support unter dem folgenden Link: [Personal-Portal-Support](https://personal.telekom.de/mitarbeiter-infos/services-dienste/hilfe/anmeldung)"
    - text: "You have two options to use the Personnel Portal: You can either log in personalized with your CAIMAN access data (formerly CIAM) or anonymously as a \"guest\". If you have further questions, please contact the Personnel Portal Support at the following link: [Personnel-Portal-Support](https://personal.telekom.de/mitarbeiter-infos/services-dienste/hilfe/anmeldung)"
  utter_PW_sap01:
    - text: "Um die Entstörung sämtlicher SAP-Anwendungen kümmert sich ein vom Common Service Desk unabhängiger Help Desk, nämlich der MyPortal Support. Den MyPortal Support kannst du telefonisch unter [+49 391 5976 4141](tel:+4939159764141) erreichen. Weiteres zum Thema findest du unter den folgenden Links: [SAP-Link_01](https://tiny.telekom.de/9nxwrg7i) und [SAP-Link_02](https://tiny.telekom.de/azz0uc44)"
    - text: "A help desk independent of the Common Service Desk takes care of troubleshooting all SAP applications, namely the MyPortal Support. You can reach MyPortal Support at [+49 391 5976 4141](tel:+4939159764141). You can find more on the topic under the following links: [SAP-Link_01](https://tiny.telekom.de/9nxwrg7i) and [SAP-Link_02](https://tiny.telekom.de/azz0uc44)"
  utter_PW_sap02:
    - text: "Je nach SAP Anwendung stehen dir auch folgende Möglichkeiten zur Verfügung, um dein Passwort zurücksetzen zu lassen:\n1. Für die Entsperrung von SAP x01, x02 und xH9, nimm den folgenden Link: [SAP-Selfservice](https://portal-cds-prod.telekom.de/irj/portal)\n2. Die Rücksetzung deines SAP One.ERP PSL Passwortes beauftrage bitte unter Angabe deines Benutzernamens (Corporate-ID bzw. A-Kennung ohne A) und des betroffenen Systems via eMail: [FMB OneERP-Tech](mailto:int-sd-oneerp@telekom.de)"
    - text: "Depending on the SAP application, the following options are available to you to reset your password:\n1. For unlocking SAP x01, x02 and xH9, use the following link: [SAP-Selfservice](https://portal-cds-prod.telekom.de/irj/portal)\n 2. To reset your SAP One.ERP PSL password, please request it by providing your username (Corporate-ID or A-identification without A) and the affected system via email: [FMB OneERP-Tech](mailto:int-sd-oneerp@telekom.de)"
  utter_PW_smile:
    - text: "Die Beauftragung von Passwortrücksetzungen und Entsperrungen von SMILE-Kennungen erfolgt über [ZEUS-Link](https://zeus.telekom.de:8080/zeus/) unter Angabe der entsprechenden Kennung.  Die Kennungen werden nach 60-tägiger Nichtnutzung gesperrt. Nach insgesamt 90-tägiger Nichtnutzung werden die Kennungen schon gelöscht."
    - text: "The commissioning of password resets and unlocking of SMILE identifiers is done via [ZEUS-Link](https://zeus.telekom.de:8080/zeus/) by specifying the corresponding identifier. The identifiers are blocked after 60 days of non-use. After a total of 90 days of non-use, the identifiers are already deleted."
  utter_PW_spots:
    - text: "Im Falle, wenn dein SPOTS-Passwort noch nicht gesperrt ist, sondern du es einfach vergessen hast, kannst du dir selber auf der folgenden [Webseite](http://spots.telekom.de/pls/apex/f?p=104:9) ein neues Start-Passwort generieren. Sollte aber dein Passwort schon durch Falscheingabe gesperrt sein, sollst du ein Rücksetzungsformular [über den folgenden Link](https://passwort.telekom.de/faq/Faxformular.pdf) an den Service Desk senden."
    - text: "In case your SPOTS password is not yet locked, but you have simply forgotten it, you can generate a new start password for yourself [on the following website](http://spots.telekom.de/pls/apex/f?p=104:9) However, if your password is already locked due to incorrect entry, you should send a reset form [via this link](https://passwort.telekom.de/faq/Faxformular.pdf) to the Service Desk."
  utter_PW_tess_myprov:
    - text: "Ab 1 Juli 2020 wurde TESS durch die Applikation MyProv ersetzt!"
    - text: "From July 1, 2020, TESS was replaced by the MyProv application!"
  utter_PW_tivu:
    - text: "Ich habe verstanden, du benötigst eine PW-Rücksetzung / Freischaltung für die Anwendung TIVU. Solltest du Zugriff auf einen Rechner im Intranet haben, nutze hierzu bitte den Selfservice unter: [Selfservice](https://passwort.telekom.de)"
    - text: "I understood, you need a PW reset / activation for the application TIVU. If you have access to a computer on the intranet, please use the self-service at: [Selfservice](https://passwort.telekom.de)"
  utter_PW_tvpp:
    - text: "Zur Entsperrung deines T-VPP-Accounts oder zur Neuvergabe deines TVPP-Passwortes nutze bitte folgenden [Selfservice](https://vertriebspartner.telekom.de/password-forgot/pages/ResetPassword.jsf?initialCall=true)"
    - text: "To unlock your T-VPP account or to reset your TVPP password, please use the following [Selfservice](https://vertriebspartner.telekom.de/password-forgot/pages/ResetPassword.jsf?initialCall=true)"
  utter_PW_vmwareplayer:
    - text: "Der Log-In in VMWARE erfolgt nach Auswahl des Betriebssystems mit einem automatisch generiertem Benutzernamen, der ebenso auch als Passwort zu verwenden ist."
    - text: "The log-in to VMWARE is done after selecting the operating system with an automatically generated username, which is also to be used as a password."
  utter_PW_webex:
    - text: "In Webex kannst du dich mit deiner eMail-Adresse und dem Windows-Passwort anmelden. An Mobilgeräten ist auch eine Anmeldung mit dem A-Account möglich. Das Selfserviceportal zur CIAM-Passwort-Verwaltung findest du [unter folgendem Link](https://tiny.telekom.de/crulyzm4)."
    - text: "In Webex, you can log in with your email address and Windows password. On mobile devices, you can also log in with the A-Account. You can find the self-service portal for CIAM password management [at the following link](https://tiny.telekom.de/crulyzm4)."
  utter_PW_wins:
    - text: "WINS wurde am 01.11.2022 abgeschaltet. Bitte beachte, dass ab diesem Zeitpunkt nur noch Magenta Infos genutzt wird."
    - text: "WINS was switched off on November 1st, 2022. Please note that from this point on only Magenta Infos will be used."
  utter_WindowsHelloPIN_PW_zuruecksetzen:
    - text: "Windows Hello bietet die Möglichkeit, an Stelle einer Anmeldung mittels Benutzername und Passwort am Arbeitsplatzsystem alternativ eine PIN zu verwenden. Die klassische Anmeldemethode mittels Benutzername und Passwort bleibt dabei natürlich weiterhin erhalten. Die Einrichtung einer Windows Hello PIN ist in wenigen Schritten erledigt. In dieser Anleitung erklären wir, wie das geht.: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/2c4092cb-cbc8-4743-bfbf-b59f3b83a13d)\n\nSollte die Windows Hello PIN entweder geändert oder zurückgesetzt werden, dann soll man dies über den folgenden Weg machen: Einstellungen - Konten - PIN (Windows Hello) - PIN ändern."
    - text: "Windows Hello offers the option to use a PIN as an alternative to signing in with a username and password on the workplace system. The classic method of signing in with a username and password remains, of course, still available. Setting up a Windows Hello PIN is done in a few steps. In this guide, we explain how to do it.: [YAM-Link](https://yam-united.telekom.com/pages/a66ec908-117c-4fa8-94f3-502795da60c5/apps/wiki/abd69725-2c88-4187-8499-9ed6847cd0f8/list/view/2c4092cb-cbc8-4743-bfbf-b59f3b83a13d)\n \nIf the Windows Hello PIN needs to be changed or reset, then this should be done via the following path: Settings - Accounts - PIN (Windows Hello) - Change PIN."
  utter_agent_help:
    - text: "In diesem Fall wird die Unterstützung eines Agenten mit Administratorenrechten benötigt."
    - text: "In this case we need support by an agent with admin rights."
  utter_akku_etm:
    - text: "In diesem Fall soll dein PC ausgetauscht werden, da der Akku an sich nicht ausgebaut werden kann. Hierzu benötigen wir noch ein paar Angaben von dir."
    - text: "In this case, your PC needs to be replaced because the battery itself cannot be removed. We need a few more details from you."
  utter_aktualisierung_lauft_nicht_durch:
    - text: "Beachte bitte, ob das Einmalkennwort (OTP) richtig aus der E-mail kopiert und eingefügt wurde. "
    - text: "Please make sure that the one-time password (OTP) was copied and pasted correctly from the email."
  utter_andere_karte_funktioniert:
    - text: "In diesem Fall ist die Antennenfunktion der MyCard defekt.  Unsere Empfehlung ist: Für die Nutzung für den Printservice eine zusätzliche, neue separate MyCard zu verwenden."
    - text: "In this case, the MyCard's antenna function is broken.  Our recommendation is: To use an additional, new, separate MyCard for the print service.\n"
  utter_aps_hw_drucker_lokalerdrucker:
    - text: "Externe Drucker dürfen aus Sicherheitsgründen nur mit einer direkten Kabelverbindung (USB-oder Druckerkabel, kein Geräte-WLAN) am geschäftlichen PC betrieben werden. Eine Verbindung mit dem Internet, über LAN oder WLAN, darf dabei nicht bestehen, ebenso darf keine Software eigenmächtig auf dem geschäftlichen PC dafür installiert werden."
    - text: "For security reasons, external printers may only be operated with a direct cable connection (USB or printer cable, no WiFi device) to the business PC. There may not be a connection to the Internet, via LAN or WLAN, and no software may be installed on the business PC on your own initiative."
  utter_aps_hw_kamera_abdeckung:
    - text: "Scheinbar sind Probleme mit der internen Kamera aufgetreten. Bitte prüfe, ob die Abdeckung der Kamera geöffnet ist. Manche Modelle haben zum Schutz der Privatsphäre einen kleinen Schieber vor der Linse oder der Schalter kann sich am oberen Rand des Rechners befinden. Diesen bitte einfach nach rechts oder ggf. links wegschieben."
    - text: "It seems that there have been problems with the internal camera. Please check if the cover of the camera is open. Some models have a small slider in front of the lens to protect privacy or the switch can be located at the top of the computer.  Please simply push it away to the right or, if necessary, to the left. "
  utter_aps_hw_kamera_einstellungen:
    - text: "Vielleicht wurde die Nutzung der Kamera in den Einstellungen blockiert. Hier findest du die Beschreibung um die Kameraeinstellungen manuell anpassen zu können:\n\n(1) Öffne im Windows-Startmenü die „Einstellungen“ (Zahnradsymbol).\n(2) Klicke nun auf „Datenschutz und Sicherheit“.\n(3) Scrolle hier zur Auswahl der „Kamera“.\n(4) Stelle den Schalter „Apps den Zugriff auf die Kamera erlauben“ auf die Position „Ein“. Dadurch können weitere kamerafähigen Applikationen auf die Kamera deines Rechners zugreifen. "
    - text: "Maybe the use of the camera was blocked in the settings. Here you can find the description to be able to adjust the camera settings manually:\n\n(1) In the Windows Start menu, open \"Settings\" (gear icon).\n(2) Now please click on \"Privacy and Security\".\n(3) Scroll here to select the \"Camera\".\n(4) Switch the \"Allow apps to access the camera\" to the \"On\" position. This allows other camera-enabled applications to access your computer's camera. "
  utter_aps_hw_kamera_zuruecksetzen:
    - text: "An dieser Stelle empfiehlt es sich die Kamera App-Einstellungen zurückzusetzen.  Folge bitte dafür diesen Schritte: \n(1) Rufe über das Windows-Startmenü die Einstellungen auf (Zahnradsymbol)\n(2) Klicke bitte auf \"Apps\"\n(3) Wähle \"Installierte Apps\" aus\n(4) Suche hier nach \"Kamera\" und gehe rechts auf die Punkte und anschließend auf \"erweiterte Optionen\"\n(5) Hier hast du die Möglichkeiten „Reparieren“ oder „Zurücksetzen“."
    - text: "At this point, it is recommended to reset the camera app settings.  Please follow these steps: \n(1) Please call up the settings via the Windows Start menu (gear icon)\n(2) Please click on \"Apps\"\n(3) Select \"Installed Apps\"\n(4) Search for \"Camera\" here and go to the dots on the right and then on \"advanced options\"\n(5) Here you have the options \"Repair\" or \"Reset\"."
  utter_aps_hw_nichtzertifiziert:
    - text: "Grundsätzlich werden nahezu alle auf dem Markt verfügbaren Hardware-Zubehöre an den Konzern-Arbeitsplatzsystemen von Windows unterstützt. Hierbei ist zu beachten, dass sich die Unterstützung auf die Windows-Standardfunktionen von Hardware-Zubehör bezieht. Zusätzliche Funktionen, die spezielle Treibersoftware verlangen, werden nicht unterstützt und werden somit in der Regel auch nicht funktionieren. "
    - text: "In principle, almost all hardware accessories available on the market on the corporate workstation systems are supported by Windows. It is important to note that the support refers to the standard Windows functions of hardware accessories. Additional functions that require special driver software are not supported and will therefore usually not work. "
  utter_aps_hw_nucleus:
    - text: "Störungen mit einem Standardarbeitsplatz können unterschiedliche Gründe haben - einige Fälle sind ganz einfach zu entstören aber manche sind wirklich extrem und benötigen deswegen weitere Analyse von einem Agenten. Du wirst in Kürze an einen unserer Bearbeiter per Chat weitergeleitet und folge bitte nachher den Instruktionen wie angegeben."
    - text: "Issues with a standard workstation can have different reasons - some cases are quite easy to troubleshoot but some are really extreme and therefore require further analysis by an agent. You will shortly be forwarded to one of our agents via chat and please follow the instructions as indicated."
  utter_aps_hw_treiber_reinstall:
    - text: "Scheinbar brauchen wir eine tiefere Analyse, da der Fehler an weiteren Einstellungen vom Rechner liegt. Unter anderem kann hier noch eine Treiberneuinstallation helfen, wofür aber Adminrechte benötigt werden."
    - text: "Apparently, we need a deeper analysis, as the error is due to other settings from the computer. Among other things, a driver reinstallation can help here, but admin rights are required for this."
  utter_aps_hw_verkabelung_kreuztest:
    - text: "An dieser Stelle würde ich vorschlagen die Verkabelung zu überprüfen. Meistens kann sogar ein Kreuztest (Test mit einem anderen Rechner) wirklich nützlich sein, um das herauszufinden, ob eventuell die Kamera selbst Probleme hat und nicht der Dienstrechner."
    - text: "At this point, I would suggest checking the wiring. Most of the time, even a cross-test (test with another computer) can be really useful to find out whether the camera itself is having problems and not the work computer."
  utter_aps_nw_rebootvorschlag:
    - text: "(De-)Installationsstörungen lösen sich in meisten Fällen nach dem Ausführen eines Rechner-Neustarts auch. Empfehlenswert ist es deswegen, deinen Laptop an dieser Stelle komplett neu zu booten.  Achte auch darauf, dass eine **stabile** Netzwerkverbindung besteht. Es empfiehlt sich auch die Installation sowohl direkt über LAN als auch über WLAN zu testen."
    - text: "In most cases, installation (de-)installation problems are resolved after restarting the computer. It is therefore advisable to completely reboot your laptop at this point. Also make sure that there is a **stable** network connection. You are also advised to test the installation both directly via LAN and via WLAN."
