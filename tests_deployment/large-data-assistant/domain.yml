    - text: "Tip: You can access Outlook via the web interface [OWA](https://owa-intern.telekom.de) and thus work."
  utter_pan:
    - text: "Die American Pan Pizza ist nichts anderes als das, was der Name verspricht: amerikanische Pfannenpizza. Wer auf knusprigen Boden und luftigen Teig steht und den Rand der Pizza immer liegenlässt, für den ist die Pan Pizza optimal, denn: sie hat keinen, weil sie in der Pfanne gebacken wird. Da der Pfannenboden ganz schön viel Hitze bekommt, wird der Boden der Pan Pizza sehr knusprig, der restliche Teig bleibt aber locker-luftig. Dafür muss der Pizzateig insgesamt ca. 3 Stunden aufgehen – eine Stunde in der Schüssel, die restlichen 2 Stunden in der Pfanne. Hierfür eignet sich am besten eine gusseiserne Pfanne, in der der Teig wunderbar aufgehen kann. Den Grill auf 220 °C aufheizen und die Pan Pizza darin 30 Min. bei indirekter Hitze backen, fertig!"
    - text: "The American Pan Pizza is nothing more than what the name promises: American pan pizza. If you like a crispy base and fluffy dough and always leave the edge of the pizza, then the Pan Pizza is optimal for you, because: it doesn't have one, because it is baked in the pan. Since the pan bottom gets quite a lot of heat, the bottom of the Pan Pizza becomes very crispy, but the rest of the dough remains fluffy. For this, the pizza dough needs to rise for about 3 hours in total - one hour in the bowl, the remaining 2 hours in the pan. A cast iron pan is best suited for this, in which the dough can rise wonderfully. Preheat the grill to 220 °C and bake the Pan Pizza in it for 30 minutes at indirect heat, done!"
