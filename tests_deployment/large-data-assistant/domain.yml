  utter_bitlocker_selbst_loesen:
    - text: "Solltest du Zugriff auf einen Rechner im Intranet haben (z.B. Rechner von einem Kollegen), nutze dann hierzu den [Selfservice](https://passwort.telekom.de) und wähle bitte dort einfach \"BITLOCKER\" aus. Dieser [Link](http://passwort.telekom.de) ist auch auf einem Smartphone mit Corporate Mobile Service und dem VMWare Browser (\"Web\") erreichbar. Wie einfach es geht, wird unter diesem Eintrag sogar mit Bildern veranschaulicht erklärt: [YAM-Link](https://tiny.telekom.de/c8g3komt)"
    - text: "If you have access to a computer on the intranet (e.g. a colleague's computer), then use the [Selfservice](https://passwort.telekom.de) for this and simply select \"BITLOCKER\" there. This [link](http://passwort.telekom.de) is also accessible on a smartphone with Corporate Mobile Service and the VMWare Browser (\"Web\"). How easy it is, is even explained with pictures under this entry: [YAM-Link](https://tiny.telekom.de/c8g3komt)"
  utter_bluetooth_geraet_pruefen:
    - text: "Prüfe erstmal ggf. tausche bitte die Batterien im externen Gerät und starte den Rechner neu. Wenn nach dem Neustart das Gerät immer noch nicht funktioniert, prüfe die Einstellungen ebenso. Öffne einfach über das Start Menü die Einstellungen und wähle dort die Option \"Bluetooth und Geräte\", hier soll Bluetooth eingeschaltet sein. "
    - text: "First check if necessary, please replace the batteries in the external device and restart the computer. If the device still does not work after restarting, check the settings as well. Simply open the settings from the start menu and select the option \"Bluetooth and devices\" and Bluetooth should be switched on here."
  utter_button_H2A_Ticket_keinsdavon:
    - text: "Ich kann versuchen dich mit einem Chat-Agenten zu verbinden (hierbei wird automatisch ein Ticket erstellt). Ich kann auch nur ein Ticket für dich erstellen, in diesem Fall melden sich die Agenten bei Bedarf telefonisch bei dir."
      buttons:
        - title: "Mit einem Agenten chatten"
          payload: "Mit einem Agenten chatten"
        - title: "Ein Ticket erstellen"
          payload: "Ein Ticket erstellen"
        - title: "Nichts hiervon"
          payload: "Nichts hiervon"
    - text: "I can try to connect you with a chat agent (this automatically creates a ticket). I can also just create a ticket for you, in this case the agents will contact you by phone if necessary."
      buttons:
        - title: "Mit einem Agenten chatten"
          payload: "Mit einem Agenten chatten"
        - title: "Ein Ticket erstellen"
