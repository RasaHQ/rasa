  utter_ask_APS_HW_devclient_sw_installkommtnichtan_swliste_swinderliste:
    - text: "Falls das Softwareprodukt in der YAMU DevClient-Softwareliste zu finden ist, dann braucht man zu deren Installation keine vorherige MyIT-Bestellung. Installiere das Softwarepaket einfach von dem Unternehmensportal unter dem Menüpunkt \"Apps\" heraus. Bei späteren Problemen wirst du immer die Möglichkeit haben, die Software neu zu installieren - nimm dazu aber den Kachel \"Downloads & Updates\", da die Reinstallation nur da ermöglicht wird."
    - text: "If the software product is in the YAMU DevClient software list, you do not need to order MyIT in advance to install it. Simply install the software package from the company portal under the \"Apps\" menu item. If you have any problems later, you will always have the option of reinstalling the software - but use the \"Downloads & Updates\" tile, as reinstallation is only possible there."
  utter_ask_APS_HW_devclient_sw_installkommtnichtan_swliste_swnichtinderliste:
    - text: "Bei Softwareprodukten, die in der YAMU DevClient-Softwareliste nicht vorhanden sind, besteht eine Bestellpflicht nach folgender Logik:\n1. Erstmal sollst du versuchen, in MyIT unter der Service ID deines DevClients nach der gewünschten Software zu suchen und wenn es da als Treffer dargestellt wird, bestelle sie einfach und im Späteren wird die Software im Unternehmensportal zur Installation automatisch bereitgestellt.\n2. Falls du eine (insbesondere lizenzpflichtige) Software auf deinem DevClient benötigst, die derzeit weder im Unternehmensportal noch in myIT bereitsteht, so kannst du diese über eine Freitextanforderung (nicht SoLiMaT) [hier](https://jira.telekom.de/plugins/servlet/desk/portal/1102) selber anfordern. Im Falle von komplexeren Bestellvorgängen (z.B. Lizenzierung für ein ganzes Team) wende dich bitte direkt an dein Projekt-Management."
    - text: "For software products that are not available in the YAMU DevClient software list, you must order them according to the following logic:\n1. First, you should try to search for the software you want in MyIT under the service ID of your DevClient and if it is displayed as a hit, simply order it and later the software will be automatically made available for installation in the company portal.\n2. If you need software (especially software that requires a license) on your DevClient that is currently not available in the company portal or in myIT, you can request it yourself using a free text request (not SoLiMaT) [here](https://jira.telekom.de/plugins/servlet/desk/portal/1102). In the case of more complex ordering processes (e.g. licensing for an entire team), please contact your project management directly."
  utter_ask_APS_HW_devclient_sw_installkommtnichtan_swliste_swuebermyit:
    - text: "Über MyIT bestellte Softwarepakete installieren sich in der Regel nach erfolgreicher Genehmigung von alleine, falls dein DevClient am Netz hängt. Wenn aber die Installation noch nicht stattgefunden hat, kann es auf zwei Faktoren zurückverweisen: \n1. Die myIT-Bestellung wurde noch nicht genehmigt bzw. die gewünschte Software benötigt extra Lizenzen, die erstmal gegeben sein müssen. Solches erkennt man an der langen Wartezeit nach der wirklichen Bestellung. Wende dich in so einem Fall direkt an deinen Bestellverantwortlichen, um dies geregelt zu bekommen.\n2. Bei bereits genehmigten Softwarebestellungen wird die Softwarezuweisung vom Netzwerk selber beeinflusst. Lass deinen DevClient für Stunden online, damit sich der DevClient mit all wichtigen Servern - auch dem Installationsserver - absynchronisiert. Um den Synchronisierungsvorgang zu beschleunigen, nimm den Befehl \"Synch\" im Unternehmensportal unter dem Kachel \"Device\". Dies löst einen Vorgang der Synchronisierung aus, der dabei viel hilft, das hängende Installationspaket vom Server zu ziehen."
    - text: "Software packages ordered via MyIT usually install themselves after successful approval if your DevClient is connected to the network. However, if the installation has not yet taken place, it can be attributed to two factors:\n1. The myIT order has not yet been approved or the desired software requires extra licenses that must first be granted. This can be recognized by the long waiting time after the actual order. In such a case, contact your order manager directly to get this sorted out.\n2. For software orders that have already been approved, the software assignment is influenced by the network itself. Leave your DevClient online for hours so that the DevClient synchronizes with all important servers - including the installation server. To speed up the synchronization process, use the \"Synch\" command in the company portal under the \"Device\" tile. This triggers a synchronization process that helps a lot to pull the stuck installation package from the server."
