  utter_was_ist_csd:
    - text: "**CSD** (Abkürzung für Common Service Desk) bietet standardisierte, benutzerfreundliche und integrierte Services **rund um den IT-Arbeitsplatz in Deutsch und Englisch** an, die an die spezifischen Bedürfnisse der Nutzer(gruppen) über den gesamten Lifecycle angepasst sind.  "
    - text: "**CSD** (abbreviation for Common Service Desk) offers standardized, user-friendly and integrated services **around the IT workplace in German and English**, which are adapted to the specific needs of the user (groups) over the entire lifecycle."
  utter_webex_browserversion:
    - text: "Teste bitte, ob der Fehler auch in der Browserversion besteht. \nRufe bitte dazu die Webex Startseite auf: [Link](https://web.webex.com/sign-in)"
    - text: "Please test if the error also exists in the browser version.\nTo do this, please visit the Webex homepage: [Link](https://web.webex.com/sign-in)"
  utter_webex_ciscospark_loeschen:
    - text: "Lösche bitte die CiscoSpark und CiscoSparkLauncher Prozesse!\nBeende die Webex Prozesse im Task Manager unter \"Apps\" und auch unter \"Hintergrundprozesse\".\nGib bitte \"%localappdata%\" ins Suchfeld ein und lösche den CiscoSpark Ordner."
    - text: "Please delete the CiscoSpark and CiscoSparkLauncher folders!\nClose the Webex processes in the Task Manager under \"Apps\" and also under \"Background processes\".\nPlease enter \"%localappdata%\" in the search field and delete the CiscoSpark folder."
  utter_webex_geraet_yam:
    - text: "Über diese [YAM Seite](https://tiny.telekom.de/2x9) erreichst du viele nützliche Informationen über [Webex Boards]."
    - text: "Through this [YAM page](https://tiny.telekom.de/2x9) you can access a lot of useful information about [Webex Boards]."
  utter_webex_hardware_beschaedigung:
    - text: "Wenn das Webex-Gerät einen physikalischen Schaden hat, schicke bitte zusätzlich ein Foto davon an das FMB Telepresence Help (Telepresence_HELP@telekom.com). Ohne Dokumentation können wir die Störung nicht weitergeben. "
    - text: "If the Webex device has physical damage, please also send a photo of it to the FMB Telepresence Help (Telepresence_HELP@telekom.com). Without documentation, we cannot pass on the malfunction."
  utter_webex_proxy_zuruecksetzen:
    - text: "Setze bitte die Proxy Einstellungen zurück, damit Webex auch in der Anwendung funktionieren wird!\n\n1. Ins Suchfeld gib bitte \"\"cmd.exe\"\" ein und starte es.\n2. Gib den folgenden Befehl ins CMD Fenster ein und bestätige es: \"\"netsh winhttp reset proxy\"\"\n\nNach der Ausführung des Befehls sollte die Meldung \"\"no proxy server\"\" erscheinen."
    - text: "Please reset the proxy settings so that Webex will also work in the application!\n \n1. Please enter \"\"cmd.exe\"\" into the search field and start it.\n2. Enter the following command into the CMD window and confirm it: \"\"netsh winhttp reset proxy\"\"\n\nAfter executing the command, the message \"\"no proxy server\"\" should appear."
  utter_webex_schritte_symbol_gelb_angezeigt:
    - text: "Falls es in Webex das Headset gelb angezeigt wird, prüfe bitte die folgenden Einstellungen und passe sie an:\n1. Gebe ins Windows Suchfeld \"Systemsounds ändern\" ein und drücke Enter\n2. Bei den Reitern \"Wiedergabe\" und \"Aufnahme\" klicke mit der rechten Maustaste auf das betroffene Gerät\n3. Wähle dann \"Eigenschaften\"\n4. Und prüfe beim Reiter \"Pegel\" das Lautsprecher-Symbol, ob das aktiviert ist"
    - text: "If the headset is displayed in yellow in Webex, please check the following settings and adjust them:\n1. enter \"change system sounds\" in the Windows search field and press Enter\n2. in the \"Playback\" and \"Recording\" tabs, right-click on the affected device\n3. then select \"Properties\"\n4. and check the speaker symbol on the \"Levels\" tab to see if it is activated"
  utter_webex_zuruecksetzen:
    - text: "Setze bitte Webex zurück!\nKlicke auf dein Webex Profilbild -> gehe zu \"Hilfe\" -> \"Zustandsüberprüfung\" -> scrolle nach unten -> klicke auf \"Zurücksetzen\""
    - text: "Please reset Webex!\nClick on your Webex profile picture -> go to \"Help\" -> \"Status Check\" -> scroll down -> click on \"Reset\""
  utter_windows_passwort_kuerzlich_geaendert:
    - text: "Warte bitte mindestens zwei Stunden , bis die Passwortsynchronisation in allen Systemen übernommen wird."
    - text: "Please wait at least two hours until the password synchronization is applied in all systems."
  utter_ws1_server_probleme:
    - text: "Es tut mir leid, die gewünschte Aktion kann im Moment aufgrund Kommunikationsprobleme mit dem Server nicht vervollständigt werden. Wir arbeiten daran, danke für dein Verständnis."
    - text: "Sorry, the requested action cannot be completed at the moment due to communication problems with the server. We are working on it, thank you for your understanding."
  utter_ws1_vpn_profilreinstall:
    - text: "Im System wurde das erforderliche VPN Profil für dein Gerät neu installiert. Überprüfe bitte nach ein paar Minuten die Funktionalität der Tunnel App erneut."
    - text: "The required VPN profile for your device has been reinstalled in the system. Please check the functionality of the Tunnel App again after a few minutes."
  utter_yam_gebaeudezutritt:
    - text: "Über die YAM United Seiten entweder von [EEM](https://tiny.telekom.de/kkdfc2ix) oder von [GSUS](https://tiny.telekom.de/bxruojlt) oder von [EZS](https://tiny.telekom.de/v2og44vj) findest du mehrere Information zum Prozess so wie Kontakte zur Störungsbeseitigung. "
    - text: "On the following YAM United pages either of [EEM](https://tiny.telekom.de/kkdfc2ix) or of [GSUS](https://tiny.telekom.de/bxruojlt) or of [EZS](https://tiny.telekom.de/v2og44vj) you can find more related information about the process and how issues with entry can be solved."
  utter_yam_outlook_berechtigung_vergeben:
    - text: "Hier findest du eine kleine visuelle Hilfe:\n[YAM-Link](https://tiny.telekom.de/71wli5e8)"
    - text: "Here you can find a small visual help:\n[YAM-Link](https://tiny.telekom.de/71wli5e8)"
  utter_vpn_tunnelfreischaltung_neustart:
    - text: "Please restart the computer now and then check whether the connection to the router is established again before attempting to log in. Then try logging in with your A-ID and Windows Password."
    - text: "Bitte den Rechner jetzt einmal neu starten, dann prüfe vor dem Anmeldeversuch, ob die Verbindung mit dem Router wieder besteht. Probiere dann einmal dich mit deiner A-Kennung und dem Windows Passwort anzumelden."
  utter_warnmeldung_onedrive_geloeschte_dateien:
    - text: "Erhältst du eine Benachrichtigung, wenn du Elemente in OneDrive löschst?\n\nIn dieser Meldung **Gelöschte Dateien werden überall entfernt** wirst du darüber informiert, dass die gelöschten Elemente von allen synchronisierten Geräten entfernt werden und nach dem Löschen in deinen **OneDrive-Papierkorb** verschoben werden.\n\nBei weiteren Fragen zum Thema nimm diesen [Link](https://tiny.telekom.de/etuj9z0h).\n\n"
    - text: "Do you get a notification when you delete items in OneDrive?\n\nYou receive a notification **Deleted files are removed everywhere** when you delete items in OneDrive. This message informs you that the deleted items will be removed from all synced devices and being moved to your **OneDrive Recycle Bin**.\n\nIf you have any further questions on the topic, use this [link](https://tiny.telekom.de/etuj9z0h)."
  utter_was_bietet_der_chatbot:
    - text: "**Seit April 2024 steht dir der Chatbot 7*24h zur Verfügung**  und bietet Lösungen zu deinen Fragen rund um den IT-Arbeitsplatz an.\n\n- Derzeit unterstützt dich der Chatbot bei typischen **HowDoI** und **FAQ-Themen** und er bietet dir die drei passendsten Informationen aus YAM United an. \n\n- Die Kommunikation innerhalb des Chats  kann sowohl auf **Deutsch** als auch auf **Englisch** laufen, unterstützt werden aber zurzeit nur unsere nationalen Anwender, später werden auch die internationalen User mit involviert. Bitte vergewissere dich,  **die Sprache auf der Startseite richtig einzustellen**. Das machst du so, indem du oben rechts neben deinem Namen auf das Sprachsymbol klickst. \n\n- Auch **eine Bearbeitung von Störungen** ist über geführte Dialoge möglich und du hast auch die Möglichkeit direkt ein weiterführendes Gesrpäch mit einem **menschlichen Agenten** zu führen.\n\n- **Ticketerstellung** erfolgt durch den Chatbot nur über geführte Dialoge, **Ticketupdate** mit der estellten Ticketnummer geht zurzeit über [Incident Portlet](https://inmportlet-myit.t-systems.com/INMPortlet#/home). \n\n- [CSD-Störungsticker](https://yam-united.telekom.com/pages/csd-stoerungs-ticker/apps/content/home) ist für Großstörungen direkt über die Web-Oberfläche in einem **Pop-up-Fenster** erreichbar: wenn du das Pop-up-Fenster weggeklickt hast, erreichst du es unter dem **Benachrichtigungsglöckchen des Chatbots** (rechts oben auf der Seite) wieder.\n\n- Der Chatbot wird außerdem in agiler Projektmethode ständig weiterentwickelt. \n\n- Ein CSD-Redaktionsteam wertet ständig die anonymisierten Log-Dateien aus und erweitert den Chatbot um den Content, zu denen er aktuell noch keine Antwort weiss. \n\n- [Hier](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/554da9c3-cd3e-48ab-8529-7737aebbd7ea) kannst du die **Datenschutzhinweise** für den Chatbot einsehen.\n\n- [Hier](https://yam-united.telekom.com/pages/workplace-experience/apps/blog/blog/view/2a74f227-4895-4548-847e-611e9f901843#flow2) findest du weitere Tipps & Tricks zum optimalen Umgang."
    - text: "- Since April 2024, the chatbot has been available to you 24/7, offering solutions to your questions about the IT workplace.\n\n- Currently, the chatbot supports you with typical **HowDoI** and **FAQ topics** and offers you the three most suitable pieces of information from YAM United.\n\n- Communication within the chat can be in both **German** and **English**, but currently only our national users are supported, later international users will also be involved. Please make sure to **set the language correctly on the start page**. You do this by clicking on the language symbol at the top right next to your name.\n\n- Also, **troubleshooting** through guided dialogues is possible and you also have the opportunity to have a further conversation with a **human agent**.\n\n- **Ticket creation** is only carried out by chatbot via guided dialogues, **ticket update** with the created ticket number is currently only possible via [Incident Portlet](https://inmportlet-myit.t-systems.com/INMPortlet#/home).\n \n- [CSD fault ticker](https://yam-united.telekom.com/pages/csd-stoerungs-ticker/apps/content/home) is directly accessible for major faults via the web interface in a **pop-up window**: if you have clicked away the pop-up window, you can reach it again under the **notification bell of the chatbot** (top right on the page).\n\n - The chatbot is also continuously further developed using agile project methodology.\n \n- A CSD editorial team constantly evaluates the anonymized log files and expands the chatbot with the content to which it currently does not know the answer.\n \n- [Here](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/554da9c3-cd3e-48ab-8529-7737aebbd7ea) you can view the **privacy notices** for the chatbot.\n\n- [Here](https://yam-united.telekom.com/pages/workplace-experience/apps/blog/blog/view/2a74f227-4895-4548-847e-611e9f901843#flow2) you will find more tips & tricks for optimal handling."
