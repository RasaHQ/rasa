    - text: "In this case, please check whether spaces were accidentally inserted when copying the link.\nPlease also delete the cookies and browser history. You can find help here: [Delete browser data](https://tiny.telekom.de/grs1kzcz)"
  utter_myit_stoerungsmanagement:
    - text: "Falls du eine Störung für eine andere Person melden bzw. aufgeben willst, bitte dies über das Störungsmanagement in MyIT erstellen. Da hast du die Möglichkeit die Tickets selbst zu pflegen oder Reklamation zu starten. Incident Management erreichst du direkt hier: [Link zum Incident Portlet](https://tiny.telekom.de/4t8vuilz) Weitere wichtige Information und Tipps zu MyIT Seite erreichst du hier: [YAM-Link](https://tiny.telekom.de/b6m8wfog)"
    - text: "If you want to report or submit a disruption for another person, please do this via the Incident Management Portlet in MyIT. There you have the opportunity to maintain the tickets yourself or to start a complaint. You can reach Incident Management directly here: [Link to the Incident Portlet](https://tiny.telekom.de/4t8vuilz) You can reach further important information and tips on the MyIT page here: [YAM-Link](https://tiny.telekom.de/b6m8wfog)"
  utter_neapolitanische:
    - text: "Ein dicker Rand, der besonders fluffig ist, und ein hauchdünner Boden zeichnen eine richtig gute Pizza aus. Die neapolitanische Pizza – auch „Pizza Napoletana“ genannt – ist die ursprünglichste Form der italienischen Pizza. Um als klassisch neapolitanisch zu gelten, muss sie im Holzofen gebacken werden. Wenn man es ganz genau nimmt, wird die neapolitanische Pizza nur in zwei verschiedenen Variationen zubereitet:\n\nPizza Margherita mit Tomatensauce,\nPizza Mozzarella mit Basilikum\noder Pizza Marinara mit Tomatensauce und Oregano."
    - text: "A thick edge that is particularly fluffy, and a wafer-thin bottom characterize a really good pizza. The Neapolitan pizza - also called \"Pizza Napoletana\" - is the most original form of Italian pizza. To be considered classically Neapolitan, it must be baked in a wood-fired oven. If you want to be very precise, the Neapolitan pizza is only prepared in two different variations:\n\nPizza Margherita with tomato sauce,\nPizza Mozzarella with basil\nor Pizza Marinara with tomato sauce and oregano."
  utter_owa_outlook_online:
