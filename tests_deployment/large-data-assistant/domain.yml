    - text: "At the beginning, a restart of the device is recommended. \nThe instructions with screenshots for the Microsoft Cloud registration can be found on the [YAMU page of the Light Managed Device Service](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/9cf544f8-616f-4c82-a3d1-b829480e8097?currentLanguage=DE) on the right side of the bookmarks on the page."
  utter_csd_kanaelentypen:
    - text: "Um die **Kundenzufriedenheit** zu steigern, bietet CSD mehrere Kanäle zur Fehlerbehebung: \n\n- **CSD-Chatbot**: [Der Chatbot](https://csdchatbot.telekom.de) hilft bei verschiedenen Anfragen wie Selfservice Portale, HowDoI's Artikel oder Verweise auf die richtigen Hotlines. Der digitale Assistent steht euch 24/7, also Rund um die Uhr zur Verfügung.  Erreichbar über folgenden [Link](https://csdchatbot.telekom.de) \n- **Störungsmanagement über MyIT**: Störungsmeldungen können jederzeit online und von überall in MyIT gemeldet und deren Status nachverfolgt werden. [Störung online melden](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/f156e82f-ce65-413e-a84d-347f4bfc4549) \n- **Anruf bei der CSD Hotline**: Unsere freundlichen Agentinnen und Agenten des **Common Service Desks** (CSD) erreichst du telefonisch unter [+49 391 5976 4100](tel:+4939159764100), innerhalb der Servicezeiten (Montag-Freitag 07.00-18.00 Uhr).  [Auswahlmenü/Kennziffernliste von CSD](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/ef6c1ea8-312f-42b5-8dd1-aeed0a29e04b).  \n**Die Störungsmeldung an Common Service Desk per E-Mail ist nicht möglich.** \n- **Störungs-Ticker**: Der bekannte CSD Störungs-Ticker informiert aktuell über großflächige Störungen.[CSD Störungs-Ticker Startseite](https://yam-united.telekom.com/pages/csd-stoerungs-ticker/apps/content/home)"
    - text: "To increase **customer satisfaction**, CSD offers several channels for troubleshooting:\n\n- **CSD Chatbot**: [The Chatbot](https://csdchatbot.telekom.de) helps with various requests such as self-service portals, HowDoI's articles or references to the correct hotlines. The digital assistant is available to you 24/7, around the clock. Accessible via the following [link](https://csdchatbot.telekom.de)\n - **Fault management via MyIT**: Fault reports can be reported online at any time and from anywhere in MyIT and their status can be tracked. [Report fault online](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/f156e82f-ce65-413e-a84d-347f4bfc4549)\n - **Call to the CSD hotline**: Our friendly agents of the **Common Service Desk** (CSD) can be reached by phone at [+49 391 5976 4100](tel:+4939159764100), within the service hours (Monday-Friday 07.00-18.00). [Selection menu/extension list of CSD](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/ef6c1ea8-312f-42b5-8dd1-aeed0a29e04b).\n **Reporting faults to the Common Service Desk by email is not possible.**\n - **Fault-Ticker**: The well-known CSD fault ticker provides current information about widespread faults. [CSD Fault-Ticker Homepage](https://yam-united.telekom.com/pages/csd-stoerungs-ticker/apps/content/home)"
  utter_devclient_erstanmledung_ho:
    - text: "Die Inbetriebnahme eines R&D DevClients ist im Homeoffice nicht möglich! Führe es bitte an einem Standort mit R&D Netz per Lan Kabel oder Wlan durch und denk an die zwei Faktor Authentifizierung.  Die betroffenen Standorte findest du hier: [Betroffene Standorte](https://tiny.telekom.de/yh8ul2th) beziehunsweise eine genaue Anleitung unter diesem Link [Inbetriebnahme DevClient](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/6a10ee39-0f4e-46fa-9d1b-35d80df57695)"
    - text: "The commissioning of an R&D DevClient is not possible in the home office! Please carry it out at a location with R&D network via LAN cable or WLAN and remember the two-factor authentication. You can find the affected locations here: [Affected Locations](https://tiny.telekom.de/yh8ul2th) or a detailed instruction under this link [Commissioning DevClient](https://yam-united.telekom.com/pages/workplace-experience/apps/wiki/wiki/list/view/6a10ee39-0f4e-46fa-9d1b-35d80df57695)"
  utter_docking_etm:
    - text: "In this case, your docking station should be replaced.\nFor this we need a few more details from you."
    - text: "In diesem Fall soll deine Dockingstation ausgetauscht werden. Hierzu benötigen wir noch ein paar Angaben von dir."
  utter_docking_hardreset:
    - text: "Zu Beginn, solltest du ein Hardreset deiner Dockingstation durchführen. \n1. Trenne alle Kabelverbindungen von der Dockingstation\n2. Drücke nun ca. 45 Sekunden lang auf den Powerknopf \n3. Danach kannst du wieder alle Anschlüsse mit der Dockingstation verbinden und gleich testen"
    - text: "To begin, you should perform a hard reset on your docking station. \n1. Disconnect all cable connections from the docking station\n2. Press the power button for about 45 seconds \n3. You can then reconnect all ports to the docking station and test them straight away"
  utter_docking_kabel_stromversorgung:
    - text: "Prüfe bitte die Stromversorgung bei deiner Dockingstation. Die Kompatibilität des Netzteiles kannst du in dieser Liste an der Wattanzahl erkennen. [Yamu-Link](https://yam-united.telekom.com/pages/ws-deployment-hw-zertifizierung/apps/wiki/hardwareliste/list/view/177e7eee-cbc4-4d77-be33-0b04de621537?currentLanguage=DE)"
    - text: "Please check the power supply on your docking station. You can see the compatibility of the power supply in this list according to the number of watts.\n[Yamu-Link](https://yam-united.telekom.com/pages/ws-deployment-hw-zertifizierung/apps/wiki/hardwareliste/list/view/177e7eee-cbc4-4d77-be33-0b04de621537?currentLanguage=DE)"
  utter_dockingstation_kann_defekt_sein:
    - text: "In diesem Fall ist es möglich, dass du eine Störung mit der Dockingstation hast. Die Bearbeitung erfolgt dem entsprechend in Bezug auf die Dockingstation weiter."
    - text: "In this case, it is possible that you have a problem with the docking station. The issue processing will continue accordingly with regard to the docking station."
  utter_dummy_agent_not_available:
