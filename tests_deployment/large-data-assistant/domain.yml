    - text: "Please change the connection from LAN to WLAN and vice versa, or test another LAN connection."
  utter_voraussetzungen_fehlen:
    - text: "Wenn diese Kriterien nicht erfüllt sind, kann ich dir leider nicht weiterhelfen."
