                          - if: slots.APS_HW_devclient_hw_grundgeraet_useranmeldung is "Useranmeldung nicht möglich"
                            then:
                              - link: sub_APS_HW_devclient_emea
                          - else: message_utter_user_kein_button_gedrueckt_2
