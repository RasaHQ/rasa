                      - collect: did_help
                        description: Frage den User, ob das geholfen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                        ask_before_filling: true
                        next:
                          - if: slots.did_help is "nein"
                            then:
                              - action: utter_intern_cms_android_new_token
                              - set_slots:
                                  - slot_sm9_bestguide: BG248300
                                  - slot_sm9_title: "BOT_MSSD: Android: Token für Einrichtung CMS notwendig, Ursachen- Key:"
                                  - slot_sm9_category1: CENTRAL SERVICES
                                  - slot_sm9_category2: MOBILE DEVICE SERVICES
