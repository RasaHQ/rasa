  sub_APS_HW_devclient_hw:
    name: sub_APS_HW_devclient_hw
    description: Dieser Flow darf nicht direkt getriggert werden. Dieser Flow beschreibt Probleme von DevClients, die sich auf die Hardware beziehen sei es eine Peripherie oder das Grundgerät also der DevClient selber.
    steps:
      - set_slots:
          - blind_spot: true
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er wirklich Hardwareprobleme auf seinem DevClient hat. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        utter: utter_ask_check_devclient_hw
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then: message_utter_APS_HW_devclient_hw_generell
          - if: slots.slot_richtig_verstanden is "nein, ich habe ein anderes Thema"
            then:
              - action: utter_2_userabbruch_neu_formulieren
                next: END
          - else: message_utter_user_kein_button_gedrueckt
      - id: message_utter_APS_HW_devclient_hw_generell
        action: utter_APS_HW_devclient_hw_generell
      - collect: APS_HW_devclient_hw_hardwaretyp
        description: Frag den User nach der gestörten Hardwarekomponente des DevClients. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.APS_HW_devclient_hw_hardwaretyp is "Peripherien (inkl. Headset)"
            then: message_utter_APS_HW_devclient_hw_peripherien
          - if: slots.APS_HW_devclient_hw_hardwaretyp is "lokaler Drucker"
