                                  - if: slots.cms_tunnel_neuinstallation_ergebnis is "Nein, war erfolglos"
                                    then:
                                      - action: utter_intern_cms_geraetedaten_tunnel_android
                                      - set_slots:
                                          - slot_sm9_bestguide: BG279068
                                          - slot_sm9_title: "BOT_MSSD: Android: Störung VMware Tunnel"
                                          - slot_sm9_category1: CENTRAL SERVICES
                                          - slot_sm9_category2: MOBILE DEVICE SERVICES
