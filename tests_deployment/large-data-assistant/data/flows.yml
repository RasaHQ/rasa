    description: Dieser Flow beschreibt Störungen mit dem Produkt M365 bzw. O365. Es werden Berechtigungs-, Zugriffs-, Synchronisierungs-, Aktivierungs- und Lizenzprobleme von Produkten betrachtet, wie Excel, Word, Access, OneDrive, OneNote, MS Teams, SharePoint Online, Modern Groups, Gast Account. Der Flow wird auch getriggert, wenn Excel, Word, Access, OneDrive, OneNote, MS Teams, SharePoint Online, Modern Groups, Gast Account entweder nicht gestartet werden können, oder wenn sich der User an Excel, Word, Access, OneDrive, OneNote, MS Teams, SharePoint Online, Modern Groups, Gast Account nicht anmelden kann oder wenn es mit den Office Produkten Performanceprobleme aufgetreten sind..
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er wirklich Probleme mit Excel, Word, Access, OneDrive, OneNote, MS Teams, SharePoint Online, Modern Groups, Gast Account hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_m365_richtig_verstanden
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then: message_utter_M365_produktbeschreibung
          - if: slots.slot_richtig_verstanden is "nein, ich habe ein anderes Thema"
