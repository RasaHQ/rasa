  sub_APS_HW_monitor:
    name: sub_APS_HW_monitor
    description: Dieser Flow darf nicht direkt getriggert werden. Dieser Flow beschreibt Fälle von Störungen mit dem Monitor, Display und der Grafikkarte. Der Monitor kann der vom Laptop oder extern angeschlossen sein.
    steps:
      - collect: APS_HW_monitor_interoderextern
        description: Frag den User darüber, wie der gestörte Bildschirm angeschlossen ist. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.APS_HW_monitor_interoderextern is "integriertes Laptop Display"
            then:
              - collect: APS_HW_monitor_bildanzeige
                description: Frag den User, ob der Bildschirm überhaupt etwas zeigt. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.APS_HW_monitor_bildanzeige is "Bild ist fehlerhaft/verschwommen"
                    then: message_utter_APS_HW_generell_rebootunddock_2
                  - if: slots.APS_HW_monitor_bildanzeige is "Diplay hat kein Bild"
                    then: message_utter_APS_HW_generell_rebootunddock
                  - else: message_utter_user_kein_button_gedrueckt
              - id: message_utter_APS_HW_generell_rebootunddock
                action: utter_APS_HW_generell_rebootunddock
              - collect: did_help
                description: Frag den User, ob das geholfen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
