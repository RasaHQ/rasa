  sub_MSSD_CMS_tunnel_app_android:
    name: sub_MSSD_CMS_tunnel_app_android
    description: Dieser Flow darf nie getriggert werden. Es ist im Mainflow "MSSD_Android_IOS_TunnelApp" verlinkt.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er eine Tunnel Störung auf seinem mobilen Gerät hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_tunnelapp_android
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: Abfrage_ok
                description: Frag den User, ob "keine Apps sind installiert" als Fehlermeldung erscheint. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                utter: utter_ask_tunnel_no_apps_installed
                ask_before_filling: true
                next:
                  - if: slots.Abfrage_ok is "nein"
                    then: set_slots_blind_spot
                  - if: slots.Abfrage_ok is "ja"
                    then: message_utter_message_tunnel_no_apps_installed
                  - else: message_utter_user_kein_button_gedrueckt
              - id: message_utter_message_tunnel_no_apps_installed
                action: utter_message_tunnel_no_apps_installed
              - action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: set_slots_blind_spot
                set_slots:
                  - blind_spot: true
              - collect: cms_tunnelapp_fm
                description: Frage den User, welche Fehlermeldung in der Tunnel App kommt.
                ask_before_filling: true
              - collect: message_tunnel_internetconnection
                description: Frage den Kunden, ob es eine aktive Internetverbindung (WLAN oder LTE) besteht. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                ask_before_filling: true
              - set_slots:
                  - blind_spot: false
                next:
                  - if: slots.message_tunnel_internetconnection is "Nein, keine Verbindung"
                    then: message_utter_tunnel_worksasdesigned
                  - if: slots.message_tunnel_internetconnection is "Ja, Internet vorhanden"
                    then:
                      - action: utter_ANDtunnel_restarttunnel
                      - set_slots:
                          - blind_spot: true
                      - collect: did_help
                        description: Frage den User, ob das geholfen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                        ask_before_filling: true
                      - set_slots:
                          - blind_spot: false
                        next:
                          - if: slots.did_help is "nein"
                            then:
                              - action: utter_cms_ANDtunnel_deletecache
                              - set_slots:
                                  - blind_spot: true
                              - collect: stoerung_entscheidung
                                description: Frage den User, ob die Störung noch besteht. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                                ask_before_filling: true
                              - set_slots:
                                  - blind_spot: false
                                next:
                                  - if: slots.stoerung_entscheidung is "ich habe weiterhin eine Störung"
                                    then: message_utter_ANDtunnel_dnssettings
                                  - if: slots.stoerung_entscheidung is "danke, die Störung hat sich erledigt"
                                    then: action_openSM9_incident_resolved_2
                                  - else: message_utter_user_kein_button_gedrueckt_2
                              - id: action_openSM9_incident_resolved_2
                                action: action_openSM9_incident_resolved
                              - link: feedback_flow
                              - id: message_utter_ANDtunnel_dnssettings
                                action: utter_ANDtunnel_dnssettings
                              - action: utter_ANDtunnel_airplanemode
                              - set_slots:
                                  - blind_spot: true
                              - collect: cms_tunnel_vpn
                                description: Frage den User, ob er jetzt eine aktive VPN Verbindung hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                                ask_before_filling: true
                              - set_slots:
                                  - blind_spot: false
                                next:
                                  - if: slots.cms_tunnel_vpn is "ich habe keine aktive VPN Verbindung"
                                    then: action_WS1_jobtrigger_vpnreinstall
                                  - if: slots.cms_tunnel_vpn is "der Tunnel ist Verbunden"
                                    then: action_openSM9_incident_resolved_3
                                  - else: message_utter_user_kein_button_gedrueckt_3
                              - id: action_openSM9_incident_resolved_3
                                action: action_openSM9_incident_resolved
                              - link: feedback_flow
                              - id: action_WS1_jobtrigger_vpnreinstall
                                action: action_WS1_jobtrigger_vpnreinstall
                              - action: utter_ws1_vpn_profilreinstall
                              - collect: cms_tunnelapp_vpn_funktion
                                description: Frage den User, ob die Tunnel App funktionsfähig ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                                ask_before_filling: true
                                next:
                                  - if: slots.cms_tunnelapp_vpn_funktion is "Ja, Tunnel App ist jetzt funktionsfähig"
                                    then: action_openSM9_incident_resolved_4
                                  - if: slots.cms_tunnelapp_vpn_funktion is "Nein, Tunnel App ist weiterhin gestört"
                                    then: message_utter_cms_tunnel_reinstalltunnelapp
                                  - else: message_utter_user_kein_button_gedrueckt_4
