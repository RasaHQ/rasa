  sub_MSSD_CMS_android_token:
    name: sub_MSSD_CMS_android_token
    description: Dieser Flow beschreibt die Neugenerierung eines Aktivierungstokens für Android Handys und Tablets (wie zum Beispiel Samsung, Xiaomi und so weiter) mit dem Corporate Mobile Service (CMS) Dienst, um das Endgerät neu registrieren zu können.
    steps:
      - set_slots:
          - blind_spot: true
        next:
          - if: slots.slot_emea_domain is "EMEA1"
            then:
              - collect: slot_richtig_verstanden
                description: Frage den User, ob er für sein Android Gerät einen neuen Token braucht. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                utter: utter_ask_check_androidtoken
                ask_before_filling: true
                next:
                  - if: slots.slot_richtig_verstanden is "nein, ich habe ein anderes Thema"
                    then:
                      - action: utter_2_userabbruch_neu_formulieren
                      - set_slots:
                          - blind_spot: false
                        next: END
                  - if: slots.slot_richtig_verstanden is "ja, das stimmt"
                    then: action_active_directory_query_ldap
                  - else: set_slots_blind_spot
              - id: action_active_directory_query_ldap
                action: action_active_directory_query_ldap
                next:
                  - if: slots.slot_certificate_expiration_date_status is "cert_within_42days"
                    then: message_utter_myit_mycard_renew_offen
