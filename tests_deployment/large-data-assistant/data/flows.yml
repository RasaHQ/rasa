  sub_APS_HW_drucker:
    name: sub_APS_HW_drucker
    description: Dieser Flow darf nicht direkt getriggert werden. Dieser Flow beschreibt, wie man kann einen Hardwarefehler mit einem Plotter, einem lokalen Drucker und einem Netzwerkdrucker (Ricoh) beheben kann.
    steps:
      - collect: welcher_druckertyp
        description: Frage den User, welche Art vom Drucker genau betroffen ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.welcher_druckertyp is "Netzwerkdrucker (Büro/MFP/Ricoh)"
            then:
              - collect: utter_welches_problem_mit_netzwerkdrucker
                description: Frage den User, welches Problem er mit dem Netzwerkdrucker (Ricoh) hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.utter_welches_problem_mit_netzwerkdrucker is "Ich habe eine Fehlermeldung/Fehlercode auf dem MFP"
                    then:
                      - link: sub_RICOH_fehlermeldung_am_MFP_bei_der_Anmeldung
                  - if: slots.utter_welches_problem_mit_netzwerkdrucker is "Die Druckaufträge kommen nicht an"
                    then:
                      - link: sub_RICOH_druckauftraege_kommen_nicht_an
                  - if: slots.utter_welches_problem_mit_netzwerkdrucker is "Ich habe einen Hardwarefehler"
                    then: set_slots_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                  - if: slots.utter_welches_problem_mit_netzwerkdrucker is "Der Toner ist leer"
                    then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                  - if: slots.utter_welches_problem_mit_netzwerkdrucker is "Ich kann den MPS Client nicht starten"
                    then:
                      - link: sub_RICOH_MPSClient_kann_nicht_gestartet_werden
                  - else: message_utter_user_kein_button_gedrueckt
              - id: set_slots_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                set_slots:
                  - slot_sm9_title: BOT_MFP Störung
                  - slot_sm9_category1: HARDWARE
                  - slot_sm9_category2: HARDWARE
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
              - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                set_slots:
                  - slot_sm9_category1: HARDWARE
                  - slot_sm9_category2: HARDWARE
                  - slot_h2a_skill: CSD-Print service management
                  - slot_sm9_title: "BOT_PRINT: Bestellung Verbrauchmaterial / Resttonerbehälter voll"
                  - slot_sm9_bestguide: BG274561
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
              - id: message_utter_user_kein_button_gedrueckt
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
          - if: slots.welcher_druckertyp is "lokaler Drucker"
            then:
              - collect: lokaldrucker_problemtyp
                description: Frage den User, ob er zum lokalen Drucker Verbrauchsmaterialien braucht oder einen Hardware-Defekt hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.lokaldrucker_problemtyp is "Bestellung von Verbrauchsmaterialien (Toner/Kabel)"
                    then: message_utter_lokaldrucker_zubehoerbestellung
                  - if: slots.lokaldrucker_problemtyp is "Probleme mit der Hardware"
                    then: message_utter_aps_hw_drucker_lokalerdrucker
                  - else: message_utter_user_kein_button_gedrueckt_2
              - id: message_utter_aps_hw_drucker_lokalerdrucker
                action: utter_aps_hw_drucker_lokalerdrucker
              - collect: aps_hw_drucker_lokalerdrucker_verbindungsart
                description: Frage den User, wie der lokale Drucker angeschlossen ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.aps_hw_drucker_lokalerdrucker_verbindungsart is "über Netzwerk (LAN, WLAN, Bluetooth) verbunden"
                    then: message_utter_aps_hw_drucker_lokalerdrucker_2
                  - if: slots.aps_hw_drucker_lokalerdrucker_verbindungsart is "über USB/Druckerkabel angeschlossen"
                    then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
                  - else: message_utter_user_kein_button_gedrueckt_3
              - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
                set_slots:
                  - slot_sm9_category1: SOFTWARE
                  - slot_sm9_category2: LOCAL CLIENT
                  - slot_h2a_skill: CSD-Workstation system
                  - slot_sm9_title: "BOT_WINDOWS: Lokaler USB-Drucker wird nicht erkannt oder USB Drucker druckt nicht"
                  - slot_sm9_bestguide: BG241291
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
              - id: message_utter_aps_hw_drucker_lokalerdrucker_2
                action: utter_aps_hw_drucker_lokalerdrucker
              - action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: message_utter_user_kein_button_gedrueckt_3
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
              - id: message_utter_lokaldrucker_zubehoerbestellung
                action: utter_lokaldrucker_zubehoerbestellung
              - action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: message_utter_user_kein_button_gedrueckt_2
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
          - if: slots.welcher_druckertyp is "Plotter"
            then: message_utter_plotter_supportsuspended_01
          - else: message_utter_user_kein_button_gedrueckt_4
      - id: message_utter_plotter_supportsuspended_01
        action: utter_plotter_supportsuspended_01
      - action: utter_plotter_supportsuspended_02
      - action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: message_utter_user_kein_button_gedrueckt_4
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
  sub_APS_NW_vpn_leitungsabbrueche:
    name: sub_APS_NW_vpn_leitungsabbrueche
    description: Dieser Flow darf nicht direkt getriggert werden. Dieser Flow beschreibt die Problemlösung zu Fällen, in denen es die Verbindung über Cisco AnyConnect an einem Windows Rechner vereinzelt abbricht oder wenn es über den VPN-Tunnel einfach keinen Datenverkehr gibt.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er wirklich Leitungsabbrüche hat, wenn sein Laptop über Cisco AnyConnect über das Firmennetzwerk eingewählt ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_cisco_leitungsabbrueche
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then: message_utter_CISCO_VPN_leitungsabbrueche_statecheck
          - if: slots.slot_richtig_verstanden is "nein, ich habe ein anderes Thema"
            then:
              - action: utter_2_userabbruch_neu_formulieren
                next: END
          - else: message_utter_user_kein_button_gedrueckt
      - id: message_utter_CISCO_VPN_leitungsabbrueche_statecheck
        action: utter_CISCO_VPN_leitungsabbrueche_statecheck
