  2_H2A_Ticket_Servicezeit:
    name: 2_H2A_Ticket_Servicezeit
    description: trigger niemals diesen handoverflow direkt
    steps:
      - action: action_is_within_service_times
        next:
          - if: slots.slot_is_within_service_times
            then:
              - collect: slot_H2A_Ticket_keinsdavon
                description: Es wird abgefragt ob der Chatuser ein H2A möchte, ein Ticket erstellen möchte, oder keines davon. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                utter: utter_button_H2A_Ticket_keinsdavon
                ask_before_filling: true
                next:
                  - if: slots.slot_H2A_Ticket_keinsdavon is "Ein Ticket erstellen"
                    then: message_utter_2_ticketcreation_wait_20s_2
                  - if: slots.slot_H2A_Ticket_keinsdavon is "Mit einem Agenten chatten"
                    then: set_slots_slot_sm9_title
                  - if: slots.slot_H2A_Ticket_keinsdavon is "Nichts hiervon"
                    then:
                      - action: utter_2_userabbruch_neu_formulieren
                        next: END
                  - else:
                      - action: utter_2_userabbruch_neu_formulieren
                        next: END
              - id: set_slots_slot_sm9_title
                set_slots:
                  - slot_sm9_title: BOT_chat handover
              - action: action_openSM9_incident
              - action: action_initiate_agent_handover
              - collect: agent_not_available
                description: rueckmeldung von sm.now das kein agent ist verfuegbar
                utter: utter_dummy_agent_not_available
                next:
                  - if: slots.agent_not_available is "Agent unavailable"
                    then: message_utter_h2_unavailable_see_ticket
                  - else: END
              - id: message_utter_h2_unavailable_see_ticket
                action: utter_h2_unavailable_see_ticket
              - link: feedback_flow
              - id: message_utter_2_ticketcreation_wait_20s_2
                action: utter_2_ticketcreation_wait_20s
              - action: action_openSM9_incident
              - link: feedback_flow
          - if: not slots.slot_is_within_service_times
            then:
              - collect: slot_Ticket_keinTicket
                description: Es steht kein H2A  zur Verfügung , der Bot bietet Ticketerstellung an. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.slot_Ticket_keinTicket is "Ticket erstellen"
                    then: message_utter_2_ticketcreation_wait_20s
                  - if: slots.slot_Ticket_keinTicket is "kein Ticket erstellen"
                    then:
                      - action: utter_2_userabbruch_neu_formulieren
                        next: END
                  - else:
                      - action: utter_2_userabbruch_neu_formulieren
                        next: END
              - id: message_utter_2_ticketcreation_wait_20s
                action: utter_2_ticketcreation_wait_20s
              - action: action_openSM9_incident
              - link: feedback_flow
          - else:
              - action: utter_2_userabbruch_neu_formulieren
                next: END
