          - if: slots.APS_HW_devclient_hw_hardwaretyp is "Monitor"
            then: message_utter_APS_HW_devclient_hw_monitor
          - if: slots.APS_HW_devclient_hw_hardwaretyp is "Grundgerät (Laptop)"
