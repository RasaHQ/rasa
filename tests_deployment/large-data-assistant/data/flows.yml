  BESTELLUNG_mainflow:
    name: BESTELLUNG_mainflow
    description: Dieser Flow beschreibt Störungen mit Themen wie Bestellung, Artikelbestellung, Kündigung, Stornierung, Neubestellung, Userwechsel, Change Complete System, Bestandspflege, Umbuchung, Rollenshop, Auftragsgenehmigung, hängender Auftrag. Betrachtet werden hier auch Fälle, wenn ein Auftrag nicht abgearbeitet wird, oder wenn der Auftrag hängt, oder wenn die Bestellung nicht rechtzeitig abgearbeitet wird. Allgemeine Probleme auf dem Bestellportal wie myIT werden hier ebenso behandelt. Falls der User eine Software oder Hardware bestellen will, wird ebenso dieser Flow getriggert. CAIMAN, myStore sind hier ebenso betroffen.
    steps:
      - collect: slot_richtig_verstanden
        description: Frag den User, ob er wirklich Probleme mit Bestellungen, Kündigung. Aufträgen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        utter: utter_slot_richtig_verstanden_check_bestellportal
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: BESTELLUNG_portalauswahl
                description: Frage den User nach dem betroffenen Bestellportal, in dem es Probleme mit Aufträgen aufgetreten sind. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.BESTELLUNG_portalauswahl is "CIAM/CAIMAN Rollenshop"
                    then:
                      - collect: BESTELLUNG_portalauswahl_caiman
