  link_passwort_ruecksetzung:
    name: link_passwort_ruecksetzung
    description: Dieser Flow soll bei Passwortproblemen und Anmeldeproblemen und bei Fragen in Bezug auf Passwortkriterien getriggert werden.
    steps:
      - collect: slot_richtig_verstanden
        description: Frag den User, ob er wirklich ein Passwort Problem hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_passwort
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: account_typ
                description: Ask the user for the specific account type he wants to reset. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
              - action: action_map_account_type
                next:
                  - if: slots.account_typ is "MAC-OS"
                    then: action_confirm_all_slots
                  - if: slots.account_typ is "Light Managed Device"
                    then: action_confirm_all_slots_2
                  - if: slots.account_typ is "CAIMAN"
                    then: message_utter_CAIMAN_PW_zuruecksetzen
                  - if: slots.account_typ is "EMEA"
                    then: message_utter_EMEA_PW_zuruecksetzen
                  - if: slots.account_typ is "accountnavigator"
                    then: message_utter_Accountnavigator_PW_zuruecksetzen
                  - if: slots.account_typ is "Avaya Agent"
                    then: message_utter_AvayaAgent_PW_zuruecksetzen
                  - if: slots.account_typ is "Windows Hello PIN"
                    then: message_utter_WindowsHelloPIN_PW_zuruecksetzen
                  - if: slots.account_typ is "AL-MV"
                    then: message_utter_2_nimbus
                  - if: slots.account_typ is "BIOS"
                    then: message_utter_BIOS_PW_zuruecksetzen
                  - if: slots.account_typ is "Bitlocker"
                    then: action_confirm_all_slots_3
                  - if: slots.account_typ is "Mobilephone"
