              - collect: akku_nicht_physikalisch_defekt
                description: Frage den User, ob sich der Akkufehler durch die zu kurze Laufzeit, durch das nicht laden oder durch etwas anderes  zeigt. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
