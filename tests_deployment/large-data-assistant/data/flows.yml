  APS_HW_mainflow:
    name: APS_HW_mainflow
    description: Dieser Flow beschreibt Probleme und Störungen mit Hardwarekomponenten und Peripherien sei es der Rechner, Laptop, Akku oder das Grundgerät selber, oder andere Peripherien wie Headset, Mikrofon, Monitor, Display, Dockingstation, Kamera, Maus, Touchpad, Tastatur, Drucker, Bluetooth-Geräte oder der eingebaute LTE-Modem. Der Flow bezieht sich auch auf Störungen und Probleme, wenn die Hardware nicht erkannt wird, wenn die Hardware gestört ist, oder wenn die Hardware defekt ist, oder wenn die Hardware getauscht werden soll.
    steps:
      - collect: check_hardware_extended
        description: Frag den User, ob er wirklich Probleme mit seiner Hardware hat.  Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        utter: utter_check_hardware
        ask_before_filling: true
      - set_slots:
          - blind_spot: true
        next:
          - if: slots.check_hardware_extended is "nein, ich habe ein anderes Thema"
            then: message_utter_2_userabbruch_neu_formulieren
          - if: slots.check_hardware_extended is "ja, mein Rechner ist betroffen"
            then: message_utter_aps_hw_nucleus
          - if: slots.check_hardware_extended is "ja, mein mobiles Endgerät ist betroffen"
            then:
              - link: sub_MSSD_CMS_hardware_defekt
          - else: message_utter_user_kein_button_gedrueckt
      - id: message_utter_aps_hw_nucleus
        action: utter_aps_hw_nucleus
      - action: utter_APS_HW_generell_hardreset
      - collect: APS_HW_vorpruefungsfrage
        description: Frag den User, ob die vorgeschlagenen Lösungsschritte für Hardwarestörungen generell geholfen haben und ob das betroffene Gerät wieder erkannt wird und ordnungsgemäß funktioniert. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.APS_HW_vorpruefungsfrage is "Vorprüfung geholfen (alle Rechnermodelle)"
            then: action_openSM9_incident_resolved
          - if: slots.APS_HW_vorpruefungsfrage is "Vorprüfung nicht geholfen (Nucleus/Standardrechner)"
            then: message_utter_APS_HW_zertifizierung
          - if: slots.APS_HW_vorpruefungsfrage is "Vorprüfung nicht geholfen (DevClient/EntwicklerPC)"
            then:
              - link: sub_APS_HW_devclient_hw
          - else: message_utter_user_kein_button_gedrueckt_2
      - id: message_utter_APS_HW_zertifizierung
        action: utter_APS_HW_zertifizierung
      - collect: APS_HW_vorpruefungnichtok
        description: Frag den User, welche Hardwarekomponente nicht problematisch funktioniert bzw. nicht erkannt wird. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.APS_HW_vorpruefungnichtok is "Drucker"
            then:
              - link: sub_APS_HW_drucker
          - if: slots.APS_HW_vorpruefungnichtok is "Tastatur"
            then:
              - link: sub_APS_HW_tastatur
          - if: slots.APS_HW_vorpruefungnichtok is "Kamera"
            then:
              - link: sub_APS_HW_kamera
          - if: slots.APS_HW_vorpruefungnichtok is "Monitor/Grafikkarte"
            then:
              - link: sub_APS_HW_monitor
          - if: slots.APS_HW_vorpruefungnichtok is "LTE-Modem"
            then:
              - link: sub_APS_HW_ltemodem
          - if: slots.APS_HW_vorpruefungnichtok is "Kartenleser"
            then:
              - link: sub_APS_HW_kartenleser
          - if: slots.APS_HW_vorpruefungnichtok is "Headset"
            then:
              - link: sub_APS_HW_headset
          - if: slots.APS_HW_vorpruefungnichtok is "Laptop/PC"
            then: set_slots_blind_spot
          - if: slots.APS_HW_vorpruefungnichtok is "keines davon"
            then: set_slots_blind_spot_2
          - if: slots.APS_HW_vorpruefungnichtok is "Maus/Touchpad"
            then: set_slots_blind_spot_3
          - if: slots.APS_HW_vorpruefungnichtok is "eingebauter Lautsprecher/Mikrofon am Rechner"
            then: set_slots_blind_spot_4
