                        action: utter_emea_passwort_zuruecksetzen
                      - collect: emea_passwort_zuruecksetzung_ergebnis
                        description: Frage den User, ob die Passwortrücksetzung erfolgreich war. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
