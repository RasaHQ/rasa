  sub_passwort_ruecksetzung_android:
    name: sub_passwort_ruecksetzung_android
    description: Dieser Flow hilft dem User bei Passwortentsperrungen und Passwortrücksetzungen auf Android Geräten. Dieser Flow darf nie bei den Gerätetypen MacOS und iOS getriggert werden.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob es sich um eine Passwortrücksetzung für sein Android handelt. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_passwort_android
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: Android_Passwoerter
                description: Frage den User, welches Passwort oder Passcode auf seinem Android Gerät entsperrt oder zurückgesetzt werden soll. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.Android_Passwoerter is "SSO Passcode (für die dienstlichen Apps)"
                    then: message_utter_CMS_SSO_PASSCODE_PW_zuruecksetzen
                  - if: slots.Android_Passwoerter is "Domänenpasswort (EMEA)"
                    then:
                      - collect: emea_passwort_szenarien
                        description: Frage den User, dass er das passende Phänomen auswählt. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                        ask_before_filling: true
                        next:
                          - if: slots.emea_passwort_szenarien is "Passwortänderung (altes Passwort ist bekannt)"
                            then: message_utter_emea_pw_aendern_neu
                          - if: slots.emea_passwort_szenarien is "Passwortaktualisierung (geändertes Passwort auf mobilem Endgerät hinterlegen)"
                            then: message_utter_emea_passwort_aktualisierung_android
                          - if: slots.emea_passwort_szenarien is "Kennwortrichtlinien"
                            then: message_utter_emea_kennwortrichtlinien
                          - if: slots.emea_passwort_szenarien is "Passwortrücksetzung (altes Passwort ist NICHT bekannt)"
                            then: message_utter_emea_passwort_zuruecksetzen
                          - else: message_utter_user_kein_button_gedrueckt
