  sub_MSSD_CMS_synchronisierung_ios_native:
    name: sub_MSSD_CMS_synchronisierung_ios_native
    description: Dieser Flow beschreibt den Entstörungsprozess von Synchronisationsproblemen in der Mail-, Kalender- und Kontakte App auf einem IOS  (also iPhone oder iPad) Gerät, das durch Corporate Mobile Service bereits registriert worden ist.
    steps:
      - action: action_query_workspace_one_for_user_devices
      - set_slots:
          - blind_spot: true
      - collect: slot_WS1_inventorychoice
        description: Der User wird nach dem betroffenen Device gefragt
        utter: utter_lookup_slot_WS1_inventorychoice
        ask_before_filling: true
      - action: action_WS1_get_device_details
        next:
          - if: slots.slot_emea_domain is "EMEA2"
            then: message_utter_emea2_inm_portal
          - if: slots.slot_emea_domain is "EMEA1"
            then: action_myit_query_activesync_enable
          - else: message_utter_2_userabbruch_neu_formulieren
      - id: action_myit_query_activesync_enable
        action: action_myit_query_activesync_enable
        next:
          - if: not slots.slot_active_sync_enabled
            then:
              - action: utter_cms_activesync_order
              - set_slots:
                  - slot_sm9_title: "BOT_MSSD: iOS: native Mailapp synchronisiert nicht"
                  - slot_sm9_bestguide: BG242918
                  - slot_sm9_category1: CENTRAL SERVICES
                  - slot_sm9_category2: MOBILE DEVICE SERVICES
                  - slot_h2a_skill: CSD-Mobile device management
              - action: action_confirm_all_slots
              - set_slots:
                  - blind_spot: false
              - link: 2_H2A_Ticket_Servicezeit
          - if: slots.slot_active_sync_enabled
            then:
              - collect: devclient_bestand_check
                description: Frage den User, ob er einen DevClient hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                ask_before_filling: true
                next:
                  - if: slots.devclient_bestand_check is "ich habe einen DevClient Rechner"
                    then:
                      - action: utter_cms_devclient_bestand_vorhanden
                      - set_slots:
                          - blind_spot: false
                      - action: action_openSM9_incident_resolved
                      - link: feedback_flow
                  - if: slots.devclient_bestand_check is "ich habe keinen DevClient Rechner"
                    then: action_WS1_query_date_last_enroll
                  - else: message_utter_user_kein_button_gedrueckt
              - id: action_WS1_query_date_last_enroll
                action: action_WS1_query_date_last_enroll
                next:
                  - if: slots.slot_enrollment_date_status is "within_60_mins"
                    then:
                      - action: utter_cms_replikation_abwarten
                      - set_slots:
                          - blind_spot: false
                      - action: action_openSM9_incident_resolved
                      - link: feedback_flow
                  - if: slots.slot_enrollment_date_status is "older_than_60_mins"
                    then: message_utter_cms_synchronisation_requirement
                  - else: message_utter_user_kein_button_gedrueckt_2
              - id: message_utter_cms_synchronisation_requirement
                action: utter_cms_synchronisation_requirement
              - collect: cms_tunnel_vpn
                description: Frage den User, ob die VPN Verbindung in Tunnel verbunden ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                ask_before_filling: true
                next:
                  - if: slots.cms_tunnel_vpn is "ich habe keine aktive VPN Verbindung"
                    then: set_slots_blind_spot
                  - if: slots.cms_tunnel_vpn is "der Tunnel ist Verbunden"
                    then: message_utter_cms_nativ_sync_settings
                  - else: message_utter_user_kein_button_gedrueckt_3
              - id: message_utter_cms_nativ_sync_settings
