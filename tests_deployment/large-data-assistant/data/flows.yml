    description: Dieser Flow beschreibt wie das Passwort für DMS Web Client (DMS SCANNER TREIBER) zurückgesetzt werden kann.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er wirklich Störung mit dem DMS Passwort hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_dms_passwort
        ask_before_filling: true
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: passwortruecksetzung_fuer_wen
                description: Frage den User, für wen er das Passwort zurücksetzen will? Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                next:
                  - if: slots.passwortruecksetzung_fuer_wen is "mein eigenes Passwort mit Hilfe eines Agenten"
