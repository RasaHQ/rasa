  sub_passwort_ruecksetzung_ios:
    name: sub_passwort_ruecksetzung_ios
    description: Dieser Flow hilft dem User bei Passwortentsperrungen und Passwortrücksetzungen auf iOS Geräten. Dieser Flow darf nie bei den Gerätetypen MacOS und Android getriggert werden.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er ein IOS Passwort Thema hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_passwort_ruecksetzung_ios
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then:
              - collect: IOS_Passwoerter
                description: Frage den User, welches Passwort oder Passcode auf seinem iOS Gerät entsperrt oder zurückgesetzt werden soll. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
                ask_before_filling: true
                reset_after_flow_ends: false
                next:
                  - if: slots.IOS_Passwoerter is "Domänenpasswort (EMEA)"
                    then:
                      - collect: emea_passwort_szenarien
                        description: Frage den User, dass er das passende Phänomen auswählt. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                        ask_before_filling: true
                        next:
                          - if: slots.emea_passwort_szenarien is "Passwortänderung (altes Passwort ist bekannt)"
                            then: message_utter_emea_pw_aendern_neu
                          - if: slots.emea_passwort_szenarien is "Passwortaktualisierung (geändertes Passwort auf mobilem Endgerät hinterlegen)"
                            then:
                              - collect: ws_one_tag_name
                                description: Informiere den User, dass sein mobiles Endgerät geprüft wurde. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                                next:
                                  - if: slots.ws_one_tag_name is "boxer"
                                    then: message_utter_emea_passwort_aktualisierung_ios_boxer
                                  - if: slots.ws_one_tag_name is "native"
                                    then: message_utter_emea_passwort_aktualisierung_ios_nativ
                                  - else:
                                      - action: utter_ws1_server_probleme
                                        next: END
                              - id: message_utter_emea_passwort_aktualisierung_ios_nativ
                                action: utter_emea_passwort_aktualisierung_ios_nativ
                              - collect: emea_passwort_aktualisierung_ergebnis
                                description: Frage den User, ob die Passwortaktualisierung erfolgreich war. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                                ask_before_filling: true
                                next:
                                  - if: slots.emea_passwort_aktualisierung_ergebnis is "ich brauche weitere Hilfe"
                                    then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                                  - if: slots.emea_passwort_aktualisierung_ergebnis is "Passwortaktualisierung war erfolgreich"
                                    then: action_openSM9_incident_resolved
                                  - else: message_utter_user_kein_button_gedrueckt
                              - id: action_openSM9_incident_resolved
