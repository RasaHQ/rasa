                      - action: utter_intern_cardreader_generell
                      - action: action_confirm_all_slots
                      - link: 2_H2A_Ticket_Servicezeit
                  - else: message_utter_user_kein_button_gedrueckt_2
              - id: message_utter_user_another_card
                action: utter_user_another_card
              - collect: is_card_visible
                description: Frage den User, ob die Karte unter Gerätemanager angezeigt ist. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
