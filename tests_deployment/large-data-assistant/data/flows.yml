                  - if: slots.passwortruecksetzung_fuer_wen is "mein eigenes Passwort über FAX-Formular"
                    then: message_utter_DMSPW_Fax
                  - if: slots.passwortruecksetzung_fuer_wen is "Passwort meiner Kolleg*Innen"
                    then: message_utter_DMSPW_zuruecksetzen_kollege
                  - else: message_utter_user_kein_button_gedrueckt
