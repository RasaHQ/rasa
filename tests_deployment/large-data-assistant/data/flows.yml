version: "3.1"
flows:
  workaround_tunnelloesung_erstanmeldung_am_neuen_client_im_homeoffice:
    name: workaround_tunnelloesung_erstanmeldung_am_neuen_client_im_homeoffice
    description: Dieser Flow beschreibt die Erstanmeldung an einem kürzlich erhaltenen Rechner, an dem sich der Besitzer des Gerätes vom Home Office aus einloggen, beziehungsweise in das Intranet gelangen möchte. Die Fehlermeldung  Domäne ist nicht verfügbar oder Begriffe wie, Regeltausch, neue Hardware und Rechnertausch sollen diesen Flow ebenfalls triggern.
    steps:
      - collect: slot_richtig_verstanden
        description: Frage den User, ob er wirklich eine Störung mit dem VPN-Tunnel hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_check_vpntunnel
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.slot_richtig_verstanden is "ja, das stimmt"
            then: set_slots_blind_spot
          - if: slots.slot_richtig_verstanden is "nein, ich habe ein anderes Thema"
            then:
              - action: utter_2_userabbruch_neu_formulieren
                next: END
          - else: message_utter_user_kein_button_gedrueckt
      - id: set_slots_blind_spot
        set_slots:
          - blind_spot: true
      - collect: vorgang_tunnelfreischaltung_erstanmeldung_ho
        description: Frage den User, aus welchem Grund er eine Tunnelfreischaltung zum VPN benötigt.
        ask_before_filling: true
        reset_after_flow_ends: false
      - set_slots:
          - blind_spot: false
      - collect: erstanmeldung_welches_geraet
        description: Frage den User,  ob er die Erstanmeldung an einem R&D Developer Client oder an einem üblichen Rechner durchführen möchte. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.erstanmeldung_welches_geraet is "Standard Arbeitsplatz (Nucleus)"
            then: set_slots_blind_spot_2
          - if: slots.erstanmeldung_welches_geraet is "R&D DevClient (Intranet)"
            then: message_utter_devclient_erstanmledung_ho
          - else: message_utter_user_kein_button_gedrueckt_2
      - id: message_utter_devclient_erstanmledung_ho
        action: utter_devclient_erstanmledung_ho
      - action: utter_APS_HW_devclient_sw_ibn_devint_besitzerok
      - action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: set_slots_blind_spot_2
        set_slots:
          - blind_spot: true
      - action: utter_APS_NW_tunnelfreischaltung_rechnerauswahl
      - collect: slot_myit_sid
        description: Frage den User nach dem betroffenen Gerät und liefere Buttons.
        utter: utter_lookup_slot_myit_sid
        ask_before_filling: true
      - action: action_ciam_rasadmintool_jobtrigger_ciamid_identisch
        next:
          - if: not slots.slot_rasadmin_ciamid_ok
            then: message_utter_ras_freischaltung_nichterfolgt
          - if: slots.slot_rasadmin_ciamid_ok
            then: action_rasadmintool_jobtrigger_tunnelfreischaltung
          - else:
              - action: utter_ras_freischaltung_serverausfall
                next: END
      - id: action_rasadmintool_jobtrigger_tunnelfreischaltung
        action: action_rasadmintool_jobtrigger_tunnelfreischaltung
      - action: utter_ras_freischaltung_erfolgt
      - action: utter_vpn_tunnelfreischaltung_neustart
      - collect: vpn_tunnelfreischaltung_anmeldeversuch
        description: Frage den User, ob die Useranmeldung nach der Tunnelfreischaltung funktioniert. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.vpn_tunnelfreischaltung_anmeldeversuch is "ich habe mich anmelden können"
            then: action_openSM9_incident_resolved
          - if: slots.vpn_tunnelfreischaltung_anmeldeversuch is "Fehlermeldung ist immer noch vorhanden"
            then: set_slots_blind_spot_3
          - else: message_utter_user_kein_button_gedrueckt_3
      - id: set_slots_blind_spot_3
        set_slots:
          - blind_spot: false
      - action: utter_erstanmeldung_vorbereitungen
      - set_slots:
          - slot_sm9_title: BOT_UR1_Tunnelloesung Erstanmeldung am neuen Client im Homeoffice
          - slot_sm9_category1: NETWORK
          - slot_sm9_category2: REMOTE ACCESS
          - slot_sm9_bestguide: BG292136
          - slot_h2a_skill: CSD-Service request management
      - action: utter_intern_vpn_tunnelfreischaltung_nichtgeklappt
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: action_openSM9_incident_resolved
        action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: message_utter_user_kein_button_gedrueckt_3
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: message_utter_ras_freischaltung_nichterfolgt
        action: utter_ras_freischaltung_nichterfolgt
      - action: utter_erstanmeldung_vorbereitungen
      - set_slots:
          - slot_sm9_category1: NETWORK
          - slot_sm9_category2: REMOTE ACCESS
          - slot_h2a_skill: CSD-Service request management
          - slot_sm9_bestguide: BG292136
          - slot_sm9_title: BOT_UR1_Tunnelloesung Erstanmeldung am neuen Client im Homeoffice
      - action: utter_intern_vpn_tunnelfreischaltung_nichtgeklappt
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_user_kein_button_gedrueckt_2
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: message_utter_user_kein_button_gedrueckt
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
  sub_RICOH_fehlermeldung_am_MFP_bei_der_Anmeldung:
    name: sub_RICOH_fehlermeldung_am_MFP_bei_der_Anmeldung
    description: Dieser Flow darf nicht direkt getriggert werden. Dieser Flow beschreibt, was passiert, wenn bei der Anmeldung mit der MyCard am MFP oder während der Verwendung der Karte eine Fehlermeldung mit einer Error Code erscheint.
    steps:
      - action: utter_ricoh_neustart
      - collect: did_help
        description: Frage den User ob es geholfen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.did_help is "unbekannt"
            then: message_utter_user_kein_button_gedrueckt
          - if: slots.did_help is "ja"
            then: action_openSM9_incident_resolved
          - else: collect_Abfrage_ok
      - id: action_openSM9_incident_resolved
        action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: message_utter_user_kein_button_gedrueckt
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: collect_Abfrage_ok
        collect: Abfrage_ok
        description: Frage den User, ob andere Kollegen bei dem gleichen Drucker betroffen sind. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        utter: utter_ask_ricoh_andere_kollegen_betroffen
        ask_before_filling: true
        next:
          - if: slots.Abfrage_ok is "unbekannt"
            then: message_utter_user_kein_button_gedrueckt_2
          - if: slots.Abfrage_ok is "ja"
            then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
          - else: collect_Abfrage_ok_2
      - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
        set_slots:
          - slot_sm9_category1: HARDWARE
          - slot_sm9_category2: HARDWARE
          - slot_sm9_title: "BOT_PRINT: Fehlermeldung am MFP bei der Anmeldung"
          - slot_sm9_bestguide: BG280333
          - slot_h2a_skill: CSD-Print service management
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_user_kein_button_gedrueckt_2
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: collect_Abfrage_ok_2
        collect: Abfrage_ok
        description: |-
          Frage den User, ob er auch von anderen Druckern betroffen ist. 
          Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        utter: utter_ask_ricoh_andere_drucker_betroffen_sind
        ask_before_filling: true
        next:
          - if: slots.Abfrage_ok is "unbekannt"
            then: message_utter_user_kein_button_gedrueckt_3
          - if: slots.Abfrage_ok is "ja"
            then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
          - else: collect_ricoh_anmledung_fehlercode
      - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
        set_slots:
          - slot_sm9_bestguide: BG280333
          - slot_sm9_category1: HARDWARE
          - slot_sm9_category2: HARDWARE
          - slot_sm9_title: "BOT_PRINT: Fehlermeldung am MFP bei der Anmeldung"
          - slot_h2a_skill: CSD-Print service management
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_user_kein_button_gedrueckt_3
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: collect_ricoh_anmledung_fehlercode
        collect: ricoh_anmledung_fehlercode
        description: Frage den User, welchen Fehlercode er bekommt. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
        ask_before_filling: true
        next:
          - if: "{'10100000' '10200000'} contains slots.ricoh_anmledung_fehlercode"
            then: message_utter_ricoh_mycard_auf_dem_kartenleser_drauflegen
          - if: slots.ricoh_anmledung_fehlercode is "10700000 / 10800000"
            then:
              - collect: Abfrage_ok
                description: Frage den User, ob die Karte genug lange (bis der Display reagiert) vor dem Kartenleser gehalten wurde. Wenn kein erlaubter Wert getroffen wird, setze den Slotwert auf "unbekannt".
                utter: utter_ask_ricoh_ob_die_mycard_genug_lange_vor_dem_display_war
                ask_before_filling: true
                next:
                  - if: slots.Abfrage_ok is "ja"
                    then: message_utter_andere_karte_funktioniert
                  - if: slots.Abfrage_ok is "nein"
                    then: message_utter_ricoh_mycard_auf_dem_kartenleser_drauflegen_2
                  - else: message_utter_user_kein_button_gedrueckt_4
              - id: message_utter_ricoh_mycard_auf_dem_kartenleser_drauflegen_2
                action: utter_ricoh_mycard_auf_dem_kartenleser_drauflegen
              - action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: message_utter_andere_karte_funktioniert
                action: utter_andere_karte_funktioniert
              - action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: message_utter_user_kein_button_gedrueckt_4
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
          - if: slots.ricoh_anmledung_fehlercode is "A1000142 / A1000138"
            then: message_utter_konto_entsperren_lassen
          - if: "{'00000000' '10000000' '10099/1' '10300000 (A3001001) / 10500000 / 10600000' '10400000' '10900000' '40200010'} contains slots.ricoh_anmledung_fehlercode"
            then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_3
          - else: message_utter_user_kein_button_gedrueckt_5
      - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_3
        set_slots:
          - slot_sm9_bestguide: BG280333
          - slot_sm9_category1: HARDWARE
          - slot_sm9_category2: HARDWARE
          - slot_sm9_title: "BOT_PRINT: Fehlermeldung am MFP bei der Anmeldung"
          - slot_h2a_skill: CSD-Print service management
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_ricoh_mycard_auf_dem_kartenleser_drauflegen
        action: utter_ricoh_mycard_auf_dem_kartenleser_drauflegen
      - action: utter_ricoh_mycard_neu_einrichten
      - action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: message_utter_konto_entsperren_lassen
        action: utter_konto_entsperren_lassen
      - collect: did_help
        description: Frage den User, ob das geholfen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
        ask_before_filling: true
        next:
          - if: slots.did_help is "nein"
            then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_4
          - if: slots.did_help is "ja"
            then: action_openSM9_incident_resolved_2
          - else: message_utter_user_kein_button_gedrueckt_6
      - id: action_openSM9_incident_resolved_2
        action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_4
        set_slots:
          - slot_sm9_bestguide: BG280333
          - slot_sm9_title: "BOT_PRINT: Fehlermeldung am MFP bei der Anmeldung"
          - slot_sm9_category1: HARDWARE
          - slot_sm9_category2: HARDWARE
          - slot_h2a_skill: CSD-Print service management
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_user_kein_button_gedrueckt_6
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: message_utter_user_kein_button_gedrueckt_5
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
  sub_M365_gastaccount:
    name: sub_M365_gastaccount
    description: Dieser Flow beschreibt Probleme mit Microsoft Gast Accounts.
    steps:
      - action: utter_m365_gastaccount_produktbeschreibung
      - action: utter_m365_gastaccount_produktbeschreibung02
      - action: utter_m365_gastaccount_produktbeschreibung03
      - collect: m365_gastaccount_fehlerbild
        description: Frage den User nach dem Problembild mit Guest Accounts. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.m365_gastaccount_fehlerbild is "Einladungsmail nicht angekommen"
            then: message_utter_agent_help
          - if: slots.m365_gastaccount_fehlerbild is "trotz Berechtigungsvergabe immer noch kein Zugriff auf Ressourcen"
            then: message_utter_m365_gastaccount_fehlerbild_sharepoint
          - if: slots.m365_gastaccount_fehlerbild is "anderes Fehlerbild"
            then:
              - link: sub_M365_allgemein_H2A
          - else: message_utter_user_kein_button_gedrueckt
      - id: message_utter_m365_gastaccount_fehlerbild_sharepoint
        action: utter_m365_gastaccount_fehlerbild_sharepoint
      - collect: m365_gastaccount_fehlerbild_sharepoint_berechtigung
        description: Frage den User, ob die SharePoint Berechtigung laut der Anweisung erfolgreich eingerichtet werden konnte. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        ask_before_filling: true
        next:
          - if: slots.m365_gastaccount_fehlerbild_sharepoint_berechtigung is "ich habe die Berechtigung korriegieren können"
            then: action_openSM9_incident_resolved
          - if: slots.m365_gastaccount_fehlerbild_sharepoint_berechtigung is "SharePoint Zugriff funktioniert immer noch nicht"
            then: message_utter_agent_help_2
          - else: message_utter_user_kein_button_gedrueckt_2
      - id: message_utter_agent_help_2
        action: utter_agent_help
      - collect: abfrage_m365_allgemein_fehlerbild
        description: Frage den User nach Fehlermeldung und Fehlerbild in M365.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: abfrage_m365_allgemein_erreichbarkeit
        description: Frage den User nach Erreichbarkeit.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: abfrage_m365_gastaccount_emailadressen
        description: Frage den User nach den Sponsoren- und Gast E-Mail Adressen.
        ask_before_filling: true
        reset_after_flow_ends: false
      - set_slots:
          - slot_sm9_category1: CENTRAL SERVICES
          - slot_sm9_category2: OTHER
          - slot_h2a_skill: CSD-Workstation system
          - slot_sm9_bestguide: BG326115
          - slot_sm9_title: "BOT_Gast Account: Gast hat keinen Zugriff"
      - action: utter_intern_m365_gastaccount_h2a
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: action_openSM9_incident_resolved
        action: action_openSM9_incident_resolved
      - link: feedback_flow
      - id: message_utter_user_kein_button_gedrueckt_2
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
        next: END
      - id: message_utter_agent_help
        action: utter_agent_help
      - collect: abfrage_m365_allgemein_fehlerbild
        description: Frage den User nach dem Störungsbild.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: abfrage_m365_allgemein_erreichbarkeit
        description: Frage den User nach Erreichbarkeit.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: abfrage_m365_gastaccount_emailadressen
        description: Frage den User nach den Sponsoren- und Gast E-Mail Adressen.
        ask_before_filling: true
        reset_after_flow_ends: false
      - set_slots:
          - slot_sm9_category1: CENTRAL SERVICES
          - slot_sm9_category2: OTHER
          - slot_h2a_skill: CSD-Workstation system
          - slot_sm9_bestguide: BG337995
          - slot_sm9_title: "BOT_Gast Account: Gast hat die Einladungsmail nicht erhalten"
      - action: utter_intern_m365_gastaccount_h2a
      - action: action_confirm_all_slots
      - link: 2_H2A_Ticket_Servicezeit
      - id: message_utter_user_kein_button_gedrueckt
        action: utter_user_kein_button_gedrueckt
      - action: action_rag
  sub_MSSD_CMS_ios_token:
    name: sub_MSSD_CMS_ios_token
    description: Dieser Flow beschreibt die Neuinstallation eines iOS Gerätes, wenn sich das der User so wünscht oder wenn sich das iOS Gerät auf Werkseinstellungen zurückgesetzt hat.
    steps:
      - action: utter_cms_token_bei_ios
      - collect: cms_ios_dep_starten
        description: Frage den User, ob er mit der Installation loslegen konnte. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
        ask_before_filling: true
        next:
          - if: slots.cms_ios_dep_starten is "ich versuche die Einrichtung später"
            then: message_utter_cms_ios_dep_spaeter_starten
          - if: slots.cms_ios_dep_starten is "danke, ich konnte die Installation starten"
            then: action_openSM9_incident_resolved
          - if: slots.cms_ios_dep_starten is "nein, ich brauche weitere Hilfe"
            then: action_query_workspace_one_for_organisation_group
          - else: message_utter_user_kein_button_gedrueckt
      - id: action_query_workspace_one_for_organisation_group
        action: action_query_workspace_one_for_organisation_group
        next:
          - if: slots.ws_one_device_org_group is not "CorpIOS"
            then:
              - action: utter_cms_ios_org_group_corpios_fehler
              - set_slots:
                  - slot_sm9_title: "BOT_MSSD: iOS: DEP Gerät soll erneut eingerichtet werden, Ursachen- Key:"
                  - slot_sm9_bestguide: BG292271
                  - slot_sm9_category1: CENTRAL SERVICES
                  - slot_sm9_category2: MOBILE DEVICE SERVICES
                  - slot_h2a_skill: CSD-Mobile device management
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
          - if: slots.ws_one_device_org_group is "CorpIOS"
            then:
              - collect: define_DEP_reenrollment_reason
                description: Frag den Kunden nach dem Grund für die (Neu)installation des iOS Gerätes.
                ask_before_filling: true
              - action: action_WS1_jobtrigger_unlock_emea_account
                next:
                  - if: slots.ws_one_unlocked is "active"
                    then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
                  - if: slots.ws_one_unlocked is "unlocked"
                    then: message_utter_cms_account_unlocked_abfrage
                  - else: message_utter_user_kein_button_gedrueckt_2
              - id: message_utter_cms_account_unlocked_abfrage
                action: utter_cms_account_unlocked_abfrage
              - collect: stoerung_entscheidung
                description: Frage den User, ob die Störung noch besteht. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt"
                ask_before_filling: true
                next:
                  - if: slots.stoerung_entscheidung is "ich habe weiterhin eine Störung"
                    then: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
                  - if: slots.stoerung_entscheidung is "danke, die Störung hat sich erledigt"
                    then: action_openSM9_incident_resolved_2
                  - else: message_utter_user_kein_button_gedrueckt_3
              - id: action_openSM9_incident_resolved_2
                action: action_openSM9_incident_resolved
              - link: feedback_flow
              - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title_2
                set_slots:
                  - slot_sm9_bestguide: BG292271
                  - slot_sm9_title: "BOT_MSSD: iOS: DEP Gerät soll erneut eingerichtet werden, Ursachen- Key:"
                  - slot_sm9_category1: CENTRAL SERVICES
                  - slot_sm9_category2: MOBILE DEVICE SERVICES
                  - slot_h2a_skill: CSD-Mobile device management
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
              - id: message_utter_user_kein_button_gedrueckt_3
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
              - id: set_slots_slot_h2a_skill_slot_sm9_bestguide_slot_sm9_category1_slot_sm9_category2_slot_sm9_title
