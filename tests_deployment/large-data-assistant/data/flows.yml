  1_incident_fallback:
    name: 1_incident_fallback
    description: Dieser Flow soll getriggert werden wenn der Chatuser  über eine Software oder Mobiltelefon Störung chattet. Dies beinhaltet Störungen oder Fehlermeldungen und Bluescreens bei Notebooks , Laptops und Smartphones. Hierbei kann es sich um  Softwarestörungen an zum Beispiel bei Microsoft Produkten handeln. Bei Login, Passwort, Hardware und Anmeldeproblemen soll dieser Flow nie getriggert werden.
    steps:
      - set_slots:
          - blind_spot: true
      - collect: Abfrage_ok
        description: Frage den User, ob du ihn richtig verstanden hast, ob er eine Stoerung am Arbeitsplatz oder Mobiltelefon vorliegen hat. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_1_incident_fallback
        ask_before_filling: true
        next:
          - if: slots.Abfrage_ok is "ja"
            then: message_utter_1_incdent_fallback_hinweis_mussangaben
          - if: slots.Abfrage_ok is "nein"
            then:
              - action: utter_2_userabbruch_neu_formulieren
                next: END
          - else: message_utter_user_kein_button_gedrueckt
      - id: message_utter_1_incdent_fallback_hinweis_mussangaben
        action: utter_1_incdent_fallback_hinweis_mussangaben
      - collect: slot_1_incdent_fallback_kurzbeschreibung
        description: Dieser Slot fragt nach einer kurzen Zusammenfassung der Hardware oder Software Störung zum Beispiel mit Notebook, Handys, Microsoft Produkten oder Business Applikationen wie myPortal sowie Netzstörungen.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: slot_1_incdent_fallback_fm
        description: Dieser Slot fragt nach ob es in der aktuellen Störung eine Fehlermeldung gibt und ob der Chatuser diese eingeben kann
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: slot_1_incdent_fallback_erreichbarkeit
        description: Dieser Slot fragt den Chatuser zu welcher Zeit ein Rückruf des Supports am besten passen würde.
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: slot_1_incdent_fallback_rufnummer
        description: Fragt den Chatuser im Störungsfall nach seiner Rufnummer unter der er zurückgerufen werden möchte
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: slot_1_incdent_fallback_account
        description: Dieser Slot fragt den User nach dem Account oder der Anwendung die in der aktuellen Störung betroffen ist
        ask_before_filling: true
        reset_after_flow_ends: false
      - collect: slot_1_incident_fallback_ticketsummary_creation
        description: Zeige dem Chatuser die für das Ticket gesammelten Informationen und frage ihn ob wir fortfahren wollen. Wenn kein erlaubter Wert getroffen wird, setze den Slot Wert auf  "unbekannt".
        utter: utter_ask_1_incident_fallback_ticketsummary_creation
        ask_before_filling: true
        reset_after_flow_ends: false
        next:
          - if: slots.slot_1_incident_fallback_ticketsummary_creation is "nein, ich möchte die Angaben korrigieren"
            then:
              - collect: slot_1_incident_fallback_ticketsummary_korrektur
                description: frag den user nach angaben, die er zur ticketerstellung korrigieren will
                utter: utter_ask_1_incident_fallback_ticketsummary_korrektur
                ask_before_filling: true
              - action: utter_intern_incident_fallback_zusammenfassung_nach_korrektur
              - action: utter_intern_incident_fallback_userhinweis_nach_korrektur
              - set_slots:
                  - slot_sm9_title: BOT_Fallback_Incident
              - collect: slot_1_incdent_fallback_sid
                description: Frage den User im Störungsfall nach seiner Service ID die als eindeutige Kennzeichnung für das gestörte Hardware Produkt oder für den gestörten IT-Service dient.
                ask_before_filling: true
                reset_after_flow_ends: false
                next:
                  - if: slots.slot_1_incdent_fallback_sid is "Mobiltelefon"
                    then:
                      - collect: slot_sid
                        description: Diese Collect Info soll den User darum bitten das betroffene Geraet auszuwählen
                        utter: utter_lookup_slot_sid
                        ask_before_filling: true
                        reset_after_flow_ends: false
                      - action: action_myit_query_cms_inventory
                      - action: utter_1_incident_fallback_myit_cms_data
                      - set_slots:
                          - blind_spot: false
                      - action: action_confirm_all_slots
                      - link: 2_H2A_Ticket_Servicezeit
                  - if: slots.slot_1_incdent_fallback_sid is "Arbeitsplatzsystem"
                    then:
                      - collect: slot_myit_sid
                        description: Fragt den user welche geraet betroffen ist und liefert buttons
                        utter: utter_lookup_slot_myit_sid
                        ask_before_filling: true
                        reset_after_flow_ends: false
                      - action: action_myit_get_device_details
                      - action: utter_1_incident_fallback_myit_aps_data
                      - set_slots:
                          - blind_spot: false
                      - action: action_confirm_all_slots
                      - link: 2_H2A_Ticket_Servicezeit
                  - else: message_utter_user_kein_button_gedrueckt_2
              - id: message_utter_user_kein_button_gedrueckt_2
                action: utter_user_kein_button_gedrueckt
              - action: action_rag
                next: END
          - if: slots.slot_1_incident_fallback_ticketsummary_creation is "ja, die Angaben sind korrekt"
            then: set_slots_slot_sm9_title
          - else: set_slots_blind_spot
      - id: set_slots_slot_sm9_title
        set_slots:
          - slot_sm9_title: BOT_Fallback_Incident
      - collect: slot_1_incdent_fallback_sid
        description: Frage den User im Störungsfall nach seiner Service ID die als eindeutige Kennzeichnung für das gestörte Hardware Produkt oder für den gestörten IT-Service dient.
        ask_before_filling: true
        next:
          - if: slots.slot_1_incdent_fallback_sid is "Mobiltelefon"
            then:
              - collect: slot_sid
                description: Diese Collect Info soll den User darum bitten das betroffene Geraet auszuwählen
                utter: utter_lookup_slot_sid
                ask_before_filling: true
                reset_after_flow_ends: false
              - action: action_myit_query_cms_inventory
              - action: utter_1_incident_fallback_myit_cms_data
              - set_slots:
                  - blind_spot: false
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
          - if: slots.slot_1_incdent_fallback_sid is "Arbeitsplatzsystem"
            then:
              - collect: slot_myit_sid
                description: Fragt den user welche geraet betroffen ist und liefert buttons
                utter: utter_lookup_slot_myit_sid
                ask_before_filling: true
                reset_after_flow_ends: false
              - action: action_myit_get_device_details
              - action: utter_1_incident_fallback_myit_aps_data
              - set_slots:
                  - blind_spot: false
              - action: action_confirm_all_slots
              - link: 2_H2A_Ticket_Servicezeit
          - else: message_utter_user_kein_button_gedrueckt_3
