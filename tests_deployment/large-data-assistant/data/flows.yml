  APS_NW_mainflow:
    name: APS_NW_mainflow
    description: Dieser Flow beschreibt Verbindungsprobleme innerhalb des Telekom Netzwerks sei es remote über Cisco AnyConnect (VPN-Verbindung) oder direkt über das CWLAN, corporate WLAN oder Firmenlan (über Netzwerk- oder LAN-Kabel) im Büro oder über das Handy HotSpot. Ausgeschlossen sind Situationen, wenn die Netzwerkverbindung selber auf dem Handy gestört ist. Außerdem werden hier Störungen betrachtet, die ITENOS-bezogen sind. Verbindngsabbrüche über Cisco AnyConnect werden hier ebenso behandelt auch wenn der User unterwegs keine Verbindung herstellen kann oder sich die Verbindung sporadisch abbricht.
