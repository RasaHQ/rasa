                      - id: message_utter_user_kein_button_gedrueckt_3
                        action: utter_user_kein_button_gedrueckt
                      - action: action_rag
                        next: END
                  - if: slots.BESTELLUNG_portalauswahl is "myPortal/myStore/eBest"
                    then: message_utter_myportal_bestellprobleme
                  - if: slots.BESTELLUNG_portalauswahl is "Usermanagement (USM)"
                    then:
                      - collect: BESTELLUNG_portalauswahl_usm
