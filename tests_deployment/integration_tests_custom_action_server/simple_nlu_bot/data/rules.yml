version: "3.1"

rules:

- rule: goodbye
  steps:
  - intent: goodbye
  - action: action_goodbye

- rule: hi
  steps:
  - intent: greet
  - action: utter_greet

- rule: cheer_up
  condition:
    - slot_was_set:
        - mood: negative
  steps:
    - intent: negative_mood
    - action: utter_cheer_up

- rule: cheer_on
  condition:
    - slot_was_set:
        - mood: positive
  steps:
    - intent: positive_mood
    - action: utter_happy
