flows:
  transfer_money:
    description: This flow lets users send money to friends and family.
    name: transfer money
    steps:
      - collect: transfer_money_recipient
        description: the name of a person
      - collect: transfer_money_amount_of_money
        description: the amount of money without any currency designation
      - action: utter_transfer_complete

  list_contacts:
    description: This flow lists the user's contacts.
    name: list contacts
    steps:
      - action: action_list_contacts

  list_reminders:
    description: This flow lists the user's reminders.
    name: list reminders
    steps:
      - action: action_list_reminders
      - action: action_end_session

  stream_recent_transactions:
    description: This flow streams a summary of the user's recent transactions in real time.
    name: stream recent transactions
    steps:
      - action: action_stream_recent_transactions

  stream_agent_skills:
    description: This flow streams a short introduction and then presents quick-reply buttons listing the skills the assistant can help with.
    name: stream agent skills
    steps:
      - action: action_stream_agent_skills
