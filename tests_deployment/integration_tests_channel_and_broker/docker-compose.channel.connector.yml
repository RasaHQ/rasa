x-environment: &environment
  RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
  CARTESIA_API_KEY: ${CARTESIA_API_KEY}

configs:
  endpoints.yml:
    content: |
      action_endpoint:
        actions_module: "actions"
      nlg:
        type: rephrase
services:
  rasa-pro-assistant:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    volumes:
      - "./calm-demo-bot:/app"
    configs:
      - source: endpoints.yml
        target: /endpoints.yml
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: rasa run --debug --endpoints /endpoints.yml
    ports:
      - "5005:5005"
    environment:
      <<: *environment
    user: ${USER_ID}
    healthcheck:
      test: curl localhost:5005 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s


networks: { rasa-pro-network: { } }
