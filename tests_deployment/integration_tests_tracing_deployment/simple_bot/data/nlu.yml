version: "3.1"

nlu:
- intent: greet
  examples: |
    - hey
    - hello

- intent: goodbye
  examples: |
    - cu
    - good by

- intent: request_name
  examples: |
    - give name
    - do you know my name?

- intent: say_favourite_food
  examples: |
    - My favourite food is [bread](favourite_food).
    - I love to eat [bread](favourite_food).
