x-environment: &environment
  RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

configs:
  endpoints-jaeger.yml:
    content: |
      action_endpoint:
        url: "http://action-server-jaeger:5056/webhook"

      tracing:
        type: jaeger
        host: jaeger
        port: 6831
        service_name: rasa-jaeger-testing
        sync_export: ~
  endpoints-jaeger-for-action-server.yml:
    content: |
      tracing:
        type: jaeger
        host: jaeger
        port: 6831
        service_name: action-server-jaeger-testing
        sync_export: ~
  endpoints-jaeger-no-action-server.yml:
    content: |
      action_endpoint:
        actions_module: actions
      tracing:
        type: jaeger
        host: jaeger
        port: 6831
        service_name: rasa-jaeger-testing
        sync_export: ~
  endpoints-otlp.yml:
    content: |
      action_endpoint:
        url: "http://action-server-otlp:5057/webhook"

      tracing:
        type: otlp
        endpoint: otel-collector:4317
        insecure: false
        root_certificates: /certs/ca.pem
        service_name: rasa-otlp-testing
  endpoints-otlp-for-action-server.yml:
    content: |
      tracing:
        type: otlp
        endpoint: otel-collector:4317
        insecure: false
        root_certificates: /certs/ca.pem
        service_name: action-server-otlp-testing
  endpoints-otlp-no-action-server.yml:
    content: |
      action_endpoint:
        actions_module: actions
      tracing:
        type: otlp
        endpoint: otel-collector:4317
        insecure: false
        root_certificates: /certs/ca.pem
        service_name: rasa-otlp-testing
  otel-collector-config.yml:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              tls_settings:
                cert_file: /certs/cert.pem
                key_file: /certs/cert-key.pem

      exporters:
        jaeger:
          endpoint: "jaeger:14250"
          insecure: true
        logging:

      processors:
        batch:
          timeout: 1s

      service:
        pipelines:
          traces:
            receivers: [otlp]
            exporters: [jaeger, logging]
            processors: [batch]
  endpoints-grpc-jaeger.yml:
    content: |
      action_endpoint:
        url: "grpc://rasa-grpc-action-server-jaeger:5058"
      tracing:
        type: jaeger
        host: jaeger
        port: 6831
        service_name: rasa-jaeger-testing
        sync_export: ~
  endpoints-grpc-tls-jaeger.yml:
    content: |
      action_endpoint:
        url: "grpc://rasa-grpc-tls-action-server:5059"
        cafile: "/certs/ca.pem"
      tracing:
        type: jaeger
        host: jaeger
        port: 6831
        service_name: rasa-jaeger-testing
        sync_export: ~

services:
  otel-collector:
    image: otel/opentelemetry-collector@sha256:cec18c72535bebeaca3615e841b19066b468f87a2e29b724b118b5b7bf8808ce
    container_name: otel-collector
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./certs/cert.pem:/certs/cert.pem
      - ./certs/cert-key.pem:/certs/cert-key.pem
    configs:
      - source: otel-collector-config.yml
        target: /etc/otel-collector-config.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "4317"

  jaeger:
    image: jaegertracing/all-in-one@sha256:2fe77574dc1a9fe4da54c086c0c98feacce3ff87ab9addba933b7fc9b6d8de19
    container_name: jaeger
    networks: [ 'rasa-pro-network' ]
    ports:
      - "16686:16686"
      - "14250"
      - "6831:6831/udp"
      - "16685:16685"


  rasa-pro-jaeger-no-action-server:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-jaeger-no-action-server
    volumes:
      - "./simple_bot:/app"
    configs:
      - source: endpoints-jaeger-no-action-server.yml
        target: /endpoints-jaeger-no-action-server.yml
    entrypoint: ""
    command: rasa run -p 5008 --enable-api --endpoints /endpoints-jaeger-no-action-server.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5008:5008"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5008 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}


  rasa-pro-otlp-no-action-server:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-otlp-no-action-server
    volumes:
      - "./simple_bot:/app"
      - "./certs/ca.pem:/certs/ca.pem"
    configs:
      - source: endpoints-otlp-no-action-server.yml
        target: /endpoints-otlp-no-action-server.yml
    entrypoint: ""
    command: rasa run -p 5009 --enable-api --endpoints /endpoints-otlp-no-action-server.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5009:5009"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5009 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}


  rasa-pro-jaeger:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-jaeger
    volumes:
      - "./simple_bot:/app"
    configs:
      - source: endpoints-jaeger.yml
        target: /endpoints-jaeger.yml
    entrypoint: ""
    command: rasa run -p 5006 --enable-api --endpoints /endpoints-jaeger.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5006:5006"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5006 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}
    depends_on:
      action-server-jaeger-healthcheck:
        condition: service_healthy

  action-server-jaeger:
    image: ${RASA_SDK_REPOSITORY}:latest
    container_name: action-server-jaeger
    volumes:
      - "./simple_bot/actions:/app/actions"
    configs:
      - source: endpoints-jaeger-for-action-server.yml
        target: /app/endpoints.yml
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5056
    ports:
      - "5056:5056"
    environment:
      <<: *environment

  # We use a trick with sleep command to make the container keep running
  # while it keeps checking the health of the action server
  action-server-jaeger-healthcheck:
    image: curlimages/curl:8.12.1
    container_name: action-server-jaeger-healthcheck
    entrypoint: [ "sh", "-c" ]
    command: [ "sleep 40" ]
    networks: [ 'rasa-pro-network' ]
    depends_on:
      - action-server-jaeger
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://action-server-jaeger:5056/health" ]
      interval: 5s
      retries: 10
      timeout: 10s


  rasa-pro-otlp:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-otlp
    volumes:
      - "./simple_bot:/app"
      - "./certs/ca.pem:/certs/ca.pem"
    configs:
      - source: endpoints-otlp.yml
        target: /endpoints-otlp.yml
    entrypoint: ""
    command: rasa run -p 5007 --enable-api --endpoints /endpoints-otlp.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5007:5007"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5007 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}
    depends_on:
      action-server-otlp-healthcheck:
        condition: service_healthy

  action-server-otlp:
    image: ${RASA_SDK_REPOSITORY}:latest
    container_name: action-server-otlp
    volumes:
      - "./certs/ca.pem:/certs/ca.pem"
      - "./simple_bot/actions:/app/actions"
    configs:
      - source: endpoints-otlp-for-action-server.yml
        target: /app/endpoints.yml
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5057
    ports:
      - "5057:5057"
    environment:
      <<: *environment

  # We use a trick with sleep command to make the container keep running
  # while it keeps checking the health of the action server
  action-server-otlp-healthcheck:
    image: curlimages/curl:8.12.1
    container_name: action-server-otlp-healthcheck
    entrypoint: [ "sh", "-c" ]
    command: [ "sleep 60" ]
    networks: [ 'rasa-pro-network' ]
    depends_on:
      - action-server-otlp
    healthcheck:
      test: [ "CMD", "curl", "-sf", "http://action-server-otlp:5057/health" ]
      interval: 5s
      retries: 10
      timeout: 10s


  rasa-pro-grpc-jaeger:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-grpc-jaeger
    volumes:
      - "./simple_bot:/app"
    configs:
      - source: endpoints-grpc-jaeger.yml
        target: /endpoints-grpc-jaeger.yml
    entrypoint: ""
    command: rasa run -p 5014 --enable-api --endpoints /endpoints-grpc-jaeger.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5014:5014"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5014 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}
    depends_on:
      rasa-grpc-action-server-jaeger-healthcheck:
        condition: service_healthy

  rasa-grpc-action-server-jaeger:
    image: ${RASA_SDK_REPOSITORY}:latest
    container_name: rasa-grpc-action-server-jaeger
    volumes:
      - "./simple_bot/actions:/app/actions"
    configs:
      - source: endpoints-jaeger-for-action-server.yml
        target: /app/endpoints.yml
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5058 --grpc
    ports:
      - "5058:5058"
    environment:
      <<: *environment
    user: ${USER_ID}

# We use a trick with sleep command to make the container keep running
# while it keeps checking the health of the action server
  rasa-grpc-action-server-jaeger-healthcheck:
    image: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/f7b7r5o7/tools/grpc_health_probe:latest
    container_name: rasa-grpc-action-server-jaeger-healthcheck
    # This is a trick to make the container keep running
    entrypoint: ["bash", "-c"]
    command: ["sleep 60"]
    networks: [ 'rasa-pro-network' ]
    depends_on:
      - rasa-grpc-action-server-jaeger
    # This will check the health of the action server
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=rasa-grpc-action-server-jaeger:5058 -rpc-timeout 15s -connect-timeout 2s -gzip"]
      interval: 5s
      retries: 10
      timeout: 10s


  rasa-pro-grpc-tls-jaeger:
    image: ${RASA_REPOSITORY}:${RASA_IMAGE_TAG}
    container_name: rasa-pro-grpc-tls-jaeger
    volumes:
      - "./simple_bot:/app"
      - "./certs/tls/ca.pem:/certs/ca.pem"
    configs:
      - source: endpoints-grpc-tls-jaeger.yml
        target: /endpoints-grpc-tls-jaeger.yml
    entrypoint: ""
    command: rasa run -p 5015 --enable-api --endpoints /endpoints-grpc-tls-jaeger.yml
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5015:5015"
    environment:
      <<: *environment
    healthcheck:
      test: curl localhost:5015 || exit 1
      interval: 10s
      retries: 10
      start_period: 15s
      timeout: 10s
    user: ${USER_ID}
    depends_on:
      rasa-grpc-tls-action-server-healthcheck:
        condition: service_healthy

  rasa-grpc-tls-action-server:
    image: ${RASA_SDK_REPOSITORY}:latest
    container_name: rasa-grpc-tls-action-server
    volumes:
      - "./certs/tls/server.pem:/certs/server.pem"
      - "./certs/tls/server-key.pem:/certs/server-key.pem"
      - "./simple_bot/actions:/app/actions"
    configs:
      - source: endpoints-jaeger-for-action-server.yml
        target: /app/endpoints.yml
    networks: [ 'rasa-pro-network' ]
    entrypoint: "python -m rasa_sdk"
    command: --actions actions -p 5059 --grpc --ssl-certificate /certs/server.pem --ssl-keyfile /certs/server-key.pem
    ports:
      - "5059:5059"
    environment:
      <<: *environment
    user: ${USER_ID}

# We use a trick with sleep command to make the container keep running
# while it keeps checking the health of the action server
  rasa-grpc-tls-action-server-healthcheck:
    image: 329710836760.dkr.ecr.eu-west-1.amazonaws.com/f7b7r5o7/tools/grpc_health_probe:latest
    container_name: rasa-grpc-tls-action-server-healthcheck
    # This is a trick to make the container keep running
    entrypoint: ["bash", "-c"]
    command: ["sleep 60"]
    networks: [ 'rasa-pro-network' ]
    depends_on:
      - rasa-grpc-tls-action-server
    # This will check the health of the action server
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=rasa-grpc-tls-action-server:5059 -rpc-timeout 15s -connect-timeout 2s -gzip -tls -tls-no-verify"]
      interval: 5s
      retries: 10
      timeout: 10s


networks: { rasa-pro-network: { name: rasa-pro-network } }
