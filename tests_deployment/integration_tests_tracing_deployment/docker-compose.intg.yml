version: "3"

x-license: &license
  RASA_PRO_LICENSE: ${RASA_PRO_LICENSE}
  OPENAI_API_KEY: ${OPENAI_API_KEY}

services:
  otel-collector:
    image: otel/opentelemetry-collector@sha256:cec18c72535bebeaca3615e841b19066b468f87a2e29b724b118b5b7bf8808ce
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
      - ./certs/cert.pem:/certs/cert.pem
      - ./certs/cert-key.pem:/certs/cert-key.pem
    networks: [ 'rasa-pro-network' ]
    ports:
      - "4317"

  jaeger:
    image: jaegertracing/all-in-one@sha256:2fe77574dc1a9fe4da54c086c0c98feacce3ff87ab9addba933b7fc9b6d8de19
    networks: [ 'rasa-pro-network' ]
    ports:
      - "16686:16686"
      - "14250"
      - "6831:6831/udp"
      - "16685:16685"

  rasa-pro-jaeger:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./endpoints-jaeger.yml:/app/endpoints.yml"
    entrypoint: ""
    command: rasa run -p 5006 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5006:5006"
    environment:
      <<: *license

  rasa-pro-otlp:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./endpoints-otlp.yml:/app/endpoints.yml"
      - "./certs/ca.pem:/certs/ca.pem"
    entrypoint: ""
    command: rasa run -p 5007 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5007:5007"
    environment:
      <<: *license

  rasa-pro-jaeger-no-action-server:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./endpoints-jaeger-no-action-server.yml:/app/endpoints.yml"
    entrypoint: ""
    command: rasa run -p 5008 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5008:5008"
    environment:
      <<: *license

  rasa-pro-otlp-no-action-server:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./endpoints-otlp-no-action-server.yml:/app/endpoints.yml"
      - "./certs/ca.pem:/certs/ca.pem"
    entrypoint: ""
    command: rasa run -p 5009 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5009:5009"
    environment:
      <<: *license

  action-server-jaeger:
    image: ${SDK_TARGET_IMAGE_REGISTRY}:latest
    volumes:
      - "./endpoints-jaeger-for-action-server.yml:/app/endpoints.yml"
      - "./simple_bot/actions:/app/actions"
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5056
    ports:
      - "5056:5056"
    environment:
      <<: *license


  action-server-otlp:
    image: ${SDK_TARGET_IMAGE_REGISTRY}:latest
    volumes:
      - "./endpoints-otlp-for-action-server.yml:/app/endpoints.yml"
      - "./certs/ca.pem:/certs/ca.pem"
      - "./simple_bot/actions:/app/actions"
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5057
    ports:
      - "5057:5057"
    environment:
      <<: *license

  rasa-pro-grpc-jaeger:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./endpoints-grpc-jaeger.yml:/app/endpoints.yml"
    entrypoint: ""
    command: rasa run -p 5014 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5014:5014"
    environment:
      <<: *license

  rasa-grpc-action-server-jaeger:
    image: ${SDK_TARGET_IMAGE_REGISTRY}:latest
    volumes:
      - "./simple_bot/actions:/app/actions"
      - "./endpoints-jaeger-for-action-server.yml:/app/endpoints.yml"
    networks: [ 'rasa-pro-network' ]
    entrypoint: ""
    command: python -m rasa_sdk --actions actions -p 5058 --grpc
    environment:
      <<: *license

  rasa-pro-grpc-ssl-jaeger:
    image: ${TARGET_IMAGE_REGISTRY}:${IMAGE_TAG}
    volumes:
      - "./simple_bot:/app"
      - "./certs/ssl/ca.pem:/certs/ca.pem"
      - "./endpoints-grpc-ssl-jaeger.yml:/app/endpoints.yml"
    entrypoint: ""
    command: rasa run -p 5015 --enable-api
    networks: [ 'rasa-pro-network' ]
    ports:
      - "5015:5015"
    environment:
      <<: *license

  rasa-grpc-ssl-action-server:
    image: ${SDK_TARGET_IMAGE_REGISTRY}:latest
    volumes:
      - "./certs/ssl/server.pem:/certs/server.pem"
      - "./certs/ssl/server-key.pem:/certs/server-key.pem"
      - "./simple_bot/actions:/app/actions"
      - "./endpoints-jaeger-for-action-server.yml:/app/endpoints.yml"
    networks: [ 'rasa-pro-network' ]
    entrypoint: "python -m rasa_sdk"
    command: --actions actions -p 5059 --grpc --ssl-certificate /certs/server.pem --ssl-keyfile /certs/server-key.pem
    environment:
      <<: *license

networks: { rasa-pro-network: { } }
